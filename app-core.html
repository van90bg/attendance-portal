<script>
  /* MODULE MAP (2026-08-13 — app.html tách module, P2-2):
   *   app-core.html   — state + utils + boot + staff data + sound + nav + clock
   *   app-stats.html  — viewStats
   *   app-staff.html  — viewStaff (bảng + funnel)
   *   app-modals.html — paste/create/confirm modals
   *   app-config.html — viewConfig admin
   *   app-tasks.html  — task list + search + create
   *   app-scan.html   — scan view + queue + actions + toast
   *   Thứ tự include trong index.html = thứ tự khối script — chung global scope.
   */
  /* ============================================================
   * TOC — bản đồ vùng script (thứ tự xuất hiện từ đây xuống cuối)
   *  [0] Mock local (file://)  — nạp mock-google.js khi không qua GAS
   *  [1] State & Constants     — META, CURRENT_TASK, STATUS_C, headers
   *  [2] UTILITIES             — safeArr, fmtN, esc, escAttr, fmtClockHMS, fmtDate, setBtnBusy_, restoreBtnLabel_
   *  [3] Pagination            — renderPaginator_, goListPage, goScanPage
   *  [4] View infra            — repairViewParents, syncHeaderH (sớm)
   *  [5] Scan UI infra         — filters, stuck bars, auto-focus loop
   *  [6] Header command center — net status, bg indicator, overlay/spinner
   *  [7] Staff & Stats         — ensureStaffData, renderStaffStats, renderStaffDataTable
   *  [8] Sound                 — toggleSound, playBeep
   *  [9] View management       — showSection, selectPage, sidebar (2 khối: [4]+đây)
   * [10] Home clock            — tickHomeClock, renderHomeClock
   * [11] Modals                — paste, create/sel, confirm
   * [12] Task list & search    — loadTaskList, runListSearch, createTask
   * [13] Scan flow             — openScan, renderScanView, submitScan, queue
   * [14] Task actions          — reopen, transitionToAttend, finishTask
   * [15] Toast & feedback      — showToast, scanCard
   * ============================================================ */
  // Mock local: khi mở file:// trực tiếp (không qua GAS), nạp mock-google.js.
  // Deploy GAS: google.script luôn tồn tại → nhánh này không chạy → app thật.
  if (typeof google === 'undefined' || !google.script) {
    document.write('<script src="mock/mock-google.js?v=' + Date.now() + '"><\/script>');
  }

  var META = null;
  // #10: rank role client-side (khớp server getRole_/requireRole_) — placeholder + gate tìm NV theo role
  var ROLE_RANK = { viewer: 0, operator: 1, manager: 2, admin: 3 };
  var CURRENT_TASK = null;
  var CURRENT_LOG = [];
  // Cache tên NV client-side (từ server response) → quét lại cùng mã hiện tên tức thì.
  var CLIENT_STAFF_INDEX = {};
  var CURRENT_COUNTERS = null;  // state counters để optimistic cập nhật ngay
  var BUSY = false;
  var AUTO_FOCUS_TIMER = null;

  // P3: hằng số status — KHÔNG hardcode chuỗi tiếng Việt trong logic (đổi label = vỡ logic).
  // Khớp STATUS trong Config.gs; label hiển thị badge dùng đúng chuỗi này.
  var STATUS_C = { PENDING: '-', PRESENT: 'Có mặt', ABSENT: 'Vắng', EXTRA: 'Dư' };
  // Task status — khớp TASK_STATUS trong Config.gs (3 trạng thái 2-phase)
  var TASK_STATUS_C = { OPEN: 'open', ATTEND: 'attend', DONE: 'done' };
  // Magic Ca 'Tự do' — KHỚP SLOT_FREE_MAGIC (CsvUtil.gs). Giá trị wire/server — không đổi riêng lẻ.
  var SLOT_FREE_MAGIC = 'Tự do';
  // Regex mã barcode NV — KHỚP BARCODE_ID_RE (CsvUtil.gs). Giá trị wire/server — không đổi riêng lẻ.
  var BARCODE_ID_RE = /^OPS\d+$/i;
  // Phase label tiếng Việt cho task status
  var TASK_PHASE_LABEL = {
    open: 'Mở', attend: 'Điểm danh', done: 'Xong',
  };
  // F-search: chế độ danh sách task — 'all' (danh sách task bình thường) vs 'search' (kết quả tìm NV).
  // Khi search, taskListTable dùng SEARCH_HEAD + renderSearchResults_ (thêm cột Mã NV/Tên NV).
  var LIST_MODE = 'all';
  // Header HTML cho 2 chế độ taskListTable (reuse cùng element #taskListTable).
  // Thead danh sách task — động (funnel phễu 4 cột: Loại/Station/Team/Trạng thái + state .on)
  // Thead danh sách task — PHẢI khớp thứ tự body render: STT, Mã task, Loại, Station, Team,
  // Ca, Tổng NV, Đã quét lần 2, Dư, Trạng thái, Tạo lúc, Người tạo, Thao tác (fix 2026-08-11:
  // trước đây gom 4 funnel liên tiếp → 'Trạng thái' lệch sang cột 6, header/body lệch từ Ca).
  function funnelTh_(lbl, field) {
    var on = hasFunnel_(TASK_FILTERS, field);
    return '<th scope="col" class="th-filter" data-col="' + field + '"><span class="th-label">' + lbl + '</span>' +
      '<button type="button" class="th-funnel' + (on ? ' on' : '') + '" onclick="toggleFunnel(\'' + field + '\', event, \'task\')" aria-label="Lọc ' + lbl + '" title="Lọc ' + lbl + '">' + FUNNEL_SVG + '</button></th>';
  }
  function taskHeadHtml_() {
    return '<tr>' +
      '<th scope="col">STT</th><th scope="col">Mã task</th>' +
      funnelTh_('Station', 'station') +
      funnelTh_('Team', 'team') +
      '<th scope="col">Ca</th><th scope="col">Tổng NV</th><th scope="col">Đã điểm danh</th><th scope="col">Dư</th>' +
      funnelTh_('Trạng thái', 'status') +
      '<th scope="col">Thao tác</th></tr>';
  }
  var SEARCH_HEAD = '<tr>' +
        '<th scope="col">STT</th><th scope="col">Mã task</th><th scope="col">Mã NV</th><th scope="col">Tên NV</th>' +
        '<th scope="col">Điểm danh</th><th scope="col">Station</th><th scope="col">Team</th><th scope="col">Ca</th>' +
        '<th scope="col">Thao tác</th></tr>';

  // ===================== UTILITIES (dùng chung toàn app — gom 2026-08-11) =====================
  // I4: guard array từ server — nếu API trả object/string (bug tương lai) thì .forEach crash white screen
  function safeArr(x) { return Array.isArray(x) ? x : []; }

  // Escape HTML (text node) — luôn dùng khi nhúng dữ liệu server vào innerHTML.
  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');
  }
  // Escape HTML (attribute) — thêm quote đơn; dùng cho value="..." trong HTML string.
  function escAttr(s) {
    return esc(s).replace(/'/g, '&#39;');
  }
  // Số 0 → '-' (bảng thống kê)
  function fmtN(n) { return n ? String(n) : '-'; }

  // Format Clock In/Out Time theo sheet: 'H:mm:ss' (vd 7:05:30) — chấp nhận 3 dạng: Date, 'HH:mm', 'HH:mm:ss'.
  function fmtClockHMS(v) {
    if (v === null || v === undefined) return '';
    if (v instanceof Date && !isNaN(v)) {
      return ('0' + v.getHours()).slice(-2) + ':' + String(v.getMinutes()).padStart(2, '0') + ':' + String(v.getSeconds()).padStart(2, '0');
    }
    var s = String(v).trim();
    if (!s) return '';
    var m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
    if (m) return ('0' + Number(m[1])).slice(-2) + ':' + m[2] + ':' + (m[3] || '00');
    return esc(s);
  }

  // P2: format theo TZ Asia/Ho_Chi_Minh (khớp server Session.getScriptTimeZone)
  // — không dùng local TZ của thiết bị (có thể lệch nếu đổi vùng).
  var _fmtTZ = (function () {
    try {
      return new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Ho_Chi_Minh' });
    } catch (e) { return null; }
  })();
  function fmtDate(d) {
    if (!d) return '';
    var dt = new Date(d);
    if (isNaN(dt.getTime())) return String(d);
    if (_fmtTZ) {
      var parts = _fmtTZ.formatToParts(dt);
      var h = '0', m = '0', s = '0';
      parts.forEach(function (p) {
        if (p.type === 'hour') h = p.value;
        else if (p.type === 'minute') m = p.value;
        else if (p.type === 'second') s = p.value;
      });
      return h + ':' + m + ':' + s;
    }
    return ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2) + ':' + ('0' + dt.getSeconds()).slice(-2);
  }

  // Trạng thái nút tải/lưu — dùng chung loadStaffView/loadConfigView/saveConfig (gom 2026-08-11).
  // busyLabel: text khi đang xử lý (lưu label gốc vào dataset để restore đúng).
  function setBtnBusy_(btn, busyLabel) {
    if (btn && btn.tagName) { if (btn.dataset.origLabel === undefined) btn.dataset.origLabel = btn.textContent; btn.disabled = true; btn.textContent = busyLabel; }
  }
  function restoreBtnLabel_(btn, fallback) {
    if (btn && btn.tagName) { btn.disabled = false; btn.textContent = btn.dataset.origLabel || fallback; delete btn.dataset.origLabel; }
  }

    // ===== Pagination =====
    var SCAN_PAGE_SIZE = 50;  // bảng quét scanTable: 50 NV/trang
    var LIST_PAGE_SIZE = 100;  // viewTasks: 100 task/trang (đồng bộ viewStaff 2026-08-11)
    var LIST_PAGE = 1; // trang hiện tại: task list / kết quả tìm
    var SCAN_PAGE = 1; // trang hiện tại: bảng quét scanTable

    // Render phân trang vào container (v1: _renderPagination). Dùng inline onclick
    // (nhất quán với các button khác trong v2 — không cần delegation listener).
    // total = số dòng tổng (trước slice); current = trang đang xem; goFn = tên hàm
    // global nhận page, ví dụ goListPage / goScanPage.
    function renderPaginator_(containerId, total, current, goFn, pageSize) {
      var el = document.getElementById(containerId);
      if (!el) return;
      var ps = pageSize || SCAN_PAGE_SIZE;  // scan mặc định 50; staff/tasks truyền pageSize riêng
      if (!total || total <= ps) {
        el.innerHTML = '';
        el.style.display = 'none';
        return;
      }
      var totalPages = Math.max(1, Math.ceil(total / ps));
      var page = Math.min(current, totalPages);
      var start = (page - 1) * ps + 1;
      var end = Math.min(page * ps, total);

      var html = '<div class="pag-bar">';
      html += '<span class="pag-info">' + start + '–' + end + ' / ' + total + '</span>';
      html += '<div class="pag-buttons">';
      // Đầu + Trước
      html += '<button type="button" class="pag-btn" onclick="' + goFn + '(1)"' + (page <= 1 ? ' disabled' : '') + ' aria-label="Trang đầu">«</button>';
      html += '<button type="button" class="pag-btn" onclick="' + goFn + '(' + (page - 1) + ')"' + (page <= 1 ? ' disabled' : '') + ' aria-label="Trang trước">‹</button>';
      // Số trang có ellipsis
      var pageRange = [];
      for (var p = 1; p <= totalPages; p++) {
        if (p === 1 || p === totalPages || (p >= page - 1 && p <= page + 1)) {
          pageRange.push(p);
        } else if (pageRange[pageRange.length - 1] !== '...') {
          pageRange.push('...');
        }
      }
      for (var pi = 0; pi < pageRange.length; pi++) {
        if (pageRange[pi] === '...') {
          html += '<span class="pag-ellipsis">…</span>';
        } else {
          html += '<button type="button" class="pag-btn' + (pageRange[pi] === page ? ' active' : '') + '" onclick="' + goFn + '(' + pageRange[pi] + ')" aria-label="Trang ' + pageRange[pi] + '">' + pageRange[pi] + '</button>';
        }
      }
      // Sau + Cuối
      html += '<button type="button" class="pag-btn" onclick="' + goFn + '(' + (page + 1) + ')"' + (page >= totalPages ? ' disabled' : '') + ' aria-label="Trang sau">›</button>';
      html += '<button type="button" class="pag-btn" onclick="' + goFn + '(' + totalPages + ')"' + (page >= totalPages ? ' disabled' : '') + ' aria-label="Trang cuối">»</button>';
      html += '</div></div>';
      el.innerHTML = html;
      el.style.display = '';
    }

    // Phân trang task list: set trang + render lại (slice theo trang).
    function goListPage(page) {
      var p = Math.max(1, parseInt(page, 10) || 1);
      if (p === LIST_PAGE) return;
      LIST_PAGE = p;
      if (LIST_MODE === 'search') {
        renderSearchResults_(LAST_SEARCH_ROWS || []);
      } else if (LIST_MODE === 'task') {
        renderTaskList_(LAST_TASK_SEARCH || []);
      } else {
        renderTaskList_(LAST_TASK_LIST.tasks || []);
      }
    }

    // Phân trang StaffData: set trang + render lại (100 NV/trang).
    function goStaffPage(page) {
      var p = Math.max(1, parseInt(page, 10) || 1);
      if (p === STAFF_PAGE) return;
      STAFF_PAGE = p;
      renderStaffDataTable();
    }

    // Phân trang bảng scan: set trang + render lại scanTable (đã slice).
    function goScanPage(page) {
      var p = Math.max(1, parseInt(page, 10) || 1);
      if (p === SCAN_PAGE) return;
      SCAN_PAGE = p;
      renderScanTable(CURRENT_LOG);
    }


  // Repair: ép các view section vào đúng #main-content (phòng parser tách thẻ sau edit HTML).
  function repairViewParents() {
    var main = document.getElementById('main-content');
    if (!main) return;
    ['viewHome', 'viewStats', 'viewStaff', 'viewAbout', 'viewScan', 'viewTasks', 'viewConfig', 'viewReports', 'viewAdmin'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el && el.parentElement !== main) {
        main.appendChild(el);  // di chuyển (appendChild tự gỡ khỏi cha cũ + xếp cuối main)
      }
    });
  }

  // đồng bộ --header-h = chiều cao header THẬT — token tĩnh 59px lệch khi
  // header wrap (font/zoom/màn hẹp) → doc cao hơn viewport → scroll dọc vĩnh viễn +
  // sidebar/view-topbar sticky bị ẩn sau header. Chạy khi DOM sẵn sàng + load + resize.
  var _headerHRaf = null;
  function syncHeaderH() {
    if (_headerHRaf) return;
    _headerHRaf = requestAnimationFrame(function () {
      _headerHRaf = null;
      var hEl = document.querySelector('header');
      if (!hEl) return;
      var px = Math.round(hEl.getBoundingClientRect().height) + 'px';
      var cur = getComputedStyle(document.documentElement).getPropertyValue('--header-h').trim();
      if (cur !== px) document.documentElement.style.setProperty('--header-h', px);
    });
  }
  window.addEventListener('load', syncHeaderH);
  window.addEventListener('resize', syncHeaderH);
  // R2 (audit 2026-08-11): resize KHÔNG fire khi xoay màn hình / pinch-zoom trên mobile —
  // sync thêm orientationchange (delay 100ms vì DOM chưa relayout) + visualViewport.resize
  // → --header-h không lệch, view không bị dồn dưới header.
  window.addEventListener('orientationchange', function () { setTimeout(syncHeaderH, 100); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', syncHeaderH);

  document.addEventListener('DOMContentLoaded', function () {
    startupOverlayWatchdog();  // P2: an toàn — ẩn overlay sau 8s nếu RPC khởi động treo
    syncHeaderH();  // đo chiều cao header THẬT sau khi DOM sẵn sàng
    repairViewParents();
    loadMetaAndOptions();
    document.getElementById('scanInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitScan();
      }
    });
    // P2 (2026-08-21): touch (pointer:coarse) — bàn phím ảo bật che counters/phase-banner khi focus
    // → scroll ô quét lên giữa viewport (block:'center') để user còn thấy scanCard + nút Quét.
    if (MQ_COARSE && MQ_COARSE.matches) {
      document.getElementById('scanInput').addEventListener('focus', function () {
        setTimeout(function () {
          var el = document.getElementById('scanInput');
          if (el && document.getElementById('viewScan') && !document.getElementById('viewScan').classList.contains('hidden')) {
            el.scrollIntoView({ block: 'center', behavior: 'auto' });
          }
        }, 250);  // delay cho keyboard mở + layout ổn định
      });
    }
    // F-search: Enter trên ô tìm (viewTasks) → chay tim; Escape → clear (xử lý trong onListSearchKeydown).
    var _ls = document.getElementById('listSearch');
    if (_ls) _ls.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); runListSearch(); }
      else if (e.key === 'Escape') { onListSearchKeydown(e); }
    });
    initNetworkStatus();
    initTabSync();       // #12: quay lại tab → silent reload task đang mở (data không stale)
    initBgIndicator();   // indicator tác vụ nền (header) — ẩn ban đầu, hiện khi có scan/RPC/silent
    startAutoFocusLoop();
    initScanTopbarStuck();
    initScanFilters();
    initSidebar();
    selectPage('home');  // Trang chủ mặc định — logo + tên + đồng hồ
  });

  /* C3: tìm kiếm + lọc trạng thái + sort cột bảng scan */
  function initScanFilters() {
    var searchEl = document.getElementById('scanSearch');
    var statusEl = document.getElementById('scanStatusFilter');
    var clearEl = document.getElementById('scanClearFilter');
    var scanTbl = document.getElementById('scanTable');
    // C1: populate filter options từ STATUS_C — 1 nguồn sự thật, đổi label không vỡ filter.
    if (statusEl && statusEl.options.length === 1) {
      var FILTER_LABELS = {};
      FILTER_LABELS[STATUS_C.PENDING] = 'Chưa điểm danh';
      FILTER_LABELS[STATUS_C.PRESENT] = STATUS_C.PRESENT;
      FILTER_LABELS[STATUS_C.ABSENT] = STATUS_C.ABSENT;
      FILTER_LABELS[STATUS_C.EXTRA] = STATUS_C.EXTRA;
      [STATUS_C.PENDING, STATUS_C.PRESENT, STATUS_C.ABSENT, STATUS_C.EXTRA].forEach(function (v) {
        var o = document.createElement('option');
        o.value = v;
        o.textContent = FILTER_LABELS[v];
        statusEl.appendChild(o);
      });
    }
    var _scanSearchDebounce = null;
    if (searchEl) searchEl.addEventListener('input', function () {
      if (_scanSearchDebounce) clearTimeout(_scanSearchDebounce);
      var v = searchEl.value;
      _scanSearchDebounce = setTimeout(function () {
        SCAN_FILTER.q = v;
        SCAN_PAGE = 1;
        _scanSortDirty = true;
        renderScanTable(CURRENT_LOG);
      }, 180);
    });
    if (statusEl) statusEl.addEventListener('change', function () {
      SCAN_FILTER.status = statusEl.value;
      SCAN_PAGE = 1; // bộ lọc đổi → về trang đầu
      _scanSortDirty = true; // F4: filter đổi → đánh dấu dirty
      renderScanTable(CURRENT_LOG);
    });
    if (clearEl) clearEl.addEventListener('click', function () {
      SCAN_FILTER.q = '';
      SCAN_FILTER.status = '';
      if (searchEl) searchEl.value = '';
      if (statusEl) statusEl.value = '';
      SCAN_PAGE = 1; // xoá lọc → về trang đầu
      _scanSortDirty = true; // F4: filter xoá → đánh dấu dirty
      renderScanTable(CURRENT_LOG);
    });
    if (scanTbl) {
      var sThs = scanTbl.querySelectorAll('th.sortable');
      for (var si = 0; si < sThs.length; si++) {
        sThs[si].setAttribute('tabindex', '0');
        if (!sThs[si].getAttribute('role')) sThs[si].setAttribute('role', 'button');
      }
      scanTbl.addEventListener('click', function (e) {
        var th = e.target && e.target.closest ? e.target.closest('th.sortable') : null;
        if (!th) return;
        var col = parseInt(th.dataset.sort, 10);
        if (SCAN_SORT.col === col) SCAN_SORT.asc = !SCAN_SORT.asc;
        else { SCAN_SORT.col = col; SCAN_SORT.asc = true; }
        SCAN_SORT.userSet = true;  // F: user tự chọn cột → bỏ ép-theo-phase
        SCAN_PAGE = 1; // sort đổi thứ tự → về trang đầu
        _scanSortDirty = true; // F4: sort đổi → đánh dấu dirty cho filterAndSortScan
        updateSortIndicators();
        renderScanTable(CURRENT_LOG);
      });
      scanTbl.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
        var th = e.target && e.target.closest ? e.target.closest('th.sortable') : null;
        if (!th) return;
        e.preventDefault();
        th.click();
      });
    }
    updateSortIndicators();
  }

  var _staffSearchDebounce = null;
  var _reportsSearchDebounce = null;
  function debouncedStaffSearch_() {
    if (_staffSearchDebounce) clearTimeout(_staffSearchDebounce);
    _staffSearchDebounce = setTimeout(function () { STAFF_PAGE = 1; renderStaffDataTable(); }, 180);
  }
  function debouncedReportsSearch_() {
    if (_reportsSearchDebounce) clearTimeout(_reportsSearchDebounce);
    _reportsSearchDebounce = setTimeout(function () { renderReportsTable(); }, 180);
  }

  /* ===== Topbar sticky (.view-topbar chung) — thêm viền/bóng khi dính ===== */
  var _stuckRaf = null;
  function updateStuckBars() {
    if (_stuckRaf) return;
    _stuckRaf = requestAnimationFrame(function () {
      _stuckRaf = null;
      var bars = document.querySelectorAll('.view-topbar');
      if (!bars.length) return;
      // đọc token MỖI LẦN scroll — syncHeaderH() có thể đổi --header-h khi resize/wrap
      var hh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 59;
      bars.forEach(function (bar) {
        // bỏ qua topbar của view đang ẩn (rect = 0 → không đánh dấu stuck sai)
        if (!bar.offsetParent) { bar.classList.remove('stuck'); return; }
        var rect = bar.getBoundingClientRect();
        bar.classList.toggle('stuck', rect.top <= hh);
      });
    });
  }
  function initScanTopbarStuck() {
    window.addEventListener('scroll', updateStuckBars, { passive: true });
    updateStuckBars();
  }

  /* Mobile/tablet (pointer: coarse): KHÔNG tự focus scan input — bàn phím ảo tự bật đè nửa
     màn hình khi mở task quét. Máy tính (chuột/barcode scanner) vẫn auto-focus như cũ. */
  // R3 (audit 2026-08-11): pointer:coarse có thể đổi runtime (hybrid — gắn/tháo bàn phím rời)
  // → theo dõi change thay vì đóng băng lúc startup, tránh auto-focus bật bàn phím ảo sai.
  // Cache MQ 1 lần (media query là singleton per document — không gọi matchMedia 2 lần).
  var MQ_COARSE = window.matchMedia ? window.matchMedia('(pointer: coarse)') : null;

  // chỉ thêm 1 formatter ngày — cùng pattern _fmtTZ (IIFE + try/catch).
  var _clockFmtD = (function () {
    try { return new Intl.DateTimeFormat('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'Asia/Ho_Chi_Minh' }); }
    catch (e) { return null; }
  })();
  function tickHomeClock() {
    var el = document.getElementById('homeClock');
    var de = document.getElementById('homeDate');
    if (!el || !de) return;
    var now = new Date();
    // Format giờ theo TZ HCM — tái dùng _fmtTZ (như fmtDate), mỗi tick chỉ gọi .format()
    el.textContent = _fmtTZ ? _fmtTZ.format(now) : now.toLocaleTimeString('vi-VN');
    de.textContent = _clockFmtD ? _clockFmtD.format(now) : now.toLocaleDateString('vi-VN');
  }
  function renderHomeClock() {
    tickHomeClock();
    if (CLOCK_TIMER) clearInterval(CLOCK_TIMER);
    CLOCK_TIMER = setInterval(tickHomeClock, 1000);
  }

</script>
