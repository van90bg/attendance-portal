<script>
  /* ============================================================
   * MODULE: app-admin.html — viewAdmin (Quản trị) — nhật ký hoạt động (AuditLog).
   * Chỉ admin (server tự gate requireRole_ TRONG getAuditLogApi — DEFENSE).
   * Bảng task mọi owner đã bỏ 2026-08-17: viewTasks đã có toàn bộ task +
   * nút Kết thúc/Mở lại (gate operator) nên bảng admin là trùng lặp.
   * Nạp qua index.html (directive include app-admin) — script block riêng,
   * chung global scope (thứ tự include quan trọng: sau app-reports).
   * Tách từ app-reports.html 2026-08-17 — viewReports giờ chỉ còn Báo cáo.
   * ============================================================ */
  var ADMIN_LOADED = false;
  var AUDIT_ROWS = [];   // rows nhật ký mới tải — lọc client theo ngày

  var ADMIN_ACTIONS = {
    scan: 'Quét', createTask: 'Tạo task', transitionToAttend: 'Chuyển điểm danh',
    completeTask: 'Kết thúc task', reopenTask: 'Mở lại task', pasteCodes: 'Dán mã',
    settings: 'Cấu hình'
  };
  function adminActionLabel_(a) { return ADMIN_ACTIONS[a] || a; }

  // Entry page — lazy-load qua selectPage('admin'); nút ⟳ Cập nhật gọi lại.
  // Page hiện cả khi thiếu quyền nhưng hiển thị message (nav item đã ẩn non-manager).
  function loadAdminView(btn) {
    if (btn) setBtnBusy_(btn, '⟳ Đang tải…');
    function restore() { if (btn) restoreBtnLabel_(btn, '⟳ Cập nhật'); }
    var ab = document.getElementById('auditTable');
    if (!(typeof canAdmin_ === 'function' && canAdmin_())) {
      restore();
      if (ab && ab.tBodies[0]) ab.tBodies[0].innerHTML = '<tr><td colspan="4">Không đủ quyền — cần role admin</td></tr>';
      return;
    }
    ADMIN_LOADED = true;
    google.script.run
      .withSuccessHandler(function (res) {
        restore();
        if (!ab || !ab.tBodies[0]) return;
        if (res && res.ok && Array.isArray(res.rows)) { AUDIT_ROWS = res.rows; renderAuditFiltered(); return; }
        ab.tBodies[0].innerHTML = '<tr><td colspan="4">' + esc((res && res.message) || 'Không tải được nhật ký') + '</td></tr>';
      })
      .withFailureHandler(function (err) { restore(); showToast('Lỗi tải nhật ký: ' + err.message, true); })
      .getAuditLogApi(100);
  }

  // Lọc nhật ký theo ngày (yyyy-MM-dd từ timestamp ISO) — lọc client trên AUDIT_ROWS đã tải.
  function applyAuditFilters() {
    var clearBtn = document.getElementById('auditClearFilter');
    if (clearBtn) {
      var active = (document.getElementById('auditDateFilter') || {}).value || '';
      clearBtn.style.display = active ? '' : 'none';
    }
    renderAuditFiltered();
  }
  function clearAuditFilters() {
    var d = document.getElementById('auditDateFilter'); if (d) d.value = '';
    applyAuditFilters();
  }
  function renderAuditFiltered() {
    var d = (document.getElementById('auditDateFilter') || {}).value || '';
    var rows = AUDIT_ROWS.filter(function (r) {
      if (!d) return true;
      return auditRowDate_(r.timestamp) === d;
    });
    var countEl = document.getElementById('auditRowCount');
    if (countEl) countEl.textContent = d ? rows.length + '/' + AUDIT_ROWS.length + ' dòng' : AUDIT_ROWS.length + ' dòng';
    renderAuditRows(rows);
  }
  // Ngày từ timestamp ISO — dùng new Date (local, KHỚP fmtAuditTime_) chứ không cắt chuỗi UTC:
  // ISO lưu UTC, sát nửa đêm giờ VN (UTC+7) cắt chuỗi sẽ lệch ngày với ngày hiển thị.
  function auditRowDate_(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  // Đối tượng hiển thị: targetId thường đủ; settings ghi targetId '' + detail
  // JSON {"saved":[...]} — parse ra nội dung đọc được, không hiện JSON thô.
  function auditTargetText_(r) {
    if (r.targetId) return r.targetId;
    var d = r.detail || '';
    if (!d) return '—';
    try {
      var o = JSON.parse(d);
      if (o && typeof o === 'object') {
        var parts = Object.keys(o).map(function (k) {
          var v = o[k];
          return k + ': ' + (Array.isArray(v) ? v.join(', ') : (v && typeof v === 'object' ? JSON.stringify(v) : v));
        });
        if (parts.length) return parts.join(' · ');
      }
    } catch (e) { /* detail khong phai JSON — roi xuong hien tho */ }
    return String(d).slice(0, 60);
  }

  function renderAuditRows(rows) {
    var tb = document.getElementById('auditTable');
    if (!tb || !tb.tBodies[0]) return;
    var html = rows.map(function (r) {
      return '<tr><td data-label="Thời gian">' + esc(fmtAuditTime_(r.timestamp)) + '</td><td data-label="Email">' + esc(r.email || '') + '</td>'
        + '<td data-label="Thao tác">' + esc(adminActionLabel_(r.action)) + '</td>'
        + '<td data-label="Đối tượng">' + esc(auditTargetText_(r)) + '</td></tr>';
    }).join('');
    tb.tBodies[0].innerHTML = html || '<tr><td colspan="4">Chưa có hoạt động nào</td></tr>';
  }

  function fmtAuditTime_(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' '
      + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
</script>
