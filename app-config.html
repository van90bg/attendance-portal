<script>
  /* ============================================================
   * MODULE: app-config.html — viewConfig (Cấu hình Admin, editor-only) — defaults + group list + roleMap
   * Tách từ app.html (2026-08-13 — P2-2 tách module client).
   * Nạp qua index.html (directive include app-config) — script block
   * riêng, chung global scope với các module khác (thứ tự include quan trọng).
   * ============================================================ */
  /* ===== VIEW CONFIG — trang Cấu hình Admin (SettingsService: getSettingsApi/saveSettingsApi) =====
   * Sidebar chỉ hiện khi meta.isEditor (getMetaApi). Server gate editor (fail-closed).
   * roleMap: { email: role } — role hợp lệ khớp ROLES (Config.gs). */
  var CFG_ROLES = [
    { v: 'viewer',   l: 'Viewer — chỉ xem' },
    { v: 'operator', l: 'Operator — vận hành điểm danh' },
    { v: 'manager',  l: 'Manager — quản lý vận hành' },
    { v: 'admin',    l: 'Admin — toàn quyền' },
  ];
  var CFG_LOADED = false;      // đã render 1 lần — mở lại không fetch trùng
  var CFG_LOADED_AT = 0;      // mốc tải thành công — TTL cache (giống STAFF_LOADED_AT)
  var CFG_MAX_AGE_MS = 60 * 60 * 1000; /* 1h — cấu hình ít đổi, không fetch mỗi lần mở view (đồng bộ STAFF_MAX_AGE_MS) */

  function loadConfigView(btn, silent) {
    // Guard bấm 'Làm mới' khi còn thay đổi chưa lưu → confirm
    if (CFG_DIRTY && btn) {
      showConfirm('Chưa lưu cấu hình', 'Hủy bỏ thay đổi sẽ mất toàn bộ thay đổi cấu hình chưa lưu. Tiếp tục?', function () {
        CFG_DIRTY = false;
        syncCfgSaveBtn_();
        loadConfigView(null);
      });
      return;
    }
    var meta = document.getElementById('configMeta');
    var empty = document.getElementById('configEmpty');
    var saveBtn = document.getElementById('cfgSaveBtn');
    var wrap = document.getElementById('configWrap');
    var roleWrap = document.getElementById('roleWrap');
    var sk = document.getElementById('cfgSkeleton');
    if (meta) meta.textContent = 'Đang tải…';
    if (empty) empty.style.display = 'none';
    if (wrap) wrap.style.display = 'none';
    if (roleWrap) roleWrap.style.display = 'none';
    if (saveBtn) saveBtn.style.display = 'none';
    if (sk) sk.style.display = '';  // skeleton shimmer thay chữ "Đang tải…" (đồng bộ Task/Staff)
    setBtnBusy_(btn, '⟳ Đang tải…');
    function restore() { restoreBtnLabel_(btn, '⟳ Cập nhật'); syncCfgSaveBtn_(); }
    google.script.run
      .withSuccessHandler(function (res) {
        restore();
        if (!res || !res.ok) {
          if (!silent) showToast((res && res.message) || 'Lỗi tải cấu hình', true);
          if (meta) meta.textContent = 'Không tải được';
          if (saveBtn) saveBtn.style.display = 'none';
          if (sk) sk.style.display = 'none';
          // #11: #configEmpty mặc định là 'Không có quyền…' — đè bằng inline error + Thử lại
          // (trước đây lỗi tải hiện nhầm thông điệp phân quyền, user tưởng mất quyền).
          if (empty) {
            empty.style.display = '';
            empty.innerHTML = 'Không tải được cấu hình'
              + ((res && res.message) ? ': <b>' + esc(res.message) + '</b>' : '')
              + ' — <a href="javascript:void(0)" onclick="loadConfigView(null)">Thử lại</a>';
          }
          return;
        }
          renderConfigForm(res.settings || {});
          CFG_LOADED_AT = Date.now();  // mốc TTL cache — đồng bộ STAFF_LOADED_AT
        if (wrap) wrap.style.display = '';
        if (roleWrap) roleWrap.style.display = '';
        if (saveBtn) saveBtn.style.display = '';  // Mẫu B: nút Lưu phân quyền trên view-topbar
        if (meta) meta.textContent = 'Đã tải — ' + cfgSummary_();
        if (sk) sk.style.display = 'none';
        markServerOk();
      })
      .withFailureHandler(function (err) {
        restore();
        markServerFail();
          if (!silent) showToast('Lỗi tải cấu hình: ' + err.message, true);
        if (meta) meta.textContent = 'Lỗi kết nối';
        if (sk) sk.style.display = 'none';
      })
      .getSettingsApi();
  }

  // Mở viewConfig: dùng cache nếu còn hạn (TTL 1h — giống ensureStaffData), không fetch trùng.
  // CFG_DIRTY → KHÔNG reload (đang sửa dở — tránh mất thay đổi). Nút "⟳ Làm mới" gọi loadConfigView trực tiếp = force.
  function ensureConfigData(force, silent) {
    if (CFG_DIRTY) return;  // đang có thay đổi chưa lưu — không reload mất dữ liệu
    if (!force && CFG_LOADED && (Date.now() - CFG_LOADED_AT) < CFG_MAX_AGE_MS) return;  // cache còn hạn — giữ DOM sẵn có
    loadConfigView(null, silent);
  }

  // ===== Cấu hình vận hành — danh sách mục; MỌI thao tác = state cục bộ + markCfgDirty_,
  // gửi server 1 patch duy nhất (diff vs CFG_SNAPSHOT) khi bấm 'Lưu cấu hình' =====
  // Key mặc định theo group — Mặc định (default) gắn liền Danh sách chọn trong
  // group Station/Team/Slot Code thay vì field đơn tách riêng. departments/agencies không có default.
  var CFG_DEFAULT_KEY = { stations: 'defaultStation', teams: 'defaultTeam', slotcodes: 'defaultSlotCode' };
  var CFG_STATE = {};        // state hiện tại — nguồn render, diff vs snapshot khi Lưu
  var CFG_SNAPSHOT = null;   // bản sao settings lúc load — so sánh để tạo patch
  var CFG_DIRTY = false;     // có thay đổi chưa lưu → nút Lưu bật sáng + guard rời trang
  var CFG_EDIT_ORIG = null;  // giá trị gốc lúc mở edit group — so sánh khi hủy edit dở
  var ROLE_EDIT = null;      // role đang sửa: { email, isNew } | null
  // Group lists (Config sheet — 2026-08-11): danh sách lựa chọn cho dropdown tạo task / filter.
  // Mỗi group 1 section: item Sửa/Xoá + nút + Thêm.
  var CFG_GROUPS = [
    { key: 'stations', label: 'Danh sách Station' },
    { key: 'teams', label: 'Danh sách Team' },
    { key: 'slotcodes', label: 'Danh sách Slot Code (Ca)' },
    { key: 'departments', label: 'Danh sách Department' },
    { key: 'agencies', label: 'Danh sách Agency' },
    { key: 'contractTypes', label: 'Danh sách Contract Type' },  // thứ tự chips tạo task + cột Thống kê
  ];
  // trạng thái thu gọn từng group card (▾/▸) — state phiên, không persist, không dirty.
  var CFG_COLLAPSED = {};

  function deepCopyCfg_() { return JSON.parse(JSON.stringify(CFG_STATE)); }

  // tóm tắt #configMeta sau khi tải — số group/mục/role thay chữ "Đã tải" trống trơn.
  function cfgSummary_() {
    var items = 0;
    CFG_GROUPS.forEach(function (g) { items += safeArr(CFG_STATE[g.key]).length; });
    var map = (CFG_STATE.roleMap && typeof CFG_STATE.roleMap === 'object') ? CFG_STATE.roleMap : {};
    return CFG_GROUPS.length + ' group · ' + items + ' mục · ' + Object.keys(map).length + ' role';
  }

  function renderConfigForm(s) {
    // Hủy bỏ edit dở (group input + role) khi reload — không commit vào state mới
    CFG_EDIT_ORIG = null;
    CFG_STATE = s || {};
    CFG_SNAPSHOT = deepCopyCfg_();
    CFG_DIRTY = false;
    ROLE_EDIT = null;
    syncCfgSaveBtn_();
    renderCfgList();
    renderRoleRows();
    CFG_LOADED = true;
  }

  // Dirty tracking mọi thao tác sửa/xoá/thêm/kéo thả/default/role chỉ đổi state
  // cục bộ + đánh dấu dirty → nút 'Lưu cấu hình' bật sáng (CSS .cfg-save-dirty).
  function markCfgDirty_() {
    CFG_DIRTY = true;
    syncCfgSaveBtn_();
  }
  function syncCfgSaveBtn_() {
    var b = document.getElementById('cfgSaveBtn');
    if (b) {
      b.classList.toggle('cfg-save-dirty', !!CFG_DIRTY);
      b.disabled = !CFG_DIRTY;  // nút Lưu tắt khi chưa có thay đổi
    }
    // nút "Hủy thay đổi" RIÊNG khi dirty — thay cơ chế đổi nhãn Làm mới (dễ bỡ ngỡ)
    var d = document.getElementById('cfgDiscardBtn');
    if (d) d.style.display = CFG_DIRTY ? '' : 'none';
  }

  // hủy bỏ toàn bộ thay đổi chưa lưu → confirm → khôi phục CFG_SNAPSHOT CỤC BỘ.
  // KHÔNG gọi loadConfigView (không fetch/skeleton/nhấp nháy) — snapshot luôn = trạng thái server
  // cuối (cập nhật sau mỗi save thành công) → hủy chỉ đổi state + render lại dưới nền, giữ scroll.
  function discardCfgChanges() {
    showConfirm('Hủy bỏ thay đổi', 'Hủy bỏ toàn bộ thay đổi cấu hình chưa lưu?', function () {
      if (!CFG_SNAPSHOT) return;  // chưa load lần nào — không có gì để hủy
      renderConfigForm(JSON.parse(JSON.stringify(CFG_SNAPSHOT)));  // reset state về base server
      showToast('Đã hủy thay đổi', false);
    });
  }


  // renderCfgList: mỗi group 1 section riêng (2026-08-14 — bỏ bảng gộp/thead sticky/cột Nhóm):
  // section = tiêu đề + count + nút + Thêm + bảng nhỏ (Giá trị | Mặc định* | Thao tác).
  // ô tìm kiếm #cfgSearch lọc item theo q — section không khớp ẩn hẳn,
  // không có kết quả nào thì hiện #cfgNoResult. Giữ scroll của #configForm (.card cuộn).
  function renderCfgList() {
    var box = document.getElementById('cfgList');
    if (!box) return;
    var card = document.getElementById('configForm');
    var st = card ? card.scrollTop : 0;  // giữ vị trí cuộn card khi render lại
    var q = cfgSearchQ_();
    var htmls = CFG_GROUPS.map(function (g) { return cfgGroupHtml_(g, q); }).filter(function (h) { return h !== ''; });
    var nr = document.getElementById('cfgNoResult');
    if (nr) {
      if (q && !htmls.length) { nr.style.display = ''; nr.textContent = 'Không có mục phù hợp “' + q + '”'; }
      else { nr.style.display = 'none'; nr.textContent = ''; }
    }
    box.innerHTML = htmls.join('');
    if (card) card.scrollTop = st;
  }
  function cfgSearchQ_() {
    var s = document.getElementById('cfgSearch');
    return s ? s.value.trim().toLowerCase() : '';
  }
  function cfgItemMatch_(g, v, q) {
    if (!q) return true;
    return String(v).toLowerCase().indexOf(q) >= 0 || String(g.label).toLowerCase().indexOf(q) >= 0;
  }

  // Render 1 group card (2026-08-16 — bỏ bảng, dùng chip wrap): card riêng viền + collapse ▾/▸ +
  // head (title + count + nút + Thêm) + chips (.cfg-chips flex wrap — 7 mục Slot Code co lại 2 dòng).
  // Chip <span class="cfg-chip cfg-item-group"> giữ class/selector cho editCfgGroupItem/drag*/delete.
  // q != '' → chỉ render chip khớp (data-idx vẫn là index THẬT trong CFG_STATE);
  // group không khớp nào thì trả '' (ẩn hẳn section). Search → luôn mở (bỏ qua collapse).
  function cfgGroupHtml_(g, q) {
    var list = safeArr(CFG_STATE[g.key]);
    var hasDef = !!CFG_DEFAULT_KEY[g.key];
    var collapsed = !!CFG_COLLAPSED[g.key] && !q;
    q = q || '';
    var chips = [];
    var matches = 0;
    for (var i = 0; i < list.length; i++) {
      var v = String(list[i]);
      if (!cfgItemMatch_(g, v, q)) continue;
      matches++;
      chips.push(cfgItemChipHtml_(g, v, i, hasDef));
    }
    if (!matches) {
      if (q) return '';  // đang tìm — ẩn section không có kết quả
      chips.push('<span class="cfg-empty-val">(chưa có)</span>');
    }
    // Mockup cả head click được để collapse — chevron ▾ xoay -90° khi đóng,
    // count badge pill cạnh title; nút + Thêm là dashed pill cuối hàng chips (không còn nút ở head).
    return '<div class="cfg-group-card' + (collapsed ? ' is-collapsed' : '') + '" data-group="' + g.key + '">'
      + '<div class="cfg-card-head" role="button" tabindex="0" aria-expanded="' + (!collapsed) + '"'
        + ' onclick="toggleCfgGroupCollapse(\'' + g.key + '\')"'
        + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleCfgGroupCollapse(\'' + g.key + '\')}"'
        + ' title="' + (collapsed ? 'Mở rộng' : 'Thu gọn') + ' ' + esc(g.label) + '">'
        + '<span class="cfg-chevron" aria-hidden="true">▾</span>'
        + '<span class="cfg-group-title">' + esc(g.label) + '</span>'
        + '<span class="cfg-count" aria-label="' + list.length + ' mục">' + list.length + '</span>'
      + '</div>'
      + '<div class="cfg-chips" ondragover="dragCfgOver(event)" ondrop="dragCfgDrop(event,\'' + g.key + '\',-1)">'
        + chips.join('')
        + '<button type="button" class="cfg-add-chip" onclick="addCfgGroupItem(\'' + g.key + '\')">+ Thêm</button>'
      + '</div>'
    + '</div>';
  }
  // Chip 1 item value + star ★/☆ (default) + icon ✎/✕ — ôm sát nội dung, wrap tự nhiên.
  function cfgItemChipHtml_(g, v, i, hasDef) {
    var def = isDefault_(g.key, v);
    return '<span class="cfg-chip cfg-item-group' + (def ? ' is-default' : '') + '" data-group="' + g.key + '" data-idx="' + i + '" draggable="true"'
      + ' ondragstart="dragCfgStart(event,\'' + g.key + '\',' + i + ')"'
      + ' ondragover="dragCfgOver(event)" ondrop="dragCfgDrop(event,\'' + g.key + '\',' + i + ')"'
      + ' ondragend="dragCfgEnd(event)">'
      + '<span class="cfg-drag-handle" title="Kéo để sắp xếp — focus rồi bấm ↑↓" role="button" tabindex="0" aria-label="Sắp xếp ' + escAttr(v) + '"'
      + ' onpointerdown="cfgDragPtrDown(event,\'' + g.key + '\',' + i + ')" onpointermove="cfgDragPtrMove(event)"'
      + ' onpointerup="cfgDragPtrEnd(event)" onpointercancel="cfgDragPtrEnd(event)"'
      + ' onkeydown="cfgDragHandleKeydown(event,\'' + g.key + '\',' + i + ')">⋮⋮</span>'
      + '<span class="cfg-chip-value" title="' + escAttr(v) + '">' + esc(v) + '</span>'  /* tooltip đầy đủ khi value bị ellipsis (mockup) */
      + (hasDef ? cfgStarHtml_(g, v, def) : '')
      + '<button type="button" class="cfg-chip-edit" onclick="editCfgGroupItem(\'' + g.key + '\',' + i + ')" title="Sửa" aria-label="Sửa ' + escAttr(v) + '">✎</button>'
      + '<button type="button" class="cfg-chip-del" onclick="deleteCfgGroupItem(\'' + g.key + '\',' + i + ')" title="Xoá" aria-label="Xoá ' + escAttr(v) + '">✕</button>'
    + '</span>';
  }

  // Star ★/☆ (2026-08-16 — thay nút "Mặc định" to lặp mọi dòng): 1 ★ tô đậm = đang mặc định.
  function cfgStarHtml_(g, v, def) {
    return '<button type="button" class="cfg-star-btn' + (def ? ' cfg-star-on' : '') + '" onclick="toggleCfgDefault(\'' + g.key + '\',\'' + escAttr(String(v)) + '\')" title="' + (def ? 'Bỏ mặc định' : 'Đặt mặc định') + '" aria-label="' + (def ? 'Bỏ mặc định ' : 'Đặt mặc định ') + esc(String(v)) + '">' + (def ? '★' : '☆') + '</button>';
  }

  // thu gọn/mở rộng group card — chỉ đổi hiển thị, không dirty (không phải thay đổi cấu hình).
  function toggleCfgGroupCollapse(group) {
    CFG_COLLAPSED[group] = !CFG_COLLAPSED[group];
    renderCfgList();
  }

  function isDefault_(group, val) {
    var dk = CFG_DEFAULT_KEY[group];
    return dk ? CFG_STATE[dk] === val : false;
  }
  // Mặc định (default) inline — thay select riêng mỗi item có nút "Mặc định" + badge
  function toggleCfgDefault(group, val) {
    cancelPendingGroupEdit_();  // hủy edit dở — chỉ nút Lưu dòng mới chốt
    var dk = CFG_DEFAULT_KEY[group];
    if (!dk) return;
    CFG_STATE[dk] = (CFG_STATE[dk] === val) ? '' : val;
    renderCfgList();
    markCfgDirty_();
  }

  // Kéo thả sắp xếp item trong group (HTML5 DnD — 2026-08-12): thứ tự list = thứ tự Config
  // dùng cho Thống kê (orderedByCfg_) và dropdown tạo task.
  // HTML5 DnD không fire dragstart trên cảm ứng → thêm pointer fallback từ
  // handle ⋮⋮ (mouse giữ nguyên HTML5 DnD) + sắp xếp bằng bàn phím ↑↓/Home/End (P2).
  var CFG_DRAG = null;        // trạng thái HTML5 DnD (mouse/desktop)
  var CFG_TOUCH_DRAG = null;  // trạng thái pointer-drag (touch/pen)
  var CFG_AUTOSCROLL = null;  // rAF auto-scroll khi kéo touch gần mép card

  // Di chuyển item group from → to (dùng chung: drop HTML5, drop touch, phím ↑↓) — CỤC BỘ + dirty.
  function moveCfgItem_(group, from, to) {
    cancelPendingGroupEdit_();  // hủy edit dở — chỉ nút Lưu dòng mới chốt
    var list = safeArr(CFG_STATE[group]).slice();
    var v = list.splice(from, 1)[0];
    list.splice(to, 0, v);
    CFG_STATE[group] = list;
    renderCfgList();  // áp dụng ngay — không reload, giữ scroll
    markCfgDirty_();
  }

  function dragCfgStart(ev, group, idx) {
    if (cfgSearchQ_()) return;  // đang lọc — kéo theo index thật khó hình dung, tắt tạm
    CFG_DRAG = { group: group, from: idx };
    try { ev.dataTransfer.setData('text/plain', String(idx)); ev.dataTransfer.effectAllowed = 'move'; } catch (e) { /* ignore */ }
    if (ev.currentTarget) ev.currentTarget.classList.add('cfg-dragging');
  }
  function dragCfgOver(ev) {
    ev.preventDefault();  // cho phép drop
    if (ev.stopPropagation) ev.stopPropagation();  // chỉ target gần nhất (item) highlight — container không đè
    try { ev.dataTransfer.dropEffect = 'move'; } catch (e) { /* ignore */ }
    clearDropTargets_();
    if (ev.currentTarget) ev.currentTarget.classList.add('cfg-drop-target');
  }
  function dragCfgDrop(ev, group, to) {
    ev.preventDefault();
    var src = CFG_DRAG;
    CFG_DRAG = null;
    clearDropTargets_();
    if (!src || src.group !== group) return;
    if (to === -1) to = safeArr(CFG_STATE[group]).length;  // thả cuối group
    if (src.from === to) return;
    moveCfgItem_(group, src.from, to);
  }
  function dragCfgEnd(ev) {
    CFG_DRAG = null;
    clearDropTargets_();
    if (ev.currentTarget) ev.currentTarget.classList.remove('cfg-dragging');
  }
  function clearDropTargets_() {
    var els = document.querySelectorAll('.cfg-drop-target');
    for (var i = 0; i < els.length; i++) els[i].classList.remove('cfg-drop-target');
  }

  // ===== Pointer drag : HTML5 DnD không fire dragstart trên cảm ứng — thêm
  // pointer fallback từ handle ⋮⋮ (pointerType khác mouse = touch/pen). Mouse giữ nguyên HTML5 DnD.
  function cfgDragPtrDown(ev, group, idx) {
    if (ev.pointerType === 'mouse') return;  // mouse dùng HTML5 DnD
    if (cfgSearchQ_()) return;  // đang lọc — không kéo touch
    ev.preventDefault();
    try { ev.target.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
    CFG_TOUCH_DRAG = { group: group, from: idx, x: ev.clientX, y: ev.clientY, startX: ev.clientX, startY: ev.clientY, moved: false, to: undefined };
    var row = cfgItemRow_(group, idx);
    if (row) row.classList.add('cfg-dragging');
  }
  function cfgDragPtrMove(ev) {
    var t = CFG_TOUCH_DRAG;
    if (!t) return;
    ev.preventDefault();
    t.x = ev.clientX; t.y = ev.clientY;
    if (!t.moved) {
      if (Math.abs(ev.clientX - t.startX) + Math.abs(ev.clientY - t.startY) < 8) return;  // chưa đủ cử chỉ kéo
      t.moved = true;
    }
    cfgTouchHitTest_();
    cfgAutoScroll_(ev.clientY);
  }
  function cfgDragPtrEnd(ev) {
    var t = CFG_TOUCH_DRAG;
    if (!t) return;
    CFG_TOUCH_DRAG = null;
    cfgStopAutoScroll_();
    clearDropTargets_();
    var row = cfgItemRow_(t.group, t.from);
    if (row) row.classList.remove('cfg-dragging');
    if (!t.moved || t.to === undefined || t.to === t.from) return;
    moveCfgItem_(t.group, t.from, t.to);
  }
  function cfgTouchHitTest_() {
    var t = CFG_TOUCH_DRAG;
    if (!t) return;
    var el = document.elementFromPoint(t.x, t.y);
    var row = el && el.closest ? el.closest('.cfg-item-group[data-group="' + t.group + '"]') : null;
    clearDropTargets_();
    if (row) { row.classList.add('cfg-drop-target'); t.to = parseInt(row.getAttribute('data-idx'), 10); }
    else t.to = undefined;
  }
  // Auto-scroll card khi kéo touch gần mép trên/dưới — rAF lặp tới khi nhả tay.
  function cfgAutoScroll_(y) {
    if (CFG_AUTOSCROLL) return;
    var card = document.getElementById('configForm');
    if (!card) return;
    var zone = 48;
    CFG_AUTOSCROLL = requestAnimationFrame(function step() {
      if (!CFG_TOUCH_DRAG) { CFG_AUTOSCROLL = null; return; }
      var rect = card.getBoundingClientRect();
      var dy = 0;
      if (y < rect.top + zone) dy = -Math.round(((zone - (y - rect.top)) / zone) * 14);
      else if (y > rect.bottom - zone) dy = Math.round(((zone - (rect.bottom - y)) / zone) * 14);
      if (dy) { card.scrollTop += dy; cfgTouchHitTest_(); }  // nội dung cuộn → cập nhật target
      CFG_AUTOSCROLL = requestAnimationFrame(step);
    });
  }
  function cfgStopAutoScroll_() {
    if (CFG_AUTOSCROLL) { cancelAnimationFrame(CFG_AUTOSCROLL); CFG_AUTOSCROLL = null; }
  }
  function cfgItemRow_(group, idx) {
    var box = document.getElementById('cfgList');
    return box ? box.querySelector('.cfg-item-group[data-group="' + group + '"][data-idx="' + idx + '"]') : null;
  }

  // sắp xếp bằng bàn phím — handle focus được, ↑↓/Home/End di chuyển item (a11y).
  function cfgDragHandleKeydown(ev, group, idx) {
    if (cfgSearchQ_()) return;  // đang lọc — không sắp xếp bằng phím
    var list = safeArr(CFG_STATE[group]);
    var to = -1;
    if (ev.key === 'ArrowUp') to = idx - 1;
    else if (ev.key === 'ArrowDown') to = idx + 1;
    else if (ev.key === 'Home') to = 0;
    else if (ev.key === 'End') to = list.length - 1;
    if (to < 0 || to > list.length - 1 || to === idx) return;
    ev.preventDefault();
    moveCfgItem_(group, idx, to);
    var row = cfgItemRow_(group, to);
    var h = row ? row.querySelector('.cfg-drag-handle') : null;
    if (h) h.focus();  // giữ focus trên handle sau khi di chuyển — bấm ↑↓ liên tiếp được
  }

  // Sửa item group input + nút Lưu/Huỷ RÕ RÀNG — chỉ Lưu/Enter mới chốt vào state
  // (bỏ commit-on-blur 180ms — blur không làm gì, không mất chữ bất ngờ). Hành động khác
  // (Sửa/Thêm/Xoá/Default/Drop/Role/Lưu cấu hình...) → cancelPendingGroupEdit_ hủy edit dở.
  function editCfgGroupItem(group, idx) {
    cancelPendingGroupEdit_();  // hủy edit dở đang mở (nếu có) trước khi mở cái mới
    var box = document.getElementById('cfgList');
    if (!box) return;
    var list = safeArr(CFG_STATE[group]);
    var cur = list[idx] === undefined ? '' : list[idx];
    var item = box.querySelector('.cfg-item-group[data-group="' + group + '"][data-idx="' + idx + '"]');
    if (!item) return;
    CFG_EDIT_ORIG = String(cur);
    item.classList.add('cfg-chip-editing');
    // Mockup chip edit = input transparent liền chip (viền primary ở chip) + icon ✓/✕ —
    // gọn hơn nút chữ Lưu/Huỷ; placeholder "Giá trị mới" chỉ khi Thêm mới (cur rỗng).
    // P2 (audit 2026-08-22): mirror markup normal — drag-handle editing giữ role/tabindex/aria-label
    item.innerHTML = '<span class="cfg-drag-handle" role="button" tabindex="0" aria-label="Sắp xếp ' + escAttr(String(cur)) + '">⋮⋮</span>'
        + '<input class="cfg-edit-input" id="cfgGroupEditInput" value="' + escAttr(String(cur)) + '" placeholder="' + (cur === '' ? 'Giá trị mới' : '') + '" autocomplete="off">'
        + '<button type="button" class="cfg-chip-edit" onclick="commitCfgGroupItem(\'' + group + '\',' + idx + ')" title="Lưu" aria-label="Lưu thay đổi">✓</button>'
        + '<button type="button" class="cfg-chip-del" onclick="cancelCfgGroupEdit(\'' + group + '\',' + idx + ')" title="Huỷ" aria-label="Huỷ thay đổi">✕</button>';
    var inp = document.getElementById('cfgGroupEditInput');
    if (inp) {
      inp.focus(); inp.select();
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); commitCfgGroupItem(group, idx); }
        else if (e.key === 'Escape') cancelCfgGroupEdit(group, idx);
      });
      // KHÔNG có blur listener — edit dở giữ nguyên tới khi Lưu/Huỷ hoặc hành động khác hủy
    }
  }

  // bỏ edit dở — Thêm (row '' cuối) → pop; Sửa → giữ giá trị cũ (state chưa đổi)
  function discardCfgGroupEdit_(group) {
    var list = safeArr(CFG_STATE[group]);
    if (list.length && String(list[list.length - 1] || '').trim() === '') list.pop();
    renderCfgList();
  }

  // giá trị trùng trong cùng group (khác dòng, case-insensitive) — chặn thêm/sửa trùng
  function isDupCfgValue_(group, idx, v) {
    var list = safeArr(CFG_STATE[group]);
    var lv = String(v || '').trim().toLowerCase();
    for (var i = 0; i < list.length; i++) {
      if (i !== idx && String(list[i] || '').trim().toLowerCase() === lv) return true;
    }
    return false;
  }

  function cancelCfgGroupEdit(group) {
    CFG_EDIT_ORIG = null;
    discardCfgGroupEdit_(group);
  }

  // Commit sửa item group — CỤC BỘ (chỉ đổi state + dirty; chờ 'Lưu cấu hình' ghi server).
  // silent=true khi gọi từ saveConfig (đã có toast lưu — không lặp toast "chưa lưu").
  function commitCfgGroupItem(group, idx, silent) {
    var inp = document.getElementById('cfgGroupEditInput');
    var v = inp ? inp.value.trim() : '';
    CFG_EDIT_ORIG = null;
    if (!v) { discardCfgGroupEdit_(group); return true; }  // commit rỗng = hủy row — KHÔNG phải lỗi, save vẫn tiếp tục
    if (isDupCfgValue_(group, idx, v)) { showToast('"' + v + '" đã có trong danh sách', true); discardCfgGroupEdit_(group); return false; }  // chặn trùng
    var list = safeArr(CFG_STATE[group]).slice();
    var orig = String(list[idx] === undefined ? '' : list[idx]);
    list[idx] = v;
    CFG_STATE[group] = list;
    // đổi tên item đang là Mặc định → cập nhật default theo (trước đây default "mồ côi" — không row nào hiện trạng thái mặc định)
    var dk = CFG_DEFAULT_KEY[group];
    if (dk && CFG_STATE[dk] === orig) CFG_STATE[dk] = v;
    renderCfgList();
    var firstDirty = !CFG_DIRTY;
    markCfgDirty_();
    if (firstDirty && !silent) showToast('Đã chốt — chưa lưu. Bấm “Lưu cấu hình” khi xong', false);
    return true;
  }

  // hủy edit group đang mở — gọi trước mọi hành động khác (Sửa/Thêm/Xoá/Default/
  // Drop/Role) vì chỉ nút Lưu dòng mới chốt. Toast nếu đang gõ dở có thay đổi (không mất chữ lặng lẽ).
  function cancelPendingGroupEdit_() {
    var inp = document.getElementById('cfgGroupEditInput');
    if (!inp) return;
    var changed = CFG_EDIT_ORIG !== null && inp.value.trim() !== CFG_EDIT_ORIG;
    var item = inp.closest('.cfg-item-group');
    var group = item ? item.getAttribute('data-group') : null;
    CFG_EDIT_ORIG = null;
    if (group) discardCfgGroupEdit_(group);
    else renderCfgList();
    if (changed) showToast('Đã hủy thay đổi dòng chưa lưu', false);
  }

  // chốt dòng group đang sửa — chỉ gọi từ saveConfig ('Lưu cấu hình' = lưu mọi thay đổi)
  // trả về false khi không chốt được (trùng giá trị) → saveConfig ABORT
  function commitPendingGroupEdit_() {
    var inp = document.getElementById('cfgGroupEditInput');
    if (!inp) return true;
    var item = inp.closest('.cfg-item-group');
    if (!item) return true;
    return commitCfgGroupItem(item.getAttribute('data-group'), parseInt(item.getAttribute('data-idx'), 10), true);
  }

  // B4 xoá mục đang là Mặc định → cảnh báo trong confirm + xoá luôn default theo.
  function deleteCfgGroupItem(group, idx) {
    cancelPendingGroupEdit_();  // hủy edit dở — chỉ nút Lưu dòng mới chốt
    var list = safeArr(CFG_STATE[group]);
    var val = String(list[idx] === undefined ? '' : list[idx]);
    var isDef = isDefault_(group, val);
    showConfirm('Xoá mục', 'Xoá "' + val + '" khỏi ' + groupLabel_(group) + (isDef ? ' — mục này đang là Mặc định, sẽ bỏ mặc định theo.' : '?'), function () {
      var list2 = safeArr(CFG_STATE[group]).slice();
      list2.splice(idx, 1);
      CFG_STATE[group] = list2;
      if (isDef && CFG_DEFAULT_KEY[group]) CFG_STATE[CFG_DEFAULT_KEY[group]] = '';
      renderCfgList();
      markCfgDirty_();
    });
  }

  function addCfgGroupItem(group) {
    // KHÔNG gọi server: append '' cục bộ + mở ô nhập ngay (server lọc item rỗng → gọi server
    // rồi reload sẽ không thấy row mới — UX hỏng). User nhập giá trị → blur/Enter → commit.
    var s = document.getElementById('cfgSearch');
    if (s && s.value) s.value = '';  // bỏ tìm kiếm — row mới không bị filter ẩn
    CFG_COLLAPSED[group] = false;  // group đang thu gọn → mở ra — chip mới phải thấy
    var list = safeArr(CFG_STATE[group]).slice();
    list.push('');
    CFG_STATE[group] = list;
    renderCfgList();
    editCfgGroupItem(group, list.length - 1);
  }

  function groupLabel_(group) {
    for (var i = 0; i < CFG_GROUPS.length; i++) { if (CFG_GROUPS[i].key === group) return CFG_GROUPS[i].label; }
    return group;
  }

  // ===== Phân quyền — mỗi role = 1 card (email + role) với nút Sửa / Xoá (confirm)
  // y hệt item vận hành Sửa → input email + select role + Huỷ, commit khi
  // blur/Enter (email trống → xoá role). Mọi đổi chỉ state cục bộ + dirty.
  function roleLabel_(r) {
    for (var i = 0; i < CFG_ROLES.length; i++) { if (CFG_ROLES[i].v === r) return CFG_ROLES[i].l; }
    return r || '?';
  }

  // renderRoleRows: Phân quyền thành section riêng (2026-08-14, đồng bộ group section):
  // tiêu đề + count + nút + Thêm role ở head, bảng 3 cột (email | role | Sửa/Xoá).
  function renderRoleRows() {
    var box = document.getElementById('cfgRoleRows');
    if (!box) return;
    var map = (CFG_STATE.roleMap && typeof CFG_STATE.roleMap === 'object') ? CFG_STATE.roleMap : {};
    var keys = Object.keys(map);
    // Mockup role = card rows (không bảng) — email + badge + icon ✎/✕; + Thêm role = dashed pill.
    var html = '<div class="cfg-group-card" data-group="roleMap">'
      + '<div class="cfg-card-head" style="cursor:default;">'
        + '<span class="cfg-group-title">Phân quyền (roleMap)</span>'
        + '<span class="cfg-count">' + keys.length + '</span>'
      + '</div>'
      + '<div class="cfg-role-rows">';
    var any = false;
    keys.forEach(function (em) {
      if (ROLE_EDIT && ROLE_EDIT.email === em && !ROLE_EDIT.isNew) { html += roleRowEditHtml_(em, map[em]); any = true; }
      else { html += roleRowCardHtml_(em, map[em]); any = true; }
    });
    if (ROLE_EDIT && ROLE_EDIT.isNew) { html += roleRowEditHtml_('', 'viewer'); any = true; }
    if (!any) html += '<div class="cfg-empty-val">(chưa có role)</div>';
    html += '<button type="button" class="cfg-add-chip" onclick="addRoleRow()">+ Thêm role</button>'
      + '</div></div>';
    box.innerHTML = html;
    wireRoleEditEvents_(box);
  }


  // wireRoleEditEvents_: Enter = Lưu, Escape = Huỷ (2026-08-14 — bỏ commit-on-blur 180ms).
  function wireRoleEditEvents_(box) {
    var row = box.querySelector('.cfg-role-editing');
    if (!row) return;
    var em = row.querySelector('.cfg-role-email');
    if (!em) return;
    em.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); commitRoleEdit(); }
      else if (e.key === 'Escape') cancelRoleEdit();
    });
    setTimeout(function () { em.focus(); if (em.value) em.select(); }, 0);
  }


  function roleRowCardHtml_(email, role) {
    return '<div class="cfg-role-card" data-email="' + escAttr(email || '') + '">'
      + '<span class="cfg-role-email" title="' + escAttr(email || '') + '">' + esc(email || '(trống)') + '</span>'
      + '<span class="cfg-role-badge" title="' + escAttr(roleLabel_(role)) + '">' + esc(roleLabel_(role)) + '</span>'
      + '<div class="cfg-role-actions">'
        + '<button type="button" class="cfg-icon-btn" onclick="startRoleEdit(\'' + escAttr(email || '') + '\')" title="Sửa role" aria-label="Sửa role">✎</button>'
        + '<button type="button" class="cfg-icon-btn cfg-icon-danger" onclick="deleteRoleRow(\'' + escAttr(email || '') + '\')" title="Xoá role" aria-label="Xoá role">✕</button>'
      + '</div>'
    + '</div>';
  }

  // Xoá 1 role (inline onclick — thay closure cũ khi chuyển sang HTML-string, 2026-08-13).
  function deleteRoleRow(email) {
    cancelPendingGroupEdit_(); cancelPendingRoleEdit_();  // hủy edit dở trước khi hỏi xoá
    showConfirm('Xoá role', 'Xoá role của "' + (email || '(trống)') + '"?', function () {
      var map = CFG_STATE.roleMap || {};
      delete map[email];
      CFG_STATE.roleMap = map;
      ROLE_EDIT = null;
      renderRoleRows();
      markCfgDirty_();
    });
  }


  function roleRowEditHtml_(email, role) {
    var opts = CFG_ROLES.map(function (r) {
      return '<option value="' + r.v + '"' + (r.v === role ? ' selected' : '') + '>' + esc(r.l) + '</option>';
    }).join('');
    return '<div class="cfg-role-card cfg-role-editing" data-email="' + escAttr(email || '') + '">'
      + '<input class="cfg-role-email" type="text" placeholder="email@spxexpress.com" autocomplete="off" value="' + escAttr(email || '') + '">'
      + '<select class="cfg-role-select">' + opts + '</select>'
      + '<div class="cfg-role-actions">'
        + '<button type="button" class="cfg-icon-btn cfg-icon-ok" onclick="commitRoleEdit()" title="Lưu role" aria-label="Lưu role">✓</button>'
        + '<button type="button" class="cfg-icon-btn cfg-icon-danger" onclick="cancelRoleEdit()" title="Huỷ sửa" aria-label="Huỷ sửa role">✕</button>'
      + '</div>'
    + '</div>';
  }

  function startRoleEdit(email) {
    cancelPendingGroupEdit_();  // hủy edit dở — chỉ nút Lưu mới chốt
    if (ROLE_EDIT) cancelPendingRoleEdit_();
    ROLE_EDIT = { email: email, isNew: false };
    renderRoleRows();
  }
  function addRoleRow() {
    cancelPendingGroupEdit_();
    if (ROLE_EDIT) cancelPendingRoleEdit_();
    ROLE_EDIT = { email: '', isNew: true };
    renderRoleRows();
  }
  function cancelRoleEdit() {
    ROLE_EDIT = null;
    renderRoleRows();
  }
  // hủy role edit đang mở khi bấm hành động khác (toast nếu đang sửa dở — không mất chữ lặng lẽ)
  function cancelPendingRoleEdit_() {
    if (!ROLE_EDIT) return;
    var row = document.querySelector('.cfg-role-editing');
    var em = row ? row.querySelector('.cfg-role-email') : null;
    var changed = !!em && em.value.trim().toLowerCase() !== ROLE_EDIT.email;
    ROLE_EDIT = null;
    renderRoleRows();
    if (changed) showToast('Đã hủy thay đổi role chưa lưu', false);
  }
  // Commit role đang sửa (nút Lưu/Enter): email trống → xoá role; đổi email → xoá key cũ.
  // trả về false khi không chốt được (email trùng/hợp lệ sai) — saveConfig ABORT
  function commitRoleEdit(silent) {
    if (!ROLE_EDIT) return true;
    var row = document.querySelector('.cfg-role-editing');
    var em = row ? row.querySelector('.cfg-role-email') : null;
    var sel = row ? row.querySelector('.cfg-role-select') : null;
    if (!em || !sel) { ROLE_EDIT = null; renderRoleRows(); return true; }
    var email = em.value.trim().toLowerCase();
    // validate định dạng email — roleMap khớp chính xác string, gõ lệch = mất quyền âm thầm
    if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      showToast('Email không hợp lệ: "' + email + '"', true);
      if (em) em.focus();
      return false;
    }
    var map = CFG_STATE.roleMap || {};
    var old = ROLE_EDIT.email || '';
    // email mới đã có role (key khác) → CHẶN ghi đè âm thầm — trước đây xoá
    // mất phân quyền của người khác không cảnh báo.
    if (email && email !== old && map[email] !== undefined) {
      showToast('Email "' + email + '" đã có role "' + roleLabel_(map[email]) + '" — không ghi đè. Xoá role cũ trước nếu muốn thay.', true);
      if (em) em.focus();
      return false;  // giữ ô đang sửa — không đóng ROLE_EDIT
    }
    if (old && old !== email) delete map[old];
    if (email) map[email] = sel.value;
    else delete map[old];  // bỏ trống email → xoá role
    CFG_STATE.roleMap = map;
    ROLE_EDIT = null;
    renderRoleRows();
    var firstDirty = !CFG_DIRTY;
    markCfgDirty_();
    if (firstDirty && !silent) showToast('Đã chốt — chưa lưu. Bấm “Lưu cấu hình” khi xong', false);  // B5
    return true;
  }
  // chốt role đang sửa — chỉ gọi từ saveConfig ('Lưu cấu hình' = lưu mọi thay đổi)
  // trả về false khi không chốt được → saveConfig ABORT (không lưu thiếu âm thầm)
  function commitPendingRoleEdit_() {
    if (ROLE_EDIT) return commitRoleEdit(true);
    return true;
  }

  // Lưu toàn bộ cấu hình: diff CFG_STATE vs CFG_SNAPSHOT → 1 patch duy nhất.
  // Không reload — giữ scroll; success → cập nhật snapshot + tắt dirty (nút Lưu hết sáng).
  function saveConfig(btn) {
    // edit dở (group/role) không chốt được (trùng/hợp lệ sai) → ABORT cả lần lưu —
    // trước đây lưu tiếp phần khác, dòng lỗi bị bỏ lặng lẽ, user tưởng đã lưu hết.
    if (!commitPendingGroupEdit_() || !commitPendingRoleEdit_()) {
      showToast('Chưa lưu — dòng đang sửa không hợp lệ, kiểm tra lại', true);
      return;
    }
    var patch = cfgDiff_();
    if (!patch || !Object.keys(patch).length) { showToast('Không có thay đổi để lưu', false); return; }
    setBtnBusy_(btn, 'Đang lưu…');
    function restore() { restoreBtnLabel_(btn, 'Lưu cấu hình'); }
    google.script.run
      .withSuccessHandler(function (res) {
        restore();
        if (!res || !res.ok) { showToast((res && res.message) || 'Lỗi lưu cấu hình', true); return; }
        CFG_SNAPSHOT = deepCopyCfg_();  // base mới cho diff lần sau
        CFG_DIRTY = false;
        syncCfgSaveBtn_();
        showToast(res.message || 'Đã lưu cấu hình', false);
      })
      .withFailureHandler(function (err) {
        restore();
        markServerFail();
        showToast('Lỗi lưu cấu hình: ' + err.message, true);
      })
      .saveSettingsApi(patch);
  }

  // Diff vs snapshot lúc load — chỉ gửi key thay đổi (groups + defaults + roleMap)
  function cfgDiff_() {
    if (!CFG_SNAPSHOT) return null;
    var patch = {};
    var keys = {};
    CFG_GROUPS.forEach(function (g) { keys[g.key] = 1; });
    Object.keys(CFG_DEFAULT_KEY).forEach(function (g) { keys[CFG_DEFAULT_KEY[g]] = 1; });
    keys.roleMap = 1;
    Object.keys(keys).forEach(function (k) {
      if (JSON.stringify(CFG_STATE[k]) !== JSON.stringify(CFG_SNAPSHOT[k])) patch[k] = CFG_STATE[k];
    });
    return patch;
  }

  // Guard đóng tab / F5 khi còn thay đổi cấu hình chưa lưu → confirm trình duyệt
  window.addEventListener('beforeunload', function (e) {
    if (CFG_DIRTY) { e.preventDefault(); e.returnValue = ''; }
  });
</script>
