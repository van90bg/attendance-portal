<script>
  /* ============================================================
   * MODULE: app-config.html — viewConfig (Cấu hình Admin, editor-only) — defaults + group list + roleMap
   * Tách từ app.html (2026-08-13 — P2-2 tách module client).
   * Nạp qua index.html (directive include app-config) — script block
   * riêng, chung global scope với các module khác (thứ tự include quan trọng).
   * ============================================================ */
  /* ===== VIEW CONFIG — trang Cấu hình Admin (SettingsService: getSettingsApi/saveSettingsApi) =====
   * Sidebar chỉ hiện khi meta.isEditor (getMetaApi). Server gate editor (fail-closed).
   * roleMap: { email: role } — role hợp lệ khớp ROLES (Config.gs). */
  var CFG_ROLES = [
    { v: 'viewer',   l: 'Viewer — chỉ xem' },
    { v: 'operator', l: 'Operator — vận hành điểm danh' },
    { v: 'manager',  l: 'Manager — quản lý vận hành' },
    { v: 'admin',    l: 'Admin — toàn quyền' },
  ];
  var CFG_LOADED = false; // đã render 1 lần — mở lại không fetch trùng

  function loadConfigView(btn) {
    // Guard (2026-08-13): bấm 'Làm mới' khi còn thay đổi chưa lưu → confirm
    if (CFG_DIRTY && btn) {
      showConfirm('Chưa lưu cấu hình', 'Hủy bỏ thay đổi sẽ mất toàn bộ thay đổi cấu hình chưa lưu. Tiếp tục?', function () {
        CFG_DIRTY = false;
        syncCfgSaveBtn_();
        loadConfigView(null);
      });
      return;
    }
    var meta = document.getElementById('configMeta');
    var empty = document.getElementById('configEmpty');
    var saveBtn = document.getElementById('cfgSaveBtn');
    var wrap = document.getElementById('configWrap');
    var roleWrap = document.getElementById('roleWrap');
    if (meta) meta.textContent = 'Đang tải…';
    if (empty) empty.style.display = 'none';
    if (wrap) wrap.style.display = 'none';
    if (roleWrap) roleWrap.style.display = 'none';
    if (saveBtn) saveBtn.style.display = 'none';
    setBtnBusy_(btn, '⟳ Đang tải…');
    function restore() { restoreBtnLabel_(btn, CFG_DIRTY ? '✕ Hủy thay đổi' : '⟳ Làm mới'); syncCfgSaveBtn_(); }
    google.script.run
      .withSuccessHandler(function (res) {
        restore();
        if (!res || !res.ok) {
          showToast((res && res.message) || 'Lỗi tải cấu hình', true);
          if (empty) empty.style.display = '';
          if (meta) meta.textContent = 'Không tải được';
          if (saveBtn) saveBtn.style.display = 'none';
          return;
        }
        renderConfigForm(res.settings || {});
        if (wrap) wrap.style.display = '';
        if (roleWrap) roleWrap.style.display = '';
        if (saveBtn) saveBtn.style.display = '';  // Mẫu B: nút Lưu phân quyền trên view-topbar
        if (meta) meta.textContent = 'Đã tải';
        markServerOk();
      })
      .withFailureHandler(function (err) {
        restore();
        markServerFail();
        showToast('Lỗi tải cấu hình: ' + err.message, true);
        if (meta) meta.textContent = 'Lỗi kết nối';
      })
      .getSettingsApi();
  }

  // ===== Cấu hình vận hành — danh sách mục; MỌI thao tác = state cục bộ + markCfgDirty_,
  // gửi server 1 patch duy nhất (diff vs CFG_SNAPSHOT) khi bấm 'Lưu cấu hình' (2026-08-13) =====
  // Key mặc định theo group — Mặc định (default) gắn liền Danh sách (2026-08-12): chọn trong
  // group Station/Team/Slot Code thay vì field đơn tách riêng. departments/agencies không có default.
  var CFG_DEFAULT_KEY = { stations: 'defaultStation', teams: 'defaultTeam', slotcodes: 'defaultSlotCode' };
  var CFG_STATE = {};        // state hiện tại — nguồn render, diff vs snapshot khi Lưu
  var CFG_SNAPSHOT = null;   // bản sao settings lúc load — so sánh để tạo patch (2026-08-13)
  var CFG_DIRTY = false;     // có thay đổi chưa lưu → nút Lưu bật sáng + guard rời trang (2026-08-13)
  var CFG_EDIT_ORIG = null;  // giá trị gốc lúc mở edit group — so sánh khi hủy edit dở (2026-08-14)
  var ROLE_EDIT = null;      // role đang sửa: { email, isNew } | null (2026-08-13)
  // Group lists (Config sheet — 2026-08-11): danh sách lựa chọn cho dropdown tạo task / filter.
  // Mỗi group 1 section: item Sửa/Xoá + nút + Thêm.
  var CFG_GROUPS = [
    { key: 'stations', label: 'Danh sách Station' },
    { key: 'teams', label: 'Danh sách Team' },
    { key: 'slotcodes', label: 'Danh sách Slot Code (Ca)' },
    { key: 'departments', label: 'Danh sách Department' },
    { key: 'agencies', label: 'Danh sách Agency' },
  ];

  function deepCopyCfg_() { return JSON.parse(JSON.stringify(CFG_STATE)); }

  function renderConfigForm(s) {
    // Hủy bỏ edit dở (group input + role) khi reload — không commit vào state mới (2026-08-13)
    CFG_EDIT_ORIG = null;
    CFG_STATE = s || {};
    CFG_SNAPSHOT = deepCopyCfg_();
    CFG_DIRTY = false;
    ROLE_EDIT = null;
    syncCfgSaveBtn_();
    renderCfgList();
    renderRoleRows();
    CFG_LOADED = true;
  }

  // Dirty tracking (2026-08-13): mọi thao tác sửa/xoá/thêm/kéo thả/default/role chỉ đổi state
  // cục bộ + đánh dấu dirty → nút 'Lưu cấu hình' bật sáng (CSS .cfg-save-dirty).
  function markCfgDirty_() {
    CFG_DIRTY = true;
    syncCfgSaveBtn_();
  }
  function syncCfgSaveBtn_() {
    var b = document.getElementById('cfgSaveBtn');
    if (b) {
      b.classList.toggle('cfg-save-dirty', !!CFG_DIRTY);
      b.disabled = !CFG_DIRTY;  // B3 (2026-08-13): nút Lưu tắt khi không có thay đổi chưa lưu
    }
    var r = document.getElementById('cfgRefreshBtn');
    if (r) {
      // B6 (2026-08-13): đổi nhãn Làm mới → Hủy thay đổi khi còn chưa lưu — rõ hơn confirm
      r.textContent = CFG_DIRTY ? '✕ Hủy thay đổi' : '⟳ Làm mới';
      r.classList.toggle('cfg-refresh-dirty', !!CFG_DIRTY);
    }
  }


  // renderCfgList: mỗi group 1 section riêng (2026-08-14 — bỏ bảng gộp/thead sticky/cột Nhóm):
  // section = tiêu đề + count + nút + Thêm + bảng nhỏ (Giá trị | Mặc định* | Thao tác).
  function renderCfgList() {
    var box = document.getElementById('cfgList');
    if (!box) return;
    var card = document.getElementById('configForm');
    var st = card ? card.scrollTop : 0;  // giữ vị trí cuộn card khi render lại
    var html = CFG_GROUPS.map(function (g) { return cfgGroupHtml_(g); }).join('');
    box.innerHTML = html;
    if (card) card.scrollTop = st;
  }

  // Render 1 group section (2026-08-14 — tách nhóm): tiêu đề + count + nút + Thêm ở head, bảng con
  // (Giá trị | Mặc định* | Thao tác) — cột Mặc định chỉ hiện cho group có default (stations/teams/slotcodes).
  // Item <tr class="cfg-item cfg-item-group"> giữ class/selector cho editCfgGroupItem/drag*/delete.
  function cfgGroupHtml_(g) {
    var list = safeArr(CFG_STATE[g.key]);
    var hasDef = !!CFG_DEFAULT_KEY[g.key];
    var colSpan = hasDef ? 3 : 2;
    var items = list.length
      ? list.map(function (v, i) {
          var def = isDefault_(g.key, v);
          return '<tr class="cfg-item cfg-item-group' + (def ? ' is-default' : '') + '" data-group="' + g.key + '" data-idx="' + i + '" draggable="true"'
            + ' ondragstart="dragCfgStart(event,\'' + g.key + '\',' + i + ')"'
            + ' ondragover="dragCfgOver(event)" ondrop="dragCfgDrop(event,\'' + g.key + '\',' + i + ')"'
            + ' ondragend="dragCfgEnd(event)">'
            + '<td class="cfg-value-cell">'
              + '<span class="cfg-drag-handle" title="Kéo để sắp xếp" aria-hidden="true">⋮⋮</span>'
              + '<span class="cfg-item-label cfg-item-idx">#' + (i + 1) + '</span>'
              + '<span class="cfg-item-value">' + esc(String(v)) + '</span>'
            + '</td>'
            + (hasDef ? '<td class="cfg-default-cell">' + cfgDefaultBtnHtml_(g, v, def) + '</td>' : '')
            + '<td class="cfg-item-actions">'
              + '<button type="button" class="btn btn-outline btn-sm" onclick="editCfgGroupItem(\'' + g.key + '\',' + i + ')">Sửa</button>'
              + '<button type="button" class="btn btn-danger btn-sm" onclick="deleteCfgGroupItem(\'' + g.key + '\',' + i + ')">Xoá</button>'
            + '</td>'
          + '</tr>';
        }).join('')
      : '<tr class="cfg-empty-row"><td colspan="' + colSpan + '" class="cfg-empty-val cfg-group-empty">(chưa có)</td></tr>';
    return '<div class="cfg-group-section" data-group="' + g.key + '">'
      + '<div class="cfg-section-head">'
        + '<span class="cfg-group-title">' + esc(g.label) + ' <span class="cfg-hint">' + list.length + ' mục</span></span>'
        + '<button type="button" class="btn btn-outline btn-sm cfg-group-add" onclick="addCfgGroupItem(\'' + g.key + '\')">+ Thêm</button>'
      + '</div>'
      + '<div class="cfg-table-wrap"><table class="cfg-table">'
        + '<tbody class="cfg-group" data-group="' + g.key + '"'
          + ' ondragover="dragCfgOver(event)" ondrop="dragCfgDrop(event,\'' + g.key + '\',-1)">'
          + items
        + '</tbody>'
      + '</table></div>'
    + '</div>';
  }

  // Nút ◉/◎ Mặc định cho 1 item (group có default mới gọi — 2026-08-14 tách khỏi cfgGroupHtml_).
  function cfgDefaultBtnHtml_(g, v, def) {
    return '<button type="button" class="btn btn-outline btn-sm cfg-default-btn' + (def ? ' cfg-default-on' : '') + '" onclick="toggleCfgDefault(\'' + g.key + '\',\'' + escAttr(String(v)) + '\')" title="' + (def ? 'Bỏ mặc định' : 'Đặt mặc định') + '" aria-label="' + (def ? 'Bỏ mặc định ' : 'Đặt mặc định ') + esc(String(v)) + '">' + (def ? '◉ Mặc định' : '◎ Mặc định') + '</button>';
  }

  function isDefault_(group, val) {
    var dk = CFG_DEFAULT_KEY[group];
    return dk ? CFG_STATE[dk] === val : false;
  }
  // Mặc định (default) inline — thay select riêng (2026-08-12): mỗi item có nút ◉/◎ + badge
  function toggleCfgDefault(group, val) {
    cancelPendingGroupEdit_();  // (2026-08-14): hủy edit dở — chỉ nút Lưu dòng mới chốt
    var dk = CFG_DEFAULT_KEY[group];
    if (!dk) return;
    CFG_STATE[dk] = (CFG_STATE[dk] === val) ? '' : val;
    renderCfgList();
    markCfgDirty_();
  }
  function cfgDefaultHtml_(g) { return ''; }

  // Kéo thả sắp xếp item trong group (HTML5 DnD — 2026-08-12): thứ tự list = thứ tự Config
  // dùng cho Thống kê (orderedByCfg_) và dropdown tạo task.
  var CFG_DRAG = null;
  function dragCfgStart(ev, group, idx) {
    CFG_DRAG = { group: group, from: idx };
    try { ev.dataTransfer.setData('text/plain', String(idx)); ev.dataTransfer.effectAllowed = 'move'; } catch (e) { /* ignore */ }
    if (ev.currentTarget) ev.currentTarget.classList.add('cfg-dragging');
  }
  function dragCfgOver(ev) {
    ev.preventDefault();  // cho phép drop
    if (ev.stopPropagation) ev.stopPropagation();  // chỉ target gần nhất (item) highlight — container không đè
    try { ev.dataTransfer.dropEffect = 'move'; } catch (e) { /* ignore */ }
    clearDropTargets_();
    if (ev.currentTarget) ev.currentTarget.classList.add('cfg-drop-target');
  }
  function dragCfgDrop(ev, group, to) {
    ev.preventDefault();
    var src = CFG_DRAG;
    CFG_DRAG = null;
    clearDropTargets_();
    if (!src || src.group !== group) return;
    if (to === -1) to = safeArr(CFG_STATE[group]).length;  // thả cuối group
    if (src.from === to) return;
    cancelPendingGroupEdit_();  // (2026-08-14): hủy edit dở trước khi kéo thả
    var list = safeArr(CFG_STATE[group]).slice();
    var v = list.splice(src.from, 1)[0];
    list.splice(to, 0, v);
    CFG_STATE[group] = list;
    renderCfgList();  // áp dụng ngay — không reload, giữ scroll
    markCfgDirty_();
  }
  function dragCfgEnd(ev) {
    CFG_DRAG = null;
    clearDropTargets_();
    if (ev.currentTarget) ev.currentTarget.classList.remove('cfg-dragging');
  }
  function clearDropTargets_() {
    var els = document.querySelectorAll('.cfg-drop-target');
    for (var i = 0; i < els.length; i++) els[i].classList.remove('cfg-drop-target');
  }

  // Sửa item group (2026-08-14): input + nút Lưu/Huỷ RÕ RÀNG — chỉ Lưu/Enter mới chốt vào state
  // (bỏ commit-on-blur 180ms — blur không làm gì, không mất chữ bất ngờ). Hành động khác
  // (Sửa/Thêm/Xoá/Default/Drop/Role/Lưu cấu hình...) → cancelPendingGroupEdit_ hủy edit dở.
  function editCfgGroupItem(group, idx) {
    cancelPendingGroupEdit_();  // hủy edit dở đang mở (nếu có) trước khi mở cái mới
    var box = document.getElementById('cfgList');
    if (!box) return;
    var list = safeArr(CFG_STATE[group]);
    var cur = list[idx] === undefined ? '' : list[idx];
    var item = box.querySelector('.cfg-item-group[data-group="' + group + '"][data-idx="' + idx + '"]');
    if (!item) return;
    CFG_EDIT_ORIG = String(cur);
    var hasDef = !!CFG_DEFAULT_KEY[group];
    item.innerHTML = '<td class="cfg-value-cell">'
        + '<span class="cfg-item-label cfg-item-idx">#' + (idx + 1) + '</span>'
        + '<input class="cfg-input cfg-edit-input" id="cfgGroupEditInput" value="' + escAttr(String(cur)) + '" placeholder="Giá trị" autocomplete="off">'
      + '</td>'
      + (hasDef ? '<td class="cfg-default-cell"></td>' : '')
      + '<td class="cfg-item-actions">'
        + '<button type="button" class="btn btn-outline btn-sm" onclick="commitCfgGroupItem(\'' + group + '\',' + idx + ')">Lưu</button>'
        + '<button type="button" class="btn btn-ghost btn-sm" onclick="cancelCfgGroupEdit(\'' + group + '\',' + idx + ')">Huỷ</button>'
      + '</td>';
    var inp = document.getElementById('cfgGroupEditInput');
    if (inp) {
      inp.focus(); inp.select();
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); commitCfgGroupItem(group, idx); }
        else if (e.key === 'Escape') cancelCfgGroupEdit(group, idx);
      });
      // KHÔNG có blur listener — edit dở giữ nguyên tới khi Lưu/Huỷ hoặc hành động khác hủy
    }
  }

  // (2026-08-14): bỏ edit dở — Thêm (row '' cuối) → pop; Sửa → giữ giá trị cũ (state chưa đổi)
  function discardCfgGroupEdit_(group) {
    var list = safeArr(CFG_STATE[group]);
    if (list.length && String(list[list.length - 1] || '').trim() === '') list.pop();
    renderCfgList();
  }

  // (2026-08-14): giá trị trùng trong cùng group (khác dòng, case-insensitive) — chặn thêm/sửa trùng
  function isDupCfgValue_(group, idx, v) {
    var list = safeArr(CFG_STATE[group]);
    var lv = String(v || '').trim().toLowerCase();
    for (var i = 0; i < list.length; i++) {
      if (i !== idx && String(list[i] || '').trim().toLowerCase() === lv) return true;
    }
    return false;
  }

  function cancelCfgGroupEdit(group) {
    CFG_EDIT_ORIG = null;
    discardCfgGroupEdit_(group);
  }

  // Commit sửa item group — CỤC BỘ (chỉ đổi state + dirty; chờ 'Lưu cấu hình' ghi server).
  // silent=true khi gọi từ saveConfig (đã có toast lưu — không lặp toast "chưa lưu").
  function commitCfgGroupItem(group, idx, silent) {
    var inp = document.getElementById('cfgGroupEditInput');
    var v = inp ? inp.value.trim() : '';
    CFG_EDIT_ORIG = null;
    if (!v) { discardCfgGroupEdit_(group); return; }  // (2026-08-14): commit rỗng = hủy — không để dòng trống
    if (isDupCfgValue_(group, idx, v)) { showToast('"' + v + '" đã có trong danh sách', true); discardCfgGroupEdit_(group); return; }  // (2026-08-14): chặn trùng
    var list = safeArr(CFG_STATE[group]).slice();
    list[idx] = v;
    CFG_STATE[group] = list;
    renderCfgList();
    var firstDirty = !CFG_DIRTY;
    markCfgDirty_();
    if (firstDirty && !silent) showToast('Đã chốt — chưa lưu. Bấm “Lưu cấu hình” khi xong', false);  // B5 (2026-08-13)
  }

  // (2026-08-14): hủy edit group đang mở — gọi trước mọi hành động khác (Sửa/Thêm/Xoá/Default/
  // Drop/Role) vì chỉ nút Lưu dòng mới chốt. Toast nếu đang gõ dở có thay đổi (không mất chữ lặng lẽ).
  function cancelPendingGroupEdit_() {
    var inp = document.getElementById('cfgGroupEditInput');
    if (!inp) return;
    var changed = CFG_EDIT_ORIG !== null && inp.value.trim() !== CFG_EDIT_ORIG;
    var item = inp.closest('.cfg-item-group');
    var group = item ? item.getAttribute('data-group') : null;
    CFG_EDIT_ORIG = null;
    if (group) discardCfgGroupEdit_(group);
    else renderCfgList();
    if (changed) showToast('Đã hủy thay đổi dòng chưa lưu', false);
  }

  // (2026-08-14): chốt dòng group đang sửa — chỉ gọi từ saveConfig ('Lưu cấu hình' = lưu mọi thay đổi)
  function commitPendingGroupEdit_() {
    var inp = document.getElementById('cfgGroupEditInput');
    if (!inp) return;
    var item = inp.closest('.cfg-item-group');
    if (!item) return;
    commitCfgGroupItem(item.getAttribute('data-group'), parseInt(item.getAttribute('data-idx'), 10), true);
  }

  // B4 (2026-08-13): xoá mục đang là Mặc định → cảnh báo trong confirm + xoá luôn default theo.
  function deleteCfgGroupItem(group, idx) {
    cancelPendingGroupEdit_();  // (2026-08-14): hủy edit dở — chỉ nút Lưu dòng mới chốt
    var list = safeArr(CFG_STATE[group]);
    var val = String(list[idx] === undefined ? '' : list[idx]);
    var isDef = isDefault_(group, val);
    showConfirm('Xoá mục', 'Xoá "' + val + '" khỏi ' + groupLabel_(group) + (isDef ? ' — mục này đang là Mặc định, sẽ bỏ mặc định theo.' : '?'), function () {
      var list2 = safeArr(CFG_STATE[group]).slice();
      list2.splice(idx, 1);
      CFG_STATE[group] = list2;
      if (isDef && CFG_DEFAULT_KEY[group]) CFG_STATE[CFG_DEFAULT_KEY[group]] = '';
      renderCfgList();
      markCfgDirty_();
    });
  }

  function addCfgGroupItem(group) {
    // KHÔNG gọi server: append '' cục bộ + mở ô nhập ngay (server lọc item rỗng → gọi server
    // rồi reload sẽ không thấy row mới — UX hỏng). User nhập giá trị → blur/Enter → commit.
    var list = safeArr(CFG_STATE[group]).slice();
    list.push('');
    CFG_STATE[group] = list;
    renderCfgList();
    editCfgGroupItem(group, list.length - 1);
  }

  function groupLabel_(group) {
    for (var i = 0; i < CFG_GROUPS.length; i++) { if (CFG_GROUPS[i].key === group) return CFG_GROUPS[i].label; }
    return group;
  }

  // ===== Phân quyền — mỗi role = 1 card (email + role) với nút Sửa / Xoá (confirm)
  // y hệt item vận hành (2026-08-13): Sửa → input email + select role + Huỷ, commit khi
  // blur/Enter (email trống → xoá role). Mọi đổi chỉ state cục bộ + dirty.
  function roleLabel_(r) {
    for (var i = 0; i < CFG_ROLES.length; i++) { if (CFG_ROLES[i].v === r) return CFG_ROLES[i].l; }
    return r || '?';
  }

  // renderRoleRows: Phân quyền thành section riêng (2026-08-14, đồng bộ group section):
  // tiêu đề + count + nút + Thêm role ở head, bảng 3 cột (email | role | Sửa/Xoá).
  function renderRoleRows() {
    var box = document.getElementById('cfgRoleRows');
    if (!box) return;
    var map = (CFG_STATE.roleMap && typeof CFG_STATE.roleMap === 'object') ? CFG_STATE.roleMap : {};
    var keys = Object.keys(map);
    var html = '<div class="cfg-group-section" data-group="roleMap">'
      + '<div class="cfg-section-head">'
        + '<span class="cfg-group-title">Phân quyền (roleMap) <span class="cfg-hint">' + keys.length + ' role</span></span>'
        + '<button type="button" class="btn btn-outline btn-sm cfg-group-add" onclick="addRoleRow()">+ Thêm role</button>'
      + '</div>'
      + '<div class="cfg-table-wrap"><table class="cfg-role-table">'
        + '<tbody class="cfg-group" data-group="roleMap">';
    var any = false;
    keys.forEach(function (em) {
      if (ROLE_EDIT && ROLE_EDIT.email === em && !ROLE_EDIT.isNew) { html += roleRowEditHtml_(em, map[em]); any = true; }
      else { html += roleRowCardHtml_(em, map[em]); any = true; }
    });
    if (ROLE_EDIT && ROLE_EDIT.isNew) { html += roleRowEditHtml_('', 'viewer'); any = true; }
    if (!any) html += '<tr class="cfg-empty-row"><td colspan="3" class="cfg-empty-val cfg-group-empty">(chưa có role)</td></tr>';
    html += '</tbody></table></div></div>';
    box.innerHTML = html;
    wireRoleEditEvents_(box);
  }


  // wireRoleEditEvents_: Enter = Lưu, Escape = Huỷ (2026-08-14 — bỏ commit-on-blur 180ms).
  function wireRoleEditEvents_(box) {
    var row = box.querySelector('.cfg-role-editing');
    if (!row) return;
    var em = row.querySelector('.cfg-role-email');
    if (!em) return;
    em.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); commitRoleEdit(); }
      else if (e.key === 'Escape') cancelRoleEdit();
    });
    setTimeout(function () { em.focus(); if (em.value) em.select(); }, 0);
  }


  function roleRowCardHtml_(email, role) {
    return '<tr class="cfg-role-row cfg-role-card" data-email="' + escAttr(email || '') + '">'
      + '<td class="cfg-role-email" title="' + escAttr(email || '') + '">' + esc(email || '(trống)') + '</td>'
      + '<td><span class="cfg-role-badge">' + esc(roleLabel_(role)) + '</span></td>'
      + '<td class="cfg-item-actions">'
        + '<button type="button" class="btn btn-outline btn-sm" onclick="startRoleEdit(\'' + escAttr(email || '') + '\')" title="Sửa role" aria-label="Sửa role">Sửa</button>'
        + '<button type="button" class="btn btn-danger btn-sm" onclick="deleteRoleRow(\'' + escAttr(email || '') + '\')" title="Xoá role" aria-label="Xoá role">Xoá</button>'
      + '</td>'
    + '</tr>';
  }

  // Xoá 1 role (inline onclick — thay closure cũ khi chuyển sang HTML-string, 2026-08-13).
  function deleteRoleRow(email) {
    cancelPendingGroupEdit_(); cancelPendingRoleEdit_();  // (2026-08-14): hủy edit dở trước khi hỏi xoá
    showConfirm('Xoá role', 'Xoá role của "' + (email || '(trống)') + '"?', function () {
      var map = CFG_STATE.roleMap || {};
      delete map[email];
      CFG_STATE.roleMap = map;
      ROLE_EDIT = null;
      renderRoleRows();
      markCfgDirty_();
    });
  }


  function roleRowEditHtml_(email, role) {
    var opts = CFG_ROLES.map(function (r) {
      return '<option value="' + r.v + '"' + (r.v === role ? ' selected' : '') + '>' + esc(r.l) + '</option>';
    }).join('');
    return '<tr class="cfg-role-row cfg-role-editing" data-email="' + escAttr(email || '') + '">'
      + '<td><input class="cfg-input cfg-role-email" type="text" placeholder="email@spxexpress.com" autocomplete="off" value="' + escAttr(email || '') + '"></td>'
      + '<td><select class="cfg-input cfg-role-select">' + opts + '</select></td>'
      + '<td class="cfg-item-actions">'
        + '<button type="button" class="btn btn-outline btn-sm" onclick="commitRoleEdit()" title="Lưu role" aria-label="Lưu role">Lưu</button>'
        + '<button type="button" class="btn btn-ghost btn-sm" onclick="cancelRoleEdit()" title="Huỷ sửa" aria-label="Huỷ sửa role">Huỷ</button>'
      + '</td>'
    + '</tr>';
  }

  function startRoleEdit(email) {
    cancelPendingGroupEdit_();  // (2026-08-14): hủy edit dở — chỉ nút Lưu mới chốt
    if (ROLE_EDIT) cancelPendingRoleEdit_();
    ROLE_EDIT = { email: email, isNew: false };
    renderRoleRows();
  }
  function addRoleRow() {
    cancelPendingGroupEdit_();
    if (ROLE_EDIT) cancelPendingRoleEdit_();
    ROLE_EDIT = { email: '', isNew: true };
    renderRoleRows();
  }
  function cancelRoleEdit() {
    ROLE_EDIT = null;
    renderRoleRows();
  }
  // (2026-08-14): hủy role edit đang mở khi bấm hành động khác (toast nếu đang sửa dở — không mất chữ lặng lẽ)
  function cancelPendingRoleEdit_() {
    if (!ROLE_EDIT) return;
    var row = document.querySelector('.cfg-role-editing');
    var em = row ? row.querySelector('.cfg-role-email') : null;
    var changed = !!em && em.value.trim().toLowerCase() !== ROLE_EDIT.email;
    ROLE_EDIT = null;
    renderRoleRows();
    if (changed) showToast('Đã hủy thay đổi role chưa lưu', false);
  }
  // Commit role đang sửa (nút Lưu/Enter): email trống → xoá role; đổi email → xoá key cũ.
  function commitRoleEdit(silent) {
    if (!ROLE_EDIT) return;
    var row = document.querySelector('.cfg-role-editing');
    var em = row ? row.querySelector('.cfg-role-email') : null;
    var sel = row ? row.querySelector('.cfg-role-select') : null;
    if (!em || !sel) { ROLE_EDIT = null; renderRoleRows(); return; }
    var email = em.value.trim().toLowerCase();
    var map = CFG_STATE.roleMap || {};
    if (ROLE_EDIT.email && ROLE_EDIT.email !== email) delete map[ROLE_EDIT.email];
    if (email) map[email] = sel.value;
    else delete map[ROLE_EDIT.email];  // bỏ trống email → xoá role
    CFG_STATE.roleMap = map;
    ROLE_EDIT = null;
    renderRoleRows();
    var firstDirty = !CFG_DIRTY;
    markCfgDirty_();
    if (firstDirty && !silent) showToast('Đã chốt — chưa lưu. Bấm “Lưu cấu hình” khi xong', false);  // B5 (2026-08-13)
  }
  // (2026-08-14): chốt role đang sửa — chỉ gọi từ saveConfig ('Lưu cấu hình' = lưu mọi thay đổi)
  function commitPendingRoleEdit_() {
    if (ROLE_EDIT) commitRoleEdit(true);
  }

  // Lưu toàn bộ cấu hình: diff CFG_STATE vs CFG_SNAPSHOT → 1 patch duy nhất (2026-08-13).
  // Không reload — giữ scroll; success → cập nhật snapshot + tắt dirty (nút Lưu hết sáng).
  function saveConfig(btn) {
    commitPendingGroupEdit_();  // (2026-08-14): 'Lưu cấu hình' = lưu MỌI thay đổi — chốt dòng group/role
    commitPendingRoleEdit_();   // đang sửa trước khi diff (nút Lưu dòng chỉ chốt cục bộ)
    var patch = cfgDiff_();
    if (!patch || !Object.keys(patch).length) { showToast('Không có thay đổi để lưu', false); return; }
    setBtnBusy_(btn, 'Đang lưu…');
    function restore() { restoreBtnLabel_(btn, 'Lưu cấu hình'); }
    google.script.run
      .withSuccessHandler(function (res) {
        restore();
        if (!res || !res.ok) { showToast((res && res.message) || 'Lỗi lưu cấu hình', true); return; }
        CFG_SNAPSHOT = deepCopyCfg_();  // base mới cho diff lần sau
        CFG_DIRTY = false;
        syncCfgSaveBtn_();
        showToast(res.message || 'Đã lưu cấu hình', false);
      })
      .withFailureHandler(function (err) {
        restore();
        markServerFail();
        showToast('Lỗi lưu cấu hình: ' + err.message, true);
      })
      .saveSettingsApi(patch);
  }

  // Diff vs snapshot lúc load — chỉ gửi key thay đổi (groups + defaults + roleMap)
  function cfgDiff_() {
    if (!CFG_SNAPSHOT) return null;
    var patch = {};
    var keys = {};
    CFG_GROUPS.forEach(function (g) { keys[g.key] = 1; });
    Object.keys(CFG_DEFAULT_KEY).forEach(function (g) { keys[CFG_DEFAULT_KEY[g]] = 1; });
    keys.roleMap = 1;
    Object.keys(keys).forEach(function (k) {
      if (JSON.stringify(CFG_STATE[k]) !== JSON.stringify(CFG_SNAPSHOT[k])) patch[k] = CFG_STATE[k];
    });
    return patch;
  }

  // Guard (2026-08-13): đóng tab / F5 khi còn thay đổi cấu hình chưa lưu → confirm trình duyệt
  window.addEventListener('beforeunload', function (e) {
    if (CFG_DIRTY) { e.preventDefault(); e.returnValue = ''; }
  });
</script>
