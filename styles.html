<style>
    :root {
      color-scheme: light;  /* thay cho <meta color-scheme> — GAS addMetaTag không cho phép tag này; CSS tương đương meta */
      --primary: #0b57d0;
      --primary-dark: #0a4ab8;
      --danger: #d93025;
      --warning: #e37400;
      --success: #188038;
      --bg: #f5f6f8;
      --card: #ffffff;
      --card-radius: var(--radius-md);   /* surface chung: card + view-topbar — 1 nguồn bo góc */
      --card-ok-bg: #e6f4ea;
      --card-err-bg: #fce8e6;
      --card-extra-bg: #fef7e0;
      --header-h: 59px;  /* chiều cao header 1 hàng (padding 10×2 + nội dung ~39) — 1 nguồn cho topbar sticky + #viewTasks height.
                           JS syncHeaderH() đo header THẬT (DOMContentLoaded/load/resize/meta-load) và ghi đè token —
                           header wrap (font/zoom/màn hẹp) làm token tĩnh lệch → doc cao hơn viewport → scroll dọc luôn bật. */
      --border: #d9dce1;
      --text: #1f1f1f;
      --muted: #5f6368;
      --bottom-nav-h: 60px;        /* bottom nav mobile — 1 nguồn cho height + main padding */
      /* Design tokens (doc #2: token-driven — không magic numbers) */
      --amber: #e85d04;            /* accent v1 — header/toolbar/focus */
      --header-bg: #0d111a;        /* header command center v1 */
      --header-text: #f4f7fb;
      --header-border: #3a4a66;
      --surface-muted: #f1f3f4;    /* badge pending, counter lbl, th */
      --focus-ring: rgba(11, 87, 208, .45);  /* focus = primary (nhất quán 1 accent tương tác — hết cam) */
      --primary-bright: #1a73e8;         /* primary sáng trên nền dark (sidebar/bottom-nav active — P1 2026-08-16) */
      --accent: var(--amber);          /* accent chung — dùng amber làm chuẩn */
      --surface: #f5f6f8;              /* surface hover nhẹ (list-search .btn-icon:hover) — khớp --bg */
      /* Màu bổ sung (token hóa 2026-08-11 — màu dùng >=2 chỗ) */
      --row-hover: #f8faff;            /* hover hàng bảng (task/stats/staff) */
      --primary-bg: #e8f0fe;           /* badge.open */
      --surface-soft: #f0f1f3;          /* btn-ghost hover / badge.done — họ surface */
      --amber-dark: #9a4d00;           /* text amber đậm trên nền trắng — AA 6.1:1 (flabel) */
      --side-text: #c3cddb;            /* text sidebar dark (side-item) */
      --side-text-muted: #b6c2d4;      /* text phụ dark-surface — dùng chung header #netText + sidebar */
      --success-dark: #1e7e34;         /* text/bg xanh đậm (badge.attend) */
      /* Spacing 4pt grid (S1) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 28px;
      --space-8: 32px;
      --radius-2xs: 4px;
      --radius-xs: 6px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 999px;
      /* Type scale 8-tier (dễ đọc trên màn hình lớn — tham khảo v1 styles.html) */
      --text-3xs: 10px;
      --text-2xs: 11px;
      --text-xs: 12px;
      --text-sm: 13px;
      --text-base: 14px;
      --text-md: 15px;
      --text-lg: 16px;
      --text-xl: 18px;
      --text-2xl: 20px;
      --text-3xl: 22px;
      --text-4xl: 28px;
      --text-5xl: 32px;
      --text-6xl: 34px;
      --text-7xl: 44px;
      --text-8xl: 72px;
      --amber-solid: #b3530a;
      --amber-text: #b45309;
      --amber-hover: #d45504;
      --amber-deep: #b84500;
      --danger-strong: #b3261e;
      --primary-active: #4d8fe8;
      --primary-soft: #eaf1fe;
      --toast-bg: #202124;
      --gray-soft: #e9ecf2;
      --gray-track: #e6eaf0;
      --gray-hover-th: #e3e6ea;
      --gray-hover-btn: #e4e7ea;
      --skeleton-a: #f0f0f0;
      --skeleton-b: #e6e6e6;
      --input-text: #1a1a1a;
      --input-text-2: #3a3a3a;
      --muted-2: #6b7280;
      --field-disabled-bg: #f4f2ee;
      --field-disabled-text: #b0a99e;
      --row-extra-hover: #fdf0cd;
      --free-on-bg: #e8f6ec;
      --free-on-border: #b3d9bc;
      --free-on-text: #1f7a3d;
      --net-err: #ef4444;
      --net-err-border: #fecaca;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: var(--text-lg);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      height: 100vh; height: 100dvh; overflow: hidden;  /* khóa 1 màn hình: nội dung dài cuộn TRONG card, trang không cuộn */
    }
    /* Scrollbar mỏng toàn app  — thumb = border, hover = muted, track trong suốt */
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-full); }
    *::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    *::-webkit-scrollbar-corner { background: transparent; }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: var(--space-4) var(--space-5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: var(--text-2xl); font-weight: 600; }
    .header-user {
      color: var(--header-text, #e2e8f0);
      font-size: var(--text-sm); font-weight: 600;
      padding: 2px var(--space-2); border-radius: var(--radius-full);
      background: rgba(255,255,255,.08);
      max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    @media (max-width: 700px) { .header-user { display: none; } }  /* giữ header 1 hàng khi hẹp (tránh tràn header) */
    .btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: var(--space-2) var(--space-4);
      font-size: var(--text-md);
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      transition: background .15s;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    /* Dropdown tạo task: 2 nhóm (Nạp danh sách / Task rỗng) */
    .create-task-wrap { position: relative; }
    #btnCreate::after { content: '\25BE'; margin-left: var(--space-2); font-size: var(--text-2xs); transition: transform .15s; }
    .create-task-wrap.menu-open #btnCreate::after { transform: rotate(180deg); }
    .create-task-menu {
      position: absolute; top: calc(100% + var(--space-1)); right: 0; z-index: 60;
      min-width: 250px; background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-md); box-shadow: 0 2px 10px rgba(0,0,0,.10);
      padding: var(--space-1);
    }
    .create-task-menu-item {
      display: block; width: 100%; text-align: left; border: none; background: none;
      padding: var(--space-2); border-radius: var(--radius-sm); cursor: pointer;
    }
    .create-task-menu-item:hover { background: var(--surface-muted); }
    .create-task-item-title { display: block; font-weight: 600; color: var(--text); }
    .create-task-item-hint { display: block; font-size: var(--text-2xs); color: var(--muted); margin-top: 2px; }
    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    .btn-outline:hover { background: var(--primary-soft); }
    /* nút Xem xám nhẹ — phân biệt với Quét (primary) ở cột Thao tác */
    .btn-view { background: var(--surface-muted); color: var(--text); border: 1px solid var(--border); }
    .btn-view:hover { background: var(--gray-hover-btn); }
    .btn-danger {
          background: var(--danger);
        }
        .btn-danger:hover { background: var(--danger-strong); }
        .btn-amber {
          background: var(--amber);
          color: #fff;
        }
        .btn-amber:hover { background: var(--amber-hover); }
        .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface-soft); }
    .btn-sm { padding: var(--space-2) var(--space-3); font-size: var(--text-sm); }
    td.stt { width: 40px; text-align: center; color: var(--muted); font-size: var(--text-sm); }  /* STT hẹp, không đẩy widths */

    main {
      max-width: 1920px; margin: 0 auto; padding: var(--space-4);
      flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    }  /* wide-screen: tận dụng màn lớn cho nhiều cột */
    /* View active giãn full chiều cao — card chạm đáy viewport */
    main > section { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
    main > section > .card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: var(--space-4);  /* thoáng hơn (mockup 13/16) */
      margin-bottom: var(--space-3);
    }

    /* ===== Layout 2 cột cho Scan view (tham khảo v1) ===== */
    .view-topbar {
      position: sticky;
      top: var(--header-h); /* ngay dưới header command center */
      z-index: 30;
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-3);
      flex-wrap: wrap;
      /* Giống v1: topbar là card nổi (surface + border + radius + shadow) — không "treo lơ lửng" */
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: var(--space-2) var(--space-4);
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      transition: box-shadow .15s, border-color .15s;
    }
    /* Khi dính (stuck) — đổ bóng đậm hơn tách khỏi nội dung cuộn */
    .view-topbar.stuck {
      border-color: var(--border);
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
    }
    .view-topbar-title { flex: 1; text-align: left; min-width: 0; }  /* min-width:0 — title co lại (ellipsis)
       thay vì đẩy nút hành động tràn ngoài topbar (P1 audit: Chuyển điểm danh bị clip khi title dài + 2 nút) */
    .view-topbar-title .task-title,
    .view-topbar-title .task-meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .view-topbar .btn { min-height: 40px; line-height: 1.2; }  /* nút topbar đồng bộ 40px — desktop 37-41px lệch do border/line-height */
    /* Modal "Nạp danh sách" — 2 tab: Theo ca / Dán mã (operator: 1 nút duy nhất, không menu ẩn) */
    .load-tabs { display: flex; gap: var(--space-1); padding: var(--space-2); background: var(--surface-muted); border-radius: var(--radius-md); margin-bottom: var(--space-3); }
    .load-tab { flex: 1; padding: var(--space-2) var(--space-3); min-height: 44px; border: 0; border-radius: var(--radius-sm); background: transparent; font: inherit; font-size: var(--text-sm); font-weight: 600; color: var(--muted); cursor: pointer; }
    .load-tab.is-active { background: var(--card); color: var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .load-tab:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }

    /* Toolbar chung các view List/Scan/Stats/Staff/Config — 1 class dùng chung */
    .scan-layout {
      display: flex;
      gap: var(--space-4);
      align-items: flex-start;
      flex: 1 1 auto;
      min-height: 0;  /* card bảng scan giãn chạm đáy viewport */
    }
    .scan-col-left {
      flex: 0 0 480px;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .scan-col-right {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;  /* column-mode (≤991px): co được để card bảng cuộn trong — trước tràn bị clip */
      align-self: stretch;  /* giãn full chiều cao scan-layout — card bảng chạm đáy */
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .scan-col-left .card,
    .scan-col-right .card { margin-bottom: 0; }
    .scan-col-right .card {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
    }
    .scan-col-right .card .table-wrap {
      flex: 1 1 auto;
      overflow: auto;
      min-height: 0;
    }
    @media (max-width: 991px) {
      .scan-layout { flex-direction: column; }
      .scan-col-left { flex: none; max-width: none; }
    }
    /* P2 (header responsive): màn hẹp — topbar thoát sticky (bỏ hardcode 53px vốn
       giả định header cao cố định; khi header wrap cao hơn dễ đè). Ẩn logo ngoại
       (URL external) + netText — tiết cứng header 1 dòng, tránh layout shift/tràn. */
    @media (max-width: 600px) {
      header { padding: var(--space-2) var(--space-3); flex-wrap: wrap; row-gap: var(--space-2); }
      header .brand img { display: none; }  /* logo external — ẩn trên màn nhỏ, tránh load/tràn */
      header #netText { display: none; }    /* giữ net-dot, ẩn chữ — tiết chiều ngang */
      header .brand .title { font-size: var(--text-md); letter-spacing: .5px; }
      header .btn-icon-dark { padding: var(--space-1) var(--space-2); min-height: 28px; font-size: var(--text-sm); }
      .view-topbar { top: 0; }  /* bỏ sticky theo header — tránh đè khi header wrap */
      .card { padding: var(--space-2); }  /* trên màn hẹp tiết diện — vẫn giữ var(--card-radius) */
    }

    /* ===== Form controls chung modal tạo task / paste + form Cấu hình ===== */
    /* Card tự cao theo nội dung — ít task không trắng 600px; nhiều task → table-wrap scroll trong (max-height viewport). */
    label { display: block; font-size: var(--text-sm); font-weight: 600; color: var(--muted); margin-bottom: var(--space-2); }
    select, input[type="text"] {
      width: 100%;
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: var(--text-md);
      background: #fff;
      color: var(--text);
    }
    select:focus, input[type="text"]:focus { outline: 2px solid var(--focus-ring); border-color: var(--primary); }
    /* S7: skip link — chỉ hiện khi focus (a11y keyboard) */
    .skip-link {
      position: absolute; left: -9999px; top: 0; z-index: 10000;
      background: var(--header-bg); color: #fff; padding: var(--space-2) var(--space-4);
      border-radius: 0 0 8px 0; font-size: var(--text-base); font-weight: 600;
    }
    .skip-link:focus { left: 0; }

    /* A11y: focus-visible ring rõ — không chỉ dựa vào hover */
    .btn:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* ===== Modal tạo task: dropdown thay cây checkbox (sketch 005e) ===== */
    /* Mô tả mode đang chọn — FREE giải thích khi chọn Ca = Tự do */
    .mode-desc { font-size: var(--text-xs); color: var(--muted); margin: var(--space-2) 2px 0; line-height: 1.45; }
    .mode-desc b { color: var(--text); }
    /* Audit UI (contrast): chữ amber 12px trên nền trắng ~3.5:1 fail AA — amber đậm #9a4d00 = 6.1:1 */
    .create-total { font-size: var(--text-sm); color: var(--muted); }
    .create-total b { color: var(--amber-dark); font-weight: 700; }
    .create-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--border); }
    .create-actions { display: flex; justify-content: flex-end; gap: var(--space-2); flex-shrink: 0; }

    /* v1: badge count nhẹ — nền xám nhạt, bo tròn, chữ muted (không lấn át) */
        .create-form { display: grid; gap: var(--space-2); margin-top: var(--space-2); }
        .create-form .frow { display: grid; grid-template-columns: 80px 1fr; align-items: center; gap: var(--space-2); }
        .create-form .chips.disabled { opacity: .45; pointer-events: none; }
        .create-form .frow .flabel { font-size: var(--text-xs); font-weight: 700; color: var(--muted); }  /* label = muted — mockup label xám nhạt */
    .create-form .frow .fnote { display: block; font-size: var(--text-2xs); color: var(--muted); font-weight: 400; line-height: 1.3; }
    .chips { display: flex; flex-wrap: wrap; gap: var(--space-1); align-items: center; }
    .pick {
      border: 1px solid var(--border, #e2e5ea); background: #fff; color: var(--input-text-2);
      border-radius: var(--radius-full); font-size: var(--text-xs); padding: var(--space-1) var(--space-2); cursor: pointer; font-weight: 500;
      line-height: 1.4; transition: background .12s, border-color .12s, color .12s;
    }
    .pick:hover { background: var(--surface-muted); }
    .pick.on { background: var(--primary-bg); border-color: var(--primary); color: var(--primary-dark); font-weight: 700; }  /* selected = primary (mockup chip default) */
    .pick.free.on { background: var(--free-on-bg); border-color: var(--free-on-border); color: var(--free-on-text); }
    /* Chip 'Tất cả' — nét đứt + chữ đậm nhẹ để phân biệt chip giá trị; on = đang áp dụng */
    .pick.all { border-style: dashed; color: var(--muted-2); }
    .pick.all.on { background: var(--primary-bg); border-color: var(--primary); border-style: solid; color: var(--primary-dark); font-weight: 700; }
    .pick:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    /* Touch target modal chung paste/create/confirm — 44px touch, font 14px gọn */
    .about-dialog .btn { min-height: 44px; font-size: var(--text-base); font-weight: 600; }
    @media (max-width: 719px) {
    }

    /* ===== Bộ đếm — 3 khối luôn cùng 1 hàng (nhìn nhanh) ===== */
    .counters { display: flex; gap: var(--space-2); }
    /* P1-2 fix: dùng transform translateX (GPU-accelerated) thay vì left (layout thrash). */
    @keyframes pasteSlide {
      0% { transform: translateX(-250%); }
      100% { transform: translateX(250%); }
    }
    .counter {
      flex: 1;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-2) var(--space-2) var(--space-3);
      text-align: center;
    }
    .counter .num {
      font-size: var(--text-5xl);
      font-weight: 800;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .counter .lbl {
      display: inline-block;
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      background: var(--surface-muted);
      padding: 2px var(--space-2);
      border-radius: var(--radius-sm);
      margin-top: var(--space-2);
    }
    .counter.scanned { border-color: var(--success); }
    .counter.absent { border-color: var(--danger); }   /* DONE: Vắng (đỏ) */
    .counter.waiting { border-color: var(--primary); } /* Mở: Chờ điểm danh (xanh) */
    .counter.extra { border-color: var(--amber-dark); } /* Dư (cam đậm) — khớp scanCard.extra */
    .counter.scanned .num { color: var(--success); }
    .counter.absent .num { color: var(--danger); }
    .counter.waiting .num { color: var(--primary); }
    .counter.extra .num { color: var(--amber-dark); }  /* đồng bộ scanCard.extra/.warn (--amber-dark) */

    /* Banner trạng thái phase (viewScan) — hướng dẫn 2 bước điểm danh (U2 audit). */
    .phase-banner {
      margin-bottom: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-muted);
      color: var(--text);
      font-size: var(--text-sm);
      line-height: 1.5;
    }
    .phase-banner b { font-weight: 700; }
    .phase-banner.phase-open { border-color: var(--warning); background: var(--card-extra-bg); color: var(--amber-dark); }
    .phase-banner.phase-attend { border-color: var(--success); background: var(--primary-soft); color: var(--success-dark); }
    .phase-banner.phase-done { border-color: var(--border); background: var(--surface-muted); }

    /* ===== Toolbar bảng NV chung viewScan + viewStaff ===== */
    .att-toolbar {
      display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
      margin-bottom: var(--space-2);
    }
    .att-toolbar select { flex: 0 0 auto; width: auto; max-width: 190px; padding: var(--space-2) var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: var(--text-base); background: #fff; color: var(--text); }

    /* ===== C4: form trang Cấu hình (Config Admin) ===== */
    .topbar-actions { display: flex; gap: var(--space-2); align-items: center; flex-shrink: 0; }  /* nhóm nút topbar viewConfig (Hủy thay đổi + Làm mới + Lưu cấu hình) */
    .cfg-discard-btn { border-color: var(--danger); color: var(--danger); }  /* nút "Hủy thay đổi" riêng khi dirty — không đổi nhãn Làm mới */
    .cfg-card { padding: var(--space-3); }  /* đồng bộ .card chung (12px) — 2026-08-11 */
    .cfg-hint { font-weight: 400; font-size: var(--text-xs); color: var(--muted); text-transform: none; letter-spacing: 0; }  /* hint không bị uppercase khi nằm trong .section-heading (toolbar CẤU HÌNH VẬN HÀNH) */
    /* viewConfig role = CARD rows (mockup 2026-08-16 — thay bảng): email + badge + icon ✎/✕,
       edit = input + select + ✓/✕ — hết ellipsis cắt nút mobile, hết grid cột. */
    .cfg-role-rows { display: flex; flex-direction: column; gap: var(--space-2); }
    .cfg-role-card { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; min-width: 0; }
    .cfg-role-card:hover { background: var(--row-hover); }
    .cfg-role-card.cfg-role-editing { border-color: var(--primary); }
    .cfg-role-email { flex: 1 1 auto; min-width: 0; font-size: var(--text-sm); font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }  /* email 1 dòng + tooltip title (mockup) */
    .cfg-role-select { flex: 0 1 auto; min-width: 0; max-width: 160px; }  /* select edit co lại — input email rộng */
    .cfg-role-badge { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; padding: 3px var(--space-2); border-radius: var(--radius-full); background: var(--primary-bg); color: var(--primary-dark); font-size: var(--text-xs); font-weight: 700; white-space: nowrap; flex-shrink: 0; }  /* badge role — tooltip đầy đủ khi ellipsis */
    .cfg-role-actions { display: flex; gap: var(--space-2); flex-shrink: 0; }
    .cfg-role-card input[type=text], .cfg-role-card select { border: 1px solid var(--border); border-radius: var(--radius-xs); padding: var(--space-2) var(--space-2); font-size: var(--text-sm); background: #fff; color: var(--text); }
    .cfg-role-card input[type=text] { flex: 1 1 auto; min-width: 0; }
    /* viewConfig: danh sách mục vận hành + nút Sửa/Xoá */
    .cfg-list { display: flex; flex-direction: column; gap: var(--space-4); }  /* 2026-08-14: sections xếp dọc, tự cao — card cuộn */

    /* 2026-08-16: group = CARD riêng theo MOCKUP (ngôn ngữ giao diện): head clickable (chevron ▾ xoay -90°
       khi thu gọn + title + count badge), chips nền xám nhạt (default = xanh primary-bg + viền primary),
       icon chip 20px tròn, + Thêm dashed pill, star ★/☆ 14px. */
    .cfg-group-card { border: 1px solid var(--border); border-radius: var(--card-radius); background: var(--card); overflow: hidden; }
    #roleWrap { margin-top: var(--space-4); }  /* role card cách group cuối — gap .cfg-list 18px lo group, roleWrap sibling riêng */
    .cfg-card-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); cursor: pointer; user-select: none; min-width: 0; }  /* mockup: cả head click được */
    .cfg-card-head:hover { background: var(--row-hover); }
    .cfg-card-head:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
    .cfg-chevron { color: var(--muted); font-size: var(--text-2xs); width: 14px; display: inline-block; transition: transform .15s; flex-shrink: 0; }
    .cfg-group-card.is-collapsed .cfg-chevron { transform: rotate(-90deg); }  /* mockup: chevron xoay khi đóng */
    .cfg-group-title { font-weight: 700; font-size: var(--text-base); color: var(--text); }
    .cfg-count { font-size: var(--text-2xs); font-weight: 700; color: var(--muted); background: var(--surface-muted); padding: 2px var(--space-2); border-radius: var(--radius-full); min-width: 20px; text-align: center; flex-shrink: 0; }  /* badge đếm mục (mockup) */
    .cfg-group-card.is-collapsed .cfg-chips { display: none; }  /* thu gọn: chỉ còn head — trang ngắn lại */
    .cfg-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding: var(--space-3) var(--space-4) var(--space-4); border-top: 1px solid var(--border); }  /* chip wrap — 7 mục Slot Code co lại 2 dòng */
    .cfg-chip { display: inline-flex; align-items: center; gap: var(--space-2); background: var(--surface-muted); border: 1px solid transparent; border-radius: var(--radius-full); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--text); max-width: 100%; }  /* mockup: nền xám nhạt, không viền */
    .cfg-chip.is-default { background: var(--primary-bg); border-color: var(--primary); }  /* mockup: default xanh primary-bg + viền primary */
    .cfg-chip-value { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; font-size: var(--text-sm); color: var(--text); }  /* mockup: value cap + ellipsis + tooltip title */
    .cfg-chip .cfg-drag-handle { display: inline-flex; cursor: grab; color: var(--muted); font-size: var(--text-xs); line-height: 1; }
    .cfg-chip-edit, .cfg-chip-del { cursor: pointer; width: 20px; height: 20px; min-width: 24px; min-height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--muted); font-size: var(--text-xs); border: none; background: none; flex-shrink: 0; padding: 0; }  /* mockup: icon 20px tròn mềm */
    .cfg-chip-edit:hover { background: #fff; color: var(--primary); }
    .cfg-chip-del:hover { background: #fff; color: var(--danger); }
    .cfg-add-chip { display: inline-flex; align-items: center; gap: var(--space-1); border: 1px dashed var(--border); border-radius: var(--radius-full); padding: var(--space-2) var(--space-4); font-size: var(--text-sm); color: var(--muted); cursor: pointer; background: #fff; }  /* mockup: + Thêm dashed pill cuối chips */
    .cfg-add-chip:hover { border-color: var(--primary); color: var(--primary); }
    .cfg-star-btn { flex: 0 0 auto; border: 0; background: none; color: var(--border); font-size: var(--text-base); line-height: 1; cursor: pointer; padding: 0; flex-shrink: 0; min-width: 24px; min-height: 24px; }  /* mockup: star 14px, off = xám border */
    .cfg-star-btn:hover { color: var(--warning); }
    .cfg-star-btn.cfg-star-on { color: var(--warning); }  /* ★ đang mặc định — warning (mockup) */
    .cfg-icon-btn { flex: 0 0 auto; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; color: var(--muted); font-size: var(--text-sm); line-height: 1; cursor: pointer; padding: 0; }  /* mockup: role icon 30x30, muted */
    .cfg-icon-btn:hover { border-color: var(--primary); color: var(--primary); }
    .cfg-icon-danger { color: var(--muted); }
    .cfg-icon-danger:hover { border-color: var(--danger); color: var(--danger); }
    .cfg-icon-ok { color: var(--muted); }
    .cfg-icon-ok:hover { border-color: var(--success); color: var(--success); }
    .cfg-chip-editing { padding: var(--space-1); background: #fff; border-color: var(--primary); border-radius: var(--radius-sm); }  /* mockup: chip edit = input liền chip, viền primary ở chip */
    .cfg-chip-editing .cfg-edit-input { border: none; outline: none; font-size: var(--text-sm); padding: var(--space-1) var(--space-2); width: 140px; background: transparent; color: var(--text); flex: 0 1 auto; min-width: 0; }  /* mockup: input transparent không viền */
    .cfg-chip-editing .cfg-edit-input::placeholder { color: var(--muted); opacity: 1; }
    .cfg-empty-val { color: var(--muted); font-style: italic; }
    #cfgNoResult { padding: var(--space-2) 2px; }
    .tid-cell { font-family: Consolas, "Courier New", monospace; font-weight: 600; }  /* mã task mono — kết quả tìm kiếm */
    .task-open-link { color: var(--primary-dark); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }  /* link mở task ở Mã task (thay nút Xem/Quét mobile) */
    .task-open-link:hover { color: var(--primary); }
    .cfg-save-dirty { background: var(--amber); border-color: var(--amber); animation: cfgSavePulse 1.4s ease-in-out infinite; }
    @keyframes cfgSavePulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(232, 93, 4, .30); } 50% { box-shadow: 0 0 0 6px rgba(232, 93, 4, 0); } }
    .cfg-drag-handle { color: var(--muted); cursor: grab; font-size: var(--text-xs); letter-spacing: -1px; user-select: none; flex: 0 0 auto; touch-action: none; }  /* touch-action:none — kéo touch không bị scroll ngắt; P2: tabindex + ↑↓ sắp xếp */
    .cfg-drag-handle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--radius-2xs); }
    .cfg-chip[draggable="true"] { cursor: grab; }
    .cfg-chip.cfg-dragging { opacity: .45; }
    .cfg-chip.cfg-drop-target { outline: 2px dashed var(--primary); outline-offset: -2px; border-radius: var(--radius-full); }
    /* viewAdmin — lọc nhật ký hoạt động theo ngày (2026-08-17) */
    #auditFilters input[type="date"] {
      padding: var(--space-2) var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: #fff; font-size: var(--text-sm); color: var(--input-text); cursor: pointer; font-family: inherit; min-height: 36px;
    }
    .filter-count { font-size: var(--text-sm); color: var(--muted); margin-left: auto; white-space: nowrap; }
    .btn-clear-filter {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      border-radius: var(--radius-sm); padding: var(--space-2) var(--space-2); font-size: var(--text-base); cursor: pointer;
      line-height: normal;  /* khớp chiều cao select #scanStatusFilter cạnh nhau */
    }
    .btn-clear-filter:hover { border-color: var(--danger); color: var(--danger); background: var(--card-err-bg); }
    /* C3: header bảng scan sortable */
    #scanTable th.sortable {
      cursor: pointer; user-select: none; white-space: nowrap;
    }
    #scanTable th.sortable:hover { background: var(--gray-hover-th); }
    #scanTable th.sortable.sort-asc::after { content: ' \25B2'; font-size: var(--text-3xs); color: var(--warning); }
    #scanTable th.sortable.sort-desc::after { content: ' \25BC'; font-size: var(--text-3xs); color: var(--warning); }

    /* ===== Bảng ===== */
    .table-wrap {
      overflow: auto;
      flex: 1 1 auto;
      min-height: 0;  /* cuộn trong theo card giãn đáy — thead sticky giữ header */
    }
    #auditWrap { max-height: calc(100vh - var(--header-h) - 120px); }
    table { width: 100%; border-collapse: collapse; font-size: var(--text-base); }
    /* Đồng bộ 3 bảng dữ liệu staff/task/scan cùng font 13px + nền cell đặc —
       trước staff 13px vs task/scan 14px + bg transparent → nhìn lệch style giữa view.
       Fix (audit 2026-08-11): bọc :where() để specificity = 0 — tr:hover td (row-hover) thắng lại,
       không mất hover highlight 3 bảng (trước: #xxxTable td (1,0,1) > tr:hover td (0,1,2)). */
    #staffTable, #taskListTable, #scanTable { font-size: var(--text-sm); }
    :where(#staffTable, #taskListTable, #scanTable) td { background: var(--card); }
    th, td { padding: var(--space-2) var(--space-2); text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: var(--surface-muted); color: var(--muted); font-weight: 600; font-size: var(--text-sm); position: sticky; top: 0; }
    tr:hover td { background: var(--row-hover); }
    /* C4: dòng NV Dư — nền cam nhạt nổi bật giữa bảng */
    #scanTable tr.extra-row td { background: var(--card-extra-bg); }
    #scanTable tr.extra-row:hover td { background: var(--row-extra-hover); }

    .badge {
      display: inline-block;
      padding: 3px var(--space-2);
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: 700;
    }
    .badge.pending { background: var(--surface-muted); color: var(--muted); }
    .badge.present { background: var(--card-ok-bg); color: var(--success-dark); }  /* hợp nhất xanh badge present/attend — 1 token */
    .badge.absent  { background: var(--card-err-bg); color: var(--danger-strong); }
    /* C3 (review 2026-08-11): --danger #d93025 = 4.05:1 trên #fce8e6 fail AA — dùng #b3261e (btn-danger hover ~5.4:1) */
    .badge.extra   { background: var(--card-extra-bg); color: var(--amber-text); }
    .badge.open    { background: var(--primary-bg); color: var(--primary); }
    .badge.attend { background: var(--card-ok-bg); color: var(--success-dark); }
    .badge.done    { background: var(--gray-soft); color: var(--muted); }

    /* ===== Scan input ===== */
    .scan-row { display: flex; gap: var(--space-2); }
    .scan-input-wrap { flex: 1; position: relative; overflow: hidden; padding: var(--space-1); border-radius: var(--radius-sm); }
    .scan-input-wrap input {
      font-size: var(--text-4xl);
      letter-spacing: 1px;
      padding: var(--space-4) var(--space-4);
      font-weight: 700;
      text-align: center;
    }
    /* Tia quét laser chạy ngang ô nhập khi focus (cảm giác quét) — mờ nhẹ, không lấn input */
    .scan-input-wrap::after {
      content: '';
      position: absolute;
      /* Tránh tràn/vỡ khung: wrap có padding 4px → khóa gradient bên TRONG ô nhập
         (bù 4px 2 bên), không phủ ra vùng padding ngoài khung viền. */
      top: var(--space-1); bottom: var(--space-1); height: auto;
      left: -40%;
      width: 30%;
      background: linear-gradient(90deg, transparent, rgba(232, 93, 4, .08), transparent);
      pointer-events: none;
      opacity: 0;
    }
    .scan-input-wrap:focus-within::after { animation: scanLine 1.8s ease-in-out infinite; }
    /* Scan input không focus: nền hơi khác để phân biệt với scanCard */
    .scan-input-wrap { background: var(--surface-muted); border: 1px solid var(--border); }
    .scan-input-wrap input::placeholder {
      font-size: var(--text-md);
      font-weight: 500;
      letter-spacing: 0;
      color: var(--muted);
      opacity: 1;
    }
    .scan-input-wrap input:focus {
      outline: none;
      border-color: var(--warning);
      box-shadow: 0 0 0 4px rgba(232, 93, 4, .18);
      background: #fff;
    }
    /* Nút Quét chỉ hiển thị trên mobile (<992px); desktop máy quét tự Enter */
    #btnScan { min-width: 64px; min-height: 44px; margin: var(--space-1) 0; } /* touch target ≥44×44; flex stretch làm nút cao hơn ô input 8px (padding wrap 4px×2) → margin 4px 0 cân bằng */
    @media (min-width: 992px) {
      #btnScan { display: none; }
    }
    /* Nút Camera: chỉ trên mobile/tablet (<992px) — desktop dùng máy quét tay */
    #btnCamera { min-width: 44px; min-height: 44px; margin: var(--space-1) 0; padding: 0; display: inline-flex; align-items: center; justify-content: center; }  /* margin 4px 0 đồng bộ #btnScan -> cùng chiều cao trong scan-row (stretch) */
    #btnCameraPhoto { min-width: 44px; min-height: 44px; margin: var(--space-1) 0; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    #btnCamera svg, #btnCameraPhoto svg, .list-search .btn-icon svg { width: 20px; height: 20px; display: block; }
    @media (min-width: 992px) {
      #btnCamera { display: none; }
      #btnCameraPhoto { display: none; }
    }
    /* Màn hình rộng: lớn hơn cho màn hình touch rộng (tham khảo v1 type scale) */
    @media (min-width: 1280px) {
      .scan-input-wrap input { font-size: var(--text-6xl); padding: var(--space-4) var(--space-5); letter-spacing: 2px; }
      .scan-input-wrap input::placeholder { font-size: var(--text-lg); }
      .counter .num { font-size: var(--text-7xl); }
      .scan-card .sc-name { font-size: var(--text-6xl); }
      .task-title { font-size: var(--text-lg); }
      th, td { font-size: var(--text-md); }
    }
    .scan-hint { font-size: var(--text-xs); color: var(--muted); margin-top: var(--space-2); }

    /* ===== Scan card projector — kết quả to nhìn từ 1–2m ===== */
    .scan-card {
      border-radius: var(--card-radius);
      padding: var(--space-4) var(--space-5);
      container-type: inline-size;  /* container cho @container — Agency sau tên NV ẩn khi card hẹp */
      margin-top: var(--space-4);
      border: 2px solid var(--border);
      background: var(--card);
      text-align: left;
      transition: border-color .15s, background .15s;
      min-height: 80px;
    }
    .scan-card.ok { border-color: var(--success); background: var(--card-ok-bg); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card.err { border-color: var(--danger); background: var(--card-err-bg); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card.extra { border-color: var(--warning); background: var(--card-extra-bg); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card.warn { border-color: var(--warning); background: var(--card-extra-bg); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card .sc-status {
      font-size: var(--text-sm); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
    }
    .scan-card.ok .sc-status { color: var(--success-dark); }
    .scan-card.err .sc-status { color: var(--danger-strong); }
    .scan-card.extra .sc-status { color: var(--amber-dark); }
    .scan-card.warn .sc-status { color: var(--amber-dark); }
    /* FREE phase1: NV mới quét lần 1 = 'Chưa điểm danh' (chưa phải lỗi/cảnh báo) → xanh dương. */
    .scan-card.pending .sc-status { color: var(--primary); }
    .scan-card.pending { border-color: var(--primary); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card .sc-name { font-size: var(--text-4xl); font-weight: 800; line-height: 1.25; margin-top: 2px; }
    .scan-card .sc-agency { display: block; font-size: var(--text-xl); font-weight: 400; color: var(--muted); margin-top: 2px; }  /* Agency xuống dòng riêng — vd 'Đoàn Hoàng Phát' + dòng 'SKT' */
    .scan-card .sc-meta { font-size: var(--text-base); color: var(--muted); margin-top: var(--space-1); }
    /* đủ không gian mới hiện Agency — card hẹp (điện thoại nhỏ) ẩn để tên không ôm/tràn */
    @container (max-width: 300px) {
      .scan-card .sc-agency { display: none; }
    }
    .scan-card .sc-empty { color: var(--muted); font-size: var(--text-base); }

    /* ===== Toast ===== */
    #toast {
      position: fixed;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--toast-bg);
      color: #fff;
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-sm);
      font-size: var(--text-md);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 10000; /* P1-4: trên modal overlay (9998) + spinModal (9999) */
      max-width: 90vw;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.ok { background: var(--success); }
    #toast.err { background: var(--danger); }
    #toast.warn { background: var(--amber-solid); }  /* a11y #e37400 quá sáng — trắng 15px 3.10:1 → #b3530a 5.05:1 (toast Dư mỗi lần quét) */
    #toast .toast-text { display: inline-block; }
    #toast .toast-close {
      background: transparent; border: none; color: #fff; opacity: .8;
      font-size: var(--text-base); line-height: 1; padding: 2px var(--space-1) 2px var(--space-2);
      cursor: pointer; vertical-align: middle;
    }
    #toast .toast-close:hover { opacity: 1; }

    .empty { text-align: center; color: var(--muted); padding: var(--space-8) var(--space-4); font-size: var(--text-md); }
        .empty .empty-arrow {
          font-size: var(--text-3xl); font-weight: 700; color: var(--amber);
          animation: empty-bounce 1.4s ease-in-out infinite; margin-bottom: var(--space-2);
        }
        @keyframes empty-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
        /* ===== Pagination ===== */
        .pag-wrap { padding: var(--space-2) 2px 2px; }
        .pag-bar {
          display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
          font-size: var(--text-sm); color: var(--muted);
        }
        .pag-info { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .pag-buttons { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
        .pag-btn {
          background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xs);
          color: var(--text); padding: 3px var(--space-2); font-size: var(--text-sm); font-weight: 600;
          cursor: pointer; min-width: 28px; text-align: center; line-height: 1.6;
          transition: border-color .15s, background .15s, color .15s;
        }
        .pag-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--surface-muted); }
        .pag-btn:disabled { opacity: .35; cursor: default; }
        .pag-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }
        .pag-ellipsis { padding: 3px var(--space-1); color: var(--muted); letter-spacing: 1px; }
    .muted { color: var(--muted); font-size: var(--text-sm); }
    .task-title { font-size: var(--text-lg); font-weight: 700; margin-bottom: 2px; text-transform: uppercase; color: var(--text); }  /* heading view = text đậm — hết amber hệ */
    .task-meta { font-size: var(--text-xs); color: var(--muted); margin-bottom: var(--space-1); }
    /* .hidden dùng !important — phải thắng mọi rule hiển thị khác,
       nếu không section không bao giờ ẩn (chồng view). */
    /* U5 (review 2026-08-11): screen-reader-only — announce kết quả lọc ngắn gọn
     * (thay aria-live cỡ grid — screen reader đọc lại cả bảng pivot khi chip click) */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .hidden { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Visual polish (tham khảo v1 styles.html) ===== */
    /* Scan-line shimmer — tia quét laser trên ô nhập khi focus */
    @keyframes scanLine {
      0% { transform: translateX(-40%); opacity: 0; }
      10% { opacity: 1; }
      60% { opacity: 1; }
      100% { transform: translateX(500%); opacity: 0; }
    }
    /* Stamp effect — scan card "đóng dấu" như thẻ chấm công */
    @keyframes stampIn {
      0%   { transform: scale(.55); opacity: 0; }
      40%  { transform: scale(1.12); opacity: 1; }
      60%  { transform: scale(.90); }
      75%  { transform: scale(1.06); }
      90%  { transform: scale(.97); }
      100% { transform: scale(1); opacity: 1; }
    }
    /* I8: queue đầy — viền đỏ nhấp nháy, báo user ngừng quét tạm thời */
    .scan-input-wrap.queue-full { border-color: var(--danger); }
    /* P1-1 fix: pulse hiện rõ trên nền sáng — đổi box-shadow input + opacity.
       Trước đây ::after box-shadow .10 mờ gần như vô hình trên nền trắng. */
    .scan-input-wrap.queue-full input { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(217, 48, 37, .18); }
    .scan-input-wrap.queue-full::after { animation: queueFullPulse 1.2s ease-in-out infinite; }
    @keyframes queueFullPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217, 48, 37, .45); opacity: 1; }
      50% { box-shadow: 0 0 0 8px rgba(217, 48, 37, .18); opacity: .6; }
    }

    /* ===== Header command center (tham khảo v1) ===== */
    header {
      background: var(--header-bg);
      color: var(--header-text);
      border-bottom: 1px solid var(--header-border);
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      padding: var(--space-2) var(--space-5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }
    header .brand {
      display: flex; align-items: center; gap: var(--space-2);
    }
    header .brand .title {
      font-size: var(--text-xl); font-weight: 800; letter-spacing: 1px;
      color: var(--header-text); text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0,0,0,.35);
      white-space: nowrap;  /* title không wrap thành 2 dòng khi header hẹp */
    }
    header .brand .title .brand-accent { color: var(--amber); font-weight: 800; }
    header .header-right {
      display: flex; align-items: center; gap: var(--space-2);
    }
    header .net-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); box-shadow: 0 0 4px var(--success);
    }
    header .net-dot.offline { background: var(--danger); box-shadow: 0 0 4px var(--danger); }
    header #netText { color: var(--side-text-muted); font-size: var(--text-xs); font-weight: 600; }

    /* ===== Background task indicator (header) ===== */
    /* Bổ sung spinner + count khi có tác vụ nền đang chạy (scan queue /
       RPC pending / silent reload). Nhắc không thoát giữa chừng; thay vì màn "yên lặng" khi queue còn. */
    .bg-task-indicator {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: 2px var(--space-2);
      border-radius: var(--radius-full);
      background: rgba(232, 93, 4, .12);
      border: 1px solid rgba(232, 93, 4, .35);
      color: var(--amber);
      font-size: var(--text-2xs);
      font-weight: 700;
      line-height: 1;
    }
    .bg-task-indicator .bg-spinner {
      width: 10px;
      height: 10px;
      border: 2px solid rgba(232, 93, 4, .25);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      box-sizing: border-box;
    }
    .bg-task-indicator .bg-task-count {
      font-variant-numeric: tabular-nums;
      min-width: 10px;
      text-align: center;
    }
    @media (max-width: 600px) {
      /* màn hẹp: chỉ spinner, ẩn số — header đã tải rồi */
      .bg-task-indicator .bg-task-count { display: none; }
      .bg-task-indicator { padding: 2px var(--space-2); }
    }
    /* Ô tìm kiếm chung task list toolbar (viewTasks) + staff toolbar (viewStaff) */
    .list-search {
      display: flex; align-items: center; gap: var(--space-1);
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      padding: 2px var(--space-2);
      max-width: 320px; flex: 0 1 320px;  /* flex inline cạnh heading — không wrap dòng riêng */
    }
    .list-search input[type=search] {
      border: none; outline: none;
      background: transparent; color: var(--text); font-size: var(--text-base);
      width: 100%; min-width: 140px; padding: var(--space-2) var(--space-1);
    }
    .list-search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px var(--focus-ring); }
    /* Ẩn nút ✕ native của WebKit/Blink — tránh 2 nút xoá trong ô tìm kiếm (dùng #btnListSearchClear). */
    .list-search input[type=search]::-webkit-search-cancel-button,
    .list-search input[type=search]::-webkit-search-decoration {
      -webkit-appearance: none; appearance: none; display: none;
    }
    .list-search input[type=search]::-ms-clear { display: none; }  /* IE/Edge legacy */
    .list-search input[type=search]::placeholder { color: var(--muted); }
    .list-search .btn-icon { padding: var(--space-1) var(--space-2); min-width: 36px; min-height: 36px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-muted); border: 1px solid var(--border); border-radius: var(--radius-xs); color: var(--text); cursor: pointer; }
    .list-search .btn-icon:hover { background: var(--surface); border-color: var(--primary); }
    header .btn-icon-dark {
      min-height: 40px;  /* P2 touch >= 44 - header compact */
      background: transparent;
      border: 1px solid var(--header-border);
      color: var(--side-text);
      border-radius: var(--radius-xs);
      padding: var(--space-2) var(--space-3);
      font-size: var(--text-base);
      cursor: pointer;
      transition: border-color .12s, color .12s, background .12s;
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 32px;
      white-space: nowrap;  /* nút không wrap chữ ("⟳ Làm mới" 2 dòng → header phình cao) */
    }
    header .btn-icon-dark:hover {
      border-color: var(--warning); color: var(--warning);
      background: rgba(227,116,0,.08);
    }
    /* m5 (audit 2026-08-11): icon header SVG đơn sắc currentColor (không emoji) — khớp sidebar */
    header .btn-icon-dark svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    header .btn-icon-dark .btn-refresh-label { margin-left: var(--space-2); }
    header .brand img {
      height: 26px; width: auto; display: block;
      filter: brightness(0) invert(1);
    }
    header .btn-icon-dark.muted { color: var(--net-err); border-color: var(--net-err-border); }

    /* header luôn 1 hàng (desktop >=601px) — trước đây wrap làm header cao hơn
       --header-h:59px (75px@1024, 129px@768, 170px@375) → doc cao hơn viewport → scroll dọc
       luôn bật + sidebar/view-topbar sticky bị ẩn sau header. */
    @media (min-width: 601px) {
      header { flex-wrap: nowrap; }
    }
    @media (min-width: 601px) and (max-width: 991px) {
      header #netText { display: none; }        /* tiết ngang — net-dot đã đủ */
    }

    /* ===== Heading + search bảng chung viewTasks (task-list-toolbar) · viewScan/viewStaff (att-toolbar) ===== */
    .task-list-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
      margin-bottom: var(--space-2); flex-wrap: wrap;
    }
    .section-heading {
      margin: 0; font-size: var(--text-lg); color: var(--text); font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
      display: flex; align-items: center; gap: var(--space-2);
    }
    /* Search ép phải — kể cả khi wrap xuống dòng riêng trên màn hẹp */
    .task-list-toolbar .list-search,
    .att-toolbar .list-search { margin-left: auto; }
    .task-count-badge {
      font-family: Consolas, 'Courier New', monospace;
      font-size: var(--text-sm); font-weight: 600; color: var(--muted);
      background: var(--gray-soft); padding: 2px var(--space-2); border-radius: var(--radius-lg); line-height: 1.5;
    }
    /* Cột Ca nhiều lựa chọn — giới hạn độ rộng, dấu "..." + tooltip */
    .td-slot { max-width: 150px; }
    .slot-ellipsis {
      display: inline-block; max-width: 150px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      vertical-align: bottom;
    }

    /* ===== Spin loading overlay (tham khảo v1) ===== */
    #loadingOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      /* Fix 2026-08-09: visibility dịch chuyển có độ trễ bằng đúng thời gian fade —
         ẩn ngay KHI fade xong (mẫu cổ điển tránh "bóng ma" overlay trên WebView cũ
         vẫn vẽ dải trắng mờ ở mép trên sau khi đã hide). */
      transition: opacity .4s ease, visibility 0s linear .4s;
    }
    #loadingOverlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #loadingOverlay .spin-big {
      width: 48px; height: 48px;
      border: 4px solid var(--gray-track); border-top-color: var(--warning);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    /* F6: modal spin cho nút chuyển trạng thái (spinner dùng chung loadingOverlay + spinModal) */
    .spin-big {
      width: 40px; height: 40px;
      border: 4px solid var(--gray-track); border-top-color: var(--warning);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }
    #loadingOverlay p { margin-top: var(--space-4); color: var(--muted); font-size: var(--text-md); font-weight: 500; }

    /* ===== Modal chung paste / create / confirm / spin — tái dùng overlay + dialog ===== */
    .about-overlay {
      position: fixed; inset: 0; z-index: 9998;
      background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .2s ease, visibility .2s;
    }
    .about-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; }
    .about-dialog {
      background: #fff; border-radius: var(--radius-md); padding: var(--space-6);
      max-width: 400px; width: 90%;
      box-shadow: 0 12px 40px rgba(0,0,0,.14);
      transform: scale(.96); transition: transform .2s ease-out;
    }
    .about-overlay.open .about-dialog { transform: scale(1); }


    /* P2: tôn trọng prefers-reduced-motion — tắt animation khi user yêu cầu */
    @media (prefers-reduced-motion: reduce) {
      .scan-input-wrap:focus-within::after { animation: none; }
      .scan-input-wrap.queue-full::after { animation: none; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* High contrast (tham khảo v1): màn cũ/sáng gắt — đậm border, tương phản cao */
    @media (prefers-contrast: more) {
      :root {
        --border: #000;
        --text: #000;
        --muted: #333;
        --bg: #fff;
        --surface-muted: #eee;
      }
      .scan-card { border-width: 3px; }
      .scan-input-wrap input { border-width: 2px; border-color: #000; }
      header { border-bottom-width: 2px; }
      .badge { border: 1px solid currentColor; }
      /* S9: badge nền đặc thay nền nhạt — đọc rõ trên màn sáng/cũ */
      .badge.pending { background: #000; color: #fff; }
      .badge.present { background: var(--success); color: #fff; }
      .badge.absent  { background: var(--danger); color: #fff; }
      .badge.extra   { background: var(--amber-solid); color: #fff; }  /* a11y #e37400 quá sáng — trắng 3.10:1 → #b3530a 5.05:1 */
      .badge.open    { background: var(--primary); color: #fff; }
      .badge.attend { background: var(--success-dark); color: #fff; }
      .badge.done    { background: #000; color: #fff; }
      .counter { border-width: 2px; }
    }

    /* ===== Skeleton loading (tham khảo v1) ===== */
    .skeleton-wrap { padding: var(--space-1) 0; }
    .skeleton-row {
      display: flex; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border);
    }
    .skeleton-cell {
      flex: 1; height: 16px; margin-right: var(--space-4);
      background: linear-gradient(90deg, var(--skeleton-a) 25%, var(--skeleton-b) 50%, var(--skeleton-a) 75%);
      background-size: 200% 100%;
      border-radius: var(--radius-2xs);
      animation: skeleton-shimmer 1.5s infinite;
    }
    .skeleton-cell:last-child { margin-right: 0; }
    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ===== Thống kê (viewStats: stats-grid 2 cột Contract×Ca + Agency×Ca) + bảng StaffData (viewStaff) ===== */
    .stats-team-title {
      margin: var(--space-3) 0 var(--space-2); font-size: var(--text-base); font-weight: 800; color: var(--primary);
      text-transform: uppercase; letter-spacing: .4px;
    }
    .stats-team-title:first-child { margin-top: 0; }
    .stats-table-wrap { overflow-x: auto; max-height: calc(100vh - 260px); overflow-y: auto; flex: 1 1 auto; min-height: 0; }
    .stats-table {
      width: 100%; border-collapse: collapse; font-size: var(--text-sm);
      table-layout: fixed;  /* cột dữ liệu chia đều — Ca/Tổng width cố định (CDP: Ca 188 vs OS 72 lệch) */
    }
    .stats-table th, .stats-table td {
      padding: var(--space-1) var(--space-2); border: 1px solid var(--border);
      text-align: center; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;  /* fixed layout: cell dài không tràn sang cell kế */
    }
    .stats-table th {
      background: var(--surface-muted); color: var(--muted);
      font-weight: 700; font-size: var(--text-xs); position: sticky; top: 0;
    }
    .stats-table th:first-child, .stats-table td.row-head { width: 110px; }
    /* Mobile cards (≤640px, 2026-08-16): danh sách task thành thẻ 2 cột (đồng bộ scan/reports) —
       dòng 1 Mã task (16px) | Trạng thái · dòng 2 Station | Ca · dòng 3 Team | Tổng NV · dòng 4 — | Đã quét lần 2;
       ẩn Loại/Tạo lúc/Người tạo/Dư (chi tiết có ở màn quét) */
    @media (max-width: 640px) {
      #taskListTable thead { display: none; }
      #taskListTable tbody tr { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 3px var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); margin-bottom: var(--space-2); background: var(--card); }  /* 2 cột đồng bộ scan/reports */
      #taskListTable tbody td { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; padding: 3px 0; font-size: var(--text-md); line-height: 1.35; }  #staffTable td { font-size: var(--text-md); }  /* #staffTable td specificity (1,1,0) thắng base (1,0,0) */
      /* Chỉ còn dữ liệu — giữ nhãn ngắn 'Tổng'/'Đã quét lần 2' cho 2 số (số trần khó đoán) */
      #taskListTable tbody td[data-label="Mã task"]::before, #taskListTable tbody td[data-label="Trạng thái"]::before, #taskListTable tbody td[data-label="Điểm danh"]::before { content: none; }  /* tiêu đề + badge không nhãn */
      #taskListTable tbody td[data-label="Station"]::before { content: 'Station: '; font-weight: 600; color: var(--muted); font-size: var(--text-xs); }
      #taskListTable tbody td[data-label="Team"]::before { content: 'Team: '; font-weight: 600; color: var(--muted); font-size: var(--text-xs); }  #taskListTable tbody td[data-label="Ca"]::before { content: 'Ca: '; font-weight: 600; color: var(--muted); font-size: var(--text-xs); }
      #taskListTable tbody td[data-label="Mã NV"]::before { content: 'Mã NV: '; font-weight: 600; color: var(--muted); font-size: var(--text-xs); }  #taskListTable tbody td[data-label="Tên NV"]::before { content: 'Tên NV: '; font-weight: 600; color: var(--muted); font-size: var(--text-xs); }  #taskListTable tbody td[data-label="Tổng NV"]::before, #taskListTable tbody td[data-label="Đã quét lần 2"]::before { content: attr(data-label) ': '; font-weight: 600; color: var(--muted); font-size: var(--text-xs); }  /* nhãn đầy đủ đồng bộ scan/reports */
      /* Ẩn trên mobile: STT + Loại + Tạo lúc + Người tạo + Dư (xem nhanh không cần — chi tiết có ở màn quét) */
      #taskListTable tbody td[data-label="STT"],
      #taskListTable tbody td[data-label="Loại"],
      #taskListTable tbody td[data-label="Tạo lúc"],
      #taskListTable tbody td[data-label="Người tạo"],
      #taskListTable tbody td[data-label="Dư"] { display: none; }
      /* card 2 cột — dòng 1 Mã task (16px) | Trạng thái; dòng 2 Station | Ca; dòng 3 Team | Tổng NV; dòng 4 — | Đã quét lần 2 */
      #taskListTable tbody td[data-label="Mã task"] { grid-column: 1; grid-row: 1; font-weight: 700; color: var(--primary-dark); font-size: var(--text-lg); }
      #taskListTable tbody td[data-label="Thao tác"] { display: none; }  /* bỏ nút Xem/Quét mobile — dùng link ở Mã task */
      #taskListTable tbody td[data-label="Station"] { grid-column: 1; grid-row: 2; }
      #taskListTable tbody td[data-label="Team"] { grid-column: 1; grid-row: 3; }
      #taskListTable tbody td[data-label="Ca"] { grid-column: 2; grid-row: 2; }
      #taskListTable tbody td[data-label="Trạng thái"] { grid-column: 2; grid-row: 1; justify-self: start; }  #taskListTable tbody .badge { font-size: var(--text-sm); }
      #taskListTable tbody td[data-label="Tổng NV"] { grid-column: 2; grid-row: 3; }
      #taskListTable tbody td[data-label="Đã quét lần 2"] { grid-column: 2; grid-row: 4; }
      /* F-search: cột khác — Điểm danh thay chỗ Trạng thái (dòng 1 cạnh Mã task), Mã NV + Tên NV dòng 3 */
      #taskListTable tbody td[data-label="Mã NV"] { grid-column: 2; grid-row: 3; }  /* F-search: Mã NV + Tên NV cột 2 — cột 1 Team r3 trống r4 (không đụng Station/Ca) */
      #taskListTable tbody td[data-label="Tên NV"] { grid-column: 2; grid-row: 4; }
      #taskListTable tbody td[data-label="Điểm danh"] { grid-column: 2; grid-row: 1; justify-self: start; }  /* dời cột 3 (search mode — Thao tác ẩn) */  .pag-buttons .pag-btn:nth-child(n+3):nth-last-child(n+3), .pag-buttons .pag-ellipsis { display: none; }  /* mobile chỉ giữ « ‹ › » + info — 11 nút số (~416px) > content 355px gây xuống dòng */
    }
    /* Mobile viewScan (≤640px, 2026-08-16): danh sách NV thành thẻ 2 cột — cột 1 = Tên NV - Agency / OpsID / Team;
       cột 2 = Ca / Giờ vào DS / Giờ điểm danh; Trạng thái gắn cuối dòng Tên NV. Cỡ chữ mobile nâng 13→15px. */
    @media (max-width: 640px) {
      #scanTable thead { display: none; }
      #scanTable tbody tr { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 3px var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); margin-bottom: var(--space-2); background: var(--card); }
      #scanTable tbody td { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; padding: 3px 0; font-size: var(--text-md); line-height: 1.35; }
      #scanTable tbody td[data-label="STT"], #scanTable tbody td[data-label="Station"],
      #scanTable tbody td[data-label="Ngày"] { display: none; }

      #scanTable tbody tr.extra-row td { background: transparent; }  #scanTable tbody tr.extra-row { background: var(--card-extra-bg); }  /* thẻ extra mobile — nền cam giữ trên tr (td transparent, tr grid mặc định var(--card)) */
      /* Quản trị mobile — card 2 cột đồng bộ task/scan/reports (2026-08-17) */
      #auditTable thead { display: none; }
      #auditTable tbody tr { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 3px var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); margin-bottom: var(--space-2); background: var(--card); }
      #auditTable tbody td { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; padding: 3px 0; font-size: var(--text-md); line-height: 1.35; }
      #auditTable tbody td[data-label="Email"]::before, #auditTable tbody td[data-label="Đối tượng"]::before { content: attr(data-label) ': '; font-weight: 600; color: var(--muted); font-size: var(--text-xs); }
      /* Audit: dòng 1 Thời gian | Thao tác; dòng 2 Email | Đối tượng */
      #auditTable tbody td[data-label="Thời gian"] { grid-column: 1; grid-row: 1; font-weight: 700; color: var(--primary-dark); font-size: var(--text-md); }

    /* Stats 2 cột cần đủ chỗ: dưới 1199px (tablet 768-1199) xếp 1 cột full-width —
       tại 1024px mỗi cột chỉ 358px, bảng Contract×Ca rộng bị ép scroll-x nhiều (CDP 2026-08-11).
       ≥1200px giữ 2 cột (desktop, mỗi cột ~470px đủ thoải). */
    @media (max-width: 1199px) {
      .stats-grid { grid-template-columns: 1fr; }

         wrap cuộn ngang + sticky cột nhãn trái. Desktop ≥1200 giữ nguyên fixed layout. */
      .stats-table { width: max-content; min-width: 100%; table-layout: auto; }

    #taskListTable thead th { position: sticky; top: 0; z-index: 2; }  /* nền th chung var(--surface-muted) — đồng bộ staffTable/scanTable */
    #staffTable thead th:nth-child(-n+4) { position: sticky; top: 0; left: 0; z-index: 4; box-shadow: 1px 0 0 var(--border); }
    #staffTable tbody td:nth-child(-n+4) { position: sticky; left: 0; z-index: 1; background: var(--card); box-shadow: 1px 0 0 var(--border); }    /* ===== Báo cáo (viewReports) — chấm công tháng theo email đăng nhập ===== */

    #reportsTable th:nth-child(6) { width: 110px; }  /* Kết quả */

    #reportsTable th:nth-child(8) { width: 85px; }   /* Giờ vào */
    #reportsTable th:nth-child(9) { width: 85px; }   /* Giờ ra */
    /* Cột giá trị ngắn — cân giữa (Station / Kết quả / Giờ công / Giờ vào / Giờ ra) */
    #reportsTable th:nth-child(5), #reportsTable th:nth-child(6), #reportsTable th:nth-child(7),
    #reportsTable th:nth-child(8), #reportsTable th:nth-child(9) { text-align: center; }
    #reportsTable td:nth-child(5), #reportsTable td:nth-child(6), #reportsTable td:nth-child(7),
    #reportsTable td:nth-child(8), #reportsTable td:nth-child(9) { text-align: center; }
    #reportsTable td:nth-child(4) { white-space: normal; word-break: break-word; }  /* Tên NV wrap thay vì cắt */
    #reportsTable td:nth-child(10) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }  /* PMO 1 dòng desktop/tablet — ellipsis thay wrap */
    #reportsTable td.has-pmo { background: var(--card-extra-bg); color: var(--amber-text); font-weight: 600; }  /* highlight PMO — tint cam nhạt (đồng bộ badge.extra), chỉ khi có giá trị */
    .reports-num { font-variant-numeric: tabular-nums; }
    .reports-off { display: inline-block; padding: 2px var(--space-2); border-radius: var(--radius-full); background: var(--card-err-bg); color: var(--danger-strong); font-size: var(--text-xs); font-weight: 700; white-space: nowrap; }  /* OFF = đỏ (đồng bộ badge.absent) */
    /* Mobile ≤640px: bảng → card (mỗi dòng 1 thẻ), nhãn ::before ': ' từ data-label, ẩn Mã Ops/Mã NV/Tên NV */
    @media (max-width: 640px) {
      #reportsTable thead { display: none; }
      #reportsTable tbody tr { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 3px var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); margin-bottom: var(--space-2); background: var(--card); }
      #reportsTable tbody td { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; padding: 3px 0; font-size: var(--text-md); line-height: 1.35; }
      #reportsTable tbody td:nth-child(n) { text-align: left; }  /* thắng desktop td:nth-child(5-9) center (1,1,1) — card đồng bộ scan/task/staff */
      #reportsTable tbody td[data-label="Station"]::before,
      #reportsTable tbody td[data-label="Giờ công"]::before,
      #reportsTable tbody td[data-label="Giờ vào"]::before,
      #reportsTable tbody td[data-label="Giờ ra"]::before,
      #reportsTable tbody td[data-label="PMO"]::before { content: attr(data-label) ': '; font-weight: 600; color: var(--muted); font-size: var(--text-xs); }  /* nhãn ': ' phân cách — đồng bộ scan/task, hết dính value */
      /* card 2 cột — dòng 1 Ngày (16px đậm) | Kết quả (không nhãn, khớp màn quét);
         dòng 2 Giờ vào | Giờ công; dòng 3 Giờ ra | Station; PMO full-width cuối. Ẩn Tên NV/Mã Ops/Mã NV
         (trùng user đăng nhập). Cỡ chữ mobile 13→15px. */
      #reportsTable tbody td:nth-child(2), #reportsTable tbody td:nth-child(3),
      #reportsTable tbody td:nth-child(4) { display: none; }
      #reportsTable tbody td:nth-child(1) { grid-column: 1; grid-row: 1; font-weight: 700; color: var(--text); font-size: var(--text-lg); }  /* Ngày — tiêu đề thẻ */
      #reportsTable tbody td:nth-child(6) { grid-column: 2; grid-row: 1; justify-self: start; }  /* Kết quả */
      #reportsTable tbody td:nth-child(1)::before, #reportsTable tbody td:nth-child(6)::before { content: none; }  /* dòng tiêu đề không nhãn */
      #reportsTable tbody td:nth-child(8) { grid-column: 1; grid-row: 2; }  /* Giờ vào */
      #reportsTable tbody td:nth-child(7) { grid-column: 2; grid-row: 2; }  /* Giờ công */
      #reportsTable tbody td:nth-child(9) { grid-column: 1; grid-row: 3; }  /* Giờ ra */
      #reportsTable tbody td:nth-child(5) { grid-column: 2; grid-row: 3; }  /* Station */
      #reportsTable tbody td:nth-child(10) { grid-column: 1 / -1; grid-row: 4; white-space: normal; word-break: break-word; } /* PMO full-width dài — wrap như Agency scan */
      #reportsTable tbody td.has-pmo { background: var(--card-extra-bg); color: var(--amber-text); font-weight: 600; }  /* highlight PMO mobile — cùng tint cam nhạt, band full-width */
      #reportsTable tbody .reports-off { font-size: var(--text-sm); }  /* pill OFF khớp badge 13px */
      .stats-table td { font-size: var(--text-md); padding: var(--space-2) var(--space-2); }  .stats-table th { font-size: var(--text-md); }  .stats-col-title { font-size: var(--text-md); }  #staffTable th { font-size: var(--text-md); }  #viewAbout .about-body { font-size: var(--text-md); }  #viewAbout .about-table { font-size: var(--text-md); }
    }
    /* Báo cáo tablet (<1200px): 9 cột fixed = 1010px > vùng bảng (~718px tại 1024) → cột PMO bị ép 0px,
       nowrap + ellipsis che mất giá trị (CDP: th10W=0). Chuyển auto + max-content như stats-table —
       cột giãn theo nội dung, PMO hiện đủ; wrap cuộn ngang (đã có overflow:auto). */
    @media (max-width: 1199px) {
      #reportsTable { width: max-content; min-width: 100%; table-layout: auto; }
      #reportsTable th, #reportsTable td { overflow: visible; text-overflow: clip; }
      #reportsTable td:nth-child(10) { white-space: normal; word-break: break-word; }  /* PMO wrap thay nowrap — giá trị dài không bị cắt */
    }
    #staffTable tbody tr:hover td:nth-child(-n+4) { background: var(--row-hover); }
    /* Mobile viewStaff (≤640px, 2026-08-16): StaffData 20 cột → thẻ card 2 cột (đồng bộ scan/task/reports) —
       dòng 1 Staff Name (16px) | Staff ID; dòng 2 Date | Agency; dòng 3 Contract Type | Department;
       dòng 4 Clock In | Clock Out; dòng 5 Actual Hours | Slot Code; dòng 6 Team | Station. Ẩn cột ít dùng
       (No/Email/Event ID/Matching/Gender/Remark/Workstation); thead ẩn → phễu lọc mất như task list. */
    @media (max-width: 640px) {
      #staffTable thead { display: none; }
      #staffTable tbody tr { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 3px var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); margin-bottom: var(--space-2); background: var(--card); }
      #staffTable tbody td { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; padding: 3px 0; font-size: var(--text-md); line-height: 1.35; }
      #staffTable tbody td:nth-child(-n+4) { position: static; box-shadow: none; }  /* hết sticky-left desktop — card không cuộn ngang */
      /* Nhãn ': ' đủ — đồng bộ scan/task/reports (12px/600/muted) */
      #staffTable tbody td[data-label="Date"]::before, #staffTable tbody td[data-label="Agency"]::before,
      #staffTable tbody td[data-label="Contract Type"]::before, #staffTable tbody td[data-label="Department"]::before,
      #staffTable tbody td[data-label="Clock In"]::before, #staffTable tbody td[data-label="Clock Out"]::before,
      #staffTable tbody td[data-label="Actual Hours"]::before, #staffTable tbody td[data-label="Slot Code"]::before,

      #staffTable tbody td[data-label="No."],

      #staffTable tbody td[data-label="Event ID"],
      #staffTable tbody td[data-label="Matching Type"],
      #staffTable tbody td[data-label="Gender"],
      #staffTable tbody td[data-label="Clock In Remark"],
      #staffTable tbody td[data-label="Clock Out Remark"],
      #staffTable tbody td[data-label="Workstation"] { display: none; }
      /* Card 2 cột — dòng 1 Staff Name (16px) | Staff ID (muted, khớp OpsID scan) */
      #staffTable tbody td[data-label="Staff Name"] { grid-column: 1; grid-row: 1; font-weight: 700; color: var(--text); font-size: var(--text-lg); }
      #staffTable tbody td[data-label="Staff ID"] { grid-column: 2; grid-row: 1; justify-self: start; font-weight: 600; color: var(--muted); }
      #staffTable tbody td[data-label="Date"] { grid-column: 1; grid-row: 2; }
      #staffTable tbody td[data-label="Agency"] { grid-column: 2; grid-row: 2; }
      #staffTable tbody td[data-label="Contract Type"] { grid-column: 1; grid-row: 3; }
      #staffTable tbody td[data-label="Department"] { grid-column: 2; grid-row: 3; }
      #staffTable tbody td[data-label="Clock In"] { grid-column: 1; grid-row: 4; }
      #staffTable tbody td[data-label="Clock Out"] { grid-column: 2; grid-row: 4; }
      #staffTable tbody td[data-label="Actual Hours"] { grid-column: 1; grid-row: 5; }
      #staffTable tbody td[data-label="Slot Code"] { grid-column: 2; grid-row: 5; }
