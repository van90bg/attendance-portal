<style>
    :root {
      color-scheme: light;  /* thay cho <meta color-scheme> — GAS addMetaTag không cho phép tag này; CSS tương đương meta */
      --primary: #0b57d0;
      --primary-dark: #0a4ab8;
      --danger: #d93025;
      --warning: #e37400;
      --success: #188038;
      --bg: #f5f6f8;
      --card: #ffffff;
      --card-radius: 12px;   /* surface chung: card + view-topbar — 1 nguồn bo góc */
      --card-ok-bg: #e6f4ea;
      --card-err-bg: #fce8e6;
      --card-extra-bg: #fef7e0;
      --header-h: 59px;  /* chiều cao header 1 hàng (padding 10×2 + nội dung ~39) — 1 nguồn cho topbar sticky + #viewTasks height.
                           FIX(2026-08-09): JS syncHeaderH() đo header THẬT (DOMContentLoaded/load/resize/meta-load) và ghi đè token —
                           header wrap (font/zoom/màn hẹp) làm token tĩnh lệch → doc cao hơn viewport → scroll dọc luôn bật. */
      --border: #d9dce1;
      --text: #1f1f1f;
      --muted: #5f6368;
      --bottom-nav-h: 60px;        /* bottom nav mobile — 1 nguồn cho height + main padding (2026-08-11) */
      /* Design tokens (doc #2: token-driven — không magic numbers) */
      --amber: #e85d04;            /* accent v1 — header/toolbar/focus */
      --header-bg: #0d111a;        /* header command center v1 */
      --header-text: #f4f7fb;
      --header-border: #3a4a66;
      --surface-muted: #f1f3f4;    /* badge pending, counter lbl, th */
      --focus-ring: rgba(232, 93, 4, .45);
      --accent: var(--amber);          /* accent chung — dùng amber làm chuẩn */
      --surface: #f5f6f8;              /* surface hover nhẹ (list-search .btn-icon:hover) — khớp --bg */
      /* Màu bổ sung (token hóa 2026-08-11 — màu dùng >=2 chỗ) */
      --row-hover: #f8faff;            /* hover hàng bảng (task/stats/staff) */
      --primary-bg: #e8f0fe;           /* badge.open / badge-reconcile */
      --surface-soft: #f0f1f3;          /* btn-ghost hover / badge.done — họ surface */
      --amber-dark: #9a4d00;           /* text amber đậm trên nền trắng — AA 6.1:1 (flabel) */
      --side-text: #c3cddb;            /* text sidebar dark (side-item) */
      --side-text-muted: #b6c2d4;      /* text phụ dark-surface — dùng chung header #netText + sidebar */
      --success-dark: #1e7e34;         /* text/bg xanh đậm (badge.attend) */
      /* Spacing 4pt grid (S1) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      /* Type scale 8-tier (dễ đọc trên màn hình lớn — tham khảo v1 styles.html) */
      --text-xs: .65rem;
      --text-sm: .72rem;
      --text-base: .82rem;
      --text-md: .92rem;
      --text-lg: 1rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --text-3xl: 2rem;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      height: 100vh; height: 100dvh; overflow: hidden;  /* khóa 1 màn hình: nội dung dài cuộn TRONG card, trang không cuộn (2026-08-11) */
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 20px; font-weight: 600; }
    .header-user {
      color: var(--header-text, #e2e8f0);
      font-size: 13px; font-weight: 600;
      padding: 2px 8px; border-radius: 999px;
      background: rgba(255,255,255,.08);
      max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    @media (max-width: 700px) { .header-user { display: none; } }  /* FIX(2026-08-09): 599→700 — giữ header 1 hàng khi hẹp (tránh tràn header) */
    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      transition: background .15s;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    .btn-outline:hover { background: #eaf1fe; }
    /* FIX(2026-08-14): nút Xem xám nhẹ — phân biệt với Quét (primary) ở cột Thao tác */
    .btn-view { background: var(--surface-muted); color: var(--text); border: 1px solid var(--border); }
    .btn-view:hover { background: #e4e7ea; }
    .btn-danger {
          background: var(--danger);
        }
        .btn-danger:hover { background: #b3261e; }
        .btn-amber {
          background: var(--amber);
          color: #fff;
        }
        .btn-amber:hover { background: #d45504; }
        .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface-soft); }
    .btn-sm { padding: 6px 12px; font-size: 13px; }  /* nút nhỏ trong bảng — hết inline style */
    td.stt { width: 40px; text-align: center; color: var(--muted); font-size: 13px; }  /* STT hẹp, không đẩy widths */

    main {
      max-width: 1920px; margin: 0 auto; padding: var(--space-4);
      flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    }  /* wide-screen: tận dụng màn lớn cho nhiều cột */
    /* View active giãn full chiều cao — card chạm đáy viewport (2026-08-11) */
    main > section { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
    main > section > .card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: var(--space-3);
      margin-bottom: var(--space-3);
    }

    /* ===== Layout 2 cột cho Scan view (tham khảo v1) ===== */
    .view-topbar {
      position: sticky;
      top: var(--header-h); /* ngay dưới header command center */
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      /* Giống v1: topbar là card nổi (surface + border + radius + shadow) — không "treo lơ lửng" */
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 6px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      transition: box-shadow .15s, border-color .15s;
    }
    /* Khi dính (stuck) — đổ bóng đậm hơn tách khỏi nội dung cuộn */
    .view-topbar.stuck {
      border-color: var(--border);
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
    }
    .view-topbar-title { flex: 1; text-align: left; }
    .view-topbar .btn { min-height: 40px; line-height: 1.2; }  /* nút topbar đồng bộ 40px — desktop 37-41px lệch do border/line-height (2026-08-11) */

    /* Toolbar chung các view (2026-08-11): List/Scan/Stats/Staff/Config — 1 class dùng chung */
    .scan-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      flex: 1 1 auto;
      min-height: 0;  /* card bảng scan giãn chạm đáy viewport (2026-08-11) */
    }
    .scan-col-left {
      flex: 0 0 480px;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .scan-col-right {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;  /* column-mode (≤991px): co được để card bảng cuộn trong — trước tràn bị clip (2026-08-11) */
      align-self: stretch;  /* giãn full chiều cao scan-layout — card bảng chạm đáy */
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .scan-col-left .card,
    .scan-col-right .card { margin-bottom: 0; }
    .scan-col-right .card {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
    }
    .scan-col-right .card .table-wrap {
      flex: 1 1 auto;
      overflow: auto;
      min-height: 0;
    }
    @media (max-width: 991px) {
      .scan-layout { flex-direction: column; }
      .scan-col-left { flex: none; max-width: none; }
    }
    /* P2 (header responsive): màn hẹp — topbar thoát sticky (bỏ hardcode 53px vốn
       giả định header cao cố định; khi header wrap cao hơn dễ đè). Ẩn logo ngoại
       (URL external) + netText — tiết cứng header 1 dòng, tránh layout shift/tràn. */
    @media (max-width: 600px) {
      header { padding: 8px 12px; flex-wrap: wrap; row-gap: 6px; }
      header .brand img { display: none; }  /* logo external — ẩn trên màn nhỏ, tránh load/tràn */
      header #netText { display: none; }    /* giữ net-dot, ẩn chữ — tiết chiều ngang */
      header .brand .title { font-size: 15px; letter-spacing: .5px; }
      header .btn-icon-dark { padding: 4px 9px; min-height: 28px; font-size: 13px; }
      .view-topbar { top: 0; }  /* bỏ sticky theo header — tránh đè khi header wrap */
      .card { padding: 10px; }  /* trên màn hẹp tiết diện — vẫn giữ var(--card-radius) */
    }

    /* ===== Form controls chung (2026-08-11): modal tạo task / paste + form Cấu hình ===== */
    /* 2026-08-09: BỎ giãn full card DANH SÁCH TASK (commit 31e49b3) — card tự cao theo nội dung,
       hết khoảng trắng 600px khi ít task. Nhiều task → table-wrap scroll trong (max-height viewport). */
    label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
    }
    select:focus, input[type="text"]:focus { outline: 2px solid var(--focus-ring); border-color: var(--warning); }
    /* S7: skip link — chỉ hiện khi focus (a11y keyboard) */
    .skip-link {
      position: absolute; left: -9999px; top: 0; z-index: 10000;
      background: var(--header-bg); color: #fff; padding: 10px 16px;
      border-radius: 0 0 8px 0; font-size: 14px; font-weight: 600;
    }
    .skip-link:focus { left: 0; }

    /* A11y: focus-visible ring rõ — không chỉ dựa vào hover */
    .btn:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* ===== Modal tạo task: dropdown thay cây checkbox (sketch 005e) ===== */
    /* Mô tả mode đang chọn — FREE giải thích khi chọn Ca = Tự do */
    .mode-desc { font-size: 12px; color: var(--muted); margin: 8px 2px 0; line-height: 1.45; }
    .mode-desc b { color: var(--text); }
    /* Audit UI (contrast): chữ amber 12px trên nền trắng ~3.5:1 fail AA — amber đậm #9a4d00 = 6.1:1 */
    /* Footer gộp preview + nút hành động (sketch A1: feedback ngay nơi bấm, tiết chiều cao modal) */
    #createModal .create-footer {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
    }
    #createModal .create-actions { display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; }
    .create-total { font-size: 13px; color: var(--muted); }
    .create-total b { color: var(--amber-dark); font-weight: 700; }

    /* v1: badge count nhẹ — nền xám nhạt, bo tròn, chữ muted (không lấn át) */
    /* ===== Commit 2026-08-08: modal tạo task gọn — dropdown thay 5 cây checkbox ===== */
        .create-form { display: grid; gap: 10px; margin-top: 10px; }
        .create-form .frow { display: grid; grid-template-columns: 80px 1fr; align-items: center; gap: 8px; }
        .create-form .chips.disabled { opacity: .45; pointer-events: none; }
        .create-form .frow .flabel { font-size: 12px; font-weight: 700; color: var(--amber-dark); }
    .create-form .frow .fnote { display: block; font-size: 11px; color: var(--muted); font-weight: 400; line-height: 1.3; }
    select.field-select {
      width: 100%; padding: 8px 30px 8px 10px; border: 1px solid var(--border, #e2e5ea); border-radius: 8px;
      background: #fff; font-size: 13px; appearance: none; cursor: pointer; color: #1a1a1a;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%236b655c' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
      background-repeat: no-repeat; background-position: right 10px center;
    }
    select.field-select:focus { outline: 2px solid var(--amber, #e85d04); outline-offset: -1px; }
    select.field-select:disabled { background-color: #f4f2ee; color: #b0a99e; cursor: not-allowed; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .pick {
      border: 1px solid var(--border, #e2e5ea); background: #fff; color: #3a3a3a;
      border-radius: 999px; font-size: 12px; padding: 4px 10px; cursor: pointer; font-weight: 500;
      line-height: 1.4; transition: background .12s, border-color .12s, color .12s;
    }
    .pick:hover { background: #faf8f4; }
    .pick.on { background: #fff3e6; border-color: #f0c79e; color: #8a3d02; font-weight: 700; }
    .pick.free.on { background: #e8f6ec; border-color: #b3d9bc; color: #1f7a3d; }
    /* Chip 'Tất cả' — nét đứt + chữ đậm nhẹ để phân biệt chip giá trị; on = đang áp dụng */
    .pick.all { border-style: dashed; color: #6b7280; }
    .pick.all.on { background: #eef2f7; border-color: #9db2c7; border-style: solid; color: #334155; font-weight: 700; }
    .pick:focus-visible { outline: 2px solid var(--amber, #e85d04); outline-offset: 1px; }
    /* Kích thước modal + header amber (v1) */
    /* Audit UI (2026-08-07): modal cao ~850px (3 hàng filter) từng bị CẮT nút Tạo task trên
       màn <900px — overlay không cuộn + dialog không max-height. Fix: dialog scroll trong +
       margin:auto (căn giữa khi vừa, không kẹt top khi cao) + overlay cuộn dự phòng. */
    #createModal.about-overlay { overflow-y: auto; scrollbar-gutter: stable; }
    #createModal .about-dialog {
      width: 480px; max-width: 480px;
      overflow: visible;   /* F: menu dropdown không bị cắt bởi scroll container của dialog */
      margin: auto;
      padding: 18px 20px;
      border: 1px solid var(--border, #e2e5ea);  /* D: đồng viền với card */
    }
    #createModal .about-dialog h2#createModalTitle {
      font-size: 16px; font-weight: 700; color: var(--text, #1f1f1f);
      padding-bottom: 10px; margin-bottom: 12px;
      border-bottom: 2px solid var(--amber);
      display: flex; align-items: center; gap: 8px;
    }
    /* animation scale-in (v1) */
    #createModal.about-overlay .about-dialog { transform: scale(.95); transition: transform .2s ease-out; }
    #createModal.about-overlay.open .about-dialog { transform: scale(1); }
    /* touch target 44px (v1) */
    /* Touch target modal chung (2026-08-11): paste/create/confirm — 44px touch, font 14px gọn */
    .about-dialog .btn { min-height: 44px; font-size: 14px; font-weight: 600; }
    @media (max-width: 719px) {
      #createModal .about-dialog {
        width: 100vw; max-width: 100vw;
        height: 100vh; max-height: 100vh;
        border-radius: 0;
        overflow: auto;
        padding: 12px;
      }
    }

    /* ===== Bộ đếm — 3 khối luôn cùng 1 hàng (nhìn nhanh) ===== */
    .counters { display: flex; gap: 10px; }
    /* P1-2 fix: dùng transform translateX (GPU-accelerated) thay vì left (layout thrash). */
    @keyframes pasteSlide {
      0% { transform: translateX(-250%); }
      100% { transform: translateX(250%); }
    }
    .counter {
      flex: 1;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px 12px;
      text-align: center;
    }
    .counter .num {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .counter .lbl {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      background: var(--surface-muted);
      padding: 2px 10px;
      border-radius: 10px;
      margin-top: 6px;
    }
    .counter.scanned { border-color: var(--success); }
    .counter.absent { border-color: var(--danger); }   /* DONE: Vắng (đỏ) */
    .counter.waiting { border-color: var(--primary); } /* Mở: Chờ có mặt (xanh) */
    .counter.extra { border-color: var(--amber-dark); } /* Dư (cam đậm) — khớp scanCard.extra */
    .counter.scanned .num { color: var(--success); }
    .counter.absent .num { color: var(--danger); }
    .counter.waiting .num { color: var(--primary); }
    .counter.extra .num { color: var(--amber-dark); }  /* FIX(2026-08-14): đồng bộ scanCard.extra/.warn (--amber-dark) — trước --warning #e37400 lệch tông */

    /* ===== Toolbar bảng NV chung (2026-08-11): viewScan + viewStaff ===== */
    .att-toolbar {
      /* 2026-08-11: bỏ nền xám/border — đồng bộ task-list-toolbar (header bảng trong suốt, chỉ heading + search).
         User duyệt 2026-08-11: att-toolbar xám nhẹ còn task-list-toolbar trong suốt → chọn trong suốt cho cả 2. */
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .att-toolbar select { flex: 0 0 auto; width: auto; max-width: 190px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #fff; color: var(--text); }

    /* ===== C4: form trang Cấu hình (Config Admin) ===== */
    .topbar-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }  /* nhóm nút topbar viewConfig (Hủy thay đổi + Làm mới + Lưu cấu hình) */
    .cfg-discard-btn { border-color: var(--danger); color: var(--danger); }  /* P2 (2026-08-16): nút "Hủy thay đổi" riêng khi dirty — bỏ đổi nhãn Làm mới (min-width 150px cũng bỏ) */
    .cfg-card { padding: var(--space-3); }  /* đồng bộ .card chung (12px) — 2026-08-11 */
    .cfg-hint { font-weight: 400; font-size: 12px; color: var(--muted); text-transform: none; letter-spacing: 0; }  /* hint không bị uppercase khi nằm trong .section-heading (toolbar CẤU HÌNH VẬN HÀNH) */
    /* viewConfig role = CARD rows (mockup 2026-08-16 — thay bảng): email + badge + icon ✎/✕,
       edit = input + select + ✓/✕ — hết ellipsis cắt nút mobile, hết grid cột. */
    .cfg-role-rows { display: flex; flex-direction: column; gap: 8px; }
    .cfg-role-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff; min-width: 0; }
    .cfg-role-card:hover { background: var(--row-hover); }
    .cfg-role-card.cfg-role-editing { border-color: var(--primary); }
    .cfg-role-email { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }  /* email 1 dòng + tooltip title (mockup) */
    .cfg-role-select { flex: 0 1 auto; min-width: 0; max-width: 160px; }  /* select edit co lại — input email rộng */
    .cfg-role-badge { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; padding: 3px 10px; border-radius: 999px; background: var(--primary-bg); color: var(--primary-dark); font-size: 12px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }  /* badge role — tooltip đầy đủ khi ellipsis */
    .cfg-role-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .cfg-role-card input[type=text], .cfg-role-card select { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; background: #fff; color: var(--text); }
    .cfg-role-card input[type=text] { flex: 1 1 auto; min-width: 0; }
    /* viewConfig: danh sách mục vận hành + nút Sửa/Xoá (2026-08-11) */
    .cfg-list { display: flex; flex-direction: column; gap: 18px; }  /* 2026-08-14: sections xếp dọc, tự cao — card cuộn */

    /* 2026-08-16: group = CARD riêng theo MOCKUP (ngôn ngữ giao diện): head clickable (chevron ▾ xoay -90°
       khi thu gọn + title + count badge), chips nền xám nhạt (default = xanh primary-bg + viền primary),
       icon chip 20px tròn, + Thêm dashed pill, star ★/☆ 14px. */
    .cfg-group-card { border: 1px solid var(--border); border-radius: var(--card-radius); background: var(--card); overflow: hidden; }
    #roleWrap { margin-top: 14px; }  /* role card cách group cuối — gap .cfg-list 18px lo group, roleWrap sibling riêng */
    .cfg-card-head { display: flex; align-items: center; gap: 9px; padding: 13px 16px; cursor: pointer; user-select: none; min-width: 0; }  /* mockup: cả head click được */
    .cfg-card-head:hover { background: var(--row-hover); }
    .cfg-card-head:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
    .cfg-chevron { color: var(--muted); font-size: 11px; width: 14px; display: inline-block; transition: transform .15s; flex-shrink: 0; }
    .cfg-group-card.is-collapsed .cfg-chevron { transform: rotate(-90deg); }  /* mockup: chevron xoay khi đóng */
    .cfg-group-title { font-weight: 700; font-size: 14px; color: var(--text); }
    .cfg-count { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface-muted); padding: 2px 8px; border-radius: 999px; min-width: 20px; text-align: center; flex-shrink: 0; }  /* badge đếm mục (mockup) */
    .cfg-group-card.is-collapsed .cfg-chips { display: none; }  /* thu gọn: chỉ còn head — trang ngắn lại */
    .cfg-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px 16px; border-top: 1px solid var(--border); }  /* chip wrap — 7 mục Slot Code co lại 2 dòng */
    .cfg-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-muted); border: 1px solid transparent; border-radius: 999px; padding: 6px 6px 6px 12px; font-size: 13px; color: var(--text); max-width: 100%; }  /* mockup: nền xám nhạt, không viền */
    .cfg-chip.is-default { background: var(--primary-bg); border-color: var(--primary); }  /* mockup: default xanh primary-bg + viền primary */
    .cfg-chip-value { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; font-size: 13px; color: var(--text); }  /* mockup: value cap + ellipsis + tooltip title */
    .cfg-chip .cfg-drag-handle { display: inline-flex; cursor: grab; color: var(--muted); font-size: 12px; line-height: 1; }
    .cfg-chip-edit, .cfg-chip-del { cursor: pointer; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--muted); font-size: 12px; border: none; background: none; flex-shrink: 0; padding: 0; }  /* mockup: icon 20px tròn mềm */
    .cfg-chip-edit:hover { background: #fff; color: var(--primary); }
    .cfg-chip-del:hover { background: #fff; color: var(--danger); }
    .cfg-add-chip { display: inline-flex; align-items: center; gap: 4px; border: 1px dashed var(--border); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--muted); cursor: pointer; background: #fff; }  /* mockup: + Thêm dashed pill cuối chips */
    .cfg-add-chip:hover { border-color: var(--primary); color: var(--primary); }
    .cfg-star-btn { flex: 0 0 auto; border: 0; background: none; color: var(--border); font-size: 14px; line-height: 1; cursor: pointer; padding: 0; flex-shrink: 0; }  /* mockup: star 14px, off = xám border */
    .cfg-star-btn:hover { color: var(--warning); }
    .cfg-star-btn.cfg-star-on { color: var(--warning); }  /* ★ đang mặc định — warning (mockup) */
    .cfg-icon-btn { flex: 0 0 auto; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--muted); font-size: 13px; line-height: 1; cursor: pointer; padding: 0; }  /* mockup: role icon 30x30, muted */
    .cfg-icon-btn:hover { border-color: var(--primary); color: var(--primary); }
    .cfg-icon-danger { color: var(--muted); }
    .cfg-icon-danger:hover { border-color: var(--danger); color: var(--danger); }
    .cfg-icon-ok { color: var(--muted); }
    .cfg-icon-ok:hover { border-color: var(--success); color: var(--success); }
    .cfg-chip-editing { padding: 4px; background: #fff; border-color: var(--primary); border-radius: 8px; }  /* mockup: chip edit = input liền chip, viền primary ở chip */
    .cfg-chip-editing .cfg-edit-input { border: none; outline: none; font-size: 13px; padding: 4px 6px; width: 140px; background: transparent; color: var(--text); flex: 0 1 auto; min-width: 0; }  /* mockup: input transparent không viền */
    .cfg-chip-editing .cfg-edit-input::placeholder { color: var(--muted); opacity: 1; }
    .cfg-empty-val { color: var(--muted); font-style: italic; }
    #cfgNoResult { padding: 8px 2px; }  /* P1 (2026-08-16): "Không có mục phù hợp" ngoài section — có chút thở */
    .tid-cell { font-family: Consolas, "Courier New", monospace; font-weight: 600; }  /* mã task mono — kết quả tìm kiếm */
    .task-open-link { color: var(--primary-dark); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }  /* FIX(2026-08-14): link mở task ở Mã task (thay nút Xem/Quét mobile) */
    .task-open-link:hover { color: var(--primary); }
    .cfg-save-dirty { background: var(--amber); border-color: var(--amber); animation: cfgSavePulse 1.4s ease-in-out infinite; }
    @keyframes cfgSavePulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(232, 93, 4, .30); } 50% { box-shadow: 0 0 0 6px rgba(232, 93, 4, 0); } }
    .cfg-drag-handle { color: var(--muted); cursor: grab; font-size: 12px; letter-spacing: -1px; user-select: none; flex: 0 0 auto; touch-action: none; }  /* P0 (2026-08-16): touch-action:none — kéo touch không bị scroll ngắt; P2: tabindex + ↑↓ sắp xếp */
    .cfg-drag-handle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 3px; }
    .cfg-chip[draggable="true"] { cursor: grab; }
    .cfg-chip.cfg-dragging { opacity: .45; }
    .cfg-chip.cfg-drop-target { outline: 2px dashed var(--primary); outline-offset: -2px; border-radius: 999px; }
    .btn-clear-filter {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 8px 10px; font-size: 14px; cursor: pointer;
      line-height: normal;  /* khớp chiều cao select #scanStatusFilter cạnh nhau */
    }
    .btn-clear-filter:hover { border-color: var(--danger); color: var(--danger); background: var(--card-err-bg); }
    /* C3: header bảng scan sortable */
    #scanTable th.sortable {
      cursor: pointer; user-select: none; white-space: nowrap;
    }
    #scanTable th.sortable:hover { background: #e3e6ea; }
    #scanTable th.sortable.sort-asc::after { content: ' \25B2'; font-size: 10px; color: var(--warning); }
    #scanTable th.sortable.sort-desc::after { content: ' \25BC'; font-size: 10px; color: var(--warning); }

    /* ===== Bảng ===== */
    .table-wrap {
      overflow: auto;
      flex: 1 1 auto;
      min-height: 0;  /* cuộn trong theo card giãn đáy — thead sticky giữ header */
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    /* Đồng bộ 3 bảng dữ liệu (2026-08-11): staff/task/scan cùng font 13px + nền cell đặc —
       trước staff 13px vs task/scan 14px + bg transparent → nhìn lệch style giữa view.
       Fix (audit 2026-08-11): bọc :where() để specificity = 0 — tr:hover td (row-hover) thắng lại,
       không mất hover highlight 3 bảng (trước: #xxxTable td (1,0,1) > tr:hover td (0,1,2)). */
    #staffTable, #taskListTable, #scanTable { font-size: 13px; }
    :where(#staffTable, #taskListTable, #scanTable) td { background: var(--card); }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: var(--surface-muted); color: var(--muted); font-weight: 600; font-size: 13px; position: sticky; top: 0; }
    tr:hover td { background: var(--row-hover); }
    /* C4: dòng NV Dư — nền cam nhạt nổi bật giữa bảng */
    #scanTable tr.extra-row td { background: var(--card-extra-bg); }
    #scanTable tr.extra-row:hover td { background: #fdf0cd; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge.pending { background: var(--surface-muted); color: var(--muted); }
    .badge.present { background: var(--card-ok-bg); color: #137333; }
    .badge.absent  { background: var(--card-err-bg); color: #b3261e; }
    /* C3 (review 2026-08-11): --danger #d93025 = 4.05:1 trên #fce8e6 fail AA — dùng #b3261e (btn-danger hover ~5.4:1) */
    .badge.extra   { background: var(--card-extra-bg); color: #b45309; }
    .badge.open    { background: var(--primary-bg); color: var(--primary); }
    .badge.attend { background: var(--card-ok-bg); color: var(--success-dark); }
    .badge.done    { background: var(--surface-soft); color: var(--muted); }
    .badge.badge-free      { background: #f3e8fd; color: #7c3aed; }
    .badge.badge-reconcile { background: var(--primary-bg); color: var(--primary); }

    /* ===== Scan input ===== */
    .scan-row { display: flex; gap: 10px; }
    .scan-input-wrap { flex: 1; position: relative; overflow: hidden; padding: 4px; border-radius: 8px; }
    .scan-input-wrap input {
      font-size: 28px;
      letter-spacing: 1px;
      padding: 16px 18px;
      font-weight: 700;
      text-align: center;
    }
    /* Tia quét laser chạy ngang ô nhập khi focus (cảm giác quét) — mờ nhẹ, không lấn input */
    .scan-input-wrap::after {
      content: '';
      position: absolute;
      /* Tránh tràn/vỡ khung: wrap có padding 4px → khóa gradient bên TRONG ô nhập
         (bù 4px 2 bên), không phủ ra vùng padding ngoài khung viền. */
      top: 4px; bottom: 4px; height: auto;
      left: -40%;
      width: 30%;
      background: linear-gradient(90deg, transparent, rgba(232, 93, 4, .08), transparent);
      pointer-events: none;
      opacity: 0;
    }
    .scan-input-wrap:focus-within::after { animation: scanLine 1.8s ease-in-out infinite; }
    .scan-input-wrap input::placeholder {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--muted);
      opacity: 1;
    }
    .scan-input-wrap input:focus {
      outline: none;
      border-color: var(--warning);
      box-shadow: 0 0 0 4px rgba(232, 93, 4, .18);
    }
    /* Nút Quét chỉ hiển thị trên mobile (<992px); desktop máy quét tự Enter */
    #btnScan { min-width: 64px; min-height: 44px; margin: 4px 0; } /* touch target ≥44×44; FIX(2026-08-14): flex stretch làm nút cao hơn ô input 8px (padding wrap 4px×2) → margin 4px 0 cân bằng */
    @media (min-width: 992px) {
      #btnScan { display: none; }
    }
    /* Nút Camera: chỉ trên mobile/tablet (<992px) — desktop dùng máy quét tay */
    #btnCamera { min-width: 44px; min-height: 44px; margin: 4px 0; padding: 0; display: inline-flex; align-items: center; justify-content: center; }  /* margin 4px 0 đồng bộ #btnScan -> cùng chiều cao trong scan-row (stretch) */
    #btnCamera svg, .list-search .btn-icon svg { width: 20px; height: 20px; display: block; }
    @media (min-width: 992px) {
      #btnCamera { display: none; }
    }
    /* Màn hình rộng: lớn hơn cho màn hình touch rộng (tham khảo v1 type scale) */
    @media (min-width: 1280px) {
      .scan-input-wrap input { font-size: 34px; padding: 18px 20px; letter-spacing: 2px; }
      .scan-input-wrap input::placeholder { font-size: 17px; }
      .counter .num { font-size: 44px; }
      .scan-card .sc-name { font-size: 34px; }
      .task-title { font-size: 17px; }
      th, td { font-size: 15px; }
    }
    .scan-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

    /* ===== Scan card projector — kết quả to nhìn từ 1–2m ===== */
    .scan-card {
      border-radius: var(--card-radius);
      padding: 16px 20px;
      container-type: inline-size;  /* FIX(2026-08-14): container cho @container — Agency sau tên NV ẩn khi card hẹp */
      margin-top: 14px;
      border: 2px solid var(--border);
      background: var(--card);
      text-align: left;
      transition: border-color .15s, background .15s;
      min-height: 80px;
    }
    .scan-card.ok { border-color: var(--success); background: var(--card-ok-bg); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card.err { border-color: var(--danger); background: var(--card-err-bg); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card.extra { border-color: var(--warning); background: var(--card-extra-bg); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card.warn { border-color: var(--warning); background: var(--card-extra-bg); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card .sc-status {
      font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
    }
    .scan-card.ok .sc-status { color: var(--success); }
    .scan-card.err .sc-status { color: var(--danger); }
    .scan-card.extra .sc-status { color: var(--amber-dark); }
    .scan-card.warn .sc-status { color: var(--amber-dark); }
    /* FREE phase1: NV mới quét lần 1 = 'Chưa điểm danh' (chưa phải lỗi/cảnh báo) → xanh dương. */
    .scan-card.pending .sc-status { color: var(--primary); }
    .scan-card.pending { border-color: var(--primary); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card .sc-name { font-size: 30px; font-weight: 800; line-height: 1.25; margin-top: 2px; }
    .scan-card .sc-agency { font-weight: 400; color: var(--muted); }  /* FIX(2026-08-14): Agency sau tên NV — vd 'Đoàn Hoàng Phát - SKT' */
    .scan-card .sc-meta { font-size: 14px; color: var(--muted); margin-top: 4px; }
    /* FIX(2026-08-14): đủ không gian mới hiện Agency — card hẹp (điện thoại nhỏ) ẩn để tên không ôm/tràn */
    @container (max-width: 300px) {
      .scan-card .sc-agency { display: none; }
    }
    .scan-card .sc-empty { color: var(--muted); font-size: 14px; }

    /* ===== Toast ===== */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #202124;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 10000; /* P1-4: trên modal overlay (9998) + spinModal (9999) */
      max-width: 90vw;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.ok { background: var(--success); }
    #toast.err { background: var(--danger); }
    #toast.warn { background: #b3530a; }  /* a11y (2026-08-12): #e37400 quá sáng — trắng 15px 3.10:1 → #b3530a 5.05:1 (toast Dư mỗi lần quét) */
    #toast .toast-text { display: inline-block; }
    #toast .toast-close {
      background: transparent; border: none; color: #fff; opacity: .8;
      font-size: 14px; line-height: 1; padding: 2px 4px 2px 10px;
      cursor: pointer; vertical-align: middle;
    }
    #toast .toast-close:hover { opacity: 1; }

    .empty { text-align: center; color: var(--muted); padding: 32px 16px; font-size: 15px; }
        .empty .empty-arrow {
          font-size: 22px; font-weight: 700; color: var(--amber);
          animation: empty-bounce 1.4s ease-in-out infinite; margin-bottom: 6px;
        }
        @keyframes empty-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
        /* ===== Pagination (tham khảo v1 scan.html — 50 dòng/trang) ===== */
        .pag-wrap { padding: 8px 2px 2px; }
        .pag-bar {
          display: flex; align-items: center; justify-content: space-between; gap: 8px;
          font-size: 13px; color: var(--muted);
        }
        .pag-info { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .pag-buttons { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
        .pag-btn {
          background: var(--card); border: 1px solid var(--border); border-radius: 6px;
          color: var(--text); padding: 3px 9px; font-size: 13px; font-weight: 600;
          cursor: pointer; min-width: 28px; text-align: center; line-height: 1.6;
          transition: border-color .15s, background .15s, color .15s;
        }
        .pag-btn:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); background: var(--surface-muted); }
        .pag-btn:disabled { opacity: .35; cursor: default; }
        .pag-btn.active { background: var(--amber); border-color: var(--amber); color: #fff; font-weight: 700; }
        .pag-ellipsis { padding: 3px 4px; color: var(--muted); letter-spacing: 1px; }
    .muted { color: var(--muted); font-size: 13px; }
    .task-title { font-size: 16px; font-weight: 700; margin-bottom: 2px; text-transform: uppercase; color: var(--amber-dark); }
    .task-meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    /* FIX(2026-08-09): .hidden dùng !important — phải thắng mọi rule hiển thị khác,
       nếu không section không bao giờ ẩn (chồng view). */
    /* U5 (review 2026-08-11): screen-reader-only — announce kết quả lọc ngắn gọn
     * (thay aria-live cỡ grid — screen reader đọc lại cả bảng pivot khi chip click) */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .hidden { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Visual polish (tham khảo v1 styles.html) ===== */
    /* Scan-line shimmer — tia quét laser trên ô nhập khi focus */
    @keyframes scanLine {
      0% { transform: translateX(-40%); opacity: 0; }
      10% { opacity: 1; }
      60% { opacity: 1; }
      100% { transform: translateX(500%); opacity: 0; }
    }
    /* Stamp effect — scan card "đóng dấu" như thẻ chấm công */
    @keyframes stampIn {
      0%   { transform: scale(.55); opacity: 0; }
      40%  { transform: scale(1.12); opacity: 1; }
      60%  { transform: scale(.90); }
      75%  { transform: scale(1.06); }
      90%  { transform: scale(.97); }
      100% { transform: scale(1); opacity: 1; }
    }
    /* I8: queue đầy — viền đỏ nhấp nháy, báo user ngừng quét tạm thời */
    .scan-input-wrap.queue-full { border-color: var(--danger); }
    /* P1-1 fix: pulse hiện rõ trên nền sáng — đổi box-shadow input + opacity.
       Trước đây ::after box-shadow .10 mờ gần như vô hình trên nền trắng. */
    .scan-input-wrap.queue-full input { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(217, 48, 37, .18); }
    .scan-input-wrap.queue-full::after { animation: queueFullPulse 1.2s ease-in-out infinite; }
    @keyframes queueFullPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217, 48, 37, .45); opacity: 1; }
      50% { box-shadow: 0 0 0 8px rgba(217, 48, 37, .18); opacity: .6; }
    }

    /* ===== Header command center (tham khảo v1) ===== */
    header {
      background: var(--header-bg);
      color: var(--header-text);
      border-bottom: 1px solid var(--header-border);
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header .brand {
      display: flex; align-items: center; gap: 10px;
    }
    header .brand .title {
      font-size: 18px; font-weight: 800; letter-spacing: 1px;
      color: var(--header-text); text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0,0,0,.35);
      white-space: nowrap;  /* FIX(2026-08-09): title không wrap thành 2 dòng khi header hẹp */
    }
    /* v1: ĐIỂM DANH nổi bật amber — brand signal */
    header .brand .title .brand-accent { color: var(--amber); font-weight: 800; }
    header .header-right {
      display: flex; align-items: center; gap: 10px;
    }
    header .net-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); box-shadow: 0 0 4px var(--success);
    }
    header .net-dot.offline { background: var(--danger); box-shadow: 0 0 4px var(--danger); }
    header #netText { color: var(--side-text-muted); font-size: 12px; font-weight: 600; }

    /* ===== Background task indicator (header) ===== */
    /* Bổ sung (2026-08-09): spinner + count khi có tác vụ nền đang chạy (scan queue /
       RPC pending / silent reload). Nhắc không thoát giữa chừng; thay vì màn "yên lặng" khi queue còn. */
    .bg-task-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(232, 93, 4, .12);
      border: 1px solid rgba(232, 93, 4, .35);
      color: var(--amber);
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }
    .bg-task-indicator .bg-spinner {
      width: 10px;
      height: 10px;
      border: 2px solid rgba(232, 93, 4, .25);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      box-sizing: border-box;
    }
    .bg-task-indicator .bg-task-count {
      font-variant-numeric: tabular-nums;
      min-width: 10px;
      text-align: center;
    }
    @media (max-width: 600px) {
      /* màn hẹp: chỉ spinner, ẩn số — header đã tải rồi */
      .bg-task-indicator .bg-task-count { display: none; }
      .bg-task-indicator { padding: 2px 7px; }
    }
    /* Ô tìm kiếm chung (2026-08-11): task list toolbar (viewTasks) + staff toolbar (viewStaff) */
    .list-search {
      display: flex; align-items: center; gap: 4px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 6px;
      max-width: 320px; flex: 0 1 320px;  /* flex inline cạnh heading — không wrap dòng riêng */
    }
    .list-search input[type=search] {
      border: none; outline: none;
      background: transparent; color: var(--text); font-size: 14px;
      width: 100%; min-width: 140px; padding: 6px 4px;
    }
    /* Ẩn nút ✕ native của WebKit/Blink — tránh 2 nút xoá trong ô tìm kiếm (dùng #btnListSearchClear). */
    .list-search input[type=search]::-webkit-search-cancel-button,
    .list-search input[type=search]::-webkit-search-decoration {
      -webkit-appearance: none; appearance: none; display: none;
    }
    .list-search input[type=search]::-ms-clear { display: none; }  /* IE/Edge legacy */
    .list-search input[type=search]::placeholder { color: var(--muted); }
    .list-search .btn-icon { padding: 4px 8px; min-width: 36px; min-height: 36px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-muted); border: 1px solid var(--border); border-radius: 6px; color: var(--text); cursor: pointer; }
    .list-search .btn-icon:hover { background: var(--surface); border-color: var(--primary); }
    header .btn-icon-dark {
      min-height: 40px;  /* P2 touch >= 44 - header compact */
      background: transparent;
      border: 1px solid var(--header-border);
      color: var(--side-text);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
      transition: border-color .12s, color .12s, background .12s;
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 32px;
      white-space: nowrap;  /* FIX(2026-08-09): nút không wrap chữ ("⟳ Làm mới" 2 dòng → header phình cao) */
    }
    header .btn-icon-dark:hover {
      border-color: var(--warning); color: var(--warning);
      background: rgba(227,116,0,.08);
    }
    /* m5 (audit 2026-08-11): icon header SVG đơn sắc currentColor (không emoji) — khớp sidebar */
    header .btn-icon-dark svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    header .btn-icon-dark .btn-refresh-label { margin-left: 6px; }
    header .brand img {
      height: 26px; width: auto; display: block;
      filter: brightness(0) invert(1);
    }
    header .btn-icon-dark.muted { color: #ef4444; border-color: #fecaca; }

    /* FIX(2026-08-09): header luôn 1 hàng (desktop >=601px) — trước đây wrap làm header cao hơn
       --header-h:59px (75px@1024, 129px@768, 170px@375) → doc cao hơn viewport → scroll dọc
       luôn bật + sidebar/view-topbar sticky bị ẩn sau header. */
    @media (min-width: 601px) {
      header { flex-wrap: nowrap; }
    }
    @media (min-width: 601px) and (max-width: 991px) {
      header #netText { display: none; }        /* tiết ngang — net-dot đã đủ */
    }

    /* ===== Heading + search bảng chung (2026-08-11): viewTasks (task-list-toolbar) · viewScan/viewStaff (att-toolbar) ===== */
    .task-list-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 10px; flex-wrap: wrap;
    }
    .section-heading {
      margin: 0; font-size: 16px; color: var(--amber-dark); font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
      display: flex; align-items: center; gap: 8px;
    }
    /* Search ép phải — kể cả khi wrap xuống dòng riêng trên màn hẹp (2026-08-11) */
    .task-list-toolbar .list-search,
    .att-toolbar .list-search { margin-left: auto; }
    .task-count-badge {
      font-family: Consolas, 'Courier New', monospace;
      font-size: 13px; font-weight: 600; color: var(--muted);
      background: #e9ecf2; padding: 2px 10px; border-radius: 20px; line-height: 1.5;
    }
    /* Cột Ca nhiều lựa chọn — giới hạn độ rộng, dấu "..." + tooltip (2026-08-10) */
    .td-slot { max-width: 150px; }
    .slot-ellipsis {
      display: inline-block; max-width: 150px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      vertical-align: bottom;
    }

    /* ===== Spin loading overlay (tham khảo v1) ===== */
    #loadingOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      /* Fix 2026-08-09: visibility dịch chuyển có độ trễ bằng đúng thời gian fade —
         ẩn ngay KHI fade xong (mẫu cổ điển tránh "bóng ma" overlay trên WebView cũ
         vẫn vẽ dải trắng mờ ở mép trên sau khi đã hide). */
      transition: opacity .4s ease, visibility 0s linear .4s;
    }
    #loadingOverlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #loadingOverlay .spin-big {
      width: 48px; height: 48px;
      border: 4px solid #e6eaf0; border-top-color: var(--warning);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    /* F6: modal spin cho nút chuyển trạng thái (spinner dùng chung loadingOverlay + spinModal) */
    .spin-big {
      width: 40px; height: 40px;
      border: 4px solid #e6eaf0; border-top-color: var(--warning);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }
    #loadingOverlay p { margin-top: 16px; color: var(--muted); font-size: 15px; font-weight: 500; }

    /* ===== Modal chung (2026-08-11): paste / create / confirm / spin — tái dùng overlay + dialog ===== */
    .about-overlay {
      position: fixed; inset: 0; z-index: 9998;
      background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .2s ease, visibility .2s;
    }
    .about-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; }
    .about-dialog {
      background: #fff; border-radius: 12px; padding: 24px;
      max-width: 400px; width: 90%;
      box-shadow: 0 12px 40px rgba(0,0,0,.14);
      transform: scale(.96); transition: transform .2s ease-out;
    }
    .about-overlay.open .about-dialog { transform: scale(1); }

    /* ===== Camera scan overlay (mobile) — fullscreen quét mã 1D ===== */
    .camera-overlay .about-dialog {
      max-width: 100%;
      width: 100%;
      height: 100%;
      border-radius: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      background: #000;
      transform: none;  /* fullscreen: không scale như modal nhỏ */
    }
    .camera-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 12px 16px; flex-shrink: 0;
      background: var(--header-bg); color: var(--header-text);
    }
    .camera-head h2 { font-size: 16px; font-weight: 700; margin: 0; }
    .camera-head .btn-icon-dark { border-color: var(--header-border); color: #7f8ea3; }
    .camera-head .btn-icon-dark:hover { border-color: var(--warning); color: var(--warning); }
    .camera-reader {
      flex: 1 1 auto; min-height: 0; position: relative;
      background: #000; overflow: hidden;
    }
    .camera-reader video, .camera-reader img { width: 100% !important; height: 100% !important; object-fit: cover; }
    #cameraReader { position: absolute; inset: 0; width: 100%; height: 100%; }
    .camera-reticle {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      border: 2px solid rgba(232, 93, 4, .55);
      box-shadow: inset 0 0 0 9999px rgba(0, 0, 0, .25);
    }
    .camera-reticle::after {
      content: ''; position: absolute; left: 6%; right: 6%; top: 50%; height: 3px;
      background: linear-gradient(90deg, transparent, var(--warning), transparent);
      box-shadow: 0 0 8px var(--warning);
      animation: camLaser 2s ease-in-out infinite;
    }
    @keyframes camLaser {
      0%, 100% { transform: translateY(-90px); opacity: .4; }
      50%      { transform: translateY(90px);  opacity: 1; }
    }
    .camera-hint {
      padding: 12px 16px; text-align: center; font-size: 14px; flex-shrink: 0;
      background: var(--card); border-top: 1px solid var(--border); color: var(--muted);
    }
    @media (prefers-reduced-motion: reduce) {
      .camera-reticle::after { animation: none; }
    }

    /* P2: tôn trọng prefers-reduced-motion — tắt animation khi user yêu cầu */
    @media (prefers-reduced-motion: reduce) {
      .scan-input-wrap:focus-within::after { animation: none; }
      .scan-input-wrap.queue-full::after { animation: none; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* High contrast (tham khảo v1): màn cũ/sáng gắt — đậm border, tương phản cao */
    @media (prefers-contrast: more) {
      :root {
        --border: #000;
        --text: #000;
        --muted: #333;
        --bg: #fff;
        --surface-muted: #eee;
      }
      .scan-card { border-width: 3px; }
      .scan-input-wrap input { border-width: 2px; border-color: #000; }
      header { border-bottom-width: 2px; }
      .badge { border: 1px solid currentColor; }
      /* S9: badge nền đặc thay nền nhạt — đọc rõ trên màn sáng/cũ */
      .badge.pending { background: #000; color: #fff; }
      .badge.present { background: var(--success); color: #fff; }
      .badge.absent  { background: var(--danger); color: #fff; }
      .badge.extra   { background: #b3530a; color: #fff; }  /* a11y (2026-08-12): #e37400 quá sáng — trắng 3.10:1 → #b3530a 5.05:1 */
      .badge.open    { background: var(--primary); color: #fff; }
      .badge.attend { background: var(--success-dark); color: #fff; }
      .badge.done    { background: #000; color: #fff; }
      .badge.badge-free      { background: #2a1f3d; color: #c9a2f2; }
      .badge.badge-reconcile { background: #1b2b4a; color: #8ab4f8; }
      .counter { border-width: 2px; }
    }

    /* ===== Skeleton loading (tham khảo v1) ===== */
    .skeleton-wrap { padding: 4px 0; }
    .skeleton-row {
      display: flex; padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    .skeleton-cell {
      flex: 1; height: 16px; margin-right: 14px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e6e6e6 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: skeleton-shimmer 1.5s infinite;
    }
    .skeleton-cell:last-child { margin-right: 0; }
    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ===== Thống kê (viewStats: stats-grid 2 cột Contract×Ca + Agency×Ca) + bảng StaffData (viewStaff) ===== */
    .stats-team-title {
      margin: 12px 0 6px; font-size: 14px; font-weight: 800; color: var(--primary);
      text-transform: uppercase; letter-spacing: .4px;
    }
    .stats-team-title:first-child { margin-top: 0; }
    .stats-table-wrap { overflow-x: auto; max-height: calc(100vh - 260px); overflow-y: auto; flex: 1 1 auto; min-height: 0; }
    .stats-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
      table-layout: fixed;  /* cột dữ liệu chia đều — Ca/Tổng width cố định (CDP: Ca 188 vs OS 72 lệch) */
    }
    .stats-table th, .stats-table td {
      padding: 5px 8px; border: 1px solid var(--border);
      text-align: center; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;  /* fixed layout: cell dài không tràn sang cell kế */
    }
    .stats-table th {
      background: var(--surface-muted); color: var(--muted);
      font-weight: 700; font-size: 12px; position: sticky; top: 0;
    }
    .stats-table th:first-child, .stats-table td.row-head { width: 110px; }
    /* Mobile cards (≤640px, 2026-08-13): danh sách task thành thẻ gọn 3 dòng, không tiêu đề ô, không gạch chân:
       dòng 1 = Mã task + Trạng thái + nút Quét/Xem · dòng 2 = Station · Team · Ca · dòng 3 = Tổng + Đã quét;
       ẩn Loại/Tạo lúc/Người tạo/Dư (chi tiết có ở màn quét) */
    @media (max-width: 640px) {
      #taskListTable thead { display: none; }
      #taskListTable tbody tr { display: grid; grid-template-columns: minmax(0, 1.2fr) 1fr 1fr; gap: 2px 8px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--card); }
      #taskListTable tbody td { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; padding: 2px 0; font-size: 13px; line-height: 1.35; }
      /* Bỏ tiêu đề ô trên thẻ (2026-08-13): chỉ còn dữ liệu — giữ nhãn ngắn 'Tổng'/'Đã quét' cho 2 số (số trần khó đoán) + dấu · ngăn cách giữa các mục */
      #taskListTable tbody td[data-label]::before { content: none; }
      #taskListTable tbody td[data-label="Tổng NV"]::before,
      #taskListTable tbody td[data-label="Đã quét"]::before { content: attr(data-label); font-weight: 600; color: var(--muted); font-size: 11px; margin-right: 4px; }
      /* FIX(2026-08-14): bỏ dấu · ngăn cách giữa các mục — grid gap 8px đã phân cách */
      /* Ẩn trên mobile: STT + Loại + Tạo lúc + Người tạo + Dư (xem nhanh không cần — chi tiết có ở màn quét) */
      #taskListTable tbody td[data-label="STT"],
      #taskListTable tbody td[data-label="Loại"],
      #taskListTable tbody td[data-label="Tạo lúc"],
      #taskListTable tbody td[data-label="Người tạo"],
      #taskListTable tbody td[data-label="Dư"] { display: none; }
      /* Danh sách task: dòng 1 Mã task + nút · dòng 2 Station/Team/Ca · dòng 3 Trạng thái + Tổng NV + Đã quét */
      #taskListTable tbody td[data-label="Mã task"] { grid-column: 1 / span 2; grid-row: 1; font-weight: 700; color: var(--primary-dark); }
      #taskListTable tbody td[data-label="Thao tác"] { display: none; }  /* FIX(2026-08-14): bỏ nút Xem/Quét mobile — dùng link ở Mã task */
      #taskListTable tbody td[data-label="Station"] { grid-column: 1; grid-row: 2; }
      #taskListTable tbody td[data-label="Team"] { grid-column: 2; grid-row: 2; }
      #taskListTable tbody td[data-label="Ca"] { grid-column: 3; grid-row: 2; }
      #taskListTable tbody td[data-label="Trạng thái"] { grid-column: 3; grid-row: 1; justify-self: end; }  /* FIX(2026-08-14): dời cột 3 (cột Thao tác đã ẩn) */
      #taskListTable tbody td[data-label="Tổng NV"] { grid-column: 1; grid-row: 3; }
      #taskListTable tbody td[data-label="Đã quét"] { grid-column: 2; grid-row: 3; }
      /* F-search: cột khác — Điểm danh thay chỗ Trạng thái (dòng 1 cạnh Mã task), Mã NV + Tên NV dòng 3 */
      #taskListTable tbody td[data-label="Mã NV"] { grid-column: 1; grid-row: 3; }
      #taskListTable tbody td[data-label="Tên NV"] { grid-column: 2 / span 2; grid-row: 3; }
      #taskListTable tbody td[data-label="Điểm danh"] { grid-column: 3; grid-row: 1; justify-self: end; }  /* FIX(2026-08-14): dời cột 3 (search mode — Thao tác ẩn) */
    }
    /* Mobile viewScan (≤640px, 2026-08-13): danh sách NV thành thẻ gọn 2 dòng — dòng 1 = Mã NV + Trạng thái, dòng 2 = Tên NV;
       chỉ giữ thông tin cần, ẩn STT/Agency/Station/Team/Ca/Ngày/Giờ có mặt/Giờ quét (chi tiết có ở màn quét desktop) */
    @media (max-width: 640px) {
      #scanTable thead { display: none; }
      #scanTable tbody tr { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 2px 8px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--card); }
      #scanTable tbody td { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; padding: 2px 0; font-size: 13px; line-height: 1.35; }
      #scanTable tbody td[data-label="STT"], #scanTable tbody td[data-label="Station"],
      #scanTable tbody td[data-label="Ngày"] { display: none; }
      /* FIX(2026-08-14): thẻ NV 3 hàng — dòng 1 Tên NV + Agency + Trạng thái · dòng 2 OpsID + Team + Ca · dòng 3 Giờ có mặt + Giờ quét */
      #scanTable tbody td[data-label="Tên NV"] { grid-column: 1 / span 2; grid-row: 1; font-weight: 700; color: var(--text); }
      #scanTable tbody td[data-label="Agency"] { grid-column: 3; grid-row: 1; }
      #scanTable tbody td[data-label="Trạng thái"] { grid-column: 4; grid-row: 1; justify-self: end; }
      #scanTable tbody td[data-label="Mã NV"] { grid-column: 1; grid-row: 2; font-weight: 600; color: var(--muted); }
      #scanTable tbody td[data-label="Team"] { grid-column: 2; grid-row: 2; }
      #scanTable tbody td[data-label="Ca"] { grid-column: 3 / span 2; grid-row: 2; }
      #scanTable tbody td[data-label="Giờ có mặt"] { grid-column: 1 / span 2; grid-row: 3; }
      #scanTable tbody td[data-label="Giờ quét"] { grid-column: 3 / span 2; grid-row: 3; }
      /* FIX(2026-08-14): nhãn đầy đủ hàng 2 + 3 trước thông tin — "OpsID: 12345" "Team: A" "Ca: 08:00-17:00" "Giờ có mặt: 19:10:13" "Giờ quét: 19:15:05" */
      #scanTable tbody td[data-label="Mã NV"]::before { content: 'OpsID: '; font-weight: 600; color: var(--muted); font-size: 11px; }
      #scanTable tbody td[data-label="Team"]::before { content: 'Team: '; font-weight: 600; color: var(--muted); font-size: 11px; }
      #scanTable tbody td[data-label="Ca"]::before { content: 'Ca: '; font-weight: 600; color: var(--muted); font-size: 11px; }
      #scanTable tbody td[data-label="Giờ có mặt"]::before,
      #scanTable tbody td[data-label="Giờ quét"]::before { content: attr(data-label) ': '; font-weight: 600; color: var(--muted); font-size: 11px; }
      #scanTable tbody tr.extra-row td { background: transparent; }  /* thẻ extra — nền theo tr đã đặt ở tr */
    }
    #btnScanListToggle { display: none; min-width: 36px; padding: 6px 10px; font-size: 14px; line-height: 1; margin-left: auto; }  /* desktop ẩn — chỉ mobile; FIX(2026-08-14): nút mũi tên tam giác ▼/▲ gọn ở góc phải card (margin-left:auto ép phải cả khi search ẩn) */
    /* FIX(2026-08-14): Mở rộng danh sách → ẩn cột quét (counters + ô nhập + nút Quét + scanCard) — danh sách NV đẩy lên full */
    body.scan-expanded .scan-col-left { display: none; }
    /* Mobile viewScan (≤700px): danh sách NV thu gọn mặc định — chỉ counters + ô quét + nút quét + scanCard; bấm Mở rộng mới hiện bảng + tìm/lọc (2026-08-13) */
    @media (max-width: 700px) {
      #btnScanListToggle { display: inline-flex; }
      #scanListCard .list-search, #scanListCard #scanStatusFilter, #scanListCard #scanClearFilter, #scanListCard .table-wrap { display: none; }
      #scanListCard.scan-list-open .list-search { display: flex; }
      #scanListCard.scan-list-open #scanStatusFilter { display: inline-block; }
      #scanListCard.scan-list-open #scanClearFilter { display: inline-block; }
      #scanListCard.scan-list-open .table-wrap { display: block; }
    }
    .stats-table th.total, .stats-table td.total { width: 70px; }
    .stats-table td.row-head {
      text-align: left; font-weight: 600; background: var(--surface-muted);
    }
    .stats-table td.total {
      background: #fff3e0; font-weight: 800; color: var(--amber-dark);
    }
    .stats-table tr:hover td { background: var(--row-hover); }
    .stats-table tr:hover td.row-head { background: var(--surface-muted); }

    /* Thống kê 2 cột: Contract × Ca (trái) + Agency × Ca (phải) — 2026-08-11 */
    .stats-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 10px; align-items: start; }
    .stats-team-block { min-width: 0; }
    /* Nhóm 'Khác' — dữ liệu ngoài Config gom cuối (policy 2026-08-12) */
    .stats-other-title { color: var(--muted); font-style: italic; }
    .stats-other-row td.row-head { color: var(--muted); font-style: italic; }
    .stats-other-th { color: var(--muted); font-style: italic; }
    .stats-col-title {
      font-size: 13px; font-weight: 800; color: var(--primary);
      text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px;
      padding: 8px 6px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface-muted);
    }
    /* Stats 2 cột cần đủ chỗ: dưới 1199px (tablet 768-1199) xếp 1 cột full-width —
       tại 1024px mỗi cột chỉ 358px, bảng Contract×Ca rộng bị ép scroll-x nhiều (CDP 2026-08-11).
       ≥1200px giữ 2 cột (desktop, mỗi cột ~470px đủ thoải). */
    @media (max-width: 1199px) {
      .stats-grid { grid-template-columns: 1fr; }
      /* PA1 (2026-08-12): màn nhỏ → bảng giãn theo nội dung (hết cắt cụt fixed-layout),
         wrap cuộn ngang + sticky cột nhãn trái. Desktop ≥1200 giữ nguyên fixed layout. */
      .stats-table { width: max-content; min-width: 100%; table-layout: auto; }
      .stats-table th, .stats-table td { overflow: visible; text-overflow: clip; }
      .stats-table th:first-child { left: 0; z-index: 4; box-shadow: 1px 0 0 var(--border); }
      .stats-table td:first-child { position: sticky; left: 0; z-index: 1; box-shadow: 1px 0 0 var(--border); }
    }

    /* Bảng danh sách StaffData — 20 cột, scroll ngang */
    #staffTable { font-size: 13px; border-collapse: separate; border-spacing: 0; }
    #staffTable th { white-space: nowrap; }
    #staffTable td { white-space: nowrap; }
    /* Cố định 4 cột đầu (No, Date, Staff ID, Staff Name) khi cuộn ngang */
    #staffTable thead th { position: sticky; top: 0; z-index: 2; }
    #taskListTable thead th { position: sticky; top: 0; z-index: 2; }  /* nền th chung var(--surface-muted) — đồng bộ staffTable/scanTable (2026-08-11) */
    #staffTable thead th:nth-child(-n+4) { position: sticky; top: 0; left: 0; z-index: 4; box-shadow: 1px 0 0 var(--border); }
    #staffTable tbody td:nth-child(-n+4) { position: sticky; left: 0; z-index: 1; background: var(--card); box-shadow: 1px 0 0 var(--border); }    /* ===== Báo cáo (viewReports) — chấm công tháng theo email đăng nhập (2026-08-16) ===== */
    /* Topbar meta: tên NV đậm màu primary + email muted — to rõ hơn task-meta mặc định */
    #reportsMeta { font-size: 15px; font-weight: 600; color: var(--primary-dark); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #reportsMeta .reports-user-email, #reportsMeta .reports-user-count { font-weight: 400; font-size: 13px; color: var(--muted); }

    #reportsTable { font-size: 13px; table-layout: fixed; }
    #reportsTable thead th { position: sticky; top: 0; z-index: 2; }
    /* Kích thước cột cố định — Tên NV + PMO nhận phần còn lại (wrap thay vì cắt) */
    #reportsTable th:nth-child(1) { width: 105px; }  /* Ngày */
    #reportsTable th:nth-child(2) { width: 105px; }  /* Mã Ops */
    #reportsTable th:nth-child(3) { width: 105px; }  /* Mã NV */
    #reportsTable th:nth-child(4) { width: 200px; }  /* Tên NV — cap, không giãn rỗng (1920: 406px → 200px); PMO nhận phần còn lại */
    #reportsTable th:nth-child(5) { width: 130px; }  /* Station */
    #reportsTable th:nth-child(6) { width: 110px; }  /* Kết quả */
    #reportsTable th:nth-child(7) { width: 85px; }   /* Giờ công */
    #reportsTable th:nth-child(8) { width: 85px; }   /* Giờ vào */
    #reportsTable th:nth-child(9) { width: 85px; }   /* Giờ ra */
    /* Cột giá trị ngắn — cân giữa (Station / Kết quả / Giờ công / Giờ vào / Giờ ra) */
    #reportsTable th:nth-child(5), #reportsTable th:nth-child(6), #reportsTable th:nth-child(7),
    #reportsTable th:nth-child(8), #reportsTable th:nth-child(9) { text-align: center; }
    #reportsTable td:nth-child(5), #reportsTable td:nth-child(6), #reportsTable td:nth-child(7),
    #reportsTable td:nth-child(8), #reportsTable td:nth-child(9) { text-align: center; }
    #reportsTable td:nth-child(4), #reportsTable td:nth-child(10) { white-space: normal; word-break: break-word; }  /* Tên NV + PMO wrap thay vì cắt */
    .reports-num { font-variant-numeric: tabular-nums; }
    .reports-off { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--surface-muted); color: var(--muted); font-size: 12px; font-weight: 700; white-space: nowrap; }
    /* Mobile ≤640px: bảng → card (mỗi dòng 1 thẻ), nhãn ::before từ data-label, bỏ Mã NV + PMO */
    @media (max-width: 640px) {
      #reportsTable thead { display: none; }
      #reportsTable tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 3px 12px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: var(--card); }
      #reportsTable tbody td { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border: 0; padding: 2px 0; white-space: normal; word-break: break-word; text-align: left; }
      #reportsTable tbody td::before { content: attr(data-label); color: var(--muted); font-size: 12px; flex-shrink: 0; }
      /* Bỏ Tên NV + Mã Ops (+ Mã NV, Station, Giờ công) — card 2 cột:
         cột 1 = Ngày/Giờ vào/Giờ ra (Giờ vào + Giờ ra CÙNG bên, xếp dọc), cột 2 = Kết quả;
         PMO riêng 1 hàng full-width cuối (PMO dài 2 dòng không đẩy Giờ vào/Giờ ra tách nhau). */
      #reportsTable tbody td:nth-child(2), #reportsTable tbody td:nth-child(3),
      #reportsTable tbody td:nth-child(4), #reportsTable tbody td:nth-child(5),
      #reportsTable tbody td:nth-child(7) { display: none; }
      #reportsTable tbody td:nth-child(1) { grid-column: 1; grid-row: 1; }  /* Ngày */
      #reportsTable tbody td:nth-child(6) { grid-column: 2; grid-row: 1; }  /* Kết quả */
      #reportsTable tbody td:nth-child(8) { grid-column: 1; grid-row: 2; }  /* Giờ vào — cột trái */
      #reportsTable tbody td:nth-child(9) { grid-column: 1; grid-row: 3; }  /* Giờ ra — CÙNG cột trái, ngay dưới Giờ vào */
      #reportsTable tbody td:nth-child(10) { grid-column: 1 / -1; grid-row: 4; align-items: flex-start; } /* PMO full-width — 2 dòng không phá layout */
      #reportsTable tbody tr:hover td { background: var(--card); }
    }
    #staffTable tbody tr:hover td:nth-child(-n+4) { background: var(--row-hover); }
    /* Filter phễu Excel viewStaff (2026-08-11): funnel icon header + dropdown checkbox */
    /* th-filter dùng chung staffTable + taskListTable (funnel phễu) */
    th.th-filter { position: relative; }
    .th-label { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; }  /* label trong header bảng th (2026-08-12) */
    .th-funnel {
      display: inline-flex; align-items: center; justify-content: center; vertical-align: middle;
      background: transparent; border: none; color: var(--muted); cursor: pointer;
      padding: 3px 4px; margin-left: 4px; border-radius: 5px; line-height: 1;
    }
    .th-funnel:hover { background: var(--surface-soft); color: var(--amber-dark); }
    .th-funnel.on { color: var(--amber); background: var(--card-extra-bg); }
    .staff-filter-panel {
      position: fixed; z-index: 70; min-width: 210px; max-width: 260px;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: 10px 12px;
    }
    .sfp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 13px; }
    .sfp-body { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .sfp-opt { display: flex; align-items: center; gap: 7px; font-size: 13px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
    .sfp-opt:hover { background: var(--surface-muted); }
    .sfp-opt input { accent-color: var(--amber); width: 15px; height: 15px; flex-shrink: 0; }
    .sfp-opt .sfp-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Option count=0 (khớp filter cột khác) → mờ — chọn sẽ ra bảng trống */
    .sfp-opt.zero { opacity: .45; }
    .sfp-opt .sfp-count { flex-shrink: 0; min-width: 20px; text-align: center; font-size: 11px; line-height: 1;
      color: var(--muted); background: var(--surface-muted); border-radius: 9px; padding: 3px 5px; }
    .sfp-empty { color: var(--muted); font-size: 12px; padding: 6px; }
    .sfp-foot { display: flex; gap: 8px; margin-top: 10px; }
    @media (max-width: 700px) { .staff-filter-panel { max-width: 85vw; } }
    /* Filter chips bảng Thống kê (Station + Ngày) */
    .stats-filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .stats-filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .stats-filter-row .flabel { font-size: 12px; font-weight: 700; color: var(--amber-dark); min-width: 56px; }
    .create-form .frow .flabel { min-width: 56px; }  /* đồng bộ cột label với stats-filters (2026-08-11) */
    .stats-filters .pick { font-size: 12px; }

    /* Màn hẹp: cột trái full-width, bảng thống kê cuộn theo chiều cao viewport */
    @media (max-width: 1199px) {
      .stats-table-wrap { max-height: 60vh; }
    }
    /* ===== SPX Điểm Danh — Sidebar điều hướng chính ===== */
    body { overflow-x: hidden; }
    .app-shell { display: flex; flex: 1 1 auto; min-height: 0; }
    #sidebar {
      flex: 0 0 240px; width: 240px;
      background: var(--header-bg);
      color: var(--header-text);
      border-right: 1px solid var(--header-border);
      display: flex; flex-direction: column;
      transition: flex-basis .2s ease, width .2s ease, transform .25s ease;
      overflow: hidden;
      /* Fix 2026-08-09: CỐ ĐỊNH sidebar không cuộn theo trang — sticky ngay dưới
         header + cao đúng viewport. Nav dài quá → tự cuộn trong (side-nav overflow-y). */
      position: sticky;
      top: var(--header-h);
      height: calc(100vh - var(--header-h));
      min-height: 0;
    }
    .side-nav { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
    .side-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; min-height: 40px; padding: 8px 12px;
      background: transparent; border: 0; border-radius: 8px;
      color: var(--side-text); font-size: 14px; font-weight: 600; text-align: left;
      cursor: pointer; white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .side-item:hover { background: rgba(255,255,255,.08); color: #fff; }
    .side-item.active { background: var(--amber); color: #fff; }
    .side-ico { font-size: 17px; line-height: 1; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; }
    .side-ico svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .side-lbl { overflow: hidden; text-overflow: ellipsis; }
    .side-foot { padding: 8px; border-top: 1px solid var(--header-border); }
    .side-compact {
      width: 100%; min-height: 36px;
      background: transparent; border: 1px solid var(--header-border); border-radius: 8px;
      color: var(--side-text-muted); font-size: 16px; font-weight: 600; cursor: pointer; line-height: 1;
      transition: background .15s;
    }
    .side-compact:hover { background: rgba(255,255,255,.08); color: #fff; }

    /* Collapsed: thu gọn về icon-only */
    body.side-collapsed #sidebar { flex-basis: 48px; width: 48px; }
    body.side-collapsed .side-lbl { display: none; }
    body.side-collapsed .side-item { justify-content: center; padding: 8px 0; }

    /* ===== Bottom nav — thay sidebar trái trên màn ≤700px (2026-08-11) ===== */
    .bottom-nav {
      display: none;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      height: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom));
      padding: 4px 6px env(safe-area-inset-bottom);
      box-sizing: border-box;
      background: var(--header-bg);
      border-top: 1px solid var(--header-border);
      box-shadow: 0 -2px 10px rgba(0,0,0,.22);
    }
    .nav-item {
      flex: 1 1 0; min-width: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px;
      background: transparent; border: 0; border-radius: 8px;
      color: var(--side-text-muted); font-size: 12px; font-weight: 600; line-height: 1.15;
      cursor: pointer; padding: 4px 2px;
      transition: color .15s, background .15s;
    }
    .nav-item svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
    .nav-item.active { color: var(--amber); }

    /* Mobile ≤700px: ẩn sidebar trái, hiện bottom nav (2026-08-11) */
    @media (max-width: 700px) {
      #sidebar { display: none; }
      .bottom-nav { display: flex; }
      main { padding-bottom: calc(var(--bottom-nav-h) + var(--space-3) + env(safe-area-inset-bottom)); }
      .home-hero { min-height: calc(100vh - var(--header-h) - var(--bottom-nav-h) - 24px); }
      /* Mobile: nút topbar gọn + title 1 dòng — tiết chiều dọc (scan topbar 151px quá cao, 2026-08-11) */
      .view-topbar { row-gap: 6px; }
      .view-topbar .btn { padding: 8px 14px; min-height: 40px; font-size: 13px; }  /* touch 40px (audit 375px: trước 29px) */
      .view-topbar .task-title { font-size: 16px; }
      #viewConfig .view-topbar-title { flex: 0 1 auto; min-width: 0; }  /* FIX(2026-08-16): title co lại — nhường chỗ cho nút dirty */
      #viewConfig .topbar-actions { flex-shrink: 1; flex-wrap: wrap; gap: 6px 6px; justify-content: flex-end; }  /* FIX(2026-08-16): 3 nút dirty = 349px > content 315px (390/375) → tràn ngang; wrap trong topbar, hết vỡ */
      #viewConfig .topbar-actions .btn { padding: 8px 8px; }  /* FIX(2026-08-16): co đệm — 3 nút vừa 1 hàng (309px < 315px) — topbar 2 hàng thay 3 */
      .view-topbar .task-meta { font-size: 11px; }
      /* viewScan: topbar + counters + input + bảng xếp chồng vượt viewport → cuộn TRONG section,
         topbar sticky giữ nút hành động luôn thấy (CDP: wrap 0-1px bị bóp — 2026-08-11) */
      #viewScan { overflow-y: auto; }
      #viewScan .scan-layout { flex: 1 1 auto; min-height: 0; }  /* FIX(2026-08-14): giãn đầy section — nội dung ngắn card vừa màn hình (trước trống 113px cuối section, audit gap 185); nội dung cao vẫn cuộn trong section + bảng cuộn trong wrap */
      .view-topbar { top: 0; }
      .scan-input-wrap input { font-size: 20px; padding: 10px 14px; }
      .scan-card { padding: 12px 16px; margin-top: 10px; }
      /* Chips (chọn Station/Ca/Team/Hình thức/Ngày — create modal + stats filter): touch ~36px thay 27px (2026-08-11) */
      .pick { padding: 8px 14px; font-size: 13px; min-height: 44px; display: inline-flex; align-items: center; }  /* U6: touch ≥44px (ngoài bảng) */
      /* Filter phễu mobile: option + funnel icon touch ≥33px (audit 375px — 2026-08-11) */
      .staff-filter-panel .sfp-opt { padding: 9px 8px; min-height: 44px; align-items: center; }  /* U6: touch ≥44px */
      .staff-filter-panel .sfp-opt input { width: 18px; height: 18px; }
      .th-funnel { padding: 12px 12px; margin-left: 2px; }  /* svg 11px + 24 padding = 35px touch */
      /* Touch nút nhỏ mobile (audit CDP 375px — 2026-08-11): btn-sm 27px · btn-icon 27px · pag-btn 26px → min-height chốt 36px */
      .btn-sm { padding: 8px 14px; min-height: 36px; font-size: 13px; }

      header .btn-icon-dark { min-height: 36px; padding: 6px 10px; font-size: 13px; }
    }
    /* Main: nhường chỗ khi mở sidebar; tự tràn khi ẩn/thu gọn */

    #viewStats .card { display: flex; flex-direction: column; max-height: calc(100vh - var(--header-h) - 120px); min-height: 0; }  /* -120: trừ cả topbar + main padding để trang không cuộn khi wrap max */
    #viewStats .stats-table-wrap { max-height: none; }  /* tablet: wrap giãn đầy card (trước bị chặn 60vh → cuộn nhiều + trống dưới card, CDP 1024: card 594 wrap 460 nội dung 613) */
    #viewConfig .card { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }  /* P2 (2026-08-16 v2): bỏ cuộn card — scroll chuyển xuống cfg-list-wrap; toolbar đứng ngoài nên luôn thấy (giống Task/Staff). overflow:hidden không chặn cuộn con (FIX 2026-08-14: card overflow:hidden làm scroll container chết — vì KHÔNG có container con overflow:auto; giờ có cfg-list-wrap) */
    #viewConfig #roleWrap { display: block; }  /* 2026-08-14: sections xếp dọc — tự cao, card cuộn */
    /* P2 (2026-08-16 v2): "CẤU HÌNH VẬN HÀNH" + ô tìm kiếm CỐ ĐỊNH = đứng NGOÀI vùng cuộn (cfg-list-wrap) —

    #configWrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
