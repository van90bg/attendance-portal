<style>
    :root {
      color-scheme: light;  /* thay cho <meta color-scheme> — GAS addMetaTag không cho phép tag này; CSS tương đương meta */
      --primary: #0b57d0;
      --primary-dark: #0a4ab8;
      --danger: #d93025;
      --warning: #e37400;
      --success: #188038;
      --bg: #f5f6f8;
      --card: #ffffff;
      --card-radius: 12px;   /* surface chung: card + view-topbar — 1 nguồn bo góc */
      --card-ok-bg: #e6f4ea;
      --card-err-bg: #fce8e6;
      --card-extra-bg: #fef7e0;
      --header-h: 59px;  /* chiều cao header 1 hàng (padding 10×2 + nội dung ~39) — 1 nguồn cho topbar sticky + #viewTasks height.
                           FIX(2026-08-09): JS syncHeaderH() đo header THẬT (DOMContentLoaded/load/resize/meta-load) và ghi đè token —
                           header wrap (font/zoom/màn hẹp) làm token tĩnh lệch → doc cao hơn viewport → scroll dọc luôn bật. */
      --border: #d9dce1;
      --text: #1f1f1f;
      --muted: #5f6368;
      --bottom-nav-h: 60px;        /* bottom nav mobile — 1 nguồn cho height + main padding (2026-08-11) */
      /* Design tokens (doc #2: token-driven — không magic numbers) */
      --amber: #e85d04;            /* accent v1 — header/toolbar/focus */
      --header-bg: #0d111a;        /* header command center v1 */
      --header-text: #f4f7fb;
      --header-border: #3a4a66;
      --surface-muted: #f1f3f4;    /* badge pending, counter lbl, th */
      --focus-ring: rgba(232, 93, 4, .45);
      --accent: var(--amber);          /* accent chung — dùng amber làm chuẩn */
      --surface: #f5f6f8;              /* surface hover nhẹ (list-search .btn-icon:hover) — khớp --bg */
      /* Màu bổ sung (token hóa 2026-08-11 — màu dùng >=2 chỗ) */
      --row-hover: #f8faff;            /* hover hàng bảng (task/stats/staff) */
      --primary-bg: #e8f0fe;           /* badge.open / badge-reconcile */
      --surface-soft: #f0f1f3;          /* btn-ghost hover / badge.done — họ surface */
      --amber-dark: #9a4d00;           /* text amber đậm trên nền trắng — AA 6.1:1 (flabel) */
      --side-text: #c3cddb;            /* text sidebar dark (side-item) */
      --side-text-muted: #b6c2d4;      /* text phụ dark-surface — dùng chung header #netText + sidebar */
      --success-dark: #1e7e34;         /* text/bg xanh đậm (badge.attend) */
      /* Spacing 4pt grid (S1) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      /* Type scale 8-tier (kiosk readability — tham khảo v1 styles.html) */
      --text-xs: .65rem;
      --text-sm: .72rem;
      --text-base: .82rem;
      --text-md: .92rem;
      --text-lg: 1rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --text-3xl: 2rem;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      height: 100vh; height: 100dvh; overflow: hidden;  /* khóa 1 màn hình: nội dung dài cuộn TRONG card, trang không cuộn (2026-08-11) */
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 20px; font-weight: 600; }
    .header-user {
      color: var(--header-text, #e2e8f0);
      font-size: 13px; font-weight: 600;
      padding: 2px 8px; border-radius: 999px;
      background: rgba(255,255,255,.08);
      max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    @media (max-width: 700px) { .header-user { display: none; } }  /* FIX(2026-08-09): 599→700 — giữ header 1 hàng khi hẹp (tránh tràn header) */
    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      transition: background .15s;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    .btn-outline:hover { background: #eaf1fe; }
    .btn-danger {
          background: var(--danger);
        }
        .btn-danger:hover { background: #b3261e; }
        .btn-amber {
          background: var(--amber);
          color: #fff;
        }
        .btn-amber:hover { background: #d45504; }
        .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface-soft); }
    .btn-sm { padding: 6px 12px; font-size: 13px; }  /* nút nhỏ trong bảng — hết inline style */
    td.stt { width: 40px; text-align: center; color: var(--muted); font-size: 13px; }  /* STT hẹp, không đẩy widths */

    main {
      max-width: 1920px; margin: 0 auto; padding: var(--space-4);
      flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    }  /* wide-screen: tận dụng màn lớn cho nhiều cột */
    /* View active giãn full chiều cao — card chạm đáy viewport (2026-08-11) */
    main > section { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
    main > section > .card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: var(--space-3);
      margin-bottom: var(--space-3);
    }

    /* ===== Layout 2 cột cho Scan view (tham khảo v1) ===== */
    .view-topbar {
      position: sticky;
      top: var(--header-h); /* ngay dưới header command center */
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      /* Giống v1: topbar là card nổi (surface + border + radius + shadow) — không "treo lơ lửng" */
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 6px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      transition: box-shadow .15s, border-color .15s;
    }
    /* Khi dính (stuck) — đổ bóng đậm hơn tách khỏi nội dung cuộn */
    .view-topbar.stuck {
      border-color: var(--border);
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
    }
    .view-topbar-title { flex: 1; text-align: left; }

    /* Toolbar chung các view (2026-08-11): List/Scan/Stats/Staff/Config — 1 class dùng chung */
    .scan-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      flex: 1 1 auto;
      min-height: 0;  /* card bảng scan giãn chạm đáy viewport (2026-08-11) */
    }
    .scan-col-left {
      flex: 0 0 480px;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .scan-col-right {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;  /* column-mode (≤991px): co được để card bảng cuộn trong — trước tràn bị clip (2026-08-11) */
      align-self: stretch;  /* giãn full chiều cao scan-layout — card bảng chạm đáy */
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .scan-col-left .card,
    .scan-col-right .card { margin-bottom: 0; }
    .scan-col-right .card {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
    }
    .scan-col-right .card .table-wrap {
      flex: 1 1 auto;
      overflow: auto;
      min-height: 0;
    }
    @media (max-width: 991px) {
      .scan-layout { flex-direction: column; }
      .scan-col-left { flex: none; max-width: none; }
    }
    /* P2 (header responsive): màn hẹp — topbar thoát sticky (bỏ hardcode 53px vốn
       giả định header cao cố định; khi header wrap cao hơn dễ đè). Ẩn logo ngoại
       (URL external) + netText — tiết cứng header 1 dòng, tránh layout shift/tràn. */
    @media (max-width: 600px) {
      header { padding: 8px 12px; flex-wrap: wrap; row-gap: 6px; }
      header .brand img { display: none; }  /* logo external — ẩn trên màn nhỏ, tránh load/tràn */
      header #netText { display: none; }    /* giữ net-dot, ẩn chữ — tiết chiều ngang */
      header .brand .title { font-size: 15px; letter-spacing: .5px; }
      header .btn-icon-dark { padding: 4px 9px; min-height: 28px; font-size: 13px; }
      .view-topbar { top: 0; }  /* bỏ sticky theo header — tránh đè khi header wrap */
      .card { padding: 10px; }  /* trên màn hẹp tiết diện — vẫn giữ var(--card-radius) */
    }

    /* ===== Form controls chung (2026-08-11): modal tạo task / paste + form Cấu hình ===== */
    /* 2026-08-09: BỎ giãn full card DANH SÁCH TASK (commit 31e49b3) — card tự cao theo nội dung,
       hết khoảng trắng 600px khi ít task. Nhiều task → table-wrap scroll trong (max-height viewport). */
    label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
    }
    select:focus, input[type="text"]:focus { outline: 2px solid var(--focus-ring); border-color: var(--warning); }
    /* S7: skip link — chỉ hiện khi focus (a11y keyboard) */
    .skip-link {
      position: absolute; left: -9999px; top: 0; z-index: 10000;
      background: var(--header-bg); color: #fff; padding: 10px 16px;
      border-radius: 0 0 8px 0; font-size: 14px; font-weight: 600;
    }
    .skip-link:focus { left: 0; }

    /* A11y: focus-visible ring rõ — không chỉ dựa vào hover */
    .btn:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* ===== Modal tạo task: dropdown thay cây checkbox (sketch 005e) ===== */
    /* Mô tả mode đang chọn — FREE giải thích khi chọn Ca = Tự do */
    .mode-desc { font-size: 12px; color: var(--muted); margin: 8px 2px 0; line-height: 1.45; }
    .mode-desc b { color: var(--text); }
    /* Audit UI (contrast): chữ amber 12px trên nền trắng ~3.5:1 fail AA — amber đậm #9a4d00 = 6.1:1 */
    /* Footer gộp preview + nút hành động (sketch A1: feedback ngay nơi bấm, tiết chiều cao modal) */
    #createModal .create-footer {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
    }
    #createModal .create-actions { display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; }
    .create-total { font-size: 13px; color: var(--muted); }
    .create-total b { color: var(--warning); font-weight: 700; }

    /* v1: badge count nhẹ — nền xám nhạt, bo tròn, chữ muted (không lấn át) */
    /* ===== Commit 2026-08-08: modal tạo task gọn — dropdown thay 5 cây checkbox ===== */
        .create-form { display: grid; gap: 10px; margin-top: 10px; }
        .create-form .frow { display: grid; grid-template-columns: 80px 1fr; align-items: center; gap: 8px; }
        .create-form .chips.disabled { opacity: .45; pointer-events: none; }
        .create-form .frow .flabel { font-size: 12px; font-weight: 700; color: var(--amber-dark); }
    .create-form .frow .fnote { display: block; font-size: 11px; color: var(--muted); font-weight: 400; line-height: 1.3; }
    select.field-select {
      width: 100%; padding: 8px 30px 8px 10px; border: 1px solid var(--border, #e2e5ea); border-radius: 8px;
      background: #fff; font-size: 13px; appearance: none; cursor: pointer; color: #1a1a1a;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%236b655c' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
      background-repeat: no-repeat; background-position: right 10px center;
    }
    select.field-select:focus { outline: 2px solid var(--amber, #e85d04); outline-offset: -1px; }
    select.field-select:disabled { background-color: #f4f2ee; color: #b0a99e; cursor: not-allowed; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .pick {
      border: 1px solid var(--border, #e2e5ea); background: #fff; color: #3a3a3a;
      border-radius: 999px; font-size: 12px; padding: 4px 10px; cursor: pointer; font-weight: 500;
      line-height: 1.4; transition: background .12s, border-color .12s, color .12s;
    }
    .pick:hover { background: #faf8f4; }
    .pick.on { background: #fff3e6; border-color: #f0c79e; color: #8a3d02; font-weight: 700; }
    .pick.free.on { background: #e8f6ec; border-color: #b3d9bc; color: #1f7a3d; }
    .pick:focus-visible { outline: 2px solid var(--amber, #e85d04); outline-offset: 1px; }
    /* Kích thước modal + header amber (v1) */
    /* Audit UI (2026-08-07): modal cao ~850px (3 hàng filter) từng bị CẮT nút Tạo task trên
       màn <900px — overlay không cuộn + dialog không max-height. Fix: dialog scroll trong +
       margin:auto (căn giữa khi vừa, không kẹt top khi cao) + overlay cuộn dự phòng. */
    #createModal.about-overlay { overflow-y: auto; scrollbar-gutter: stable; }
    #createModal .about-dialog {
      width: 480px; max-width: 480px;
      overflow: visible;   /* F: menu dropdown không bị cắt bởi scroll container của dialog */
      margin: auto;
      padding: 18px 20px;
      border: 1px solid var(--border, #e2e5ea);  /* D: đồng viền với card */
    }
    #createModal .about-dialog h2#createModalTitle {
      font-size: 16px; font-weight: 700; color: var(--text, #1f1f1f);
      padding-bottom: 10px; margin-bottom: 12px;
      border-bottom: 2px solid var(--amber);
      display: flex; align-items: center; gap: 8px;
    }
    /* animation scale-in (v1) */
    #createModal.about-overlay .about-dialog { transform: scale(.95); transition: transform .2s ease-out; }
    #createModal.about-overlay.open .about-dialog { transform: scale(1); }
    /* touch target 44px (v1) */
    /* Touch target modal chung (2026-08-11): paste/create/confirm — 44px kiosk, font 14px gọn */
    .about-dialog .btn { min-height: 44px; font-size: 14px; font-weight: 600; }
    @media (max-width: 719px) {
      #createModal .about-dialog {
        width: 100vw; max-width: 100vw;
        height: 100vh; max-height: 100vh;
        border-radius: 0;
        overflow: auto;
        padding: 12px;
      }
    }

    /* ===== Bộ đếm — 3 khối luôn cùng 1 hàng (kiosk nhìn nhanh) ===== */
    .counters { display: flex; gap: 10px; }
    /* P1-2 fix: dùng transform translateX (GPU-accelerated) thay vì left (layout thrash). */
    @keyframes pasteSlide {
      0% { transform: translateX(-250%); }
      100% { transform: translateX(250%); }
    }
    .counter {
      flex: 1;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px 12px;
      text-align: center;
    }
    .counter .num {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .counter .lbl {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      background: var(--surface-muted);
      padding: 2px 10px;
      border-radius: 10px;
      margin-top: 6px;
    }
    .counter.scanned .num { color: var(--success); }
    .counter.absent .num { color: var(--danger); }   /* DONE: Vắng (đỏ) */
    .counter.waiting .num { color: var(--primary); } /* Mở: Chờ có mặt (xanh) */
    .counter.extra .num { color: var(--warning); }

    /* ===== Toolbar bảng NV chung (2026-08-11): viewScan + viewStaff ===== */
    .att-toolbar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      background: var(--surface-muted); flex-shrink: 0;
      border-radius: 12px 12px 0 0;
    }
    .att-toolbar select { flex: 0 0 auto; width: auto; max-width: 190px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #fff; color: var(--text); }

    /* ===== C4: form trang Cấu hình (Config Admin) ===== */
    .topbar-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }  /* nhóm nút topbar viewConfig (Làm mới + Lưu phân quyền) */
    .cfg-cols { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 14px; }  /* Mẫu B (2026-08-11): 2 card cạnh nhau, giãn đầy section (audit-ui: card chạm đáy) */
    #viewConfig .cfg-cols { flex: 1 1 auto; min-height: 0; }  /* card chạm đáy như mọi view — nội dung cuộn trong từng card */
    .cfg-card { padding: 16px; }
    .cfg-section-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: var(--primary); }
    .cfg-hint { font-weight: 400; font-size: 12px; color: var(--muted); }
    .cfg-input { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #fff; color: var(--text); }
    .cfg-role-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .cfg-role-email { flex: 1 1 280px; min-width: 0; }
    .cfg-role-select { flex: 0 0 auto; width: auto; max-width: 220px; }  /* desktop giữ 220px; mobile co lại (media dưới) */
    /* viewConfig: danh sách mục vận hành + nút Sửa/Xoá (2026-08-11) */
    .cfg-list { display: flex; flex-direction: column; gap: 8px; }
    .cfg-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-muted); }
    .cfg-item-label { flex: 0 0 190px; font-size: 13px; font-weight: 600; color: var(--text); }
    .cfg-item-value { flex: 1 1 auto; font-size: 14px; color: var(--primary-dark); word-break: break-word; }
    .cfg-empty-val { color: var(--muted); font-style: italic; }
    .cfg-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .cfg-item-edit { background: var(--card); }
    .cfg-edit-input { flex: 1 1 auto; }
    .cfg-status { font-size: 13px; color: var(--muted); }
    .btn-clear-filter {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer;
      min-height: 44px; line-height: 1;
    }
    .btn-clear-filter:hover { border-color: var(--danger); color: var(--danger); background: var(--card-err-bg); }
    /* C3: header bảng scan sortable */
    #scanTable th.sortable {
      cursor: pointer; user-select: none; white-space: nowrap;
    }
    #scanTable th.sortable:hover { background: #e3e6ea; }
    #scanTable th.sortable.sort-asc::after { content: ' \25B2'; font-size: 10px; color: var(--warning); }
    #scanTable th.sortable.sort-desc::after { content: ' \25BC'; font-size: 10px; color: var(--warning); }

    /* ===== Bảng ===== */
    .table-wrap {
      overflow: auto;
      flex: 1 1 auto;
      min-height: 0;  /* cuộn trong theo card giãn đáy — thead sticky giữ header */
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: var(--surface-muted); color: var(--muted); font-weight: 600; font-size: 13px; position: sticky; top: 0; }
    tr:hover td { background: var(--row-hover); }
    /* C4: dòng NV Dư — nền cam nhạt nổi bật giữa bảng */
    #scanTable tr.extra-row td { background: var(--card-extra-bg); }
    #scanTable tr.extra-row:hover td { background: #fdf0cd; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge.pending { background: var(--surface-muted); color: var(--muted); }
    .badge.present { background: var(--card-ok-bg); color: #137333; }
    .badge.absent  { background: var(--card-err-bg); color: var(--danger); }
    .badge.extra   { background: var(--card-extra-bg); color: #b45309; }
    .badge.open    { background: var(--primary-bg); color: var(--primary); }
    .badge.attend { background: var(--card-ok-bg); color: var(--success-dark); }
    .badge.done    { background: var(--surface-soft); color: var(--muted); }
    .badge.badge-free      { background: #f3e8fd; color: #7c3aed; }
    .badge.badge-reconcile { background: var(--primary-bg); color: var(--primary); }

    /* ===== Scan input ===== */
    .scan-row { display: flex; gap: 10px; }
    .scan-input-wrap { flex: 1; position: relative; overflow: hidden; padding: 4px; border-radius: 8px; }
    .scan-input-wrap input {
      font-size: 28px;
      letter-spacing: 1px;
      padding: 16px 18px;
      font-weight: 700;
      text-align: center;
    }
    /* Tia quét laser chạy ngang ô nhập khi focus (kiosk feel) — mờ nhẹ, không lấn input */
    .scan-input-wrap::after {
      content: '';
      position: absolute;
      /* Tránh tràn/vỡ khung: wrap có padding 4px → khóa gradient bên TRONG ô nhập
         (bù 4px 2 bên), không phủ ra vùng padding ngoài khung viền. */
      top: 4px; bottom: 4px; height: auto;
      left: -40%;
      width: 30%;
      background: linear-gradient(90deg, transparent, rgba(232, 93, 4, .08), transparent);
      pointer-events: none;
      opacity: 0;
    }
    .scan-input-wrap:focus-within::after { animation: scanLine 1.8s ease-in-out infinite; }
    .scan-input-wrap input::placeholder {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0;
      color: #8a93a6;
      opacity: 1;
    }
    .scan-input-wrap input:focus {
      outline: none;
      border-color: var(--warning);
      box-shadow: 0 0 0 4px rgba(232, 93, 4, .18);
    }
    /* Nút Quét chỉ hiển thị trên mobile (<992px); desktop máy quét tự Enter */
    #btnScan { min-width: 64px; min-height: 44px; } /* touch target ≥44×44 */
    @media (min-width: 992px) {
      #btnScan { display: none; }
    }
    /* Kiosk wide-screen: lớn hơn cho màn hình touch rộng (tham khảo v1 type scale) */
    @media (min-width: 1280px) {
      .scan-input-wrap input { font-size: 34px; padding: 18px 20px; letter-spacing: 2px; }
      .scan-input-wrap input::placeholder { font-size: 17px; }
      .counter .num { font-size: 44px; }
      .scan-card .sc-name { font-size: 34px; }
      .task-title { font-size: 17px; }
      th, td { font-size: 15px; }
    }
    .scan-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

    /* ===== Scan card projector — kết quả to nhìn từ 1–2m ===== */
    .scan-card {
      border-radius: var(--card-radius);
      padding: 16px 20px;
      margin-top: 14px;
      border: 2px solid var(--border);
      background: var(--card);
      text-align: left;
      transition: border-color .15s, background .15s;
      min-height: 80px;
    }
    .scan-card.ok { border-color: var(--success); background: var(--card-ok-bg); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card.err { border-color: var(--danger); background: var(--card-err-bg); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card.extra { border-color: var(--warning); background: var(--card-extra-bg); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card.warn { border-color: var(--warning); background: var(--card-extra-bg); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card .sc-status {
      font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
    }
    .scan-card.ok .sc-status { color: var(--success); }
    .scan-card.err .sc-status { color: var(--danger); }
    .scan-card.extra .sc-status { color: var(--warning); }
    .scan-card.warn .sc-status { color: var(--warning); }
    /* FREE phase1: NV mới quét lần 1 = 'Chưa điểm danh' (chưa phải lỗi/cảnh báo) → xanh dương. */
    .scan-card.pending .sc-status { color: var(--primary); }
    .scan-card.pending { border-color: var(--primary); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
    .scan-card .sc-name { font-size: 30px; font-weight: 800; line-height: 1.25; margin-top: 2px; }
    .scan-card .sc-meta { font-size: 14px; color: var(--muted); margin-top: 4px; }
    .scan-card .sc-empty { color: var(--muted); font-size: 14px; }

    /* ===== Toast ===== */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #202124;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 10000; /* P1-4: trên modal overlay (9998) + spinModal (9999) */
      max-width: 90vw;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.ok { background: var(--success); }
    #toast.err { background: var(--danger); }
    #toast.warn { background: var(--warning, #e85d04); }
    #toast .toast-text { display: inline-block; }
    #toast .toast-close {
      background: transparent; border: none; color: #fff; opacity: .8;
      font-size: 14px; line-height: 1; padding: 2px 4px 2px 10px;
      cursor: pointer; vertical-align: middle;
    }
    #toast .toast-close:hover { opacity: 1; }

    .empty { text-align: center; color: var(--muted); padding: 32px 16px; font-size: 15px; }
        .empty .empty-arrow {
          font-size: 22px; font-weight: 700; color: var(--amber);
          animation: empty-bounce 1.4s ease-in-out infinite; margin-bottom: 6px;
        }
        @keyframes empty-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
        /* ===== Pagination (tham khảo v1 scan.html — 50 dòng/trang) ===== */
        .pag-wrap { padding: 8px 2px 2px; }
        .pag-bar {
          display: flex; align-items: center; justify-content: space-between; gap: 8px;
          font-size: 13px; color: var(--muted);
        }
        .pag-info { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .pag-buttons { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
        .pag-btn {
          background: var(--card); border: 1px solid var(--border); border-radius: 6px;
          color: var(--text); padding: 3px 9px; font-size: 13px; font-weight: 600;
          cursor: pointer; min-width: 28px; text-align: center; line-height: 1.6;
          transition: border-color .15s, background .15s, color .15s;
        }
        .pag-btn:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); background: var(--surface-muted); }
        .pag-btn:disabled { opacity: .35; cursor: default; }
        .pag-btn.active { background: var(--amber); border-color: var(--amber); color: #fff; font-weight: 700; }
        .pag-ellipsis { padding: 3px 4px; color: var(--muted); letter-spacing: 1px; }
    .muted { color: var(--muted); font-size: 13px; }
    .task-title { font-size: 16px; font-weight: 700; margin-bottom: 2px; text-transform: uppercase; color: var(--warning); }
    .task-meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    /* FIX(2026-08-09): .hidden dùng !important — phải thắng mọi rule hiển thị khác,
       nếu không section không bao giờ ẩn (chồng view). */
    .hidden { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Visual polish (tham khảo v1 styles.html) ===== */
    /* Scan-line shimmer — tia quét laser trên ô nhập khi focus */
    @keyframes scanLine {
      0% { transform: translateX(-40%); opacity: 0; }
      10% { opacity: 1; }
      60% { opacity: 1; }
      100% { transform: translateX(500%); opacity: 0; }
    }
    /* Stamp effect — scan card "đóng dấu" như thẻ chấm công */
    @keyframes stampIn {
      0%   { transform: scale(.55); opacity: 0; }
      40%  { transform: scale(1.12); opacity: 1; }
      60%  { transform: scale(.90); }
      75%  { transform: scale(1.06); }
      90%  { transform: scale(.97); }
      100% { transform: scale(1); opacity: 1; }
    }
    /* I8: queue đầy — viền đỏ nhấp nháy, báo user ngừng quét tạm thời */
    .scan-input-wrap.queue-full { border-color: var(--danger); }
    /* P1-1 fix: pulse hiện rõ trên nền sáng — đổi box-shadow input + opacity.
       Trước đây ::after box-shadow .10 mờ gần như vô hình trên nền trắng. */
    .scan-input-wrap.queue-full input { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(217, 48, 37, .18); }
    .scan-input-wrap.queue-full::after { animation: queueFullPulse 1.2s ease-in-out infinite; }
    @keyframes queueFullPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217, 48, 37, .45); opacity: 1; }
      50% { box-shadow: 0 0 0 8px rgba(217, 48, 37, .18); opacity: .6; }
    }

    /* ===== Header command center (tham khảo v1) ===== */
    header {
      background: var(--header-bg);
      color: var(--header-text);
      border-bottom: 1px solid var(--header-border);
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header .brand {
      display: flex; align-items: center; gap: 10px;
    }
    header .brand .title {
      font-size: 18px; font-weight: 800; letter-spacing: 1px;
      color: var(--header-text); text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0,0,0,.35);
      white-space: nowrap;  /* FIX(2026-08-09): title không wrap thành 2 dòng khi header hẹp */
    }
    /* v1: ĐIỂM DANH nổi bật amber — brand signal */
    header .brand .title .brand-accent { color: var(--amber); font-weight: 800; }
    header .header-right {
      display: flex; align-items: center; gap: 10px;
    }
    header .net-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); box-shadow: 0 0 4px var(--success);
    }
    header .net-dot.offline { background: var(--danger); box-shadow: 0 0 4px var(--danger); }
    header #netText { color: var(--side-text-muted); font-size: 12px; font-weight: 600; }

    /* ===== Background task indicator (header) ===== */
    /* Bổ sung (2026-08-09): spinner + count khi có tác vụ nền đang chạy (scan queue /
       RPC pending / silent reload). Nhắc kiosk không thoát giữa chừng; thay vì màn "yên lặng" khi queue còn. */
    .bg-task-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(232, 93, 4, .12);
      border: 1px solid rgba(232, 93, 4, .35);
      color: var(--amber);
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }
    .bg-task-indicator .bg-spinner {
      width: 10px;
      height: 10px;
      border: 2px solid rgba(232, 93, 4, .25);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      box-sizing: border-box;
    }
    .bg-task-indicator .bg-task-count {
      font-variant-numeric: tabular-nums;
      min-width: 10px;
      text-align: center;
    }
    @media (max-width: 600px) {
      /* màn hẹp: chỉ spinner, ẩn số — header đã tải rồi */
      .bg-task-indicator .bg-task-count { display: none; }
      .bg-task-indicator { padding: 2px 7px; }
    }
    /* Ô tìm kiếm chung (2026-08-11): task list toolbar (viewTasks) + staff toolbar (viewStaff) */
    .list-search {
      display: flex; align-items: center; gap: 4px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 6px;
      max-width: 320px; flex: 0 1 320px;  /* flex inline cạnh heading — không wrap dòng riêng */
    }
    .list-search input[type=search] {
      border: none; outline: none;
      background: transparent; color: var(--text); font-size: 14px;
      width: 100%; min-width: 140px; padding: 6px 4px;
    }
    /* Ẩn nút ✕ native của WebKit/Blink — tránh 2 nút xoá trong ô tìm kiếm (dùng #btnListSearchClear). */
    .list-search input[type=search]::-webkit-search-cancel-button,
    .list-search input[type=search]::-webkit-search-decoration {
      -webkit-appearance: none; appearance: none; display: none;
    }
    .list-search input[type=search]::-ms-clear { display: none; }  /* IE/Edge legacy */
    .list-search input[type=search]::placeholder { color: var(--muted); }
    .list-search .btn-icon { padding: 4px 8px; background: var(--surface-muted); border: 1px solid var(--border); border-radius: 6px; color: var(--text); cursor: pointer; }
    .list-search .btn-icon:hover { background: var(--surface); border-color: var(--primary); }
    header .btn-icon-dark {
      min-height: 40px;  /* P2 touch >= 44 - header compact */
      background: transparent;
      border: 1px solid var(--header-border);
      color: var(--side-text);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
      transition: border-color .12s, color .12s, background .12s;
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 32px;
      white-space: nowrap;  /* FIX(2026-08-09): nút không wrap chữ ("⟳ Làm mới" 2 dòng → header phình cao) */
    }
    header .btn-icon-dark:hover {
      border-color: var(--warning); color: var(--warning);
      background: rgba(227,116,0,.08);
    }
    header .brand img {
      height: 26px; width: auto; display: block;
      filter: brightness(0) invert(1);
    }
    header .btn-icon-dark.muted { color: #ef4444; border-color: #fecaca; }

    /* FIX(2026-08-09): header luôn 1 hàng (desktop >=601px) — trước đây wrap làm header cao hơn
       --header-h:59px (75px@1024, 129px@768, 170px@375) → doc cao hơn viewport → scroll dọc
       luôn bật + sidebar/view-topbar sticky bị ẩn sau header. */
    @media (min-width: 601px) {
      header { flex-wrap: nowrap; }
    }
    @media (min-width: 601px) and (max-width: 991px) {
      header #netText { display: none; }        /* tiết ngang — net-dot đã đủ */
    }

    /* ===== Heading + search bảng chung (2026-08-11): viewTasks (task-list-toolbar) · viewScan/viewStaff (att-toolbar) ===== */
    .task-list-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 10px; flex-wrap: wrap;
    }
    .section-heading {
      margin: 0; font-size: 16px; color: var(--warning); font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
      display: flex; align-items: center; gap: 8px;
    }
    /* Search ép phải — kể cả khi wrap xuống dòng riêng trên màn hẹp (2026-08-11) */
    .task-list-toolbar .list-search,
    .att-toolbar .list-search { margin-left: auto; }
    .task-count-badge {
      font-family: Consolas, 'Courier New', monospace;
      font-size: 13px; font-weight: 600; color: var(--muted);
      background: #e9ecf2; padding: 2px 10px; border-radius: 20px; line-height: 1.5;
    }
    /* Cột Ca nhiều lựa chọn — giới hạn độ rộng, dấu "..." + tooltip (2026-08-10) */
    .td-slot { max-width: 150px; }
    .slot-ellipsis {
      display: inline-block; max-width: 150px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      vertical-align: bottom;
    }

    /* ===== Spin loading overlay (tham khảo v1) ===== */
    #loadingOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      /* Fix 2026-08-09: visibility dịch chuyển có độ trễ bằng đúng thời gian fade —
         ẩn ngay KHI fade xong (mẫu cổ điển tránh "bóng ma" overlay trên WebView cũ
         vẫn vẽ dải trắng mờ ở mép trên sau khi đã hide). */
      transition: opacity .4s ease, visibility 0s linear .4s;
    }
    #loadingOverlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #loadingOverlay .spin-big {
      width: 48px; height: 48px;
      border: 4px solid #e6eaf0; border-top-color: var(--warning);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    /* F6: modal spin cho nút chuyển trạng thái (spinner dùng chung loadingOverlay + spinModal) */
    .spin-big {
      width: 40px; height: 40px;
      border: 4px solid #e6eaf0; border-top-color: var(--warning);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }
    #loadingOverlay p { margin-top: 16px; color: var(--muted); font-size: 15px; font-weight: 500; }

    /* ===== Modal chung (2026-08-11): paste / create / confirm / spin — tái dùng overlay + dialog ===== */
    .about-overlay {
      position: fixed; inset: 0; z-index: 9998;
      background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .2s ease, visibility .2s;
    }
    .about-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; }
    .about-dialog {
      background: #fff; border-radius: 12px; padding: 24px;
      max-width: 400px; width: 90%;
      box-shadow: 0 12px 40px rgba(0,0,0,.14);
      transform: scale(.96); transition: transform .2s ease-out;
    }
    .about-overlay.open .about-dialog { transform: scale(1); }

    /* P2: tôn trọng prefers-reduced-motion — tắt animation khi user yêu cầu */
    @media (prefers-reduced-motion: reduce) {
      .scan-input-wrap:focus-within::after { animation: none; }
      .scan-input-wrap.queue-full::after { animation: none; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* High contrast (tham khảo v1): kiosk màn cũ/sáng gắt — đậm border, tương phản cao */
    @media (prefers-contrast: more) {
      :root {
        --border: #000;
        --text: #000;
        --muted: #333;
        --bg: #fff;
        --surface-muted: #eee;
      }
      .scan-card { border-width: 3px; }
      .scan-input-wrap input { border-width: 2px; border-color: #000; }
      header { border-bottom-width: 2px; }
      .badge { border: 1px solid currentColor; }
      /* S9: badge nền đặc thay nền nhạt — đọc rõ trên màn sáng/cũ */
      .badge.pending { background: #000; color: #fff; }
      .badge.present { background: var(--success); color: #fff; }
      .badge.absent  { background: var(--danger); color: #fff; }
      .badge.extra   { background: var(--warning); color: #fff; }
      .badge.open    { background: var(--primary); color: #fff; }
      .badge.attend { background: var(--success-dark); color: #fff; }
      .badge.done    { background: #000; color: #fff; }
      .badge.badge-free      { background: #2a1f3d; color: #c9a2f2; }
      .badge.badge-reconcile { background: #1b2b4a; color: #8ab4f8; }
      .counter { border-width: 2px; }
    }

    /* ===== Skeleton loading (tham khảo v1) ===== */
    .skeleton-wrap { padding: 4px 0; }
    .skeleton-row {
      display: flex; padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    .skeleton-cell {
      flex: 1; height: 16px; margin-right: 14px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e6e6e6 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: skeleton-shimmer 1.5s infinite;
    }
    .skeleton-cell:last-child { margin-right: 0; }
    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ===== Thống kê (viewStats: stats-grid 2 cột Contract×Ca + Agency×Ca) + bảng StaffData (viewStaff) ===== */
    .stats-team-title {
      margin: 12px 0 6px; font-size: 14px; font-weight: 800; color: var(--primary);
      text-transform: uppercase; letter-spacing: .4px;
    }
    .stats-team-title:first-child { margin-top: 0; }
    .stats-table-wrap { overflow-x: auto; max-height: calc(100vh - 260px); overflow-y: auto; flex: 1 1 auto; min-height: 0; }
    .stats-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
      table-layout: fixed;  /* cột dữ liệu chia đều — Ca/Tổng width cố định (CDP: Ca 188 vs OS 72 lệch) */
    }
    .stats-table th, .stats-table td {
      padding: 5px 8px; border: 1px solid var(--border);
      text-align: center; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;  /* fixed layout: cell dài không tràn sang cell kế */
    }
    .stats-table th {
      background: var(--surface-muted); color: var(--muted);
      font-weight: 700; font-size: 12px; position: sticky; top: 0;
    }
    .stats-table th:first-child, .stats-table td.row-head { width: 110px; }
    .stats-table th.total, .stats-table td.total { width: 70px; }
    .stats-table td.row-head {
      text-align: left; font-weight: 600; background: var(--surface-muted);
    }
    .stats-table td.total {
      background: #fff3e0; font-weight: 800; color: var(--amber);
    }
    .stats-table tr:hover td { background: var(--row-hover); }
