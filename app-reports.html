<script>
  /* ============================================================
   * MODULE: app-reports.html — viewReports (Báo cáo) — chấm công tháng theo email đăng nhập
   * Nạp qua index.html (directive include app-reports) — script block
   * riêng, chung global scope với các module khác (thứ tự include quan trọng).
   * Nguồn: StaffAttendance (sheet ngoài, lọc theo Ops ID của email đăng nhập qua StaffInfo).
   * ============================================================ */
  var REPORTS_LOADED = false;
  var REPORT_ROWS = [];    // rows server trả (đã sort giảm dần theo ngày)
  var REPORT_META = null;  // { email, opsId, staffName, message }

  // Meta topbar: tên NV đậm màu + email + count — HTML (không textContent để giữ style span).
  function reportsMetaHtml_(q, rows) {
    if (q) return '<span class="reports-user-count">' + rows.length + '/' + REPORT_ROWS.length + ' dòng phù hợp</span>';
    var m = REPORT_META || {};
    var name = String(m.staffName || '').trim();
    var em = String(m.email || '').trim();
    var out = '';
    if (name) out += '<span class="reports-user-name">' + esc(name) + '</span>';
    if (em) out += ' <span class="reports-user-email">' + esc(em) + '</span>';
    var extra = REPORT_ROWS.length ? ' — ' + REPORT_ROWS.length + ' dòng' : (m.message ? ' — ' + m.message : '');
    if (extra) out += ' <span class="reports-user-count">' + esc(extra) + '</span>';
    return out;
  }

  // Tải báo cáo của user đang đăng nhập (getReportsApi — gate operator+ TRONG server).
  function loadReportsView(btn) {
    var skel = document.getElementById('reportsSkeleton');
    var metaEl = document.getElementById('reportsMeta');
    var tbl = document.getElementById('reportsTableWrap');
    var empty = document.getElementById('reportsEmpty');
    if (skel) skel.style.display = REPORTS_LOADED ? 'none' : '';
    if (tbl) tbl.style.display = 'none';
    if (empty) empty.style.display = 'none';
    if (metaEl) metaEl.textContent = 'Đang tải…';
    if (btn) setBtnBusy_(btn, '⟳ Đang tải…');
    function restore() { if (btn) restoreBtnLabel_(btn, '⟳ Cập nhật'); }
    google.script.run
      .withSuccessHandler(function (res) {
        restore();
        if (!res || !res.ok) {
          if (metaEl) metaEl.textContent = 'Lỗi';
          if (skel) skel.style.display = 'none';
          showToast((res && res.message) || 'Lỗi tải báo cáo', true);
          return;
        }
        REPORT_ROWS = safeArr(res.rows);
        REPORT_META = res;
        REPORTS_LOADED = true;
        if (skel) skel.style.display = 'none';
        renderReportsTable();
        loadAdminPanel();
        markServerOk();
      })
      .withFailureHandler(function (err) {
        restore();
        markServerFail();
        if (skel) skel.style.display = 'none';
        showToast('Lỗi tải báo cáo: ' + err.message, true);
      })
      .getReportsApi();
  }

  // Render bảng — lọc client theo ô tìm kiếm (ngày / station / kết quả / giờ / PMO).
  function renderReportsTable() {
    var q = ((document.getElementById('reportsSearch') || {}).value || '').trim().toLowerCase();
    var rows = REPORT_ROWS.filter(function (r) {
      if (!q) return true;
      var hay = [r.reportDate, r.bizStaffId, r.employeeId, r.staffName, r.station, r.result, r.workHour, r.inTime, r.outTime, r.pmo].join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    var tbl = document.getElementById('reportsTableWrap');
    var empty = document.getElementById('reportsEmpty');
    var body = document.getElementById('reportsTableBody');
    var metaEl = document.getElementById('reportsMeta');
    if (!tbl || !body) return;
    if (metaEl) metaEl.innerHTML = reportsMetaHtml_(q, rows);
    if (!rows.length) {
      body.innerHTML = '';
      tbl.style.display = 'none';
      if (empty) {
        empty.style.display = '';
        empty.textContent = q ? 'Không có dòng phù hợp “' + q + '”' : ((REPORT_META && REPORT_META.message) || 'Chưa có dữ liệu chấm công');
      }
      return;
    }
    if (empty) empty.style.display = 'none';
    body.innerHTML = rows.map(function (r) {
      var off = String(r.result || '').toUpperCase() === 'OFF';
      // data-label: mobile hiển thị dạng card (td::before = nhãn, ẩn Mã NV + PMO).
      return '<tr>'
        + '<td data-label="Ngày">' + esc(r.reportDate) + '</td>'
        + '<td data-label="Mã Ops"><b>' + esc(r.bizStaffId) + '</b></td>'
        + '<td data-label="Mã NV">' + esc(r.employeeId) + '</td>'
        + '<td data-label="Tên NV">' + esc(r.staffName) + '</td>'
        + '<td data-label="Station">' + esc(r.station) + '</td>'
        + '<td data-label="Kết quả">' + (off ? '<span class="reports-off">OFF</span>' : esc(r.result)) + '</td>'
        + '<td data-label="Giờ công" class="reports-num">' + esc(r.workHour || '—') + '</td>'
        + '<td data-label="Giờ vào">' + esc(r.inTime || '—') + '</td>'
        + '<td data-label="Giờ ra">' + esc(r.outTime || '—') + '</td>'
        + '<td data-label="PMO"' + (r.pmo ? ' class="has-pmo"' : '') + '>' + esc(r.pmo || '—') + '</td>'
        + '</tr>';
    }).join('');
    tbl.style.display = '';
  }

  // ===== Admin (manager+): toàn bộ task + nhật ký hoạt động =====
  // Gate client canManager_() (khớp server requireRole_('manager')); server vẫn tự
  // gate trong getAuditLogApi/getAllTasksApi (DEFENSE — bypass google.script.run).
  var ADMIN_ACTIONS = {
    scan: 'Quét', createTask: 'Tạo task', transitionToAttend: 'Chuyển điểm danh',
    completeTask: 'Kết thúc task', reopenTask: 'Mở lại task', pasteCodes: 'Dán mã',
    settings: 'Cấu hình'
  };
  function adminActionLabel_(a) { return ADMIN_ACTIONS[a] || a; }
  function phaseLabel_(ph) {
    if (ph === 'done') return '<span class="badge err">Xong</span>';
    if (ph === 'attend') return '<span class="badge ok">Điểm danh</span>';
    return '<span class="badge warn">Mở</span>';
  }
  function loadAdminPanel() {
    var panel = document.getElementById('adminPanel');
    if (!panel) return;
    if (!(typeof canManager_ === 'function' && canManager_())) { panel.style.display = 'none'; return; }
    panel.style.display = '';
    google.script.run
      .withSuccessHandler(function (res) {
        var tb = document.getElementById('adminTaskTable');
        if (!tb || !tb.tBodies[0]) return;
        if (res && res.ok && Array.isArray(res.tasks)) { renderAdminTasks(res.tasks); return; }
        tb.tBodies[0].innerHTML = '<tr><td colspan="6">' + esc((res && res.message) || 'Không tải được task') + '</td></tr>';
      })
      .getAllTasksApi();
    google.script.run
      .withSuccessHandler(function (res) {
        var tb = document.getElementById('auditTable');
        if (!tb || !tb.tBodies[0]) return;
        if (res && res.ok && Array.isArray(res.rows)) { renderAuditRows(res.rows); return; }
        tb.tBodies[0].innerHTML = '<tr><td colspan="4">' + esc((res && res.message) || 'Không tải được nhật ký') + '</td></tr>';
      })
      .getAuditLogApi(100);
  }
  function renderAdminTasks(tasks) {
    var tb = document.getElementById('adminTaskTable');
    if (!tb || !tb.tBodies[0]) return;
    var html = tasks.slice(0, 50).map(function (t) {
      var phase = t.phase === 'done' ? 'done' : (t.phase === 'attend' ? 'attend' : 'open');
      var taskId = esc(t.taskId || '');
      var btn = '';
      if (phase === 'attend') btn = '<button class="btn btn-sm" onclick="adminCompleteTask(\'' + taskId + '\')">Kết thúc</button>';
      if (phase === 'done') btn = '<button class="btn btn-sm btn-outline" onclick="adminReopenTask(\'' + taskId + '\')">Mở lại</button>';
      return '<tr><td>' + taskId + '</td><td>' + esc(t.taskType === 'free' ? 'Tự do' : 'Đối chiếu') + '</td>'
        + '<td>' + esc((t.slotCode || '') + (t.team ? ' / ' + t.team : '')) + '</td>'
        + '<td>' + esc(t.createdBy || '') + '</td>'
        + '<td>' + phaseLabel_(phase) + '</td>'
        + '<td>' + btn + '</td></tr>';
    }).join('');
    tb.tBodies[0].innerHTML = html || '<tr><td colspan="6">Chưa có task</td></tr>';
  }
  function renderAuditRows(rows) {
    var tb = document.getElementById('auditTable');
    if (!tb || !tb.tBodies[0]) return;
    var html = rows.map(function (r) {
      return '<tr><td>' + esc(fmtAuditTime_(r.timestamp)) + '</td><td>' + esc(r.email || '') + '</td>'
        + '<td>' + esc(adminActionLabel_(r.action)) + '</td>'
        + '<td>' + esc(r.targetId || (r.detail || '').slice(0, 60)) + '</td></tr>';
    }).join('');
    tb.tBodies[0].innerHTML = html || '<tr><td colspan="4">Chưa có hoạt động nào</td></tr>';
  }
  function fmtAuditTime_(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' '
      + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function adminCompleteTask(taskId) {
    showConfirm('Kết thúc task', 'Kết thúc task ' + taskId + '?', function () {
      google.script.run
        .withSuccessHandler(function (res) { showToast((res && res.message) || 'Xong', !(res && res.ok)); loadAdminPanel(); })
        .withFailureHandler(function (err) { showToast('Lỗi: ' + err.message, true); })
        .completeTaskApi(taskId);
    });
  }
  function adminReopenTask(taskId) {
    showConfirm('Mở lại task', 'Mở lại task ' + taskId + '?', function () {
      google.script.run
        .withSuccessHandler(function (res) { showToast((res && res.message) || 'Xong', !(res && res.ok)); loadAdminPanel(); })
        .withFailureHandler(function (err) { showToast('Lỗi: ' + err.message, true); })
        .reopenTaskApi(taskId);
    });
  }
</script>
