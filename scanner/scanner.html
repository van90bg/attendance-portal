<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quét điểm danh — SPX</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column;
    overscroll-behavior: contain;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: #1e293b;
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #count { font-size: 13px; color: #94a3b8; font-variant-numeric: tabular-nums; }
  #btnDone {
    border: 1px solid #475569; background: transparent; color: #e2e8f0;
    padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer;
    min-height: 44px;
  }
  main { flex: 1; position: relative; background: #000; overflow: hidden; }
  #reader { position: absolute; inset: 0; }
  #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
  .reticle {
    position: absolute; inset: 10%; border: 2px solid rgba(251, 146, 60, .7);
    border-radius: 12px; pointer-events: none;
    box-shadow: inset 0 0 0 9999px rgba(0, 0, 0, .2);
  }
  .reticle::after {
    content: ''; position: absolute; left: 8%; right: 8%; top: 50%; height: 3px;
    background: linear-gradient(90deg, transparent, #fb923c, transparent);
    box-shadow: 0 0 8px #fb923c;
    animation: laser 1.6s ease-in-out infinite;
  }
  @keyframes laser {
    0%, 100% { transform: translateY(-35%); opacity: .4; }
    50%      { transform: translateY(35%);  opacity: 1; }
  }
  #status {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 16px; text-align: center; font-size: 14px;
    background: rgba(15, 23, 42, .85); color: #cbd5e1;
  }
  #status.ok { color: #4ade80; }
  #status.err { color: #f87171; }
  #sent {
    flex-shrink: 0; max-height: 30vh; overflow-y: auto;
    padding: 8px 14px 14px; font-size: 13px; color: #94a3b8;
    border-top: 1px solid #334155;
  }
  #sent .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; font-variant-numeric: tabular-nums; }
  #sent .row b { color: #4ade80; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) {
    .reticle::after { animation: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Quét điểm danh — SPX</h1>
  <span id="count">0 mã</span>
  <button id="btnDone" type="button" onclick="closeSelf()">Xong</button>
</header>
<main>
  <div id="reader"></div>
  <div class="reticle" aria-hidden="true"></div>
  <div id="status" role="status" aria-live="polite">Đang mở camera…</div>
</main>
<div id="sent" aria-live="polite"></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  /* Trang scanner NGOÀI GAS — app Điểm Danh mở qua window.open (nút Quét bằng camera).
   * Tab top-level nên getUserMedia hoạt động (iframe GAS chặn camera). Mỗi mã quét được
   * postMessage về app → app reuse luồng submitScan() gửi server. GIỮ TAB MỞ để quét
   * liên tục nhiều NV — không cần xác nhận nào sau khi chụp (không phải camera app OS). */
  (function () {
    var LAST_CODE = '';
    var LAST_TS = 0;
    var SAME_CODE_COOLDOWN = 1500; // ms — cùng mã nằm trong khung không gửi lặp
    var SENT_COUNT = 0;
    var scanner = null;

    var statusEl = document.getElementById('status');
    var countEl = document.getElementById('count');
    var sentEl = document.getElementById('sent');

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || '';
    }
    function beep() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 1568;
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
        osc.start(); osc.stop(ctx.currentTime + 0.2);
      } catch (e) { /* không có audio — bỏ qua */ }
    }
    function sendCode(code) {
      if (!code) return;
      var now = Date.now();
      if (code === LAST_CODE && now - LAST_TS < SAME_CODE_COOLDOWN) return;
      LAST_CODE = code; LAST_TS = now;
      var target = window.opener;
      if (!target) {
        setStatus('Mất kết nối app — đóng tab rồi mở lại từ nút Quét bằng camera', 'err');
        return;
      }
      target.postMessage({ source: 'spx-scan', code: code }, '*');
      SENT_COUNT++;
      countEl.textContent = SENT_COUNT + ' mã';
      beep();
      setStatus('Đã gửi: ' + code, 'ok');
      var t = new Date();
      var hm = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
      var row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span>' + esc(code) + '</span><b>' + hm + '</b>';
      sentEl.insertBefore(row, sentEl.firstChild);
      if (sentEl.children.length > 40) sentEl.removeChild(sentEl.lastChild);
    }
    function closeSelf() {
      // window.close() chỉ hoạt động với tab do script mở — đúng trường hợp này.
      window.close();
      setTimeout(function () { setStatus('Trình duyệt chặn tự đóng — hãy tự đóng tab này', 'err'); }, 300);
    }
    function start() {
      if (!window.Html5Qrcode) { setStatus('Không tải được thư viện quét (kiểm tra mạng)', 'err'); return; }
      if (!window.opener) {
        setStatus('Mở trang này từ app Điểm Danh (nút Quét bằng camera) để quét.', 'err');
        return;
      }
      var config = {
        fps: 10,
        qrbox: function (vw, vh) {
          var size = Math.floor(Math.min(vw, vh) * 0.8);
          return { width: size, height: size };
        },
        // Mã NV là 1D — Code128/Code39 (nhanh + ít dương tính giả)
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39
        ]
      };
      function onSuccess(text) { sendCode(String(text || '').trim()); }
      function onError() { /* gọi liên tục khi chưa thấy mã */ }
      scanner = new Html5Qrcode('reader');
      scanner.start({ facingMode: 'environment' }, config, onSuccess, onError).catch(function (err) {
        var msg = (err && err.message) ? String(err.message) : '';
        if (/permission|denied|not ?allowed/i.test(msg)) {
          setStatus('Quyền camera bị từ chối — vào Cài đặt trình duyệt → Quyền → Camera → Cho phép trang này, rồi thử lại', 'err');
        } else {
          setStatus('Không mở được camera: ' + msg, 'err');
        }
      });
    }
    // Tắt camera khi rời trang (đèn tắt, không tốn pin)
    window.addEventListener('pagehide', function () {
      if (scanner) {
        var s = scanner;
        scanner = null;
        s.stop().then(function () { try { s.clear(); } catch (e) {} }).catch(function () {});
      }
    });
    start();
  })();
</script>
</body>
</html>
