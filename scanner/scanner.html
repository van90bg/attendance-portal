<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quét điểm danh — SPX</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column;
    overscroll-behavior: contain;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: #1e293b;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #count { font-size: 15px; color: #94a3b8; font-variant-numeric: tabular-nums; }
  #btnDone {
    border: 1px solid #475569; background: transparent; color: #e2e8f0;
    padding: 8px 20px; border-radius: 8px; font-size: 16px; cursor: pointer;
    min-height: 44px;
  }
  /* Camera chiếm ~40vh — nhường chỗ cho danh sách kết quả (đọc to, dễ nhìn khi quét liên tục). */
  main { height: 40vh; min-height: 240px; position: relative; background: #000; overflow: hidden; flex-shrink: 0; }
  #reader { position: absolute; inset: 0; }
  #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
  .reticle {
    position: absolute; inset: 10%; border: 2px solid rgba(251, 146, 60, .7);
    border-radius: 12px; pointer-events: none;
    box-shadow: inset 0 0 0 9999px rgba(0, 0, 0, .2);
  }
  .reticle::after {
    content: ''; position: absolute; left: 8%; right: 8%; top: 50%; height: 3px;
    background: linear-gradient(90deg, transparent, #fb923c, transparent);
    box-shadow: 0 0 8px #fb923c;
    animation: laser 1.6s ease-in-out infinite;
  }
  @keyframes laser {
    0%, 100% { transform: translateY(-35%); opacity: .4; }
    50%      { transform: translateY(35%);  opacity: 1; }
  }
  #status {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 16px; text-align: center; font-size: 17px; font-weight: 600;
    background: rgba(15, 23, 42, .85); color: #cbd5e1;
  }
  #status.ok { color: #4ade80; }
  #status.err { color: #f87171; }
  #sent {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 10px 14px 14px; font-size: 15px; color: #94a3b8;
    border-top: 1px solid #334155;
  }
  #sent .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 15px; font-variant-numeric: tabular-nums; }
  #sent .code { font-weight: 700; color: #e2e8f0; min-width: 86px; font-size: 16px; }
  #sent .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e2e8f0; font-size: 17px; font-weight: 600; }
  #sent .time { color: #94a3b8; font-size: 14px; }
  #sent .badge { padding: 3px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  #sent .badge.ok { background: rgba(74, 222, 128, .15); color: #4ade80; }
  #sent .badge.warn { background: rgba(251, 146, 60, .15); color: #fb923c; }
  #sent .badge.err { background: rgba(248, 113, 113, .15); color: #f87171; }
  /* Phản hồi 2-pha: kết quả DỰ ĐOÁN từ app (chưa có xác nhận server) — tông vàng + viền nét đứt */
  #status.pending { color: #fbbf24; }
  #sent .badge.pending { outline: 1px dashed rgba(148, 163, 184, .55); opacity: .9; }
  /* Kết quả quét TO — đồng bộ scanCard của app (status in hoa + tên 30px + meta), nhìn từ 1-2m */
  #resultCard {
    flex-shrink: 0; margin: 10px 14px 0; padding: 14px 18px;
    border: 2px solid #334155; border-radius: 12px; background: #1e293b;
    min-height: 100px;
  }
  #resultCard.ok { border-color: #4ade80; background: rgba(74, 222, 128, .10); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
  #resultCard.warn { border-color: #fb923c; background: rgba(251, 146, 60, .10); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
  #resultCard.err { border-color: #f87171; background: rgba(248, 113, 113, .10); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
  #resultCard.pending { border-color: #60a5fa; background: rgba(96, 165, 250, .10); animation: stampIn .38s cubic-bezier(.22, 1, .36, 1); }
  #resultCard .rc-status { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #94a3b8; }
  #resultCard.ok .rc-status { color: #4ade80; }
  #resultCard.warn .rc-status { color: #fb923c; }
  #resultCard.err .rc-status { color: #f87171; }
  #resultCard.pending .rc-status { color: #60a5fa; }
  #resultCard .rc-name { font-size: 30px; font-weight: 800; line-height: 1.25; margin-top: 2px; color: #e2e8f0; }
  #resultCard .rc-meta { font-size: 15px; color: #94a3b8; margin-top: 4px; }
  #resultCard .rc-empty { color: #64748b; font-size: 14px; }
  /* Pha 1 — đang chờ xác nhận server: viền nét đứt */
  #resultCard.opt { outline: 2px dashed rgba(148, 163, 184, .55); outline-offset: -6px; }
  @keyframes stampIn { from { transform: scale(.94); opacity: .4; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .reticle::after { animation: none; }
    #resultCard.ok, #resultCard.warn, #resultCard.err, #resultCard.pending { animation: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Quét điểm danh — SPX</h1>
  <span id="count">0 mã</span>
  <button id="btnDone" type="button">Xong</button>
</header>
<main>
  <div id="reader"></div>
  <div class="reticle" aria-hidden="true"></div>
  <div id="status" role="status" aria-live="polite">Đang mở camera…</div>
</main>
<div id="resultCard"><div class="rc-empty">Chưa có lượt quét</div></div>
<div id="sent" aria-live="polite"></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  /* Trang scanner NGOÀI GAS — app Điểm Danh mở qua window.open (nút Quét bằng camera).
   * Tab top-level nên getUserMedia hoạt động (iframe GAS chặn camera). Mỗi mã quét được
   * postMessage về app → app reuse luồng submitScan() gửi server. GIỮ TAB MỞ để quét
   * liên tục nhiều NV — không cần xác nhận nào sau khi chụp (không phải camera app OS). */
  (function () {
    var LAST_CODE = '';
    var LAST_TS = 0;
    var SAME_CODE_COOLDOWN = 1500; // ms — cùng mã nằm trong khung không gửi lặp
    var SENT_COUNT = 0;
    var scanner = null;

    var statusEl = document.getElementById('status');
    var countEl = document.getElementById('count');
    var sentEl = document.getElementById('sent');
    var cardEl = document.getElementById('resultCard');

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || '';
    }
    // Âm thanh phân biệt trạng thái — quét nhanh không cần nhìn màn hình:
    // Có mặt = 2 tiếng cao (ok) · Dư = 2 tiếng giữa (warn) · Lỗi = tiếng trầm xuống (err).
    var audioCtx = null;
    function getCtx() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        return audioCtx;
      } catch (e) { return null; }
    }
    // iOS Safari: mở khóa AudioContext ở thao tác chạm đầu tiên (autoplay policy).
    document.addEventListener('pointerdown', function () { getCtx(); }, { once: true, passive: true });
    // vol mặc định 0.9 (gần max, decay nhanh nên không clip) — to hơn 0.55 cũ ~4dB.
    function tone(freq, dur, delay, type, vol) {
      var ctx = getCtx();
      if (!ctx) return;
      try {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        var t0 = ctx.currentTime + (delay || 0);
        var v = (vol === undefined) ? 0.9 : vol;
        gain.gain.setValueAtTime(v, t0);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.start(t0); osc.stop(t0 + dur + 0.03);
      } catch (e) { /* không có audio — bỏ qua */ }
    }
    // TING thành công — 2 tiếng E6→A6 (triangle: sáng hơn sine, nghe giòn) + họa âm
    // bội 1 quãng tám (sine nhỏ) tạo âm chuông 'ting' lanh lảnh, to rõ cả mobile + desktop.
    function beepOk() {
      tone(1318, 0.1, 0, 'triangle');
      tone(2636, 0.08, 0.004, 'sine', 0.22);
      tone(1760, 0.14, 0.11, 'triangle');
      tone(3520, 0.1, 0.114, 'sine', 0.22);
    }
    function beepWarn() { tone(740, 0.12, 0, 'triangle'); tone(740, 0.12, 0.16, 'triangle'); }
    function beepErr() { tone(311, 0.2, 0, 'sawtooth'); tone(233, 0.24, 0.18, 'sawtooth'); }
    function sendCode(code) {
      if (!code) return;
      var now = Date.now();
      if (code === LAST_CODE && now - LAST_TS < SAME_CODE_COOLDOWN) return;
      LAST_CODE = code; LAST_TS = now;
      var target = window.opener;
      if (!target) {
        setStatus('Mất kết nối app — đóng tab rồi mở lại từ nút Quét bằng camera', 'err');
        return;
      }
      target.postMessage({ source: 'spx-scan', code: code }, '*');
      SENT_COUNT++;
      countEl.textContent = SENT_COUNT + ' mã';
      addRow(code, '', '…', '', '');
    }
    function fmtTime(d) {
      return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2);
    }
    function addRow(code, name, statusText, cls, time) {
      var row = document.createElement('div');
      row.className = 'row';
      row.setAttribute('data-code', code);
      row.innerHTML = '<span class="code">' + esc(code) + '</span>' +
        '<span class="name">' + esc(name) + '</span>' +
        '<span class="badge ' + (cls || '') + '">' + esc(statusText || '…') + '</span>' +
        '<span class="time">' + esc(time || fmtTime(new Date())) + '</span>';
      sentEl.insertBefore(row, sentEl.firstChild);
      // Danh sách gần đây chỉ cần vài dòng — thông tin chính nằm ở card to phía trên.
      if (sentEl.children.length > 5) sentEl.removeChild(sentEl.lastChild);
    }
    // Card kết quả TO — đồng bộ scanCard của app: status in hoa + tên 30px + meta mã/giờ.
    function showCard(statusText, name, meta, stateCls, opt) {
      cardEl.className = (opt ? 'opt ' : '') + stateCls;
      cardEl.innerHTML = '<div class="rc-status">' + esc(statusText) + '</div>' +
        '<div class="rc-name">' + esc(name || '…') + '</div>' +
        (meta ? '<div class="rc-meta">' + esc(meta) + '</div>' : '');
    }
    // Nhận kết quả từ app (sau khi server xử lý): tên NV + trạng thái — cập nhật card + dòng.
    // Chỉ tin message từ window.opener (chính app đã mở tab này).
    function showResult(r) {
      var code = String(r.code || '').trim();
      var name = String(r.name || '').trim();
      var status = String(r.status || '').trim();
      var label = String(r.statusLabel || '').trim();
      // label từ app (statusLabel) là nguồn hiển thị — app đã phân giải
      // FREE phase1 PENDING → 'Có mặt'; chỉ fallback sang raw status khi thiếu.
      var disp = label || (status === '-' ? 'Chưa điểm danh' : status);
      var msg = String(r.message || '').trim();
      var time = String(r.time || '').trim();
      var ok = !!r.ok;
      var opt = !!r.optimistic;   // kết quả DỰ ĐOÁN từ app — chưa có xác nhận server
      var statusText = ok ? (disp || 'Đã điểm danh') : (msg || 'Không điểm danh được');
      var stateCls = ok ? (disp === 'Dư' ? 'warn' : (disp === 'Chưa điểm danh' ? 'pending' : 'ok')) : 'err';
      var meta = 'Mã: ' + code + (time ? ' · ' + time : '');
      var badgeText = ok ? disp : (msg || 'Lỗi');
      var badgeCls = ok ? (disp === 'Dư' ? 'warn' : 'ok') : 'err';
      // Card chỉ hiện kết quả của mã QUÉT MỚI NHẤT (mirror guard scanSeq của app) —
      // server trả hàng đợi lệch thứ tự: kết quả mã cũ đến sau không được ghi đè card
      // (người quét vừa quét mã khác, card nhảy về NV cũ → hiểu nhầm).
      var isLatest = (code === LAST_CODE);
      var rows = sentEl.children;
      var row = null;
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].getAttribute('data-code') === code) { row = rows[i]; break; }
      }
      // Pha 1 — kết quả dự đoán: hiện + beep NGAY (không chờ server). Dòng đánh dấu
      // data-opt để pha 2 chỉ beep lại nếu server trả khác (tránh beep đúp).
      if (opt) {
        if (ok) { if (disp === 'Dư') beepWarn(); else beepOk(); }
        else { beepErr(); }
        showCard(statusText, name || code, meta, stateCls, true);
        if (row) {
          var nm0 = row.querySelector('.name');
          var bd0 = row.querySelector('.badge');
          if (nm0 && name) nm0.textContent = name;
          if (bd0) { bd0.textContent = badgeText; bd0.className = 'badge ' + badgeCls + ' pending'; }
        } else {
          addRow(code, name, badgeText, badgeCls, time);
          row = sentEl.firstChild;
        }
        if (row) { row.setAttribute('data-opt', badgeText); }
        return;
      }
      // Pha 2 — kết quả chuẩn từ server: ghi đè dòng; chỉ beep nếu KHÁC dự đoán.
      // Kết quả mã KHÔNG còn mới nhất: cập nhật dòng lịch sử nhưng KHÔNG đụng card/beep.
      var prev = row ? row.getAttribute('data-opt') : null;
      if (isLatest && (!prev || prev !== badgeText)) {
        if (ok) { if (disp === 'Dư') beepWarn(); else beepOk(); }
        else { beepErr(); }
      }
      if (isLatest) {
        showCard(statusText, name || code, meta, stateCls, false);
      }
      if (row) {
        var nm = row.querySelector('.name');
        var bd = row.querySelector('.badge');
        if (nm && name) nm.textContent = name;
        if (bd) { bd.textContent = badgeText; bd.className = 'badge ' + badgeCls; }
        row.removeAttribute('data-opt');
      } else {
        addRow(code, name, badgeText, badgeCls, time);
      }
    }
    window.addEventListener('message', function (e) {
      if (e.source !== window.opener) return;
      var d = e.data;
      if (!d || d.source !== 'spx-app') return;
      // App báo task đã kết thúc (quét xong) → tự đóng tab.
      if (d.action === 'close') {
        window.close();
        setTimeout(function () { try { location.replace('about:blank'); } catch (e) {} }, 250);
        return;
      }
      if (!d.result) return;
      showResult(d.result);
    });

    function closeSelf() {
      // Báo app đóng tab (opener đóng child) — rồi tự close() nếu được.
      var target = window.opener;
      if (target) {
        try { target.postMessage({ source: 'spx-scan', action: 'close' }, '*'); } catch (e) {}
      }
      window.close();
      // iOS Safari bỏ qua window.close() (kể cả tab do window.open mở) → dọn về trang
      // trống: tab 'đóng' về thị giác, camera tắt qua pagehide. Không có cách đóng tab thật trên iOS.
      setTimeout(function () {
        try { location.replace('about:blank'); } catch (e) {}
      }, 250);
    }
    // closeSelf ở scope IIFE — inline onclick không thấy được, gắn listener qua JS.
    document.getElementById('btnDone').addEventListener('click', closeSelf);
    function start() {
      if (!window.Html5Qrcode) { setStatus('Không tải được thư viện quét (kiểm tra mạng)', 'err'); return; }
      if (!window.opener) {
        setStatus('Mở trang này từ app Điểm Danh (nút Quét bằng camera) để quét.', 'err');
        return;
      }
      var config = {
        fps: 10,
        qrbox: function (vw, vh) {
          var size = Math.floor(Math.min(vw, vh) * 0.8);
          return { width: size, height: size };
        },
        // Mã NV là 1D — Code128/Code39 (nhanh + ít dương tính giả)
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39
        ]
      };
      function onSuccess(text) { sendCode(String(text || '').trim()); }
      function onError() { /* gọi liên tục khi chưa thấy mã */ }
      scanner = new Html5Qrcode('reader');
      scanner.start({ facingMode: 'environment' }, config, onSuccess, onError)
        .then(function () { setStatus(''); })  // camera đã chạy — bỏ 'Đang mở camera…'
        .catch(function (err) {
          var msg = (err && err.message) ? String(err.message) : '';
          if (/permission|denied|not ?allowed/i.test(msg)) {
            setStatus('Quyền camera bị từ chối — vào Cài đặt trình duyệt → Quyền → Camera → Cho phép trang này, rồi thử lại', 'err');
          } else {
            setStatus('Không mở được camera: ' + msg, 'err');
          }
        });
    }
    // Tắt camera khi rời trang (đèn tắt, không tốn pin)
    window.addEventListener('pagehide', function () {
      if (scanner) {
        var s = scanner;
        scanner = null;
        s.stop().then(function () { try { s.clear(); } catch (e) {} }).catch(function () {});
      }
    });
    start();
  })();
</script>
</body>
</html>
