  // Mock local: khi mở file:// trực tiếp (không qua GAS), nạp mock-google.js.

  // ===================== UTILITIES (dùng chung toàn app — gom 2026-08-11) =====================
  // I4: guard array từ server — nếu API trả object/string (bug tương lai) thì .forEach crash white screen
  function safeArr(x) { return Array.isArray(x) ? x : []; }

  // Escape HTML (text node) — luôn dùng khi nhúng dữ liệu server vào innerHTML.
  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');
  }
  // Escape HTML (attribute) — thêm quote đơn; dùng cho value="..." trong HTML string.
  function escAttr(s) {
    return esc(s).replace(/'/g, '&#39;');
  }
  // Số 0 → '-' (bảng thống kê)
  function fmtN(n) { return n ? String(n) : '-'; }

  // Format Clock In/Out Time theo sheet: 'H:mm:ss' (vd 7:05:30) — chấp nhận 3 dạng: Date, 'HH:mm', 'HH:mm:ss'.
  function fmtClockHMS(v) {
    if (v === null || v === undefined) return '';
    if (v instanceof Date && !isNaN(v)) {
      return ('0' + v.getHours()).slice(-2) + ':' + String(v.getMinutes()).padStart(2, '0') + ':' + String(v.getSeconds()).padStart(2, '0');
    }
    var s = String(v).trim();
    if (!s) return '';
    var m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
    if (m) return ('0' + Number(m[1])).slice(-2) + ':' + m[2] + ':' + (m[3] || '00');
    return s;
  }

  // P2: format theo TZ Asia/Ho_Chi_Minh (khớp server Session.getScriptTimeZone)
  // — không dùng local TZ của máy kiosk (có thể lệch nếu đổi vùng).
  var _fmtTZ = (function () {
    try {
      return new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Ho_Chi_Minh' });
    } catch (e) { return null; }
  })();
  function fmtDate(d) {
    if (!d) return '';
    var dt = new Date(d);
    if (isNaN(dt.getTime())) return String(d);
    if (_fmtTZ) {
      var parts = _fmtTZ.formatToParts(dt);
      var h = '0', m = '0', s = '0';
      parts.forEach(function (p) {
        if (p.type === 'hour') h = p.value;
        else if (p.type === 'minute') m = p.value;
        else if (p.type === 'second') s = p.value;
      });
      return h + ':' + m + ':' + s;
    }
    return ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2) + ':' + ('0' + dt.getSeconds()).slice(-2);
  }

  // Trạng thái nút tải/lưu — dùng chung loadStaffView/loadConfigView/saveConfig (gom 2026-08-11).
  // busyLabel: text khi đang xử lý (lưu label gốc vào dataset để restore đúng).
  function setBtnBusy_(btn, busyLabel) {
    if (btn && btn.tagName) { btn.disabled = true; btn.dataset.label = btn.textContent; btn.textContent = busyLabel; }
  }
  function restoreBtnLabel_(btn, fallback) {
    if (btn && btn.tagName) { btn.disabled = false; btn.textContent = btn.dataset.label || fallback; }
  }

    // ===== Pagination (tham khảo v1 scan.html — 50 dòng/trang) =====
    var SCAN_PAGE_SIZE = 50;  // bảng quét scanTable: 50 NV/trang
    var LIST_PAGE_SIZE = 100;  // viewTasks: 100 task/trang (đồng bộ viewStaff 2026-08-11)
    var LIST_PAGE = 1; // trang hiện tại: task list / kết quả tìm
    var SCAN_PAGE = 1; // trang hiện tại: bảng quét scanTable

    // Render phân trang vào container (v1: _renderPagination). Dùng inline onclick
    // (nhất quán với các button khác trong v2 — không cần delegation listener).
    // total = số dòng tổng (trước slice); current = trang đang xem; goFn = tên hàm
    // global nhận page, ví dụ goListPage / goScanPage.
    function renderPaginator_(containerId, total, current, goFn, pageSize) {
      var el = document.getElementById(containerId);
      if (!el) return;
      var ps = pageSize || SCAN_PAGE_SIZE;  // scan mặc định 50; staff/tasks truyền pageSize riêng
      if (!total || total <= ps) {
        el.innerHTML = '';
        el.style.display = 'none';
        return;
      }
      var totalPages = Math.max(1, Math.ceil(total / ps));
      var page = Math.min(current, totalPages);
      var start = (page - 1) * ps + 1;
      var end = Math.min(page * ps, total);

      var html = '<div class="pag-bar">';
      html += '<span class="pag-info">' + start + '–' + end + ' / ' + total + '</span>';
      html += '<div class="pag-buttons">';
      // Đầu + Trước
      html += '<button type="button" class="pag-btn" onclick="' + goFn + '(1)"' + (page <= 1 ? ' disabled' : '') + ' aria-label="Trang đầu">«</button>';
      html += '<button type="button" class="pag-btn" onclick="' + goFn + '(' + (page - 1) + ')"' + (page <= 1 ? ' disabled' : '') + ' aria-label="Trang trước">‹</button>';
      // Số trang có ellipsis
      var pageRange = [];
      for (var p = 1; p <= totalPages; p++) {
        if (p === 1 || p === totalPages || (p >= page - 1 && p <= page + 1)) {
          pageRange.push(p);
        } else if (pageRange[pageRange.length - 1] !== '...') {
          pageRange.push('...');
        }
      }
      for (var pi = 0; pi < pageRange.length; pi++) {
        if (pageRange[pi] === '...') {
          html += '<span class="pag-ellipsis">…</span>';
        } else {
          html += '<button type="button" class="pag-btn' + (pageRange[pi] === page ? ' active' : '') + '" onclick="' + goFn + '(' + pageRange[pi] + ')" aria-label="Trang ' + pageRange[pi] + '">' + pageRange[pi] + '</button>';
        }
      }
      // Sau + Cuối
      html += '<button type="button" class="pag-btn" onclick="' + goFn + '(' + (page + 1) + ')"' + (page >= totalPages ? ' disabled' : '') + ' aria-label="Trang sau">›</button>';
      html += '<button type="button" class="pag-btn" onclick="' + goFn + '(' + totalPages + ')"' + (page >= totalPages ? ' disabled' : '') + ' aria-label="Trang cuối">»</button>';
      html += '</div></div>';
      el.innerHTML = html;
      el.style.display = '';
    }

    // Phân trang task list: set trang + render lại (slice theo trang).
    function goListPage(page) {
      var p = Math.max(1, parseInt(page, 10) || 1);
      if (p === LIST_PAGE) return;
      LIST_PAGE = p;
      if (LIST_MODE === 'search') {
        renderSearchResults_(LAST_SEARCH_ROWS || []);
      } else if (LIST_MODE === 'task') {

      } else {

    // Phân trang StaffData: set trang + render lại (100 NV/trang).

    function goScanPage(page) {
      var p = Math.max(1, parseInt(page, 10) || 1);
      if (p === SCAN_PAGE) return;
      SCAN_PAGE = p;
      renderScanTable(CURRENT_LOG);
    }


  // Repair: ép các view section vào đúng #main-content (phòng parser tách thẻ sau edit HTML).
  function repairViewParents() {
    var main = document.getElementById('main-content');
    if (!main) return;
    ['viewHome', 'viewStats', 'viewStaff', 'viewAbout', 'viewScan', 'viewTasks', 'viewConfig', 'viewReports'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el && el.parentElement !== main) {
        main.appendChild(el);  // di chuyển (appendChild tự gỡ khỏi cha cũ + xếp cuối main)
      }
    });
  }

  // FIX(2026-08-09): đồng bộ --header-h = chiều cao header THẬT — token tĩnh 59px lệch khi
  // header wrap (font/zoom/màn hẹp) → doc cao hơn viewport → scroll dọc vĩnh viễn +
  // sidebar/view-topbar sticky bị ẩn sau header. Chạy khi DOM sẵn sàng + load + resize.
  function syncHeaderH() {
    var hEl = document.querySelector('header');
    if (!hEl) return;
    var px = Math.round(hEl.getBoundingClientRect().height) + 'px';
    var cur = getComputedStyle(document.documentElement).getPropertyValue('--header-h').trim();
    if (cur !== px) document.documentElement.style.setProperty('--header-h', px);
  }
  window.addEventListener('load', syncHeaderH);
  window.addEventListener('resize', syncHeaderH);

  document.addEventListener('DOMContentLoaded', function () {

    document.getElementById('scanInput').addEventListener('paste', onScanInputPaste);

  /* C3: tìm kiếm + lọc trạng thái + sort cột bảng scan */
  function initScanFilters() {
    var searchEl = document.getElementById('scanSearch');
    var statusEl = document.getElementById('scanStatusFilter');
    var clearEl = document.getElementById('scanClearFilter');
    var scanTbl = document.getElementById('scanTable');
    // C1: populate filter options từ STATUS_C — 1 nguồn sự thật, đổi label không vỡ filter.
    if (statusEl && statusEl.options.length === 1) {
      var FILTER_LABELS = {};
      FILTER_LABELS[STATUS_C.PENDING] = 'Chưa điểm danh';
      FILTER_LABELS[STATUS_C.PRESENT] = STATUS_C.PRESENT;
      FILTER_LABELS[STATUS_C.ABSENT] = STATUS_C.ABSENT;
      FILTER_LABELS[STATUS_C.EXTRA] = STATUS_C.EXTRA;
      [STATUS_C.PENDING, STATUS_C.PRESENT, STATUS_C.ABSENT, STATUS_C.EXTRA].forEach(function (v) {
        var o = document.createElement('option');
        o.value = v;
        o.textContent = FILTER_LABELS[v];
        statusEl.appendChild(o);
      });
    }
    if (searchEl) searchEl.addEventListener('input', function () {
      SCAN_FILTER.q = searchEl.value;
      SCAN_PAGE = 1; // bộ lọc lởi → về trang đầu
      renderScanTable(CURRENT_LOG);
    });
    if (statusEl) statusEl.addEventListener('change', function () {
      SCAN_FILTER.status = statusEl.value;
      SCAN_PAGE = 1; // bộ lọc đổi → về trang đầu
      renderScanTable(CURRENT_LOG);
    });
    if (clearEl) clearEl.addEventListener('click', function () {
      SCAN_FILTER.q = '';
      SCAN_FILTER.status = '';
      if (searchEl) searchEl.value = '';
      if (statusEl) statusEl.value = '';
      SCAN_PAGE = 1; // xoá lọc → về trang đầu
      renderScanTable(CURRENT_LOG);
    });
    if (scanTbl) scanTbl.addEventListener('click', function (e) {
      var th = e.target && e.target.closest ? e.target.closest('th.sortable') : null;
      if (!th) return;
      var col = parseInt(th.dataset.sort, 10);
      if (SCAN_SORT.col === col) SCAN_SORT.asc = !SCAN_SORT.asc;
      else { SCAN_SORT.col = col; SCAN_SORT.asc = true; }
      SCAN_SORT.userSet = true;  // F: user tự chọn cột → bỏ ép-theo-phase
      SCAN_PAGE = 1; // sort đổi thứ tự → về trang đầu
      updateSortIndicators();
      renderScanTable(CURRENT_LOG);
    });
    updateSortIndicators();
  }

  /* ===== Topbar sticky (.view-topbar chung) — thêm viền/bóng khi dính ===== */
  function updateStuckBars() {
    var bars = document.querySelectorAll('.view-topbar');
    if (!bars.length) return;
    // FIX(2026-08-09): đọc token MỖI LẦN scroll — syncHeaderH() có thể đổi --header-h khi resize/wrap
    var hh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 59;
    bars.forEach(function (bar) {
      // bỏ qua topbar của view đang ẩn (rect = 0 → không đánh dấu stuck sai)
      if (!bar.offsetParent) { bar.classList.remove('stuck'); return; }
      var rect = bar.getBoundingClientRect();
      bar.classList.toggle('stuck', rect.top <= hh);
    });
  }
  function initScanTopbarStuck() {
    window.addEventListener('scroll', updateStuckBars, { passive: true });
    updateStuckBars();
  }

  /* Mobile/tablet (pointer: coarse): KHÔNG tự focus scan input — bàn phím ảo tự bật đè nửa
     màn hình khi mở task quét. Kiosk desktop (chuột/barcode scanner) vẫn auto-focus như cũ. (2026-08-11) */
  var COARSE_POINTER = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  /* ===== Auto-focus loop (tham khảo v1): giữ focus vào scan input trên kiosk touch ===== */
  function startAutoFocusLoop() {
    if (COARSE_POINTER) return;  // mobile/tablet: không auto-focus — bàn phím không tự bật
    if (AUTO_FOCUS_TIMER) return;
    AUTO_FOCUS_TIMER = setInterval(function () {
      // Mobile/tablet: nếu pointer thành coarse (hybrid device) → dừng hẳn, không focus
      if (COARSE_POINTER) { stopAutoFocusLoop(); return; }
      // S10: modal đang mở → không giật focus về scan input
      if (anyModalOpen()) return;
      var scanView = document.getElementById('viewScan');
      var input = document.getElementById('scanInput');
      // P2 (audit): viewScan hidden → không cần giữ focus (đang ở danh sách task);
      // dừng luôn interval để không chạy vô ích mỗi 3s trên kiosk bật lâu.
      if (!scanView || scanView.classList.contains('hidden')) { stopAutoFocusLoop(); return; }
      if (input && !input.disabled) {
        var active = document.activeElement;
        if (active !== input && active && active.tagName !== 'SELECT' && active.tagName !== 'INPUT') {
          input.focus();
        }
      }
    }, 3000);
  }
  function stopAutoFocusLoop() {
    if (AUTO_FOCUS_TIMER) { clearInterval(AUTO_FOCUS_TIMER); AUTO_FOCUS_TIMER = null; }
  }

  /* ===== Trạng thái mạng (header command center) ===== */
  // P2: netDot phản ánh BOTH network interface (navigator.onLine) VÀ server GAS còn
  // sống. navigator.onLine chỉ báo mạng — deploy fail/timeout/quota GAS không đổi nó,
  // operator dễ bị đánh lừa thấy "Online" xanh trong khi app chết. Bất kỳ RPC fail
  // (google.script.run → withFailureHandler) đều là server unreachable thật: business
  // lỗi đã được server tự catch và trả về {ok:false} qua success handler.
  var SERVER_OK = true;
  function updateNetStatus(online) {
    var dot = document.getElementById('netDot');
    var txt = document.getElementById('netText');
    if (!dot || !txt) return;
    if (online === undefined) online = navigator.onLine;
    var ok = SERVER_OK && online;
    dot.className = 'net-dot' + (ok ? '' : ' offline');
    txt.textContent = SERVER_OK ? (online ? 'Online' : 'Offline') : 'Server lỗi';
  }
  function markServerFail() {
    if (!SERVER_OK) return;
    SERVER_OK = false;
    updateNetStatus();
  }
  function markServerOk() {
    if (SERVER_OK) return;
    SERVER_OK = true;
    updateNetStatus();
  }
  function initNetworkStatus() {
    updateNetStatus();
    window.addEventListener('online', function () { updateNetStatus(true); });
    window.addEventListener('offline', function () { updateNetStatus(false); });
  }

  function renderStatsChipGroup(id, col, vals) {

  // distinct + sort các giá trị field (client, không RPC)
  function distinctSorted_(rows, field, desc) {
    var seen = {}, out = [];
    (rows || []).forEach(function (r) {
      var v = String((r && r[field]) || '').trim();
      if (v && !seen[v]) { seen[v] = true; out.push(v); }
    });
    // Ngày: sort giảm dần (gần nhất cạnh 'Tất cả', format yyyy-MM-dd ISO); field khác: tăng dần
    out.sort(function (a, b) {

  // Pivot chung: dòng = rowField, cột = colField — Ca dọc khi rowField='slotCode'; số 0 → '-'
  function statsPivot(rows, rowField, colField) {
    var rowKeys = []; var rowSeen = {};
    var colKeys = []; var colSeen = {};
    rows.forEach(function (r) {
      var a = (r[rowField] || '').trim(), b = (r[colField] || '').trim();
      if (a && !rowSeen[a]) { rowSeen[a] = true; rowKeys.push(a); }
      if (b && !colSeen[b]) { colSeen[b] = true; colKeys.push(b); }
    });
    rowKeys.sort(); colKeys.sort();
    var map = {};
    rows.forEach(function (r) {
      var a = (r[rowField] || '').trim(), b = (r[colField] || '').trim();
      if (!(a && b)) return;
      if (!map[a]) map[a] = {};
      map[a][b] = (map[a][b] || 0) + 1;
    });
    var rowLabel = rowField === 'slotCode' ? 'Ca' : rowField;
    var html = '<table class="stats-table"><thead><tr><th scope="col">' + esc(rowLabel) + '</th>';
    colKeys.forEach(function (c) { html += '<th scope="col">' + esc(c) + '</th>'; });
    html += '<th scope="col" class="total">Tổng</th></tr></thead><tbody>';
    rowKeys.forEach(function (a) {
      html += '<tr><td scope="row" class="row-head">' + esc(a) + '</td>';
      var rowTotal = 0;
      colKeys.forEach(function (c) { var v = (map[a] && map[a][c]) || 0; rowTotal += v; html += '<td>' + fmtN(v) + '</td>'; });
      html += '<td class="total">' + fmtN(rowTotal) + '</td></tr>';
    });
    html += '<tr><td class="total">Tổng</td>';
    var colTotal = 0;
    colKeys.forEach(function (c) {
      var n = 0; rowKeys.forEach(function (a) { n += (map[a] && map[a][c]) || 0; });
      colTotal += n; html += '<td class="total">' + fmtN(n) + '</td>';
    });
    html += '<td class="total">' + fmtN(colTotal) + '</td></tr></tbody></table>';
    return html;
  }

  /* ===== Filter phễu Excel dùng chung (viewStaff + viewTasks, 2026-08-11): funnel header + dropdown checkbox ===== */

  function funnelCtx_(key) { return key === 'task' ? TASK_FILTER_CTX : STAFF_FILTER_CTX; }
  function hasFunnel_(filters, f) { return filters[f] && filters[f].length > 0; }
  function funnelMatches_(filters, r) {
    for (var f in filters) {
      var sel = filters[f];
      if (!sel || !sel.length) continue;
      if (sel.indexOf(String((r && r[f]) || '')) === -1) return false;
    }
    return true;
  }
  function funnelOptions_(rows, f) {
    var seen = {}; var out = [];
    (rows || []).forEach(function (r) {

  // Badge count mỗi option (2026-08-11): số row khớp các filter ĐANG ÁP Ở CỘT KHÁC

  // context lọc hiện tại → user biết chọn option sẽ còn bao nhiêu kết quả.
  function funnelOptionCounts_(rows, field, filters) {
    var others = {};
    var hasOther = false;
    for (var f in filters) {
      if (f === field) continue;                 // bỏ cột đang mở
      if (filters[f] && filters[f].length) { others[f] = filters[f]; hasOther = true; }
    }
    var counts = {};
    (rows || []).forEach(function (r) {
      if (hasOther && !funnelMatches_(others, r)) return;
      var v = String((r && r[field]) || '').trim();
      if (!v) return;
      counts[v] = (counts[v] || 0) + 1;

  function toggleFunnel(field, ev, key) {

    if (_funnel.col === field && _funnel.ctx === ctx && panel.style.display !== 'none') { closeFunnel(); return; }
    _funnel.col = field; _funnel.ctx = ctx;
    var r = th.getBoundingClientRect();
    var lbl = th.querySelector('.th-label');
    document.getElementById('sfpTitle').textContent = 'Lọc: ' + (lbl ? lbl.textContent : field);
    var sel = ctx.filters[field] || [];

  function renderFunnelOptions_(field, sel) {
    var ctx = _funnel.ctx;
    var rows = ctx.rows();

    var counts = funnelOptionCounts_(rows, field, ctx.filters);
    var html = opts.map(function (v) {

      var zero = !counts[v] ? ' zero' : '';

        '<span class="sfp-label">' + esc(v) + '</span>' +
        '<span class="sfp-count">' + (counts[v] || 0) + '</span></label>';
    }).join('') || '<div class="sfp-empty">(không có giá trị)</div>';

  /* ===== Âm thanh phản hồi quét (C1) — Web Audio API, không cần file =====
     error: buzz thấp 200Hz · scan: beep cao 880Hz — gate bởi SOUND_ON */
  var _audioCtx = null;
  function playBeep(type) {
    if (!SOUND_ON) return;
    try {
      if (!_audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        _audioCtx = new AC();
      }
      var ctx = _audioCtx;
      if (ctx.state === 'suspended') ctx.resume();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      if (type === 'error') {
        osc.type = 'square';
        osc.frequency.value = 200;
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
      } else {
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
      }
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } catch (e) { /* kiosk không hỗ trợ audio — bỏ qua */ }
  }

  var pasteFocusBack = null;
  function openPasteModal() {
    if (!CURRENT_TASK || !CURRENT_TASK.permission || !CURRENT_TASK.permission.canScanOpen) return;
    var m = document.getElementById('pasteModal');
    if (!m) return;
    pasteFocusBack = document.activeElement;
    m.setAttribute('aria-hidden', 'false');
    m.classList.add('open');
    var ta = document.getElementById('pasteTextarea');
        if (ta) { ta.value = ''; ta.oninput = updatePasteCount; updatePasteCount(); ta.focus(); }
        var sb = document.getElementById('btnPasteSubmit');
        if (sb) sb.disabled = false; // reset nếu lần trước đóng giữa chừng đang xử lý

        if (preview) { preview.style.display = 'none'; preview.innerHTML = ''; }

        if (!ta || !hint) return;
        var n = ta.value.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l !== ''; }).length;
        if (n > 0) {
          hint.textContent = 'Đã phát hiện ' + n + ' mã NV';

  function submitPaste() {
    var ta = document.getElementById('pasteTextarea');
    if (!ta) return;
    var submitBtn = document.getElementById('btnPasteSubmit');
    if (submitBtn && submitBtn.disabled) return; // đang xử lý — chống double-submit
    var lines = ta.value.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l !== ''; });
    if (!lines.length) { showToast('Chưa có mã nào', true); return; }
    if (lines.length > 200) { lines = lines.slice(0, 200); showToast('Đã giới hạn 200 dòng đầu', true); }
    // Dedup client-side — mã trùng cùng lần dán chỉ gửi 1 (server cũng chặn, tránh payload thừa)
    var seen = {}, dup = 0;
    var uniq = [];
    lines.forEach(function (l) {
      var k = l.toLowerCase();
      if (seen[k]) { dup++; return; }
      seen[k] = 1; uniq.push(l);
    });
    var preview = document.getElementById('pastePreview');
    var prog = document.getElementById('pasteProgress');
    var progText = document.getElementById('pasteProgressText');
    // GIỮ modal mở: progress bar + tổng kết ngắn TRONG modal (không đóng trước —
    // trước đây đóng modal rồi render vào preview ẩn → danh sách đã dán không thấy).
    if (prog) prog.style.display = '';
    if (progText) progText.textContent = dup > 0
      ? ('Đang xử lý ' + uniq.length + ' mã (bỏ ' + dup + ' mã trùng)…')
      : ('Đang xử lý ' + uniq.length + ' mã…');
    if (preview) { preview.style.display = 'none'; preview.innerHTML = ''; }
    if (submitBtn) submitBtn.disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        if (submitBtn) submitBtn.disabled = false;
        if (prog) prog.style.display = 'none';
        if (!res || !res.ok) {
          var errMsg = (res && res.message) || 'Lỗi khi dán mã';
          if (preview) { preview.innerHTML = '<div style="color:var(--danger);font-weight:600;">' + esc(errMsg) + '</div>'; preview.style.display = ''; }
          showToast(errMsg, true);
          return;
        }
        // Refresh counters & log từ server response, rồi (đúng yêu cầu) TỰ ĐÓNG modal
        // khi dữ liệu NV đã load xong — tổng kết ngọn qua toast thay vì preview trong modal.
        if (res.counters) { CURRENT_COUNTERS = res.counters; renderCounters(res.counters); }
        if (CURRENT_TASK && CURRENT_TASK.taskId === res.taskId) {
          // m4: silent reload — gate loadTaskDetail xử cả defer (đang quét → hoãn, queue cạn
          // → maybeReloadPending chạy). Bỏ check scanBusy local: khỏi 2 cơ chế cho 1 vấn đề.
          loadTaskDetail(CURRENT_TASK.taskId, true);
        }
        // P1-3: dán có mã thất bại → liệt kê từng mã NGAY trong modal và GIỮ modal mở
        // để user sửa; chỉ khi 0 lỗi mới tự đóng. `res.results` (per-code) server đã trả
        // sẵn nhưng client trước đây bỏ qua.
        if (res.failed > 0 && Array.isArray(res.results)) {
          var fails = res.results.filter(function (r) { return !r.ok; });
          if (fails.length) {
            var detail = '<div style="margin-bottom:8px;font-size:13px;font-weight:600;color:var(--warning);">Chi tiết thất bại:</div>';
            fails.forEach(function (r) {
              detail += '<div style="font-size:13px;padding:2px 0;border-bottom:1px solid var(--border);">'
                + '<span style="font-family:monospace;">' + esc(r.code) + '</span>'
                + ' — ' + esc(r.message || r.status || '') + '</div>';
            });
            if (preview) { preview.innerHTML = detail; preview.style.display = ''; }
            showToast('Đã dán ' + res.success + '/' + res.total + ' mã — ' + res.failed + ' thất bại', true);
            return; // giữ modal mở — user xem mã lỗi rồi dán lại
          }
        }
        var msg = 'Đã dán ' + res.success + '/' + res.total + ' mã'
          + (res.failed > 0 ? (' — ' + res.failed + ' thất bại') : '');
        if (dup > 0) msg += ' — bỏ ' + dup + ' mã trùng';
        showToast(msg, res.failed > 0);
        closePasteModal();
      })
      .withFailureHandler(function (err) {
        if (submitBtn) submitBtn.disabled = false;
        if (prog) prog.style.display = 'none';
        var errMsg = (err && err.message) || 'unknown';
        if (preview) { preview.innerHTML = '<div style="color:var(--danger);font-weight:600;">Lỗi server: ' + esc(errMsg) + '</div>'; preview.style.display = ''; }
        showToast('Lỗi dán mã: ' + errMsg, true);
      })
      .pasteCodesApi(CURRENT_TASK.taskId, uniq);
  }

  /* ===== T-1: Apply scan permission (owner gate) ===== */
  // Cờ khoá owner (non-owner ở phase OPEN) — các hàm UI khác (updateFinishBtnState,
  // updateQueueFullState) phải tôn trọng để không vô tình bật lại input/nút.
  var scanOwnerLocked = false;
  function applyScanPermission() {
    if (!CURRENT_TASK || !CURRENT_TASK.permission) return;
    var perm = CURRENT_TASK.permission;
    var scanInput = document.getElementById('scanInput');
    var btnToAttend = document.getElementById('btnToAttend');
    var pasteBtn = document.getElementById('btnPaste'); // may not exist yet, guard
    var banner = document.getElementById('scanPermissionBanner');
    var canScan = perm.canScanOpen;
    var isOpenPhase = CURRENT_TASK.phase === TASK_STATUS_C.OPEN || CURRENT_TASK.status === TASK_STATUS_C.OPEN;

    // Chỉ khoá khi non-owner ở phase OPEN — ATTEND (Điểm danh) mọi người quét được
    // (kể cả khi permission stale sau transition/reopen).
    scanOwnerLocked = isOpenPhase && !canScan;

    // Disable/enable scan input
    if (scanInput) {
      var taskDone = CURRENT_TASK.phase === TASK_STATUS_C.DONE || CURRENT_TASK.status === TASK_STATUS_C.DONE;
      var queueFull = SCAN_QUEUE.length >= SCAN_QUEUE_MAX;
      scanInput.disabled = taskDone || queueFull || scanOwnerLocked;
      if (scanOwnerLocked) {
        scanInput.placeholder = 'Chỉ owner mới quét được ở phase Mở (task này)';
      } else if (canScan) {
        scanInput.placeholder = 'Quét mã nhân viên…';
      }
    }

    // Show/hide banner
    if (!canScan && isOpenPhase) {
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'scanPermissionBanner';
        banner.style.cssText = 'background:#fff3e0;border:1px solid var(--warning);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:var(--warning);font-weight:600;';
        banner.textContent = 'Chỉ owner mới quét được ở phase Mở (task này)';
        var card = document.querySelector('.scan-col-left .card');
        if (card && card.parentNode) card.parentNode.insertBefore(banner, card);
      }
    } else {
      if (banner) { banner.remove(); }
    }

    // Ẩn "Chuyển điểm danh" khi non-owner bị khoá phase Mở — CHỈ ẩn, KHÔNG re-show:
    // khi không khoá, hiển thị theo phase do updateFinishBtnState quyết định
    // (chỉ phase OPEN mới hiện nút này — tránh hiện nhầm ở Điểm danh/Xong).
    if (btnToAttend && scanOwnerLocked) {
      btnToAttend.style.display = 'none';
    }

    // Nút Dán (topbar): CHỈ ẩn khi khoá — hiện/ẩn theo FREE+OPEN do renderScanView quyết.
    if (pasteBtn && scanOwnerLocked) {
      pasteBtn.style.display = 'none';
    }
  }

  document.addEventListener('keydown', function (e) {

      if (m && m.classList.contains('open')) { closeCreateModal(); return; }

      var fpanel = document.getElementById('staffFilterPanel');

    }
    // Tab giữ trong dialog khi mở
    if (e.key === 'Tab') {
      var m = document.querySelector('.about-overlay.open');
      if (!m) return;
      var focusables = m.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if (!focusables.length) return;
      var first = focusables[0], last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // Tên hiển thị từ email (v1): cắt trước @, title-case nhẹ. VD van.thanhnguyen@spxexpress.com → Van.thanhnguyen
  function displayName(email) {
    if (!email) return '—';
    var name = String(email).split('@')[0];
    return name || email;
  }
  /* ===== VIEW CONFIG — trang Cấu hình Admin (SettingsService: getSettingsApi/saveSettingsApi) =====
   * Sidebar chỉ hiện khi meta.isEditor (getMetaApi). Server gate editor (fail-closed).
   * roleMap: { email: role } — role hợp lệ khớp ROLES (Config.gs). */
  var CFG_ROLES = [
    { v: 'viewer',   l: 'Viewer — chỉ xem' },
    { v: 'operator', l: 'Operator — vận hành kiosk' },
    { v: 'manager',  l: 'Manager — quản lý vận hành' },
    { v: 'admin',    l: 'Admin — toàn quyền' },
  ];
  var CFG_LOADED = false; // đã render 1 lần — mở lại không fetch trùng

  function loadConfigView(btn) {
    var meta = document.getElementById('configMeta');
    var empty = document.getElementById('configEmpty');
    var saveBtn = document.getElementById('cfgSaveBtn');
    var wrap = document.getElementById('configWrap');
    if (meta) meta.textContent = 'Đang tải…';
    if (empty) empty.style.display = 'none';
    if (wrap) wrap.style.display = 'none';  // Mẫu B: ẩn cả khối 2 card khi tải
    if (saveBtn) saveBtn.style.display = 'none';
    setBtnBusy_(btn, '⟳ Đang tải…');
    function restore() { restoreBtnLabel_(btn, '⟳ Làm mới'); }
    google.script.run
      .withSuccessHandler(function (res) {
        restore();
        if (!res || !res.ok) {
          showToast((res && res.message) || 'Lỗi tải cấu hình', true);
          if (empty) empty.style.display = '';
          if (meta) meta.textContent = 'Không tải được';
          if (saveBtn) saveBtn.style.display = 'none';
          return;
        }
        renderConfigForm(res.settings || {});
        if (wrap) wrap.style.display = '';  // Mẫu B: hiện 2 card cạnh nhau
        if (saveBtn) saveBtn.style.display = '';  // Mẫu B: nút Lưu phân quyền trên view-topbar
        if (meta) meta.textContent = 'Đã tải';
        markServerOk();
      })
      .withFailureHandler(function (err) {
        restore();
        markServerFail();
        showToast('Lỗi tải cấu hình: ' + err.message, true);
        if (meta) meta.textContent = 'Lỗi kết nối';
      })
      .getSettingsApi();
  }

  // ===== Cấu hình vận hành — danh sách mục, mỗi mục Sửa/Xoá lưu ngay (2026-08-11) =====
  var CFG_FIELDS = [
    { key: 'defaultStation', label: 'Station mặc định', placeholder: 'VD: KHO-01' },
    { key: 'defaultSlotCode', label: 'Slot Code (Ca) mặc định', placeholder: 'VD: Ca 1' },
    { key: 'defaultTeam', label: 'Team mặc định', placeholder: 'VD: Team A' },
    // department KHÔNG ở đây — đã chuyển thành group (CFG_GROUPS): key đơn Sửa/Xoá
    // sẽ gửi {department: string} → server group branch xóa SẠCH danh sách Department.
  ];
  var CFG_STATE = {}; // bản sao settings hiện tại — render lại khi Huỷ sửa
  // Group lists (Config sheet 4 cột Key/Value/Group/Index — 2026-08-11): danh sách lựa chọn
  // cho dropdown tạo task / filter. Mỗi group 1 section: item Sửa/Xoá + nút + Thêm.
  var CFG_GROUPS = [
    { key: 'stations', label: 'Danh sách Station' },
    { key: 'teams', label: 'Danh sách Team' },
    { key: 'slotcodes', label: 'Danh sách Slot Code (Ca)' },
    { key: 'departments', label: 'Danh sách Department' },
  ];

  function renderConfigForm(s) {
    CFG_STATE = s || {};
    renderCfgList();
    renderRoleRows((s && s.roleMap) || {});
    CFG_LOADED = true;
  }

  function renderCfgList() {
    var box = document.getElementById('cfgList');
    if (!box) return;
    // (1) Single defaults — pre-select khi tạo task
    var html = CFG_FIELDS.map(function (f) {
      var v = CFG_STATE[f.key];
      var val = (v === null || v === undefined || v === '') ? '<span class="cfg-empty-val">(trống)</span>' : esc(String(v));
      return '<div class="cfg-item" data-key="' + f.key + '">'
        + '<div class="cfg-item-label">' + esc(f.label) + '</div>'
        + '<div class="cfg-item-value">' + val + '</div>'
        + '<div class="cfg-item-actions">'
          + '<button type="button" class="btn btn-outline btn-sm" onclick="editCfgField(\'' + f.key + '\')">Sửa</button>'
          + '<button type="button" class="btn btn-danger btn-sm" onclick="deleteCfgField(\'' + f.key + '\')">Xoá</button>'
        + '</div>'
      + '</div>';
    }).join('');
    // (2) Group lists — danh sách lựa chọn (station/team/slotcode/department) — grid 2 cột desktop
    html += '<div class="cfg-group-sep" role="separator" aria-label="Danh sách lựa chọn"></div>';
    html += '<div class="cfg-groups">' + CFG_GROUPS.map(function (g) { return cfgGroupHtml_(g); }).join('') + '</div>';
    box.innerHTML = html;
  }

  // Render 1 group section: title + item list (Sửa/Xoá) + nút Thêm
  function cfgGroupHtml_(g) {
    var list = safeArr(CFG_STATE[g.key]);
    var items = list.length
      ? list.map(function (v, i) {
          return '<div class="cfg-item cfg-item-group" data-group="' + g.key + '" data-idx="' + i + '">'
            + '<div class="cfg-item-label cfg-item-idx">#' + (i + 1) + '</div>'
            + '<div class="cfg-item-value">' + esc(String(v)) + '</div>'
            + '<div class="cfg-item-actions">'
              + '<button type="button" class="btn btn-outline btn-sm" onclick="editCfgGroupItem(\'' + g.key + '\',' + i + ')">Sửa</button>'
              + '<button type="button" class="btn btn-danger btn-sm" onclick="deleteCfgGroupItem(\'' + g.key + '\',' + i + ')">Xoá</button>'
            + '</div>'
          + '</div>';
        }).join('')
      : '<div class="cfg-empty-val cfg-group-empty">(chưa có — bấm + Thêm)</div>';
    return '<div class="cfg-group" data-group="' + g.key + '">'
      + '<div class="cfg-group-title">' + esc(g.label) + ' <span class="cfg-hint">' + list.length + ' mục</span></div>'
      + items
      + '<button type="button" class="btn btn-outline btn-sm cfg-group-add" onclick="addCfgGroupItem(\'' + g.key + '\')">+ Thêm</button>'
    + '</div>';
  }

  // Sửa item group: thay item idx bằng input + Lưu/Huỷ
  function editCfgGroupItem(group, idx) {
    var box = document.getElementById('cfgList');
    if (!box) return;
    var list = safeArr(CFG_STATE[group]);
    var cur = list[idx] === undefined ? '' : list[idx];
    var item = box.querySelector('.cfg-item-group[data-group="' + group + '"][data-idx="' + idx + '"]');
    if (!item) return;
    item.innerHTML = '<div class="cfg-item-label cfg-item-idx">#' + (idx + 1) + '</div>'
      + '<input class="cfg-input cfg-edit-input" id="cfgGroupEditInput" value="' + escAttr(String(cur)) + '" placeholder="Giá trị" autocomplete="off">'
      + '<div class="cfg-item-actions">'
        + '<button type="button" class="btn btn-sm" onclick="saveCfgGroupItem(\'' + group + '\',' + idx + ')">Lưu</button>'
        + '<button type="button" class="btn btn-ghost btn-sm" onclick="cancelCfgGroupEdit(\'' + group + '\',' + idx + ')">Huỷ</button>'
      + '</div>';
    var inp = document.getElementById('cfgGroupEditInput');
    if (inp) { inp.focus(); inp.select(); }
  }

  function cancelCfgGroupEdit(group) {
    // Huỷ sau khi Thêm (item '' chưa nhập) → pop item rỗng cuối, không để lại dòng trống
    if (group && Array.isArray(CFG_STATE[group])) {
      var list = CFG_STATE[group];
      if (list.length && String(list[list.length - 1] || '').trim() === '') list.pop();
    }
    renderCfgList();
  }

  function saveCfgGroupItem(group, idx) {
    var inp = document.getElementById('cfgGroupEditInput');
    var v = inp ? inp.value.trim() : '';
    var list = safeArr(CFG_STATE[group]).slice();
    list[idx] = v;
    var btn = document.querySelector('.cfg-item-group[data-idx="' + idx + '"] .cfg-item-actions button');
    setBtnBusy_(btn, 'Đang lưu…');
    var patch = {}; patch[group] = list;
    saveConfigPatch(patch, 'Đã lưu ' + groupLabel_(group));
  }

  function deleteCfgGroupItem(group, idx) {
    showConfirm('Xoá mục', 'Xoá "' + String(safeArr(CFG_STATE[group])[idx]) + '" khỏi ' + groupLabel_(group) + '?', function () {
      var list = safeArr(CFG_STATE[group]).slice();
      list.splice(idx, 1);
      var patch = {}; patch[group] = list;
      saveConfigPatch(patch, 'Đã xoá mục khỏi ' + groupLabel_(group));
    });
  }

  function addCfgGroupItem(group) {
    // KHÔNG gọi server: append '' cục bộ + mở ô nhập ngay (server lọc item rỗng → gọi server
    // rồi reload sẽ không thấy row mới — UX hỏng). User nhập giá trị → Lưu → save cả mảng.
    var list = safeArr(CFG_STATE[group]).slice();
    list.push('');
    CFG_STATE[group] = list;
    renderCfgList();
    editCfgGroupItem(group, list.length - 1);
  }

  function groupLabel_(group) {
    for (var i = 0; i < CFG_GROUPS.length; i++) { if (CFG_GROUPS[i].key === group) return CFG_GROUPS[i].label; }
    return group;
  }

  function editCfgField(key) {
    var box = document.getElementById('cfgList');
    if (!box) return;
    var f = null;
    for (var i = 0; i < CFG_FIELDS.length; i++) { if (CFG_FIELDS[i].key === key) { f = CFG_FIELDS[i]; break; } }
    if (!f) return;
    var cur = CFG_STATE[key];
    box.innerHTML = '<div class="cfg-item cfg-item-edit" data-key="' + key + '">'
      + '<div class="cfg-item-label">' + esc(f.label) + '</div>'
      + '<input class="cfg-input cfg-edit-input" id="cfgEditInput" value="' + escAttr(String(cur === null || cur === undefined ? '' : cur)) + '" placeholder="' + escAttr(f.placeholder) + '" autocomplete="off">'
      + '<div class="cfg-item-actions">'
        + '<button type="button" class="btn btn-sm" onclick="saveCfgField(\'' + key + '\')">Lưu</button>'
        + '<button type="button" class="btn btn-ghost btn-sm" onclick="cancelCfgEdit()">Huỷ</button>'
      + '</div>'
    + '</div>';
    var inp = document.getElementById('cfgEditInput');
    if (inp) { inp.focus(); inp.select(); }
  }

  function cancelCfgEdit() { renderCfgList(); }

  function saveCfgField(key) {
    var inp = document.getElementById('cfgEditInput');
    var v = inp ? inp.value.trim() : '';
    var btn = document.querySelector('.cfg-item-edit .cfg-item-actions button');
    setBtnBusy_(btn, 'Đang lưu…');
    var patch = {}; patch[key] = v;
    saveConfigPatch(patch, 'Đã lưu ' + fieldLabel_(key));
  }

  function deleteCfgField(key) {
    showConfirm('Xoá cấu hình', 'Xoá \"' + fieldLabel_(key) + '\" — giá trị sẽ trống (dùng mặc định).', function () {
      var patch = {}; patch[key] = '';
      saveConfigPatch(patch, 'Đã xoá ' + fieldLabel_(key));
    });
  }

  function fieldLabel_(key) {
    for (var i = 0; i < CFG_FIELDS.length; i++) { if (CFG_FIELDS[i].key === key) return CFG_FIELDS[i].label; }
    return key;
  }

  // Lưu patch 1 mục (vận hành) — server nhận patch, trả thông báo
  function saveConfigPatch(patch, okMsg) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) {
          showToast((res && res.message) || 'Lỗi lưu cấu hình', true);
          renderCfgList(); // thoát edit state — hiện giá trị server cũ
          return;
        }
        showToast(okMsg || res.message || 'Đã lưu', false);
        loadConfigView(); // đọc lại từ server (cache đã invalidate)
      })
      .withFailureHandler(function (err) {
        markServerFail();
        showToast('Lỗi lưu cấu hình: ' + err.message, true);
        renderCfgList(); // thoát edit state — tránh kẹt input
      })
      .saveSettingsApi(patch);
  }

  function renderRoleRows(map) {
    var box = document.getElementById('cfgRoleRows');
    if (!box) return;
    box.innerHTML = '';
    var keys = Object.keys(map || {});
    keys.forEach(function (em) { appendRoleRow(em, map[em]); });
    if (!keys.length) appendRoleRow('', 'viewer');
  }

  function appendRoleRow(email, role) {
    var box = document.getElementById('cfgRoleRows');
    if (!box) return;
    var row = document.createElement('div');
    row.className = 'cfg-role-row';
    var em = document.createElement('input');
    em.className = 'cfg-input cfg-role-email';
    em.type = 'text'; em.placeholder = 'email@spxexpress.com'; em.autocomplete = 'off';
    em.value = email || '';
    var sel = document.createElement('select');
    sel.className = 'cfg-input cfg-role-select';
    CFG_ROLES.forEach(function (r) {
      var o = document.createElement('option');
      o.value = r.v; o.textContent = r.l;
      sel.appendChild(o);
    });
    var known = false;
    for (var ri = 0; ri < CFG_ROLES.length; ri++) { if (CFG_ROLES[ri].v === role) { known = true; break; } }
    sel.value = known ? role : 'viewer';  // role lạ trong config cũ → clamp về viewer (không lưu '')
    var del = document.createElement('button');
    del.type = 'button'; del.className = 'btn btn-danger btn-sm';
    del.textContent = '✕'; del.title = 'Xóa dòng role'; del.setAttribute('aria-label', 'Xóa dòng role');
    del.onclick = function () { row.parentNode.removeChild(row); };
    row.appendChild(em); row.appendChild(sel); row.appendChild(del);
    box.appendChild(row);
  }

  function addRoleRow() { appendRoleRow('', 'viewer'); }

  function collectRoleMap() {
    var map = {};
    var rows = document.querySelectorAll('#cfgRoleRows .cfg-role-row');
    for (var i = 0; i < rows.length; i++) {
      var em = rows[i].querySelector('.cfg-role-email');
      var sel = rows[i].querySelector('.cfg-role-select');
      var email = em ? em.value.trim().toLowerCase() : '';
      if (!email) continue; // bỏ dòng trống email
      map[email] = sel ? sel.value : 'viewer';
    }
    return map;
  }

  function saveConfig(btn) {
    // Nút "Lưu phân quyền" (view-topbar) — chỉ gửi roleMap (mục vận hành tự lưu khi Sửa/Xoá)
    var patch = { roleMap: collectRoleMap() };
    setBtnBusy_(btn, 'Đang lưu…');
    function restore() { restoreBtnLabel_(btn, '💾 Lưu phân quyền'); }
    function setStatus(t, ok) {
      var st = document.getElementById('cfgStatus');
      if (st) { st.textContent = t; st.style.color = ok ? 'var(--success)' : 'var(--danger)'; }
    }
    google.script.run
      .withSuccessHandler(function (res) {
        restore();
        if (!res || !res.ok) { showToast((res && res.message) || 'Lỗi lưu phân quyền', true); setStatus('Lỗi lưu', false); return; }
        showToast(res.message || 'Đã lưu phân quyền', false);
        setStatus('Đã lưu ' + new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }), true);
        loadConfigView(); // đọc lại từ server (cache đã invalidate)
      })
      .withFailureHandler(function (err) {
        restore();
        markServerFail();
        showToast('Lỗi lưu phân quyền: ' + err.message, true);
      })
      .saveSettingsApi(patch);
  }

  function loadMetaAndOptions() {
    google.script.run
      .withSuccessHandler(function (meta) {
        META = meta;
        // Hiển thị user ở header (v1 style) — chỉ tên, KHÔNG badge quyền
        var uEl = document.getElementById('userEmail');
        if (uEl) {
          var em = (meta && meta.userEmail) || '';
          uEl.textContent = em ? displayName(em) : 'Khách';
          uEl.title = em || 'Chưa đăng nhập';
        }
        // Header mới không còn #appTitle — cập nhật brand title nếu có
        var brand = document.getElementById('brandTitle');
        if (brand && meta.appTitle) brand.textContent = meta.appTitle;
        // Trang Cấu hình (viewConfig) — chỉ hiện mục sidebar khi editor (getMetaApi.isEditor)
        var cfgItem = document.getElementById('sideConfigItem');
        if (cfgItem) cfgItem.style.display = (meta && meta.isEditor) ? '' : 'none';
        refreshAll();
        // Prefetch nền StaffData — mở Thống kê/Dữ liệu lần đầu KHÔNG delay
        // (CDP: cold 280ms → warm ~22ms; silent = không toast lúc khởi động; 2026-08-11)
        if (typeof ensureStaffData === 'function') { ensureStaffData(false, true); }
        // Fix #1: preload staffIndex cache sớm (fire-and-forget) → tên NV lạ hiện NGAY
        // khi quét đầu thay vì về sau. KHÔNG block UI — chỉ warm cache.
        try { google.script.run.withSuccessHandler(function(r){ if (r && r.index) CLIENT_STAFF_INDEX = r.index; }).warmStaffCacheApi(); } catch (e) { /* ignore */ }
        syncHeaderH();  // FIX(2026-08-09): title/user đã render xong — đo lại header thật (--header-h)
      })
      .withFailureHandler(function (err) {
        markServerFail();  // P2: RPC fail = server unreachable → netDot offline
        hideLoadingOverlay();
        showToast('Lỗi tải meta: ' + err.message, true);
        refreshAll();
      })
      .getMetaApi();
  }

  // P2: anti-chồng RPC — bấm '⟳ Làm mới' liên tục (hoặc load tái-kích hoạt khi đang chạy)
  // → 2 luồng getTaskListApi + getFilterOptionsApi đè nhau. Nhả lock khi CẢ HAI RPC hoàn tất
  // (đếm _refreshPending); timeout 5s chỉ là bảo hiểm phòng RPC treo — không chốt 1.5s cứng
  // (lock hết sớm khi RPC chậm sẽ cho phép chồng luồng mới). Disable nút visual khi khóa.
  var _refreshLock = false;
  var _refreshPending = 0;
  function _releaseRefreshLock() {
    if (_refreshPending <= 0) return;  // clamp — timeout 5s đã nhả, RPC trả về sau không đẩy âm
    _refreshPending--;
    if (_refreshPending > 0) return;  // còn RPC kia chưa xong — giữ khóa
    _refreshLock = false;
    hideModalSpin();  // B3: đóng spinModal khi toàn bộ refresh xong
    var btn = document.getElementById('btnRefresh');
    if (btn) { btn.disabled = false; btn.style.opacity = ''; }
  }
  function refreshAll() {
    if (_refreshLock) return;  // đang load rồi — bỏ qua, tránh chồng RPC
    showModalSpin('Đang làm mới…');  // B3: spinModal khi bấm Làm mới (ẩn ở _releaseRefreshLock)
    _refreshLock = true;
    _refreshPending = 2;  // loadFilterOptions + loadTaskList
    var btn = document.getElementById('btnRefresh');
    if (btn) { btn.disabled = true; btn.style.opacity = .6; }
    loadFilterOptions();
    loadTaskList();
    // Header "Làm mới" cũng làm mới StaffData khi đang ở Thống kê/Dữ liệu (1 nút = tất cả)
    if (ACTIVE_PAGE === 'stats' || ACTIVE_PAGE === 'data') loadStaffView();
    // bảo hiểm an toàn: phòng RPC không bao giờ resolve (treo) — vẫn nhả sau 5s
    setTimeout(function () {
      if (_refreshPending > 0) _refreshPending = 1;  // ép nhả ở vòng kế
      _releaseRefreshLock();
    }, 5000);
  }

  function loadFilterOptions() {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.ok) { _releaseRefreshLock(); showToast(res.message, true); return; }
        STATION_GROUPS = res.stationGroups || [];
        CFG_DEFAULTS = res.defaults || CFG_DEFAULTS;
        CFG_LISTS = res.lists || { stations: [], teams: [], slotcodes: [] };
        // Admin khai báo station trong Config (chưa có data) vẫn tạo task được.
        var canCreate = STATION_GROUPS.length > 0 || (CFG_LISTS.stations || []).length > 0;
        document.getElementById('btnCreate').disabled = !canCreate;
        // Modal mở trước khi options về (load chậm): SEL chưa chọn gì → áp dụng defaults ngay.
        // Đã có chọn tay thì KHÔNG đè (tôn trọng thao tác user).
        if (SEL.station === '' && anyModalOpen()) applySelDefaults();

        renderAllCols();  // refresh 4 cột khi data mới về (nếu modal đang mở)
        markServerOk();  // RPC success → server sống lại (netDot hồi phục — phủ cả trường hợp chỉ load options)
        _releaseRefreshLock();
      })
      .withFailureHandler(function (err) { markServerFail(); _releaseRefreshLock(); showToast('Lỗi tải options: ' + err.message, true); })
      .getFilterOptionsApi();
  }

  function setCreateTotal(n) {
    var c = document.getElementById('createTotalNum');
    if (!c) return;
    c.textContent = (typeof n === 'number' && n >= 0) ? n : '—';
  }
  var _previewTimer = null;
  var _previewSeq = 0;   // h2: RPC preview cũ (đã fire) không được ghi đè trạng thái hiện tại (vd: chọn 'Tự do')
  function updateCreatePreview() {
    var station = SEL.station;
    var slotCode = groupSelectedSlots();
    var team = groupSelectedTeams();
    var contractType = SEL.contractTypes;
    var date = SEL.date;
    if (isFreeSel()) { _previewSeq++; clearTimeout(_previewTimer); setCreateTotal('—'); return; }
    // Cascade: đếm theo filter hiện có — station bắt buộc; team/slot rỗng = 'Tất cả' (không lọc)
    if (!station) { _previewSeq++; clearTimeout(_previewTimer); setCreateTotal(0); return; }
    clearTimeout(_previewTimer);
    var seq = ++_previewSeq;
    _previewTimer = setTimeout(function () {
      google.script.run
        .withSuccessHandler(function (res) {
          if (seq !== _previewSeq) return;   // có filter mới hơn — bỏ kết quả cũ
          if (!res || !res.ok) { setCreateTotal(0); return; }
          setCreateTotal(res.count);
        })
        .withFailureHandler(function () {
          if (seq !== _previewSeq) return;
          setCreateTotal(0);
        })
        .previewStaffApi({ station: station, slotCode: slotCode, team: team, contractType: contractType, date: date });
    }, 200);
  }
  var STATION_GROUPS = [];   // từ server getFilterOptionsApi.stationGroups: { station, slotCodes:[{slotCode,teams}], dates }
  // defaults từ Config sheet (SettingsService qua getFilterOptionsApi.defaults) — pre-select tạo task
  var CFG_DEFAULTS = { station: '', slotCode: '', team: '' };

  // Union 2 mảng, dedup, giữ thứ tự a trước rồi b (giá trị trùng chỉ lấy của a).
  function mergeOpts_(a, b) {
    var out = [];
    // Object.create(null): tránh prototype collision (key 'constructor'/'toString'… bị coi là đã thấy)
    var seen = Object.create(null);
    [a, b].forEach(function (src) {
      (src || []).forEach(function (v) {
        var k = String(v);
        if (v === '' || v === undefined || v === null) return;
        if (seen[k]) return;
        seen[k] = true;
        out.push(v);
      });
    });
    return out;
  }

  function toggleArr(arr, val, on) {

  function initSelEvents() {
    var form = document.getElementById('createForm');
    if (!form) return;
    form.addEventListener('change', function (e) {

    form.addEventListener('click', function (e) {

      if (!chip) return;
      var col = chip.getAttribute('data-col');
      var val = chip.getAttribute('data-val');
      if (!col || val === null || val === undefined) return;
      if (col === 'station') {
        if (SEL.station !== val) {
          SEL.station = val;
          SEL.teams = []; SEL.slots = []; SEL.contractTypes = []; SEL.date = '';
          renderAllSelects();
        }
        refreshModeUI(); updateCreatePreview();
        return;
      }
      if (col === 'date') {
        SEL.date = (SEL.date === val) ? '' : val;
        renderAllSelects();
        refreshModeUI();
        updateCreatePreview();
        return;
      }
      var arr = (col === 'team') ? SEL.teams : (col === 'slot') ? SEL.slots : SEL.contractTypes;
      var pressed = chip.getAttribute('aria-pressed') === 'true';
      // Chip 'Tất cả' — toggle: (a) đang RỖNG (không lọc) → chọn hết; (b) đang CHỌN HẾT → bỏ hết;
      // (c) đang chọn vài giá trị → chọn hết. Rỗng = 'không lọc' = Tất cả về mặt lọc (server bỏ lọc mảng rỗng).
      if (val === '__ALL__') {
        var allOpts = (col === 'team') ? mergeOpts_(CFG_LISTS.teams, stationTeams())
          : (col === 'slot') ? mergeOpts_(CFG_LISTS.slotcodes, selSlotOptions()).filter(function (v) { return v !== SLOT_FREE_MAGIC; })
          : selContractOptions();
        var isEmpty = arr.length === 0;
        var isFull = allOpts.length > 0 && allOpts.every(function (v) { return arr.indexOf(v) !== -1; });
        arr.length = 0;
        // Rỗng hoặc chưa đủ → chọn hết; đang chọn hết → bỏ hết (giữ rỗng)
        if (isEmpty || !isFull) { arr.push.apply(arr, allOpts); }
        // slot: chọn/bỏ 'Tất cả' → thoát free mode (bỏ magic Tự do nếu có)

        }
        renderAllSelects(); refreshModeUI(); updateCreatePreview();

      refreshModeUI();

  function loadTaskList() {
    setListMode('all'); // đảm bảo quay lại header/thông điệp danh sách khi reload (clear từ search/refresh)
    var skel = document.getElementById('taskSkeleton');
    var tbl = document.getElementById('taskListTable');

    // P2 (SWR an toàn): cache danh sách còn hạn (<TTL) → render NGAY từ bộ nhớ,
    // KHÔNG skeleton — quay lại từ màn quét không còn chờ RPC. RPC nền vẫn chạy
    // để sync dữ liệu mới nhất (khi có thay đổi, bảng tự cập nhật).
    var cacheHit = LAST_TASK_LIST.tasks && (Date.now() - LAST_TASK_LIST.ts) < CACHE_TTL_MS;
    if (cacheHit) {
      renderTaskList_(LAST_TASK_LIST.tasks);
    } else {
      // Skeleton shimmer ngay lập tức — phản hồi tức thì thay vì "treo"
      if (skel) skel.style.display = '';
      if (tbl) tbl.style.display = 'none';
      if (empty) empty.style.display = 'none';
      // I9: đang tải → hiện '…' thay vì số 0 gây hiểu nhầm
      var cntLoading = document.getElementById('taskCount');
      if (cntLoading) cntLoading.textContent = '…';
    }
    google.script.run
      .withSuccessHandler(function (tasks) {
        hideLoadingOverlay();  // ẩn ngay khi callback về — KHÔNG phụ thuộc render (phòng render throw → overlay treo)
        LAST_TASK_LIST = { tasks: safeArr(tasks), ts: Date.now() };  // cập nhật cache
        try { renderTaskList_(safeArr(tasks)); }
        catch (e) { showToast('Lỗi hiển thị danh sách: ' + (e && e.message ? e.message : e), true); }
        markServerOk();  // P2: RPC thành công → server sống lại → netDot hồi phục
        _releaseRefreshLock();  // P2: RPC xong → nhả lock refresh (nếu dở)
      })
      .withFailureHandler(function (err) {
        markServerFail();  // P2: RPC fail → server offline
        _releaseRefreshLock();
        // Cache-reuse: RPC nền lỗi → giữ bảng đang hiển thị (cache), không phá UX
        if (!cacheHit) {
          if (skel) skel.style.display = 'none';
          if (tbl) tbl.style.display = '';

        }
        hideLoadingOverlay();
      })
      .getTaskListApi();

  // Render bảng danh sách task (dùng chung cho full-load và cache-reuse)
    function renderTaskList_(tasks) {
      var skel = document.getElementById('taskSkeleton');
      var tbl = document.getElementById('taskListTable');
      var empty = document.getElementById('taskEmpty');
      var body = document.getElementById('taskListBody');
      var cnt = document.getElementById('taskCount');

      var all = safeArr(tasks).filter(function (t) { return funnelMatches_(TASK_FILTERS, t); });
      // thead động (funnel icon + trạng thái .on) — chỉ chế độ danh sách, không phải search NV
      var head = document.getElementById('taskListHead');
      if (head && LIST_MODE !== 'search') head.innerHTML = taskHeadHtml_();
      body.innerHTML = '';
      if (skel) skel.style.display = 'none';
      if (tbl) tbl.style.display = '';
      if (cnt) cnt.textContent = all.length;
      if (!all.length) {
        if (empty) empty.style.display = '';
        var emptyTxt = document.getElementById('taskEmptyText');
        var hasFilter = Object.keys(TASK_FILTERS).some(function (f) { return TASK_FILTERS[f] && TASK_FILTERS[f].length; });
        if (emptyTxt) {
          // Có filter đang áp → báo khớp lọc; hết filter → reset về message mặc định
          // (fix 2026-08-11: trước chỉ set khi có filter, xoá filter mà dataset 0 task → message cũ dính)
          emptyTxt.innerHTML = hasFilter
            ? 'Không có task khớp bộ lọc đang áp — bấm <b>Xoá lọc</b> trên funnel để xem toàn bộ'
            : 'Chưa có task nào — chọn <b>Station / Ca / Team</b> ở trên rồi nhấn <b>+ Tạo task</b>';
        }
        renderPaginator_('taskPagination', 0, 1, 'goListPage', LIST_PAGE_SIZE);
        return;
      }
      if (empty) empty.style.display = 'none';
      // Pagination: slice theo trang hiện tại (LIST_PAGE_SIZE=100)
      var total = all.length;
      var totalPages = Math.max(1, Math.ceil(total / LIST_PAGE_SIZE));
      if (LIST_PAGE > totalPages) LIST_PAGE = totalPages;

          '<td class="num">' + (t.total || 0) + '</td>' +
          '<td class="num">' + (t.scanned || 0) + '</td>' +
          '<td class="num">' + (t.extra || 0) + '</td>' +
          '<td>' + taskStatusBadge(t.status) + '</td>' +
          '<td>' + esc(t.createdAtText || t.createdAt || '') + '</td>' +
          '<td>' + esc(displayName(t.createdBy || '')) + '</td>' +

        body.appendChild(tr);

  function openScan(taskId) {

    // KHÔNG spinner + RPC nền sync im lặng — hết chờ đợi khi quay lại mở cùng task.
    if (CURRENT_TASK && CURRENT_TASK.taskId === taskId
        && LAST_SCAN_VIEW.taskId === taskId
        && Date.now() - LAST_SCAN_VIEW.ts < CACHE_TTL_MS) {
      renderScanView({ task: CURRENT_TASK, log: CURRENT_LOG, counters: CURRENT_COUNTERS });
      hideLoadingOverlay();  // phòng nếu overlay còn từ lần trước

  // Render view scan từ data (dùng chung cho full-load và cache-reuse)
  function renderScanView(data) {
    var skel = document.getElementById('scanSkeleton');
    var tbl = document.getElementById('scanTable');
    var empty = document.getElementById('scanEmpty');
    CURRENT_TASK = data.task;
    // Server không trả field phase (function closure không serialize được) — tính lại
    // từ status ở client để tránh lỗi "unidentified" khi cache miss.
    if (CURRENT_TASK && !CURRENT_TASK.phase) {
      CURRENT_TASK.phase = CURRENT_TASK.status === TASK_STATUS_C.ATTEND ? 'attend'
        : (CURRENT_TASK.status === TASK_STATUS_C.DONE ? 'done' : 'open');

      ' · <b>' + esc(phaseLabel) + '</b>' + esc(phaseHint);

    if (tbl) tbl.style.display = '';
    renderScanTable(safeArr(data.log));
    // P1: task đã có scan → khôi phục scan card (không reset về "Chưa có")
    restoreScanCard(safeArr(data.log));
    CURRENT_COUNTERS = data.counters || { scanned: 0, absent: 0, extra: 0 };
    renderCounters(CURRENT_COUNTERS);

    // T-2: Nút "Dán danh sách mã" trên view-topbar — chỉ hiện khi FREE + open + canScanOpen.
    // (nút tĩnh trong HTML; ở đây chỉ bật/tắt display theo task vừa render)
    var pasteBtn = document.getElementById('btnPaste');
    var isFree = data.task.taskType === TASK_TYPE_C.FREE;
    var isOpenPhase = data.task.phase === TASK_STATUS_C.OPEN || data.task.status === TASK_STATUS_C.OPEN;
    var perm = data.task.permission || {};
    if (pasteBtn) {
      pasteBtn.style.display = (isFree && isOpenPhase && perm.canScanOpen) ? '' : 'none';

    // Quét được khi: phase2 (Điểm danh) HOẶC task Đối chiếu (RECONCILE, phase1 vẫn ghi
        // Giờ có mặt được). Task Quét tự do (FREE) cũng 2-phase: phase1 ghi Giờ có mặt, chuyển Điểm danh, phase2 ghi Giờ quét (V2 FREE là 2-phase) — phải bấm
        // "Chuyển điểm danh" (phase2) mới quét được (tránh ghi Giờ có mặt mà sheet thiếu Giờ quét).
        var isReconcile = data.task.taskType === TASK_TYPE_C.RECONCILE;
        // P1: canScan chỉ dựa trên phase (không dùng isReconcile/isFree) — source of truth.
        // task DONE (status DONE hoặc phase DONE) => canScan = false. applyScanPermission() sẽ gộp owner-gate + queue-full.
        var isDone = data.task.phase === TASK_STATUS_C.DONE || data.task.status === TASK_STATUS_C.DONE;
        var canScan = !isDone;

          : 'Task đã kết thúc — không thể quét';

        // F: đồng bộ indicator sort với phase vừa render (phase2 → cột Giờ quét)
        updateSortIndicators();
        // T-1: áp dụng owner gate CUỐI CÙNG — nguồn quyết định cuối cho disabled/placeholder/
        // nút Chuyển điểm danh/nút paste (không bị logic phase ở trên ghi đè).
        applyScanPermission();
        // Mobile/tablet (pointer:coarse): KHÔNG focus ngay — bàn phím ảo tự bật đè màn hình
        // khi mở task quét (2026-08-11). Kiosk desktop giữ auto-focus như cũ.
        if (canScan && !scanOwnerLocked && !COARSE_POINTER) {
          scanInput.focus();
        }
  }

  // silent=true: gọi RPC nền (đã render từ cache) — KHÔNG show spinner, KHÔNG reset UI
  function loadTaskDetail(taskId, silent) {
    var seq = ++SCAN_LOAD_SEQ;

      .withSuccessHandler(function (res) {

        if (silent && scanBusy()) { _pendingSilentReload = taskId; BG_TASKS.silent = 1; updateBgIndicator(); return; } // m4: hoãn, reload khi queue idle

      })
      .withFailureHandler(function (err) {

        if (seq !== SCAN_LOAD_SEQ) return; // response của task cũ — bỏ qua
        hideLoadingOverlay();  // P2: load lỗi cũng ẩn spinner
