<script>
  /* ============================================================
   * MODULE: app-scan.html — viewScan — render log/bảng/sort + scan queue optimistic + actions + toast
   * Tách từ app.html (2026-08-13 — P2-2 tách module client).
   * Nạp qua index.html (directive include app-scan) — script block
   * riêng, chung global scope với các module khác (thứ tự include quan trọng).
   * ============================================================ */
  var SCAN_LOAD_SEQ = 0; // chống response task cũ ghi đè khi chuyển task nhanh
  // P2 (SWR an toàn): snapshot task vừa xem — quay lại + mở cùng task trong 15s
  // render NGAY từ bộ nhớ (không spinner, không chờ RPC) + gọi RPC nền sync im lặng.
  // TTL 15s khớp server TASK_DETAIL — không bao giờ hiển thị data stale hơn server.
  var LAST_SCAN_VIEW = { taskId: null, ts: 0 };
  var CACHE_TTL_MS = 15000; // TTL chung: scan view + task list (khớp server TASK_DETAIL)
  // P2 (SWR an toàn): snapshot danh sách task — quay lại từ màn quét trong 15s
  // render NGAY từ bộ nhớ (không skeleton) + RPC nền sync im lặng.
  // TTL dùng chung CACHE_TTL_MS — không bao giờ hiển thị data stale hơn server.
  var LAST_TASK_LIST = { tasks: null, ts: 0 };
  // Lưu kết quả tìm NV hiện tại (để goListPage render lại đúng trang).
  var LAST_SEARCH_ROWS = [];
  // Lưu kết quả tìm TASK hiện tại (mode 'task') — render lại trang không mất kết quả.
  var LAST_TASK_SEARCH = [];
  function invalidateClientCaches_() {
    LAST_TASK_LIST = { tasks: null, ts: 0 };
    LAST_SCAN_VIEW = { taskId: null, ts: 0 };
    _pendingSilentReload = null; // m4: data mới → bỏ reload dồn lại (task sẽ load tươi khi mở)
    BG_TASKS.silent = 0;
    updateBgIndicator();
  }

  // Render view scan từ data (dùng chung cho full-load và cache-reuse)
  function renderScanView(data) {
    var skel = document.getElementById('scanSkeleton');
    var tbl = document.getElementById('scanTable');
    var empty = document.getElementById('scanEmpty');
    CURRENT_TASK = data.task;
    // Server không trả field phase (function closure không serialize được) — tính lại
    // từ status ở client để tránh lỗi "unidentified" khi cache miss.
    if (CURRENT_TASK && !CURRENT_TASK.phase) {
      CURRENT_TASK.phase = CURRENT_TASK.status === TASK_STATUS_C.ATTEND ? 'attend'
        : (CURRENT_TASK.status === TASK_STATUS_C.DONE ? 'done' : 'open');
    }
    // Task kết thúc → tự đóng tab scanner ngoài (nếu mở cho chính task này).
    if (CURRENT_TASK && CURRENT_TASK.phase === TASK_STATUS_C.DONE && EXTERNAL_SCAN_TASK_ID === CURRENT_TASK.taskId) {
      closeExternalScanner();
    }
    CURRENT_LOG = safeArr(data.log);
    SCAN_PAGE = 1; // dữ liệu mới (task vừa mở) → về trang đầu
    document.getElementById('scanTaskTitle').textContent = data.task.taskId;
    var metaEl = document.getElementById('scanTaskMeta');
    var phaseLabel = TASK_PHASE_LABEL[data.task.phase] || TASK_PHASE_LABEL.open;
    var phaseHint = data.task.phase === TASK_STATUS_C.OPEN ? ' (ghi Giờ có mặt)' : (data.task.phase === TASK_STATUS_C.ATTEND ? ' (ghi Giờ quét)' : '');
    metaEl.innerHTML =
      esc(taskKindLabel_(data.task)) + ' ' + esc(data.task.station) + ' ' + esc(data.task.slotCode) + ' ' + esc(data.task.team) +
      ' — <b>' + esc(phaseLabel) + '</b>' + esc(phaseHint);  /* bỏ dấu · giữa các trường (space phân cách, trước phase dùng —) */
    if (skel) skel.style.display = 'none';
    if (tbl) tbl.style.display = '';
    renderScanTable(safeArr(data.log));
    // P1: task đã có scan → khôi phục scan card (không reset về "Chưa có")
    restoreScanCard(safeArr(data.log));
    CURRENT_COUNTERS = data.counters || { scanned: 0, absent: 0, extra: 0 };
    renderCounters(CURRENT_COUNTERS);
    updateScanFilterLabel_();

    // T-2: Nút "Dán danh sách mã" + "Lấy danh sách theo ca" gom trong menu "⋯" (#scanMoreWrap) —
    // chỉ hiện khi FREE + open + canScanOpen (nút tĩnh trong HTML; ở đây chỉ bật/tắt display).
    var pasteBtn = document.getElementById('btnPaste');
    var rosterBtn = document.getElementById('btnLoadRoster');
    var isFree = data.task.taskType === TASK_TYPE_C.FREE;
    var isOpenPhase = data.task.phase === TASK_STATUS_C.OPEN || data.task.status === TASK_STATUS_C.OPEN;
    var perm = data.task.permission || {};
    if (pasteBtn) {
      pasteBtn.style.display = (isFree && isOpenPhase && perm.canScanOpen) ? '' : 'none';
    }
    // A1: nút "Lấy danh sách theo ca" — cùng gate paste (phase Mở + owner). Task mới luôn FREE.
    if (rosterBtn) {
      rosterBtn.style.display = (isOpenPhase && perm.canScanOpen) ? '' : 'none';
    }
    updateScanMoreBtn_();

    // Quét được khi: phase2 (Điểm danh) HOẶC task Đối chiếu (RECONCILE, phase1 vẫn ghi
        // Giờ có mặt được). Task Quét tự do (FREE) cũng 2-phase: phase1 ghi Giờ có mặt, chuyển Điểm danh, phase2 ghi Giờ quét (V2 FREE là 2-phase) — phải bấm
        // "Chuyển điểm danh" (phase2) mới quét được (tránh ghi Giờ có mặt mà sheet thiếu Giờ quét).
        var isReconcile = data.task.taskType === TASK_TYPE_C.RECONCILE;
        // P1: canScan chỉ dựa trên phase (không dùng isReconcile/isFree) — source of truth.
        // task DONE (status DONE hoặc phase DONE) => canScan = false. applyScanPermission() sẽ gộp owner-gate + queue-full.
        var isDone = data.task.phase === TASK_STATUS_C.DONE || data.task.status === TASK_STATUS_C.DONE;
        var canScan = !isDone;
        var scanInput = document.getElementById('scanInput');
        scanInput.disabled = !canScan;
        scanInput.placeholder = canScan ? 'Quét mã nhân viên…'
          : 'Task đã kết thúc — không thể quét';
        updateFinishBtnState();
        // F: đồng bộ indicator sort với phase vừa render (phase2 → cột Giờ quét)
        updateSortIndicators();
        // T-1: áp dụng owner gate CUỐI CÙNG — nguồn quyết định cuối cho disabled/placeholder/
        // nút Chuyển điểm danh/nút paste (không bị logic phase ở trên ghi đè).
        applyScanPermission();
        // Mobile/tablet (pointer:coarse): KHÔNG focus ngay — bàn phím ảo tự bật đè màn hình
        // khi mở task quét. Máy tính (chuột/barcode scanner) giữ auto-focus như cũ.
        if (canScan && !scanOwnerLocked && !COARSE_POINTER) {
          scanInput.focus();
        }
  }

  // silent=true: gọi RPC nền (đã render từ cache) — KHÔNG show spinner, KHÔNG reset UI
  function loadTaskDetail(taskId, silent) {
    var seq = ++SCAN_LOAD_SEQ;
    if (!silent) {
      // Reset UI NGAY — tránh hiển thị dữ liệu task mở trước đó trong lúc loading
      var skel = document.getElementById('scanSkeleton');
      var tbl = document.getElementById('scanTable');
      var empty = document.getElementById('scanEmpty');
      if (skel) skel.style.display = '';
      if (tbl) tbl.style.display = 'none';
      if (empty) empty.style.display = 'none';
      CURRENT_TASK = null;
      CURRENT_LOG = [];
      document.getElementById('scanTaskTitle').textContent = 'Đang tải…';
      document.getElementById('scanTaskMeta').textContent = '';
      document.getElementById('scanInput').value = '';
      document.getElementById('scanInput').disabled = true; // luôn khóa trong lúc load — chỉ mở ở phase2 (renderScanView)
      renderCounters({ scanned: 0, absent: 0, extra: 0 });
      resetScanCard();
      updateFinishBtnState();
    }
    google.script.run
      .withSuccessHandler(function (res) {
        if (seq !== SCAN_LOAD_SEQ) return; // response của task cũ — bỏ qua
        if (!res.ok) {
          hideLoadingOverlay();  // ẩn cả khi res.ok === false — không kẹt spinner
          if (!silent) { showToast(res.message, true); backToList(); }
          else {
            // P3-12: silent fail (finishTask) → render lại view tươi (không kẹt UI OPEN)
            loadTaskDetail(taskId);
          }
          return;
        }
        // Minor#3 (audit): silent reload trong lúc SCAN_QUEUE/SCAN_PROCESSING đang chạy
        // → renderScanView thay CURRENT_LOG bằng array MỚI, làm item.target trong queue
        // trỏ object cũ → dòng vừa quét optimistic 'biến mất'. Gate: đang scan thì bỏ qua
        // RPC silent (giữ view optimistic đang hiển thị — server vẫn ghi đúng phía sau).
        if (silent && scanBusy()) { _pendingSilentReload = taskId; BG_TASKS.silent = 1; updateBgIndicator(); return; } // m4: hoãn, reload khi queue idle
        renderScanView(res);
        LAST_SCAN_VIEW = { taskId: taskId, ts: Date.now() };
        hideLoadingOverlay();
      })
      .withFailureHandler(function (err) {
        markServerFail();
        if (seq !== SCAN_LOAD_SEQ) return; // response của task cũ — bỏ qua
        hideLoadingOverlay();  // ẩn cả khi lỗi — không kẹt spinner
        if (silent) return; // RPC nền lỗi — giữ view đang hiển thị (cache) — không phá UX
        var skel = document.getElementById('scanSkeleton');
        var tbl = document.getElementById('scanTable');
        var empty = document.getElementById('scanEmpty');
        if (skel) skel.style.display = 'none';
        if (tbl) tbl.style.display = '';
        // P2: reset trạng thái view khi load lỗi — hết view treo "Đang tải…" + input disabled
        document.getElementById('scanTaskTitle').textContent = 'Không tải được task';
        document.getElementById('scanTaskMeta').textContent = '';
        if (empty) { empty.textContent = 'Lỗi tải chi tiết — bấm ← Danh sách task để quay lại'; empty.style.display = ''; }
        document.getElementById('scanInput').disabled = true;
        updateFinishBtnState();
        showToast('Lỗi tải chi tiết: ' + err.message, true);
      })
      .getTaskDetailApi(taskId);
  }

  function renderCounters(c) {
      if (!c) return;
      document.getElementById('cScanned').textContent = c.scanned || 0;
      document.getElementById('cAbsent').textContent = c.absent || 0;
      document.getElementById('cExtra').textContent = c.extra || 0;
      // Label counter theo phase: OPEN → 'Có mặt'/'Chưa có mặt'; ATTEND → 'Đã điểm danh'/'Chưa điểm danh';
      // DONE → 'Đã điểm danh'/'Vắng' (đỏ).
      // Neo bằng ID cha — KHÔNG dùng '.counter.absent': nhánh OPEN tự swap class
      // absent→waiting nên querySelector('.counter.absent') về null ở lần render kế
      // → bỏ qua cả khối phase-aware → counter hiện số raw sai phase.
      var absentCounter = document.getElementById('cAbsent') ? document.getElementById('cAbsent').parentElement : null;
      var lbl = absentCounter ? absentCounter.querySelector('.lbl') : null;
      var scannedCounter = document.getElementById('cScanned') ? document.getElementById('cScanned').parentElement : null;
      var scannedLbl = scannedCounter ? scannedCounter.querySelector('.lbl') : null;
      if (lbl && CURRENT_TASK) {
        // task DONE (status) => luôn 'Vắng', không để phase lỗi/stale giữ 'Chưa điểm danh'.
        var isDone = CURRENT_TASK.status === TASK_STATUS_C.DONE || CURRENT_TASK.phase === TASK_STATUS_C.DONE;
        if (isDone) {
          if (scannedLbl) scannedLbl.textContent = 'Đã điểm danh';
          document.getElementById('cScanned').textContent = c.scanned || 0;
          lbl.textContent = 'Vắng';
          absentCounter.classList.add('absent');
          absentCounter.classList.remove('waiting');
        } else if (CURRENT_TASK.phase === TASK_STATUS_C.OPEN) {
          // Phase 1 (Mở): counter 1 = 'Có mặt' (presentAt — đã ghi Giờ có mặt, xanh);
          // counter 2 = 'Chưa có mặt' (roster chưa đến; FREE không roster → 0).
          var presentAt = c.presentAt || 0;
          document.getElementById('cScanned').textContent = presentAt;
          document.getElementById('cAbsent').textContent = Math.max(0, (c.total || 0) - presentAt - (c.extra || 0));
          if (scannedLbl) scannedLbl.textContent = 'Có mặt';
          lbl.textContent = 'Chưa có mặt';
          absentCounter.classList.add('waiting');
          absentCounter.classList.remove('absent');
        } else { // ATTEND (phase) — chưa kết thúc
          if (scannedLbl) scannedLbl.textContent = 'Đã điểm danh';
          document.getElementById('cScanned').textContent = c.scanned || 0;
          lbl.textContent = 'Chưa điểm danh';
          absentCounter.classList.add('absent');
          absentCounter.classList.remove('waiting');
        }
      }
    }

  // P1: label option lọc trạng thái theo phase — PENDING = 'Chưa có mặt' (Mở) / 'Chưa điểm danh' (Điểm danh).
  function updateScanFilterLabel_() {
    var statusEl = document.getElementById('scanStatusFilter');
    if (!statusEl) return;
    var lbl = (CURRENT_TASK && CURRENT_TASK.phase === TASK_STATUS_C.OPEN) ? 'Chưa có mặt' : 'Chưa điểm danh';
    for (var i = 0; i < statusEl.options.length; i++) {
      if (statusEl.options[i].value === STATUS_C.PENDING) { statusEl.options[i].textContent = lbl; return; }
    }
  }

  // C3: state lọc + sort bảng scan — mặc định sort theo phase:
  // phase1 (Mở) → Giờ có mặt (col 7) mới nhất; phase2 (Điểm danh) → Giờ quét (col 8).
  var SCAN_FILTER = { q: '', status: '' };
  var SCAN_SORT = { col: 7, asc: false, userSet: false };  // userSet=true khi user chọn cột; false=mặc định theo phase
  var STATUS_ORDER = {};  // P3: dựng từ STATUS_C — tránh hardcode label
  STATUS_ORDER[STATUS_C.PENDING] = 0;
  STATUS_ORDER[''] = 0;
  STATUS_ORDER[STATUS_C.PRESENT] = 1;
  STATUS_ORDER[STATUS_C.ABSENT] = 2;
  STATUS_ORDER[STATUS_C.EXTRA] = 3;
  // C4: rank status cho sort — KHÔNG dùng `|| 9` (0 là falsy → PENDING thành 9)
  function statusRank(s) {
    var r = STATUS_ORDER[s];
    return r === undefined ? 9 : r;
  }

  function filterAndSortScan(log) {
    var q = SCAN_FILTER.q.trim().toLowerCase();
    var st = SCAN_FILTER.status;
    // 2-phase: sort mặc định theo phase — phase1 Giờ có mặt (col7), phase2 Giờ quét (col8)
    var phaseCol = (CURRENT_TASK && CURRENT_TASK.phase === TASK_STATUS_C.ATTEND) ? 8 : 7;
    // F: nếu user chưa chọn sort riêng (userSet=false mặc định) → ép theo phaseCol;
    // nếu đã chọn cột → tôn trọng cột user chọn (kể cả 7/8) — KHÔNG ép ngược lại.
    var asc = SCAN_SORT.asc;
    var col = SCAN_SORT.userSet ? SCAN_SORT.col : phaseCol;
    var out = [];
    safeArr(log).forEach(function (r) {
      if (st && r.status !== st) return;
      if (q) {
        var hay = (String(r.staffId || '') + ' ' + String(r.staffName || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return;
      }
      out.push(r);
    });
    out.sort(function (a, b) {
      var va, vb;
      if (col === 9) {
        va = statusRank(a.status);
        vb = statusRank(b.status);
      } else if (col === 0) { va = String(a.staffId || '').toUpperCase(); vb = String(b.staffId || '').toUpperCase(); }
      else if (col === 1) { va = String(a.staffName || '').toUpperCase(); vb = String(b.staffName || '').toUpperCase(); }
      else if (col === 2) { var sa = CLIENT_STAFF_INDEX[String(a.staffId || '').toUpperCase()] || null; var sb = CLIENT_STAFF_INDEX[String(b.staffId || '').toUpperCase()] || null; va = String(sa && sa.agency || '').toUpperCase(); vb = String(sb && sb.agency || '').toUpperCase(); }
      else if (col === 3) { va = String(a.station || ''); vb = String(b.station || ''); }
      else if (col === 4) { va = String(a.team || ''); vb = String(b.team || ''); }
      else if (col === 5) { va = String(a.slotCode || ''); vb = String(b.slotCode || ''); }
      else if (col === 6) { va = String(a.dateText || ''); vb = String(b.dateText || ''); }
      else if (col === 7) { va = String(a.timeRefText || ''); vb = String(b.timeRefText || ''); }
      else {
        // col 8 = Giờ quét — sort theo epoch (số) CHÍNH XÁC cả khi xuyên nửa đêm;
        // timeScanText "HH:mm:ss" mất ngày → sort chuỗi sai. Chưa quét = epoch 0.
        va = Number(a.timeScanEpoch) || 0;
        vb = Number(b.timeScanEpoch) || 0;
      }
      if (va === vb) return 0;
      var cmp = va < vb ? -1 : 1;
      return asc ? cmp : -cmp;
    });
    return out;
  }

  function renderScanTable(log) {
      var body = document.getElementById('scanTableBody');
      var empty = document.getElementById('scanEmpty');
      var tbl = document.getElementById('scanTable');
      if (!log || !log.length) {
        // P3: log rỗng → ẩn luôn bảng (header trống + empty div gây rối mắt)
        body.innerHTML = '';
        if (tbl) tbl.style.display = 'none';
        empty.textContent = 'Không có nhân viên nào trong danh sách';
        empty.style.display = '';
        renderPaginator_('scanPagination', 0, 1, 'goScanPage');
        return;
      }
      var rows = filterAndSortScan(log);
      if (!rows.length) {
        // C3: có log nhưng bộ lọc loại hết → báo khác empty thật
        body.innerHTML = '';
        if (tbl) tbl.style.display = 'none';
        empty.textContent = 'Không có NV khớp bộ lọc';
        empty.style.display = '';
        renderPaginator_('scanPagination', 0, 1, 'goScanPage');
        return;
      }
      empty.style.display = 'none';
      if (tbl) tbl.style.display = '';
      // Pagination: slice theo trang hiện tại (SCAN_PAGE_SIZE=50)
      var total = rows.length;
      var totalPages = Math.max(1, Math.ceil(total / SCAN_PAGE_SIZE));
      if (SCAN_PAGE > totalPages) SCAN_PAGE = totalPages;
      if (SCAN_PAGE < 1) SCAN_PAGE = 1;
      var start = (SCAN_PAGE - 1) * SCAN_PAGE_SIZE;
      _paintScanRows(body, rows, start);
      renderPaginator_('scanPagination', total, SCAN_PAGE, 'goScanPage');
    }

    // I2: keyed row-diff — chỉ update cell thay đổi, không replace toàn bộ (chống flicker)
    function _paintScanRows(body, rows, startIdx) {
      var existing = {};
      var i, tr;
      var start = startIdx || 0;
      var pageItems = rows.slice(start, start + SCAN_PAGE_SIZE);
      for (i = 0; i < body.children.length; i++) {
        tr = body.children[i];
        if (tr.dataset && tr.dataset.id) existing[tr.dataset.id] = tr;
      }
      var keep = {};
      for (i = 0; i < pageItems.length; i++) {
        var r = pageItems[i];
        tr = existing[r.staffId];
        if (!tr) { tr = document.createElement('tr'); tr.dataset.id = r.staffId; }
        tr.className = r.status === STATUS_C.EXTRA ? 'extra-row' : '';  // C4: nổi bật NV lạ
        var cells = scanRowCells(r, start + i);
        if (tr.children.length !== cells.length) {
          tr.innerHTML = cells.join('');
        } else {
          for (var c = 0; c < cells.length; c++) {
            if (tr.children[c].innerHTML !== cells[c]) tr.children[c].innerHTML = cells[c];
          }
        }
        keep[r.staffId] = tr;
      }
      // Xoá tr không còn trong dữ liệu lọc
      for (i = body.children.length - 1; i >= 0; i--) {
        tr = body.children[i];
        if (!keep[tr.dataset && tr.dataset.id]) tr.remove();
      }
      // Đưa về đúng thứ tự lọc/sort (appendChild tự chuyển về cuối)
      for (i = 0; i < pageItems.length; i++) {
        tr = keep[pageItems[i].staffId];
        if (body.lastChild !== tr) body.appendChild(tr);
      }
    }

  // Mobile (≤700px): thu gọn / mở rộng danh sách NV trong viewScan — mặc định thu gọn
  // (chỉ counters + ô quét + nút quét + scanCard), mở ra khi cần xem bảng/lọc.
  function toggleScanList() {
    var card = document.getElementById('scanListCard');
    var btn = document.getElementById('btnScanListToggle');
    if (!card || !btn) return;
    var open = card.classList.toggle('scan-list-open');
    // Mở rộng -> ẩn cột quét (counters + ô nhập + nút Quét + scanCard), danh sách NV đẩy lên full
    document.body.classList.toggle('scan-expanded', open);
    btn.textContent = open ? '▲' : '▼';
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Thu gọn danh sách NV' : 'Mở rộng danh sách NV');
    btn.title = open ? 'Thu gọn danh sách NV' : 'Mở rộng danh sách NV';
  }

  function scanRowCells(r, idx) {
    var badge = badgeFor(r.status, r);
    var staffRec = CLIENT_STAFF_INDEX[String(r.staffId || '').toUpperCase()] || null;
    return [
      '<td class="stt" data-label="STT">' + (idx + 1) + '</td>',
      '<td data-label="Mã NV"><b>' + esc(r.staffId) + '</b></td>',
      '<td data-label="Tên NV">' + esc(r.staffName) + '</td>',
      '<td data-label="Agency">' + esc(staffRec && staffRec.agency ? staffRec.agency : '') + '</td>',
      '<td data-label="Station">' + esc(r.station || '') + '</td>',
      '<td data-label="Team">' + esc(r.team || '') + '</td>',
      '<td data-label="Ca">' + esc(r.slotCode || '') + '</td>',
      '<td data-label="Ngày">' + esc(r.dateText || '') + '</td>',
      '<td data-label="Giờ có mặt">' + esc(r.timeRefText || '') + '</td>',
      '<td data-label="Giờ quét">' + esc(r.timeScanText || '') + '</td>',
      '<td data-label="Trạng thái">' + badge + '</td>'
    ];
  }

  function updateSortIndicators() {
    var ths = document.querySelectorAll('#scanTable th.sortable');
    // F: highlight cột sort THỰC TẾ — khớp filterAndSortScan (userSet ? cột user : phaseCol)
    var effectiveCol = SCAN_SORT.userSet ? SCAN_SORT.col
      : ((CURRENT_TASK && CURRENT_TASK.phase === TASK_STATUS_C.ATTEND) ? 8 : 7);
    for (var i = 0; i < ths.length; i++) {
      var col = parseInt(ths[i].dataset.sort, 10);
      var active = col === effectiveCol;
      ths[i].classList.toggle('sort-asc', active && SCAN_SORT.asc);
      ths[i].classList.toggle('sort-desc', active && !SCAN_SORT.asc);
      ths[i].setAttribute('aria-sort', active ? (SCAN_SORT.asc ? 'ascending' : 'descending') : 'none');
    }
  }

  function badgeFor(status, row) {
    if (status === STATUS_C.PENDING || !status) {
      // Phase 1 (Mở) + đã ghi Giờ có mặt → 'Có mặt' (xanh) — khớp scanCard/counter.
      if (CURRENT_TASK && CURRENT_TASK.phase === TASK_STATUS_C.OPEN && row && Number(row.timeRefEpoch) > 0) {
        return '<span class="badge present">Có mặt</span>';
      }
      return '<span class="badge pending">' + (CURRENT_TASK && CURRENT_TASK.phase === TASK_STATUS_C.OPEN ? 'Chưa có mặt' : 'Chưa điểm danh') + '</span>';
    }
    if (status === STATUS_C.PRESENT) return '<span class="badge present">Có mặt</span>';
    if (status === STATUS_C.ABSENT) return '<span class="badge absent">Vắng</span>';
    if (status === STATUS_C.EXTRA) return '<span class="badge extra">Dư</span>';
    return esc(status || '');
  }

  // 2026-08-07: badge Loại task ở danh sách task (FREE = Quét tự do, RECONCILE = Đối chiếu).
  // Badge Loại task: task mới luôn FREE nhưng có thể đã nạp danh sách (A1) — hiện trạng thái
  // danh sách thay vì chế độ tạo: roster > 0 → "Đã có danh sách"; còn trống → "Quét tự do".
  function taskTypeBadge(task, fallbackType) {
    var taskType = (task && task.taskType) || fallbackType;
    var hasRoster = task && Number(task.total || task.count || 0) > 0;
    if (hasRoster) return '<span class="badge badge-reconcile">Đã có danh sách</span>';
    if (taskType === TASK_TYPE_C.FREE) return '<span class="badge badge-free">Quét tự do</span>';
    if (taskType === TASK_TYPE_C.RECONCILE) return '<span class="badge badge-reconcile">Đối chiếu</span>';
    return '<span class="badge">Task</span>';
  }
  // Nhãn loại task cho scanTaskMeta — "Đã có danh sách" khi roster đã nạp (đồng bộ taskTypeBadge).
  function taskKindLabel_(task) {
    if (!task) return 'Task';
    if (Number(task.total || task.count || 0) > 0) return 'Đã có danh sách';
    return TT_LABEL[task.taskType] || 'Task';
  }
  // F-search: badge Trạng thái task — dùng chung cho renderTaskList_ + renderSearchResults_ (tránh duplicate markup).
  // 'attend'→Điểm danh, 'done'→Xong, 'open'→Mở; trạng thái lạ/null → badge trống.
  function taskStatusBadge(status) {
    if (status === TASK_STATUS_C.DONE) return '<span class="badge done">Xong</span>';
    if (status === TASK_STATUS_C.ATTEND) return '<span class="badge attend">Điểm danh</span>';
    if (status === TASK_STATUS_C.OPEN) return '<span class="badge open">Mở</span>';
    return '<span class="badge">' + esc(status || '') + '</span>';
  }
  // Cột Ca (slotCode) có thể nhiều giá trị (server join ', ') — hiển thị gọn 'Nhiều ca', tooltip đầy đủ.
  function slotCellHtml(v) {
    var s = v || '';
    var parts = s.split(', ').filter(function (x) { return x.trim(); });
    var text = parts.length > 1 ? 'Nhiều ca' : s;
    return '<span class="slot-ellipsis" title="' + escAttr(s) + '">' + esc(text) + '</span>';
  }

  // Hàng đợi quét: capture + optimistic NGAY, server xử lý nền tuần tự.
  var SCAN_QUEUE = [];
  var SCAN_PROCESSING = false;
  var SCAN_QUEUE_MAX = 2; // giảm backlog (5 → 2) để tên NV hiện tức thì, ít delay queue
  // m4 (audit): silent reload (paste/finish/refresh) xảy ra giữa lượt quét → gate trong
  // loadTaskDetail HOÃN thay vì bỏ (đặt _pendingSilentReload) → reload khi queue sạch.
  var _pendingSilentReload = null;
  function maybeReloadPending() {
    if (!_pendingSilentReload) return;
    if (scanBusy()) return; // còn lượt quét đang xử lý — chờ tiếp
    var tid = _pendingSilentReload;
    _pendingSilentReload = null;
    BG_TASKS.silent = 0;
    updateBgIndicator();
    if (CURRENT_TASK && CURRENT_TASK.taskId === tid) loadTaskDetail(tid, true);
  }
  // P2: seq chống response cũ đè scan card mới — quét B lúc response A đang bay,
  // response A về sẽ showScanCard(A) nhảy card về NV quét trước đó vài giây.
  var SCAN_CARD_SEQ = 0;
  // D2: guard dùng chung — còn scan đang chờ server hoặc trong queue.
  function scanBusy() {
    return SCAN_QUEUE.length > 0 || SCAN_PROCESSING;
  }
  // B: recount theo timeScan (khớp server computeCounters — ScanLogic.gs) thay vì
  // đếm theo status text: tránh lệch khi dòng có timeScan nhưng status chưa cập nhật.
  // Dùng cho: optimistic bump (submitScan), rollback/sync (processScanQueue).
  function recountFromLog() {
    var s = 0, e = 0, a = 0, p = 0;
    (CURRENT_LOG || []).forEach(function (r) {
      // P2: epoch là nguồn sự thật duy nhất (khớp server computeCounters)
      var hasScan = Number(r.timeScanEpoch) > 0;
      var hasRef = Number(r.timeRefEpoch) > 0;
      if (hasScan) s++;
      if (hasRef) p++;
      if (r.status === STATUS_C.EXTRA) e++;
      else if (!hasScan) a++;
    });
    // D2 (review 2026-08-11): presentAt đủ shape như server computeCounters —
    // trước thiếu → 'Chưa điểm danh' counter = 0 trong phase OPEN đến khi server trả res.counters.
    CURRENT_COUNTERS = { scanned: s, absent: a, extra: e, presentAt: p, total: (CURRENT_LOG || []).length };
    renderCounters(CURRENT_COUNTERS);
  }

  /* F2: Dán danh sách mã trực tiếp vào #scanInput (thay thế nút "Dán danh sách mã").
   * - Barcode scanner = keyboard emulation → KHÔNG bao giờ trigger paste event.
   * - Chỉ clipboard (Ctrl+V / menu) mới đến handler này.
   * - 1 dòng → để submitScan xử lý bình thường (không preventDefault).
   * - ≥2 dòng → mở paste modal + chạy batch hiện có (reuse submitPaste / pasteCodesApi).
   */
  function onScanInputPaste(e) {
      var pasted = (e.clipboardData || window.clipboardData).getData('text/plain');
      if (!pasted) return;
      var lines = pasted.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l !== ''; });
      if (lines.length <= 1) return; // single line → để scan bình thường
      e.preventDefault();
      // Mở modal (openPasteModal guard gate: chỉ mở khi canScanOpen). Nếu không đủ quyền
      // / chưa có task → modal KHÔNG mở → không gọi submitPaste (tránh gửi server âm thầm
      // rồi render kết quả vào #pastePreview đang ẩn, user không thấy phản hồi).
      var m = document.getElementById('pasteModal');
      openPasteModal();
      if (!m || !m.classList.contains('open')) {
        // Phân biệt lý do: task đã kết thúc vs không có quyền dán ở phase Mở — toast đúng ngữ cảnh.
        var done = CURRENT_TASK && (CURRENT_TASK.phase === TASK_STATUS_C.DONE || CURRENT_TASK.status === TASK_STATUS_C.DONE);
        showToast(done ? 'Task đã kết thúc — không thể dán mã' : 'Chỉ owner mới dán được mã ở phase Mở (task này)', true);
        return;
      }
      var ta = document.getElementById('pasteTextarea');
      if (ta) { ta.value = lines.join('\n'); }
      // Reuse hoàn toàn: submitPaste đọc ta.value, clamp 200, gọi pasteCodesApi,
      // render kết quả vào #pastePreview, refresh counters + log.
      submitPaste();
    }

  function submitScan() {
    if (!CURRENT_TASK) return;
    // T-1: Guard against disabled input (owner gate)
    var input = document.getElementById('scanInput');
    if (input && input.disabled) {
      // Phân biệt lý do khoá input để toast đúng (không luôn nói 'Chỉ owner'):
      // scanOwnerLocked (non-owner phase Mở) | task done | queue đầy.
      var lockMsg = scanOwnerLocked
        ? 'Chỉ owner mới quét được ở phase Mở (task này)'
        : (CURRENT_TASK.phase === TASK_STATUS_C.DONE ? 'Task đã kết thúc' : 'Hàng đợi đang đầy — chờ giây lát');
      notifyExternalScanner({ code: (input.value || '').trim(), ok: false, message: lockMsg });
      showToast(lockMsg, true);
      playBeep('error');
      input.value = '';
      input.focus();
      return;
    }
    // P2 (audit): chặn sớm khi task đã đóng (tab khác kết thúc task giữa chừng) —
    // tránh optimistic rồi rollback; server vẫn reject nếu race.
    // 2-phase: chặn chỉ khi task DONE (Xong). Phase OPEN (ghi Giờ có mặt) và
    // ATTEND (ghi Giờ quét) đều cho quét. Tab khác kết thúc task giữa chừng → server reject.
    if (CURRENT_TASK.phase === TASK_STATUS_C.DONE) {
      notifyExternalScanner({ code: (input.value || '').trim(), ok: false, message: 'Task đã kết thúc' });
      showToast('Task đã kết thúc', true);
      playBeep('error');
      document.getElementById('scanInput').value = '';
      document.getElementById('scanInput').focus();
      return;
    }
    // P2: chặn khi queue đầy — tránh backlog tăng mãi (2.5s/item)
    if (SCAN_QUEUE.length >= SCAN_QUEUE_MAX) {
      notifyExternalScanner({ code: (input.value || '').trim(), ok: false, message: 'Hàng đợi đang đầy — chờ giây lát' });
      input.value = '';  // I8: không giữ backlog — xoá ngay
      showToast('Hàng đợi đang đầy — chờ giây lát', true);
      playBeep('error');
      return;
    }
    var staffId = input.value.trim();
    if (!staffId) return;

    // F1: Chỉ chấp nhận mã barcode nhân viên dạng "Ops" + chữ số (case-insensitive).
    // Ví dụ hợp lệ: Ops6219, Ops000001. Sai: OpsABC, OPS, Ops12a.
    // Check client-side TRƯỚC khi vào queue → 0ms, không gọi server → KHÔNG làm chậm scan.
    if (!BARCODE_ID_RE.test(staffId)) {
      notifyExternalScanner({ code: staffId, ok: false, message: 'Sai mã — phải bắt đầu bằng Ops + số' });
      showToast('Mã phải bắt đầu bằng "Ops" và chỉ chứa số, ví dụ: Ops6219', true);
      playBeep('error');
      showScanCard('Sai mã', { staffId: staffId }, 'err');
      input.value = '';
      input.focus();
      return;
    }

    // ---- Capture ngay: clear + focus + optimistic + toast tức thì (0ms) ----
    input.value = '';
    input.focus();

    // Tìm dòng NV trong log hiện tại; nếu chưa có → tạo dòng tạm.
    var norm = staffId.toUpperCase();
    var target = null;
    (CURRENT_LOG || []).forEach(function (r) {
      if (!target && String(r.staffId).toUpperCase() === norm) { target = r; }
    });

    // 2-phase: chặn NGAY ở client theo phase hiện tại (tránh toast lặp + gọi server).
    // phase1 (Mở): đã có Giờ có mặt (timeRefEpoch>0) → 'Đã có mặt'.
    // phase2 (Điểm danh): đã quét (timeScanEpoch>0) → 'Đã điểm danh'.
    if (target) {
      if (CURRENT_TASK.phase === TASK_STATUS_C.ATTEND) {
        if (Number(target.timeScanEpoch) > 0) {
          notifyExternalScanner({ code: staffId, ok: false, message: 'Đã điểm danh rồi' });
          showToast('Đã điểm danh rồi', true);
          playBeep('error');
          showScanCard('Đã điểm danh rồi', target, 'warn');
          return;
        }
      } else {
        if (Number(target.timeRefEpoch) > 0) {
          notifyExternalScanner({ code: staffId, ok: false, message: 'Đã có mặt' });
          showToast('Đã có mặt', true);
          playBeep('error');
          showScanCard('Đã có mặt', target, 'warn');
          return;
        }
      }
    }

    var phase2 = CURRENT_TASK.phase === TASK_STATUS_C.ATTEND;
        var now = new Date();
        SCAN_CARD_SEQ++;  // F7: bump 1 lần sau guard — phủ mọi path (sai mã / đã điểm danh / enqueue)
        var item = {
          staffId: staffId,
          taskId: CURRENT_TASK.taskId,  // F1: capture task lúc enqueue — guard response cũ
          target: target,
          optimisticNew: false,
          phase2: phase2,
          clientEpoch: now.getTime(),  // WYSIWYG: gửi giờ chụp lúc quét → sheet ghi đúng giờ app hiển thị
          oldStatus: null,
          oldTimeRefText: null, oldTimeRefEpoch: null,
          oldTimeScanText: null, oldTimeScanEpoch: null,
        };  // scanSeq gán sau khi enqueue (2990) — tránh dead assignment (review 2026-08-11)
      if (target) {
      item.oldStatus = target.status;
      item.oldTimeRefText = target.timeRefText; item.oldTimeRefEpoch = target.timeRefEpoch;
      item.oldTimeScanText = target.timeScanText; item.oldTimeScanEpoch = target.timeScanEpoch;
      if (phase2) {
        // F5: NV đã Dư (EXTRA) quét lại phase2 → giữ EXTRA (khớp server classifyScan),
        // KHÔNG đổi thành Có mặt rồi nhảy về Dư (flicker). Chỉ dòng PENDING → PRESENT.
        target.status = (target.status === STATUS_C.EXTRA) ? STATUS_C.EXTRA : STATUS_C.PRESENT;
        target.timeScanText = fmtDate(now);
        target.timeScanEpoch = now.getTime();      // sort key — quét tức thì nhảy lên đầu
      } else {
        target.status = STATUS_C.PENDING;          // Giờ có mặt → chưa điểm danh
        target.timeRefText = fmtDate(now);
        target.timeRefEpoch = now.getTime();
      }
    } else {
      item.optimisticNew = true;
      // NV lạ → dòng tạm. Status optimistic phải khớp server:
      // - Quét tự do (FREE): PENDING (phase1) / PRESENT (phase2) — KHÔNG Dư.
      // - Đối chiếu (RECONCILE): EXTRA (Dư) — NV lạ ngoài danh sách.
      // (Fix 2026-08-06: trước đây hardcode EXTRA → free task hiện "Dư" 3-4s rồi mới sửa.)
      var isFree = CURRENT_TASK && CURRENT_TASK.taskType === TASK_TYPE_C.FREE;
      // FREE phase2: NV chưa trong danh sách phase1 → DƯ (EXTRA). KV chưa quay phase1.
      var optimisticStatusNew = isFree
        ? (phase2 ? STATUS_C.EXTRA : STATUS_C.PENDING)
        : STATUS_C.EXTRA;
      var staffRec = CLIENT_STAFF_INDEX[String(staffId).toUpperCase()] || null;
      var cachedName = staffRec ? (staffRec.staffName || '') : '';
      target = { staffId: staffId, staffName: cachedName || '…',
                 slotCode: staffRec ? (staffRec.slotCode || '') : '',
                 station: staffRec ? (staffRec.station || '') : '',
                 team: staffRec ? (staffRec.team || '') : '',
                 dateText: staffRec ? (staffRec.date || '') : '',  // cột Ngày hiện NGAY (không chờ reload)
                 timeRefText: phase2 ? '' : fmtDate(now), timeRefEpoch: phase2 ? 0 : now.getTime(),
                 timeScanText: phase2 ? fmtDate(now) : '', timeScanEpoch: phase2 ? now.getTime() : 0,
                 status: optimisticStatusNew };
      item.target = target;
      item.optimisticStatus = optimisticStatusNew;
      CURRENT_LOG.push(target);
    }
    item.scanSeq = SCAN_CARD_SEQ;  // P2: đánh dấu lượt quét này là mới nhất — F7 (bump sau guard) đã tăng 1 lần, ở đây chỉ gán (bỏ ++ trùng, review 2026-08-11)
    // Toast optimistic — hiện ĐÚNG trạng thái; server KHÔNG toast lại nếu trùng
    // (tránh lặp/nháy). NV lạ (optimisticNew) đã có status đúng theo free/reconcile ở trên.
    if (!item.optimisticNew) {
      // F5: optimistic status = target.status đã cập nhật (giữ EXTRA nếu dòng Dư) — khớp server.
      item.optimisticStatus = target.status;
    }
    // ---- Phản hồi 2-pha về tab scanner: kết quả DỰ ĐOÁN gửi NGAY (0ms, không chờ server) —
    // scanner hiện tên NV + beep tức thì; server trả sau (~300-800ms) ghi đè, chỉ beep lại nếu khác. ----
    var optName = (item.target.staffName && item.target.staffName !== '…') ? item.target.staffName : staffId;
    notifyExternalScanner({
      code: staffId,
      ok: true,
      optimistic: true,
      name: optName,
      status: item.optimisticStatus,
      statusLabel: scanStatusLabel_(item.optimisticStatus, item.target),
      time: phase2 ? (item.target.timeScanText || '') : (item.target.timeRefText || '')
    });
    // Toast optimistic: NV lạ (chưa có tên) hiện mã NV thay vì dấu '-' (PENDING) gây
    // hiểu lầm "trống". Server sẽ toast lại status thật nếu khác.
    // Toast: không hiện dấu '-' (PENDING) — thay bằng label rõ nghĩa 'Chưa điểm danh'.
    var toastMsg = (item.optimisticNew && !target.staffName) ? staffId : item.optimisticStatus;
    if (toastMsg === STATUS_C.PENDING) toastMsg = 'Chưa điểm danh';
    playBeep('scan');
    // (bỏ toast optimistic này — scan card đã đủ thông tin; tránh toast lặp/nháy)
    // optimistic: NV lạ free=PENDING (warn-ish) nhưng chưa confirm → dùng 'ok' tạm,
    // server sẽ confirm đúng mode sau.
    var optMode = item.optimisticStatus === STATUS_C.EXTRA ? 'extra' : 'ok';
    showScanCard(item.optimisticStatus, target, optMode);
    // ---- Optimistic counters: recount NGAY từ CURRENT_LOG (đã mutate/push) — khớp
    // server computeCounters; server sẽ trả giá trị chuẩn sau. ----
    recountFromLog();
    renderScanTable(CURRENT_LOG);
    SCAN_QUEUE.push(item);
    BG_TASKS.scan = SCAN_QUEUE.length + (SCAN_PROCESSING ? 1 : 0);
    updateBgIndicator();
    updateFinishBtnState();
    processScanQueue();
  }

  // Menu "⋯" viewScan: nút mở chỉ hiện khi có ≥1 hành động trong menu (paste/roster).
  function updateScanMoreBtn_() {
    var wrap = document.getElementById('scanMoreWrap');
    if (!wrap) return;
    var p = document.getElementById('btnPaste');
    var r = document.getElementById('btnLoadRoster');
    var anyVisible = (p && p.style.display !== 'none') || (r && r.style.display !== 'none');
    wrap.style.display = anyVisible ? '' : 'none';
    if (!anyVisible) closeScanMore_();
  }
  function toggleScanMore() {
    var menu = document.getElementById('scanMoreMenu');
    var btn = document.getElementById('btnScanMore');
    if (!menu) return;
    var opening = menu.hidden;
    closeScanMore_();
    if (opening) {
      menu.hidden = false;
      if (btn) btn.setAttribute('aria-expanded', 'true');
      var first = menu.querySelector('button:not([style*="display: none"])');
      if (first) first.focus();
    }
  }
  function closeScanMore_() {
    var menu = document.getElementById('scanMoreMenu');
    var btn = document.getElementById('btnScanMore');
    if (menu) menu.hidden = true;
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }
  // Click ngoài menu "⋯" → đóng (mở modal bên trong tự đóng khi item được click).
  document.addEventListener('click', function (e) {
    var wrap = document.getElementById('scanMoreWrap');
    var menu = document.getElementById('scanMoreMenu');
    if (!wrap || !menu || menu.hidden) return;
    if (!wrap.contains(e.target)) closeScanMore_();
  });
  // P1: không cho Kết thúc khi còn lượt quét chờ server (task-closed sẽ mất scan).
  // 2-phase: 3 nút — ToAttend (Mở→Điểm danh), Finish (chỉ phase2), Reopen (Done→Mở).
  function updateFinishBtnState() {
    var btn = document.getElementById('btnFinish');
    var btnRe = document.getElementById('btnReopen');
    var btnTo = document.getElementById('btnToAttend');
    var btnPast = document.getElementById('btnPaste');
    var btnRos = document.getElementById('btnLoadRoster');
    if (!btn) return;
    var phase = CURRENT_TASK ? CURRENT_TASK.phase : TASK_STATUS_C.OPEN;
    var done = phase === TASK_STATUS_C.DONE;
    // Nút "Kết thúc" chỉ hiện ở phase2 (Điểm danh).
    // T-1: ẩn "Chuyển điểm danh" khi non-owner đang bị khoá phase OPEN (scanOwnerLocked).
    if (btnTo) btnTo.style.display = (phase === TASK_STATUS_C.OPEN && !scanOwnerLocked) ? '' : 'none';
    if (btnRe) btnRe.style.display = done ? '' : 'none';
    if (btn) btn.style.display = (phase === TASK_STATUS_C.ATTEND) ? '' : 'none';
    // T-2: nút "Dán danh sách mã" chỉ hiện ở FREE + Mở + owner — cập nhật cả khi
    // chuyển phase KHÔNG re-render (transitionToAttend / reopen / complete).
    if (btnPast) {
      btnPast.style.display = (phase === TASK_STATUS_C.OPEN && !scanOwnerLocked
        && CURRENT_TASK && CURRENT_TASK.taskType === TASK_TYPE_C.FREE
        && CURRENT_TASK.permission && CURRENT_TASK.permission.canScanOpen) ? '' : 'none';
    }
    if (btnRos) {
      btnRos.style.display = (phase === TASK_STATUS_C.OPEN && !scanOwnerLocked
        && CURRENT_TASK && CURRENT_TASK.permission && CURRENT_TASK.permission.canScanOpen) ? '' : 'none';
    }
    updateScanMoreBtn_();
    if (scanBusy()) {
      if (btn) { btn.disabled = true; btn.title = 'Đang xử lý quét — chờ xong rồi kết thúc'; }
      if (btnTo) { btnTo.disabled = true; btnTo.title = 'Đang xử lý quét — chờ xong rồi chuyển'; }
    } else {
      if (btn) { btn.disabled = false; btn.title = ''; }
      if (btnTo) { btnTo.disabled = false; btnTo.title = ''; }
    }
    updateQueueFullState();
  }

  // I8: báo hiệu queue đầy — viền đỏ nhấp nháy quanh ô quét
  function updateQueueFullState() {
    var wrap = document.querySelector('.scan-input-wrap');
    if (!wrap) return;
    var full = SCAN_QUEUE.length >= SCAN_QUEUE_MAX;
    wrap.classList.toggle('queue-full', full);
    // P2: queue đầy → disable input luôn (hết gõ vô ích + spam toast khi Enter).
    // P1 FIX: KHÔNG ghi đè disable vì task đã kết thúc — renderScanView set
    // disabled=true khi task done, updateQueueFullState phải tôn trọng (trước đây
    // inp.disabled = full (=false) enable lại input dù task đã đóng).
    var inp = document.getElementById('scanInput');
    if (inp) {
      var taskDone = !CURRENT_TASK || CURRENT_TASK.phase === TASK_STATUS_C.DONE;
      // T-1: tôn trọng khoá owner (non-owner phase OPEN) — không bật lại input.
      inp.disabled = taskDone || full || scanOwnerLocked;
    }
  }

  function processScanQueue() {
    if (SCAN_PROCESSING || !SCAN_QUEUE.length) {
      maybeReloadPending(); // m4: queue cạn → reload silent đã hoãn (nếu đang xem task đó)
      return;
    }
    SCAN_PROCESSING = true;
    BG_TASKS.scan = SCAN_QUEUE.length + 1;  // +1 đang xử lý
    updateBgIndicator();
    var item = SCAN_QUEUE.shift();
    updateFinishBtnState();

    function rollback() {
      if (item.target && !item.optimisticNew) {
        item.target.status = item.oldStatus;
        // Khôi phục cả Giờ có mặt (timeRef) và Giờ quét (timeScan) theo phase.
        if (item.phase2) {
          item.target.timeScanText = item.oldTimeScanText || '';
          item.target.timeScanEpoch = item.oldTimeScanEpoch || 0;
        } else {
          item.target.timeRefText = item.oldTimeRefText || '';
          item.target.timeRefEpoch = item.oldTimeRefEpoch || 0;
        }
      } else if (item.target && item.optimisticNew) {
        // P1: splice theo index — KHÔNG pop() (pop xóa row CUỐI, sai khi queue
        // có 2+ NV lạ: item giữa fail → xóa nhầm row của item sau).
        var idx = CURRENT_LOG.indexOf(item.target);
        if (idx >= 0) CURRENT_LOG.splice(idx, 1);
      }
    }

    // Còn item chưa xử lý trong queue → counters optimistic đã tính trước
    // (server trả từng item sẽ ghi đè thiếu) → tính lại từ CURRENT_LOG.
    // Hết queue:
    //   - Có serverCounters (success/reject có response) → dùng counters server
    //     (chuẩn nhất — phản ánh cả scan từ tab khác).
    //   - KHÔNG có serverCounters (exception — mất response) → recount từ
    //     CURRENT_LOG để đồng bộ với rollback vừa chạy.
    function syncCounters(serverCounters) {
      if (SCAN_QUEUE.length > 0) { recountFromLog(); return; }
      if (serverCounters) { CURRENT_COUNTERS = serverCounters; renderCounters(serverCounters); }
      else { recountFromLog(); }
    }

    google.script.run
      .withSuccessHandler(function (res) {
        SCAN_PROCESSING = false;
        // F1: response của scan enqueue ở task khác (user đã thoát/đổi task giữa chừng —
        // thực tế bị chặn bởi scanBusy(), guard này là defense cho đường thoát tương lai:
        // browser back, tab mới). Scan đã ghi server-side — chỉ drain queue, không đụng UI.
        if (!CURRENT_TASK || CURRENT_TASK.taskId !== item.taskId) {
          processScanQueue();
          return;
        }
        if (res.ok) {
          if (item.target) {
            item.target.status = res.status;
            item.target.staffName = res.staffName || item.target.staffName;
            // 2-phase: cập nhật đúng cột theo res.field (timeRef=Giờ có mặt / timeScan=Giờ quét).
            if (res.phase === 'attend' || res.field === 'timeScan') {
              if (res.timeScanText) item.target.timeScanText = res.timeScanText;
              if (res.timeScanEpoch) item.target.timeScanEpoch = res.timeScanEpoch;  // sort key chính xác từ server
            } else {
              if (res.timeRefText) item.target.timeRefText = res.timeRefText;
              if (res.timeRefEpoch) item.target.timeRefEpoch = res.timeRefEpoch;
            }
            // slotCode/station/team từ server (NV lạ có thể tra được staffIndex)
            if (res.slotCode !== undefined) item.target.slotCode = res.slotCode || '';
            if (res.station !== undefined) item.target.station = res.station || '';
            if (res.team !== undefined) item.target.team = res.team || '';
            if (res.dateText !== undefined) item.target.dateText = res.dateText;
          }
          // Toast optimistic đã hiện đúng → KHÔNG toast lại (tránh lặp/nháy).
          // Chỉ cập nhật nếu server trả status khác dự đoán.
          if (res.status && res.status !== item.optimisticStatus) showToast(res.status, false);
          // Scan card: làm mới từ server (lấy tên NV thật cho NV lạ) — CHỈ nếu
          // lượt quét này vẫn là mới nhất (item.scanSeq === SCAN_CARD_SEQ) — nếu
          // user đã quét NV khác khi response đang bay, không để card nhảy về cũ.
          if (res.status && item.scanSeq === SCAN_CARD_SEQ) {
            var srvMode = res.status === STATUS_C.EXTRA ? 'extra' : 'ok';
            showScanCard(res.status, item.target, srvMode);
          }
        } else {
          rollback();
          playBeep('error');
          showToast(res.message, true);
          // Phản hồi 2-pha: server từ chối (task đóng race / quyền) → báo scanner sửa
          // kết quả dự đoán — đỏ + beep lỗi thay vì giữ xanh optimistic.
          notifyExternalScanner({ code: item.staffId, ok: false, message: res.message || 'Không điểm danh được' });
        }
        if (res.ok) {
          notifyExternalScanner({
            code: item.staffId,
            ok: true,
            name: res.staffName || (item.target && item.target.staffName) || item.staffId,
            status: res.status || item.optimisticStatus || '',
            statusLabel: scanStatusLabel_(res.status || item.optimisticStatus || '', item.target),
            time: res.timeScanText || res.timeRefText || ''
          });
        }
        syncCounters(res.counters);
        renderScanTable(CURRENT_LOG);
        updateFinishBtnState();
        BG_TASKS.scan = SCAN_QUEUE.length + (SCAN_PROCESSING ? 1 : 0);
        updateBgIndicator();
        processScanQueue();
      })
      .withFailureHandler(function (err) {
        markServerFail();
        SCAN_PROCESSING = false;
        if (!CURRENT_TASK || CURRENT_TASK.taskId !== item.taskId) {
          processScanQueue();
          return;
        }
        rollback();
        playBeep('error');
        notifyExternalScanner({ code: item.staffId, ok: false, message: 'Lỗi quét: ' + err.message });
        showToast('Lỗi quét: ' + err.message, true);
        syncCounters(null);
        renderScanTable(CURRENT_LOG);
        updateFinishBtnState();
        BG_TASKS.scan = SCAN_QUEUE.length + (SCAN_PROCESSING ? 1 : 0);
        updateBgIndicator();
        processScanQueue();
      })
      .scanStaffApi(item.taskId, item.staffId, item.clientEpoch);  // P2: dùng item.taskId đã capture — nhất quán với guard phòng thủ
  }

  // P2/H: mở lại task đã đóng (nút "Mở lại" ĐẶT TRONG task, thay thế "Kết thúc" khi DONE) — reset Vắng → Chưa điểm danh.
  function reopenTask(taskId) {
    if (BUSY) return;
    showConfirm(
      'Mở lại task',
      'Mở lại task ' + taskId + '?\nNV bị đánh Vắng sẽ đặt lại "Chưa điểm danh" để quét tiếp.',
      function () {
        BUSY = true;
        showModalSpin('Đang mở lại task…');
        google.script.run
          .withSuccessHandler(function (res) {
            BUSY = false;
            hideLoadingOverlay();
            showToast(res.message, !res.ok);
            invalidateClientCaches_();
            loadTaskList();
            // P2 FIX: sau khi mở lại thành công → mở luôn task đó (vào màn quét
            // để quét tiếp) thay vì chỉ refresh danh sách.
            if (res.ok) openScan(taskId);
          })
          .withFailureHandler(function (err) {
            markServerFail();
            BUSY = false;
            hideLoadingOverlay();
            showToast('Lỗi mở lại: ' + err.message, true);
          })
          .reopenTaskApi(taskId);
      }
    );
  }

  // 2-phase: chuyển task Mở (phase1, ghi Giờ có mặt) → Điểm danh (phase2, ghi Giờ quét).
  // A1 (docs/roster-load-design.md): confirm trước khi chuyển nếu log rỗng (chưa quét /
  // chưa nạp roster) — NV quét phase Điểm danh ngoài danh sách sẽ tính Dư.
  function transitionToAttend(taskId) {
    if (BUSY || !taskId) return;
    if (scanBusy()) {
      showToast('Đang xử lý quét — chờ xong rồi chuyển', true);
      return;
    }
    if (!CURRENT_LOG || !CURRENT_LOG.length) {
      showConfirm('Chưa có ai trong danh sách', 'NV quét ở phase Điểm danh ngoài danh sách sẽ tính là Dư. Tiếp tục?', function () {
        doTransitionToAttend(taskId);
      });
      return;
    }
    doTransitionToAttend(taskId);
  }
  function doTransitionToAttend(taskId) {
    if (BUSY || !taskId) return;
    if (scanBusy()) {
      showToast('Đang xử lý quét — chờ xong rồi chuyển', true);
      return;
    }
    BUSY = true;
    showModalSpin('Đang chuyển sang Điểm danh…');
    google.script.run
      .withSuccessHandler(function (res) {
        BUSY = false;
        hideLoadingOverlay();
        showToast(res.message, !res.ok);
        if (res.ok) {
          invalidateClientCaches_();
          // Cập nhật task hiện tại thành phase2 TỨC THÌ (không reload detail — tránh
          // chờ 2-3s đọc full sheet). Chỉ re-render button + hint phase.
          if (CURRENT_TASK && CURRENT_TASK.taskId === taskId) {
            CURRENT_TASK.phase = TASK_STATUS_C.ATTEND;
            CURRENT_TASK.status = TASK_STATUS_C.ATTEND;
            var metaEl = document.getElementById('scanTaskMeta');
            if (metaEl) {
              var phaseHint = ' (ghi Giờ quét)';
              metaEl.innerHTML =
                esc(TT_LABEL[CURRENT_TASK.taskType] || 'Task') + ' ' + esc(CURRENT_TASK.station) + ' ' +
                esc(CURRENT_TASK.slotCode) + ' ' + esc(CURRENT_TASK.team) + ' — <b>' + esc(TASK_PHASE_LABEL[TASK_STATUS_C.ATTEND]) + '</b>' + esc(phaseHint);
            }
            // Mở input để bắt đầu quét (phase2) — trước đó bị khóa ở phase1.
            var scanInput = document.getElementById('scanInput');
            scanInput.disabled = false;
            scanInput.placeholder = 'Quét mã nhân viên…';
            updateScanFilterLabel_();
            updateFinishBtnState();
            // Re-render UI phụ thuộc phase NGAY — badge cột Trạng thái + label/giá trị
            // counter + sort cột Giờ quét. Trước đây phải mở lại task mới cập nhật
            // (user thấy 'Có mặt'/'Chưa có mặt' stale cho tới khi reload).
            renderScanTable(CURRENT_LOG);
            recountFromLog();
            updateSortIndicators();
            // T-1: Re-apply permission after phase transition
            applyScanPermission();
            scanInput.focus();
          }
        }
      })
      .withFailureHandler(function (err) {
        markServerFail();
        BUSY = false;
        hideLoadingOverlay();
        showToast('Lỗi chuyển điểm danh: ' + err.message, true);
      })
      .transitionToAttendApi(taskId);
  }

  function finishTask() {
    if (BUSY || !CURRENT_TASK) return;
    // P1: chặn Kết thúc khi scan đang chờ server (SCAN_PROCESSING) hoặc trong queue —
    // nếu không, completeTask chạy trước scanStaff → NV vừa quét bị đánh Vắng nhầm.
    if (scanBusy()) {
      showToast('Đang xử lý quét — chờ xong rồi kết thúc', true);
      return;
    }
    // Modal confirm thay cho confirm() trình duyệt — giữ UX đồng nhất với các modal khác
    showConfirm(
      'Kết thúc task',
      'Kết thúc task ' + CURRENT_TASK.taskId + '?\nKhông thể quét thêm sau khi kết thúc.',
      function () {
        BUSY = true;
        showModalSpin('Đang kết thúc task…');
        var btn = document.getElementById('btnFinish');
        if (btn) btn.disabled = true;
        google.script.run
          .withSuccessHandler(function (res) {
            BUSY = false;
            if (res.ok) {
              invalidateClientCaches_();
              closeExternalScanner();   // task kết thúc → tự đóng tab scanner ngoài
              showToast(res.message, false);
              // C: silent=true → KHÔNG reset UI (skeleton/ẩn table) — chỉ render view mới lên view cũ (mượt, không nháy toàn bộ)
              loadTaskDetail(CURRENT_TASK.taskId, true);
            } else {
              hideModalSpin();
              showToast(res.message, true);
              if (btn) btn.disabled = false;
            }
          })
          .withFailureHandler(function (err) {
            markServerFail();
            BUSY = false;
            hideModalSpin();
            hideLoadingOverlay();
            if (btn) btn.disabled = false;
            showToast('Lỗi kết thúc: ' + err.message, true);
          })
          .completeTaskApi(CURRENT_TASK.taskId);
      }
    );
  }

  // ===== Helpers =====
  // D1: HTML scan card dùng chung — showScanCard/restoreScanCard chỉ lo className.
  // Label trạng thái scan — 1 nguồn chung (scanCardHTML + setScanLiveMsg_), tránh lệch sau này.
  function scanStatusLabel_(status, target) {
    if (status === STATUS_C.PENDING || !status) {
      // Phase 1 (Mở) + đã ghi Giờ có mặt → 'Có mặt' — quét phase1 = ghi nhận có mặt,
      // 'Chưa điểm danh' ngay sau quét gây hiểu lầm. Chưa quét gì /
      // phase 2 chưa quét lần 2 → vẫn 'Chưa điểm danh'.
      if (CURRENT_TASK && CURRENT_TASK.phase === TASK_STATUS_C.OPEN && target && Number(target.timeRefEpoch) > 0) {
        return 'Có mặt';
      }
      return (CURRENT_TASK && CURRENT_TASK.phase === TASK_STATUS_C.OPEN) ? 'Chưa có mặt' : 'Chưa điểm danh';
    }
    return status;
  }
  function scanCardHTML(status, target) {
    var _st = scanStatusLabel_(status, target);
    // Agency sau tên NV — vd 'Đoàn Hoàng Phát - SKT' (tra CLIENT_STAFF_INDEX;
    // mobile ẩn khi card hẹp — container query, đủ không gian mới hiện).
    var _agency = '';
    var _rec = target && target.staffId ? (CLIENT_STAFF_INDEX[String(target.staffId).toUpperCase()] || null) : null;
    if (_rec && _rec.agency) _agency = '<span class="sc-agency">' + esc(_rec.agency) + '</span>';
    return '<div class="sc-status">' + esc(_st) + '</div>' +
      '<div class="sc-name">' + esc(target.staffName || target.staffId) + _agency + '</div>' +
      '<div class="sc-meta">Mã: ' + esc(target.staffId) +
      (target.slotCode ? ' · Ca: ' + esc(target.slotCode) : '') +
      (target.team ? ' · ' + esc(target.team) : '') + '</div>';
  }
  // m4 (audit 2026-08-11): live region RIÊNG cho SR — trước đây aria-live trên cả #scanCard
  // (render lại mỗi lượt quét) → screen reader đọc lại cả khối tên+trạng thái liên tục
  // (announce-spam ở nhịp quét). Giờ chỉ 1 dòng status ngắn trong #scanLiveMsg.
  function setScanLiveMsg_(status, target, mode) {
    var live = document.getElementById('scanLiveMsg');
    if (!live) return;
    var _st = scanStatusLabel_(status, target);
    live.textContent = mode === 'err' ? 'Lỗi: ' + (status || '')
      : _st + (target && target.staffName ? ' — ' + target.staffName : '');
  }
  // mode: 'ok' (xanh) | 'extra' (cam - Dư) | 'warn' (cam - đã điểm danh/đã có mặt) | 'err' (đỏ)
  function showScanCard(status, target, mode) {
    var card = document.getElementById('scanCard');
    if (!card) return;
    if (!target) { resetScanCard(); return; }
    // C2: Dư = cam (extra), đã điểm danh/đã có mặt = cam (warn, không phải lỗi), lỗi = đỏ, ok = xanh.
    // FREE phase1: status PENDING ('Chưa điểm danh') → xanh (primary) — chưa phải lỗi/cảnh báo.
    // C4 (review 2026-08-11): wire value PENDING = '-' — so 'Chưa điểm danh' là dead arm
    // Phase 1 (Mở): quét = ghi Giờ có mặt → 'Có mặt' (ok xanh), không 'pending'.
    var phase1Arrival = status === STATUS_C.PENDING && CURRENT_TASK
      && CURRENT_TASK.phase === TASK_STATUS_C.OPEN && target && Number(target.timeRefEpoch) > 0;
    var cls = phase1Arrival ? 'ok'
      : ((status === STATUS_C.PENDING) ? 'pending'
      : (mode === 'err' ? 'err' : (mode === 'extra' ? 'extra' : (mode === 'warn' ? 'warn' : 'ok'))));
    card.className = 'scan-card ' + cls;
    card.innerHTML = scanCardHTML(status, target);
    setScanLiveMsg_(status, target, mode);
  }

  function resetScanCard() {
    var card = document.getElementById('scanCard');
    if (!card) return;
    card.className = 'scan-card';
    card.innerHTML = '<div class="sc-empty">Chưa có lượt quét</div>';
    var live = document.getElementById('scanLiveMsg');
    if (live) live.textContent = '';
  }

  // P1: khi mở task đã có lượt quét — khôi phục scan card từ log (lượt mới nhất).
  function restoreScanCard(log) {
    var card = document.getElementById('scanCard');
    if (!card || !log || !log.length) return;
    var last = null;
    // 2-phase: phase1 (Mở) chọn theo Giờ có mặt (timeRefEpoch); phase2 (Điểm danh) theo Giờ quét (timeScanEpoch).
    // So theo epoch (số) — text "HH:mm:ss" mất ngày, xuyên nửa đêm sẽ so sai.
    var phase2 = CURRENT_TASK && CURRENT_TASK.phase === TASK_STATUS_C.ATTEND;
    var keyOf = function (r) { return phase2 ? (Number(r.timeScanEpoch) || 0) : (Number(r.timeRefEpoch) || 0); };
    log.forEach(function (r) {
      var e = keyOf(r);
      if (e > (last ? keyOf(last) : 0)) last = r;
    });
    if (!last) { resetScanCard(); return; }
    // P1-2: khôi phục đúng màu như showScanCard (3171) — PENDING→pending (xanh),
    // EXTRA→extra (cam), còn lại→ok. Trước đây chỉ phân biệt EXTRA vs ok nên mở lại
    // task có lượt quét phase1 (PENDING) sẽ bị tô xanh ok thay vì pending.
    // C4 (review 2026-08-11): wire value PENDING = '-' — so 'Chưa điểm danh' là dead arm
    var phase1Arrival = last.status === STATUS_C.PENDING && CURRENT_TASK
      && CURRENT_TASK.phase === TASK_STATUS_C.OPEN && Number(last.timeRefEpoch) > 0;
    var cls = phase1Arrival ? 'scan-card ok'
      : ((last.status === STATUS_C.PENDING) ? 'scan-card pending'
      : (last.status === STATUS_C.EXTRA ? 'scan-card extra' : 'scan-card ok'));
    card.className = cls;
    card.innerHTML = scanCardHTML(last.status || STATUS_C.PRESENT, last);
    setScanLiveMsg_(last.status || STATUS_C.PRESENT, last, null);
  }

  var toastTimer = null;
  function showToast(msg, isError) {
    var t = document.getElementById('toast');
    t.setAttribute('role', isError ? 'alert' : 'status');
    t.setAttribute('aria-live', isError ? 'assertive' : 'polite');
    t.innerHTML = '<span class="toast-text">' + esc(msg) + '</span>' +
      (isError ? '<button class="toast-close" onclick="dismissToast()" aria-label="Đóng thông báo">✕</button>' : '');
    // V3: phân loại màu toast theo thông tin — Dư = amber (cảnh báo, không lỗi),
    // lỗi = đỏ, còn lại (Có mặt / Chưa điểm danh / thông báo thường) = xanh.
    var cls = isError ? 'err' : (msg === STATUS_C.EXTRA ? 'warn' : 'ok');
    t.className = 'show ' + cls;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ''; }, 2600);
  }
  function dismissToast() {
    var t = document.getElementById('toast');
    if (t) { t.className = ''; clearTimeout(toastTimer); }
  }

  // ===== Quét bằng camera — tab scanner NGOÀI GAS (getUserMedia bị iframe GAS chặn) =====
  // Nút camera mở trang scanner tĩnh ở tab mới (top-level: camera hoạt động bình thường),
  // quét live liên tục nhiều NV, mỗi mã postMessage về app → reuse submitScan().
  // SCANNER_URL: URL scanner/scanner.html sau khi deploy host tĩnh (Netlify/Vercel/Cloudflare Pages).
  // Rỗng → nút camera báo dùng Chụp ảnh. Đổi URL = sửa hằng số này + push (CI auto-deploy GAS).
  var SCANNER_URL = 'https://melodious-dolphin-08688d.netlify.app/scanner.html';
  var EXTERNAL_SCAN_ORIGIN = (function () {
    try { return SCANNER_URL ? new URL(SCANNER_URL).origin : ''; }
    catch (e) { return ''; }
  })();
  var EXTERNAL_SCAN_WIN = null;
  var EXTERNAL_SCAN_TASK_ID = null;   // task lúc mở scanner — tự đóng khi task này DONE
  var CAMERA_LIB_URL = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';

  function ensureCameraLib(cb) {
    if (window.Html5Qrcode) { cb(); return; }
    var s = document.createElement('script');
    s.src = CAMERA_LIB_URL;
    s.async = true;
    s.onload = function () { cb(); };
    s.onerror = function () {
      showToast('Không tải được thư viện đọc mã (kiểm tra mạng)', true);
    };
    document.head.appendChild(s);
  }

  function openExternalScanner() {
    if (!CURRENT_TASK) return;
    if (CURRENT_TASK.phase === TASK_STATUS_C.DONE) {
      showToast('Task đã kết thúc', true);
      return;
    }
    if (!SCANNER_URL) {
      showToast('Trang scanner chưa cấu hình — dùng nút Chụp ảnh để quét từ ảnh', true);
      return;
    }
    if (EXTERNAL_SCAN_WIN && !EXTERNAL_SCAN_WIN.closed) {
      try { EXTERNAL_SCAN_WIN.focus(); } catch (e) {}
      return;
    }
    // window.open trong user gesture trực tiếp → không bị chặn popup.
    EXTERNAL_SCAN_TASK_ID = CURRENT_TASK ? CURRENT_TASK.taskId : null;
    EXTERNAL_SCAN_WIN = window.open(SCANNER_URL, 'spx-external-scanner');
  }

  // Nhận mã từ scanner tab ngoài — validate origin (chống giả mã) + payload, reuse submitScan().
  function onExternalScanMessage(e) {
    if (!EXTERNAL_SCAN_ORIGIN || e.origin !== EXTERNAL_SCAN_ORIGIN) return;
    // Siết thêm: chỉ nhận message từ đúng cửa sổ scanner đang mở (null sau reload → bỏ qua check).
    if (EXTERNAL_SCAN_WIN && e.source !== EXTERNAL_SCAN_WIN) return;
    var d = e.data;
    if (!d || d.source !== 'spx-scan') return;
    // Scanner báo đóng: opener đóng child (luôn được phép, kể cả khi child tự close() bị chặn).
    if (d.action === 'close') {
      if (EXTERNAL_SCAN_WIN && !EXTERNAL_SCAN_WIN.closed) {
        try { EXTERNAL_SCAN_WIN.close(); } catch (err) {}
      }
      EXTERNAL_SCAN_WIN = null;
      return;
    }
    var code = String(d.code || '').trim();
    if (!code) return;
    // App đang không ở task nào (đổi view/task giữa chừng) → báo về scanner, không drop im lặng.
    if (!CURRENT_TASK) {
      notifyExternalScanner({ code: code, ok: false, message: 'Chưa mở task — mở task trong app rồi quét' });
      return;
    }
    var inp = document.getElementById('scanInput');
    if (inp) inp.value = code;
    submitScan();   // validate Ops + enqueue + optimistic + counters
  }
  window.addEventListener('message', onExternalScanMessage);

  // Gửi kết quả quét về tab scanner ngoài (nếu đang mở) — NV quét thấy tên + trạng
  // thái ngay trên tab, không phải ngó về app. origin đích = origin đã validate.
  function notifyExternalScanner(p) {
    var win = EXTERNAL_SCAN_WIN;
    if (!win || win.closed) return;
    try { win.postMessage({ source: 'spx-app', result: p }, EXTERNAL_SCAN_ORIGIN || '*'); } catch (e) {}
  }

  // Đóng tab scanner ngoài — task kết thúc (quét xong). Gửi thông báo để scanner tự
  // đóng (dọn camera sạch) + opener close() dự phòng (luôn được phép).
  function closeExternalScanner() {
    var win = EXTERNAL_SCAN_WIN;
    if (win && !win.closed) {
      try { win.postMessage({ source: 'spx-app', action: 'close' }, EXTERNAL_SCAN_ORIGIN || '*'); } catch (e) {}
      try { win.close(); } catch (e) {}
    }
    EXTERNAL_SCAN_WIN = null;
  }

  // ===== Chụp ảnh + decode (fallback camera bị chặn trong iframe GAS) =====
  // input[type=file capture=environment] không cần permission policy camera → mở thẳng
  // camera app / thư viện ảnh. Decode bằng Html5Qrcode.scanFile (cùng lib quét live) rồi
  // tái dùng submitScan() — server không đổi, chỉ client.
  var PHOTO_SCANNED = false;

  function openPhotoScan() {
    if (!CURRENT_TASK) return;
    // Mirror openExternalScanner: cho chụp ở phase OPEN và ATTEND, chỉ DONE chặn.
    if (CURRENT_TASK.phase === TASK_STATUS_C.DONE) {
      showToast('Task đã kết thúc', true);
      return;
    }
    ensureCameraLib(function () {
      var inp = document.getElementById('photoInput');
      if (!inp) return;
      inp.value = '';   // cho phép chọn lại cùng file
      inp.click();
    });
  }

  // Html5Qrcode.scanFile append container placeholder vào #photoScanReader mỗi lần decode
  // (vô hại thị giác) — dọn sau mỗi lần xử lý ảnh.
  function clearPhotoScanReader_() {
    var pr = document.getElementById('photoScanReader');
    if (pr) pr.innerHTML = '';
  }
  function onPhotoPicked() {
    var inp = document.getElementById('photoInput');
    var file = inp && inp.files && inp.files[0];
    if (!file) return;
    if (PHOTO_SCANNED) {
      showToast('Đang xử lý ảnh trước — chờ giây lát', true);   // không drop im lặng
      return;
    }
    if (!window.Html5Qrcode) {
      showToast('Thư viện đọc ảnh chưa sẵn sàng', true);
      return;
    }
    PHOTO_SCANNED = true;
    showToast('Đang đọc ảnh…');
    decodePhoto(file).then(function (code) {
      PHOTO_SCANNED = false;
      clearPhotoScanReader_();
      var text = String(code || '').trim();
      if (!text) {
        showToast('Không tìm thấy mã trong ảnh — chụp sát mã hơn, đủ sáng', true);
        playBeep('error');
        return;
      }
      var input = document.getElementById('scanInput');
      if (input) input.value = text;
      submitScan();                     // reuse luồng quét chuẩn (validate + enqueue + optimistic)
    }).catch(function (e) {
      PHOTO_SCANNED = false;
      clearPhotoScanReader_();
      var msg = e && e.message ? String(e.message) : '';
      if (/not found|no .*(code|barcode|qr)|unable to parse/i.test(msg)) {
        showToast('Không tìm thấy mã trong ảnh — chụp sát mã hơn, đủ sáng', true);
      } else {
        showToast('Không đọc được ảnh: ' + msg, true);
      }
      playBeep('error');
    });
  }

  function decodePhoto(file) {
    // Ảnh máy ảnh 12–48MP — downscale ≤1280px trước decode (scanFile đọc kích thước gốc).
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        URL.revokeObjectURL(url);
        var MAX = 1280;
        var scale = Math.min(1, MAX / Math.max(img.width, img.height));
        if (scale >= 1) { resolve(file); return; }
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (blob) {
          if (!blob) { reject(new Error('Không tạo được ảnh thu nhỏ')); return; }
          resolve(new File([blob], file.name, { type: 'image/jpeg' }));
        }, 'image/jpeg', 0.9);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('Ảnh không đọc được (có thể định dạng HEIC)'));
      };
      img.src = url;
    }).then(function (smallFile) {
      return new Html5Qrcode('photoScanReader').scanFile(smallFile, false);
    });
  }
</script>
