<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo task — Variant A: Two-mode tabs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#1f1f1f;background:#f2f3f5;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
:root{--amber:#e85d04;--primary:#1a73e8;--border:#e2e4e8;--muted:#6b7280;--bg-muted:#f8f9fa}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
.dialog{background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.18);width:600px;max-width:96vw;padding:22px 24px;max-height:90vh;overflow:auto}
h2{font-size:16px;font-weight:700;color:#1f1f1f;padding-bottom:12px;margin-bottom:14px;border-bottom:2px solid var(--amber)}
/* mode tabs */
.tabs{display:flex;background:#eef0f2;border-radius:10px;padding:4px;margin-bottom:16px}
.tab{flex:1;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:none;border-radius:8px;cursor:pointer;text-align:center}
.tab.active{background:#fff;color:#1f1f1f;box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:700}
.free-note{font-size:12px;color:var(--muted);margin-top:6px;padding:8px 12px;background:var(--bg-muted);border-radius:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col-title{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--amber);margin-bottom:6px}
.tree{border:1px solid var(--border);border-radius:8px;background:#fff;padding:6px;max-height:170px;overflow:auto}
.item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:5px;font-size:13px;cursor:pointer}
.item:hover{background:var(--bg-muted)}
.item input{accent-color:var(--amber)}
.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;border-top:1px solid var(--border);padding-top:14px}
.summary{font-size:13px;color:#1f1f1f}
.summary b{color:var(--amber)}
.spacer{flex:1}
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
.btn-ghost{background:#f0f1f3;color:#374151}
.btn-primary{background:var(--amber);color:#fff}
</style>
</head>
<body>
<div class="overlay">
  <div class="dialog">
    <h2>+ Tạo task điểm danh</h2>

    <div class="tabs">
      <button class="tab active">Đối chiếu danh sách</button>
      <button class="tab">Quét tự do</button>
    </div>

    <!-- Đối chiếu mode -->
    <div class="grid">
      <div>
        <span class="col">Station · chọn 1</span>
        <div class="tree">
          <label class="item"><input type="radio" name="station" checked> Kho Tân Bình</label>
          <label class="item"><input type="radio" name="station"> Kho Bình Dương</label>
        </div>
      </div>
      <div>
        <span class="col">Ngày · chọn 1</span>
        <div class="tree">
          <label class="item"><input type="radio" name="date" checked>07/08/2026</label>
          <label class="item"><input type="radio" name="date">08/08/2026</label>
        </div>
      </div>
      <div>
        <span class="col">Team · chọn nhiều</span>
        <div class="tree">
          <label class="item"><input type="checkbox" checked>Team A</label>
          <label class="item"><input type="checkbox" checked>Team B</label>
          <label class="item"><input type="checkbox">Team C</label>
        </div>
      </div>
      <div>
        <span class="col">Ca · chọn nhiều</span>
        <div class="tree">
          <label class="item"><input type="checkbox" checked>Ca 1</label>
          <label class="item"><input type="checkbox">Ca 2</label>
        </div>
      </div>
    </div>
    <div class="grid" style="margin-top:10px">
      <div>
        <span class="col">Hình thức · chọn nhiều</span>
        <div class="tree">
          <label class="item"><input type="checkbox" checked>Fulltime</label>
          <label class="item"><input type="checkbox">Parttime</label>
        </div>
      </div>
      <div></div>
    </div>

    <div class="footer">
      <span class="summary">Đã chọn <b>24</b> nhân viên · Ca 1 · Team A,B</span>
      <span style="flex:1"></span>
      <button class="btn btn-ghost">Huỷ</button>
      <button class="btn btn-primary">+ Tạo task Đối chiếu</button>
    </div>
  </div>
</div>
</body>
</html>
