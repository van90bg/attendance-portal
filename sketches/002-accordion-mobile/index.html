<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Task — Accordion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;color:#1a1a1a;background:#f4f5f7;min-height:100vh;
  display:flex;justify-content:center;padding:24px}
:root{
  --amber:#e85d04;--amber-soft:#fff3e0;--border:#e2e5ea;--text:#1a1a1a;--muted:#6b7280;
  --surface:#fff;--primary:#1f6feb;--primary-soft:#e8f0fe;--danger:#dc2626;--radius:12px;
  --shadow:0 12px 40px rgba(0,0,0,.10);
}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.modal{
  width:420px;max-width:calc(100vw - 32px);max-height:calc(100vh - 40px);
  background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
}
.sticky{position:sticky;top:0;background:var(--surface);z-index:2}
.modal-header{padding:16px 20px 0}
.modal-header h2{font-size:16px;font-weight:700;padding-bottom:12px;border-bottom:2px solid var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 20px;min-height:0;transition:.2s}
.chip{background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:600;
  border-radius:14px;padding:4px 10px;display:flex;align-items:center;gap:4px;cursor:pointer}
.chip:hover{filter:brightness(.94)}
.chip .x{font-weight:700;font-size:13px;opacity:.6}
.tabs{display:flex;background:#eef0f2;border-radius:10px;padding:4px;gap:4px;margin:12px 20px}
.tab{flex:1;padding:9px 6px;font-size:13px;font-weight:600;color:var(--muted);
  background:transparent;border:none;border-radius:8px;cursor:pointer;text-align:center;transition:.15s}
.tab.active{background:#fff;color:#1f1f1f;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.accordion{padding:0 20px 14px;overflow-y:auto;flex:1}
.acc{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.acc-header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
  font-size:13px;font-weight:600;cursor:pointer;background:#fafbfc;user-select:none}
.acc-header:hover{background:#f4f5f7}
.acc-body{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.acc-body.hidden{display:none}
.opt{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;transition:.12s}
.opt:hover{background:#f7f8fa}
.opt input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--primary)}
.opt.checked{background:var(--primary-soft)}
.cnt{font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-soft);border-radius:10px;padding:1px 7px;margin-left:auto}
.footer{border-top:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fafbfc}
.btn{padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;min-height:44px;transition:.15s}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--border)}
.btn-primary{background:var(--primary);color:#fff;flex:1}
.btn-count{font-size:12px;opacity:.7}
</style>
</head>
<body>
<div class="overlay">
<div class="modal">
  <div class="sticky">
    <div class="modal-header"><h2>+ Tạo task điểm danh</h2></div>
    <div class="chips" id="chips"></div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab(this,true)">Đối chiếu</button>
      <button class="tab" onclick="switchTab(this,false)">Quét tự do</button>
    </div>
  </div>
  <div class="accordion" id="acc"></div>
  <div class="footer">
    <button class="btn btn-ghost" style="flex:.3">Huỷ</button>
    <button class="btn btn-primary" style="flex:.7">+ Tạo task<span class="btn-count" id="btnCount"></span></button>
  </div>
</div>
</div>

<script>
const DATA={
  station:['Station A','Station B','Station C','Station D'],
  team:['Alpha','Bravo','Charlie','Delta'],
  slot:['C1','C2','C3','T1'],
  contract:['Chính thức','Thử việc','Part-time'],
  date:['08/08/2026','09/08/2026','10/08/2026']
};
const COUNTS={'Station A':48,'Station B':32,'Station C':24,'Station D':16,
  'Alpha':12,'Bravo':18,'Charlie':8,'Delta':14,
  'C1':22,'C2':18,'C3':12,'T1':8,
  'Chính thức':36,'Thử việc':8,'Part-time':4,
  '08/08/2026':49,'09/08/2026':44,'10/08/2026':40};
const SEL={station:'',teams:[],slots:[],contracts:[],date:'',noList:false,open:'station'};
const COLS=[
  {id:'station',title:'Station · chọn 1',multi:false},
  {id:'team',title:'Team · chọn nhiều',multi:true},
  {id:'slot',title:'Ca · chọn nhiều',multi:true},
  {id:'contract',title:'Hình thức · chọn nhiều',multi:true},
  {id:'date',title:'Ngày · chọn 1',multi:false}
];
function renderChips(){
  const c=document.getElementById('chips');c.innerHTML='';
  const all=[];if(SEL.station)all.push(SEL.station);all.push(...SEL.teams);all.push(...SEL.slots);all.push(...SEL.contracts);
  if(SEL.date)all.push(SEL.date);
  all.forEach(v=>{
    const ch=document.createElement('span');ch.className='chip';ch.textContent=v;
    const x=document.createElement('span');x.className='x';x.innerHTML='✕';x.addEventListener('click',e=>{
      e.stopPropagation();
      if(SEL.station===v)SEL.station='';else if(SEL.teams.includes(v))SEL.teams.splice(SEL.teams.indexOf(v),1);
      else if(SEL.slots.includes(v))SEL.slots.splice(SEL.slots.indexOf(v),1);
      else if(SEL.contracts.includes(v))SEL.contracts.splice(SEL.contracts.indexOf(v),1);
      else if(SEL.date===v)SEL.date='';render();
    });
    ch.appendChild(x);c.appendChild(ch);
  });
  const total=SEL.station?(COUNTS[SEL.station]||0):(all.length?COUNTS[all[0]]||0:0);
  const b=document.getElementById('btnCount');b.textContent=total>0?' ('+total+' NV)':'';
}
function renderAcc(){
  const a=document.getElementById('acc');a.innerHTML='';
  COLS.forEach(col=>{
    if(SEL.noList&&(col.id==='slot'||col.id==='contract'||col.id==='date'))return;
    const el=document.createElement('div');el.className='acc';
    const head=document.createElement('div');head.className='acc-header';
    head.innerHTML='<span>'+col.title+'</span><span>'+(SEL.open===col.id?'▴':'▴')+'</span>';
    head.addEventListener('click',()=>{SEL.open=SEL.open===col.id?'':col.id;render();});
    const body=document.createElement('div');body.className='acc-body'+(SEL.open===col.id?'':' hidden');
    (DATA[col.id]||[]).forEach(v=>{
      const opt=document.createElement('div');opt.className='opt'+(valInSel(col,v)?' checked':'');
      const lab=document.createElement('span');lab.textContent=v;
      const cnt=document.createElement('span');cnt.className='cnt';cnt.textContent=COUNTS[v]||0;
      opt.append(lab,cnt);opt.addEventListener('click',()=>{toggleSel(col,v);});
      body.appendChild(opt);
    });
    el.append(head,body);a.appendChild(el);
  });
}
function valInSel(col,v){
  if(col.multi)return SEL[col.id].includes(v);return SEL[col.id]===v;
}
function toggleSel(col,v){
  if(col.multi){const i=SEL[col.id].indexOf(v);if(i>-1)SEL[col.id].splice(i,1);else SEL[col.id].push(v);}
  else{if(SEL[col.id]===v)SEL[col.id]='';else SEL[col.id]=v;}
  render();
}
function switchTab(el,rec){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  SEL.noList=!rec;render();
}
function render(){renderChips();renderAcc();}
render();
</script>
</body>
</html>
