<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo task — Variant C: Card-stepper, action-first</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#1f1f1f;background:#f2f3f5;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
:root{--amber:#e85d04;--primary:#1a73e8;--border:#e2e4e8;--muted:#6b7280;--bg-muted:#f8f9fa}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
.dialog{background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.18);width:560px;max-width:96vw;padding:24px;max-height:90vh;overflow:auto}
h2{font-size:16px;font-weight:700;color:#1f1f1f;padding-bottom:12px;margin-bottom:16px;border-bottom:2px solid var(--amber)}
.stepbar{display:flex;gap:6px;margin-bottom:18px}
.step{flex:1;height:4px;border-radius:2px;background:var(--border)}
.step.on{background:var(--amber)}
.q{font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600}
.options{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{border:1px solid var(--border);background:#fff;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;transition:all .12s}
.chip.sel{border-color:var(--amber);background:#fef0e4;color:var(--amber);font-weight:600}
.chip-sub{margin-left:auto;color:var(--muted);font-size:11px}
.actions{display:flex;justify-content:space-between;margin-top:20px}
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
.btn-ghost{background:#f0f1f3;color:#374151}
.btn-primary{background:var(--amber);color:#fff}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.summary-line{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.summary-line b{color:var(--amber);font-size:15px}
</style>
</head>
<body>
<div class="overlay">
  <div class="dialog">
    <h2>+ Tạo task điểm danh</h2>
    <div class="stepbar"><div class="step on"></div><div class="step"></div><div class="step"></div></div>

    <div class="q">Chọn nhóm nhân viên cho task — bước 1/3 · Station &amp; Ngày</div>
    <div class="options">
      <span class="chip sel">Kho Tân Bình <span class="chip-sub">18 NV</span></span>
      <span class="chip">Kho Bình Dương <span class="chip-sub">12 NV</span></span>
      <span class="chip">Kho Củ Chi <span class="chip-sub">9 NV</span></span>
    </div>
    <div class="options">
      <span class="chip sel">07/08/2026</span>
      <span class="chip">08/08/2026</span>
    </div>

    <div class="q" style="margin-top:14px">Team · chọn nhiều</div>
    <div class="options">
      <span class="chip sel">Team A <span class="chip-sub">10</span></span>
      <span class="chip sel">Team B <span class="chip-sub">8</span></span>
      <span class="chip">Team C <span class="chip-sub">6</span></span>
    </div>

    <div class="q" style="margin-top:14px">Ca &amp; Hình thức</div>
    <div class="options">
      <span class="chip sel">Ca 1</span>
      <span class="chip">Ca 2</span>
      <span class="chip sel">Fulltime</span>
      <span class="chip">Parttime</span>
    </div>

    <div class="summary-line">Đang chọn: <b>24 NV</b> · Kho Tân Bình · Team A,B · Ca 1</div>
    <div class="actions">
      <button class="btn btn-ghost">← Quay lại</button>
      <button class="btn btn-primary" disabled>Tiếp →</button>
    </div>
  </div>
</div>
</body>
</html>
