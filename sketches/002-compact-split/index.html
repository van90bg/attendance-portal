<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo task — Variant B: Compact single-column, sidebar split</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#1f1f1f;background:#f2f3f5;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
:root{--amber:#e85d04;--primary:#1a73e8;--border:#e2e4e8;--muted:#6b7280;--bg-muted:#f8f9fa}
.overlay{position:fixed;inset:0;background:#fff;z-index:50;display:flex}
.sidebar{width:200px;background:#faf6f1;border-right:1px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;gap:8px}
.side-tab{padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.side-tab.active{background:#fff;color:#1f1f1f;box-shadow:0 1px 4px rgba(0,0,0,.08);font-weight:700;border-left:3px solid var(--amber)}
.main{flex:1;padding:24px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top h2{font-size:16px;color:#1f1f1f;border:none;padding:0}
.badge-mode{font-size:11px;background:#fef0e4;color:var(--amber);font-weight:700;padding:4px 8px;border-radius:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col-title{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
.tree{border:1px solid var(--border);border-radius:8px;background:#fff;padding:6px;max-height:150px;overflow:auto}
.item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:5px;font-size:13px;cursor:pointer}
.item input{accent-color:var(--amber)}
.free-banner{margin-top:14px;background:#fef7e0;border:1px solid #f4d79a;border-radius:8px;padding:10px 12px;font-size:12px;color:#7a5a00;display:flex;gap:10px;align-items:flex-start}
.free-banner b{color:var(--amber)}
.footer{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:18px}
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
.btn-ghost{background:#f0f1f3;color:#374151}
.btn-primary{background:var(--amber);color:#fff}
.live-count{margin-left:auto;font-size:13px;color:var(--muted)}
.live-count b{color:var(--amber);font-size:16px}
</style>
</head>
<body>
<div class="overlay">
  <div class="sidebar">
    <div class="side-tab active">Đối chiếu danh sách</div>
    <div class="side-tab">Quét tự do</div>
    <div class="side-tab" style="margin-top:auto;opacity:.5">Hướng dẫn</div>
  </div>
  <div class="main">
    <div class="top">
      <h2>+ Tạo task điểm danh</h2>
      <span class="badge-mode">Đối chiếu danh sách</span>
    </div>
    <div class="grid">
      <div>
        <span class="col-title">Station · 1</span>
        <div class="tree">
          <label class="item"><input type="radio" name="station" checked> Kho Tân Bình</label>
          <label class="item"><input type="radio" name="station"> Kho Bình Dương</label>
        </div>
      </div>
      <div>
        <span class="col-title">Ngày</span>
        <div class="tree">
          <label class="item"><input type="radio" name="date" checked>07/08/2026</label>
          <label class="item"><input type="radio" name="date">08/08/2026</label>
        </div>
      </div>
      <div>
        <span class="col-title">Team</span>
        <div class="tree">
          <label class="item"><input type="checkbox" checked>Team A</label>
          <label class="item"><input type="checkbox" checked>Team B</label>
          <label class="item"><input type="checkbox">Team C</label>
        </div>
      </div>
      <div>
        <span class="col-title">Ca (Slot)</span>
        <div class="tree">
          <label class="item"><input type="checkbox" checked>Ca 1</label>
          <label class="item"><input type="checkbox">Ca 2</label>
          <label class="item"><input type="checkbox">Ca 3</label>
        </div>
      </div>
      <div>
        <span class="col-title">Hình thức</span>
        <div class="tree">
          <label class="item"><input type="checkbox" checked>Fulltime</label>
          <label class="item"><input type="checkbox">Parttime</label>
        </div>
      </div>
    </div>
    <div class="footer">
      <span class="live-count">Tổng NV <b>24</b></span>
      <button class="btn btn-ghost">Huỷ</button>
      <button class="btn btn-primary">+ Tạo task</button>
    </div>
  </div>
</div>
</body>
</html>
