<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2 — Live preview list</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#1f1f1f;background:#f2f3f5;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
:root{--amber:#e85d04;--border:#e2e4e8;--muted:#6b7280;--bg-muted:#f8f9fa}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
.dialog{background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.18);width:660px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column}
h2{font-size:16px;font-weight:700;color:#1f1f1f;padding:18px 24px 12px;border-bottom:2px solid var(--amber)}
.tabs{display:flex;background:#eef0f2;border-radius:10px;padding:4px;margin:14px 24px 0}
.tab{flex:1;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:none;border-radius:8px;cursor:pointer;text-align:center}
.tab.active{background:#fff;color:#1f1f1f;box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:700}
.body{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 24px;overflow:auto;flex:1}
.col-title{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--amber);margin-bottom:4px}
.tree{border:1px solid var(--border);border-radius:8px;background:#fff;padding:6px;max-height:150px;overflow:auto}
.item{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:5px;font-size:13px;cursor:pointer}
.item input{accent-color:var(--amber)}
.preview{border:1px solid #f4d79a;border-radius:8px;background:#fffdf6;padding:10px 12px}
.preview-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.preview-head b{color:var(--amber);font-size:14px}
.plist{display:flex;flex-wrap:wrap;gap:4px;max-height:96px;overflow:auto}
.pchip{font-size:11px;background:#fef0e4;color:var(--amber);border-radius:12px;padding:3px 8px;font-weight:600}
.footer{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 24px 18px;border-top:1px solid var(--border)}
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
.btn-ghost{background:#f0f1f3;color:#374151}
.btn-primary{background:var(--amber);color:#fff}
</style>
</head>
<body>
<div class="overlay">
  <div class="dialog">
    <h2>+ Tạo task điểm danh</h2>
    <div class="tabs">
      <button class="tab active">Đối chiếu danh sách</button>
      <button class="tab">Quét tự do</button>
    </div>
    <div class="body">
      <div>
        <span class="col-title">Station &amp; Ngày</span>
        <div class="tree">
          <label class="item"><input type="radio" name="station" checked> Kho Tân Bình</label>
          <label class="item"><input type="radio" name="station"> Kho Bình Dương</label>
        </div>
        <div class="tree" style="margin-top:6px">
          <label class="item"><input type="radio" name="date" checked>07/08/2026</label>
          <label class="item"><input type="radio" name="date">08/08/2026</label>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <span class="col-title">Team · Ca · Hình thức</span>
          <div class="tree">
            <label class="item"><input type="checkbox" checked>Team A</label>
            <label class="item"><input type="checkbox" checked>Team B</label>
            <label class="item"><input type="checkbox">Team C</label>
            <label class="item"><input type="checkbox" checked>Ca 1</label>
            <label class="item"><input type="checkbox">Ca 2</label>
            <label class="item"><input type="checkbox" checked>Fulltime</label>
            <label class="item"><input type="checkbox">Parttime</label>
          </div>
        </div>
        <div class="preview">
          <div class="preview-head"><span>Nhân viên sẽ vào task</span><span><b>24</b> NV</span></div>
          <div class="plist">
            <span class="pchip">NV01</span><span class="pchip">NV02</span><span class="pchip">NV03</span>
            <span class="pchip">NV04</span><span class="pchip">NV05</span><span class="pchip">NV06</span>
            <span class="pchip">NV07</span><span class="pchip">NV08</span><span class="pchip">NV09</span>
            <span class="pchip">NV10</span><span class="pchip">+14</span>
          </div>
        </div>
      </div>
    </div>
    <div class="footer">
      <button class="btn btn-ghost">Huỷ</button>
      <button class="btn btn-primary">+ Tạo task Đối chiếu</button>
    </div>
  </div>
</div>
</body>
</html>
